# Dependabot — keep dependencies and pinned actions from silently drifting
# behind their security releases (spec 056 #20). Three ecosystems:
#   gomod            the hub Go module (go.mod / go.sum)
#   npm              the WUI (package.json / pnpm-lock.yaml; the npm ecosystem
#                    handles pnpm lockfiles)
#   github-actions   the SHA-pinned uses: in .github/workflows/* — Dependabot
#                    bumps the pin AND the version comment together, so pinning
#                    to a SHA (spec 056 #12) stays maintainable.
# Weekly, security label.
# open-pull-requests-limit: 0 (owner HUM-10, 2026-10-14, SPL-1862): the fleet
# pushes to trunk and never merges a PR, so version-update PRs only pile up.
# A limit of 0 stops version-update PRs; Dependabot security-update PRs keep
# their own limit (a repo setting). Bumps are applied on trunk by a lane.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/csi-spl-api/src/go/spool-hub-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "npm"
    directory: "/csi-spl-wui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
    commit-message:
      prefix: "ci(deps)"
