# RUNNER (spec 072 A13, A35): every job's runs-on is, in order, the caller's
# `runner` input (11_ci-public.yml passes ubuntu-latest for a pull request);
# else the repo variable
# SPOOL_CI_RUNNER (JSON: a label array or a quoted string) when set; else the
# SELF-HOSTED [self-hosted, spool-ci] on this repo (csitea/csi-spl, no variable
# needed); else ubuntu-latest, so a fork or a copy runs on GitHub-hosted
# runners instead of queueing for ever. Set or change the variable only with
# `./run -a do_gh_set_ci_vars` (csi-spl-iac). Gate: gh-set-ci-vars.tst.sh.
#
# Why: the org hit its GitHub Actions spending limit on 2026-09-23 and every
# hosted job stopped starting ("The job was not started because recent account
# payments have failed or your spending limit needs to be increased"). csi-spl
# was the bulk of it - 76 runs of THIS workflow on 2026-09-23 alone, nine jobs
# each, with the fleet pushing to master dozens of times a day. Self-hosted
# minutes are free and are not subject to the spending limit, which is why a
# self-hosted job starts while a hosted one will not.
#
# The box is DEBIAN 13, not the ubuntu-latest image, so nothing here may assume
# a preinstalled toolchain. Every tool comes from its setup action
# (actions/setup-go, actions/setup-node, pnpm/action-setup,
# hashicorp/setup-terraform), which downloads at runtime and works on Debian.
# A step that needs something else must install it explicitly.
#
# To go back to hosted runners (a dead box, or the limit raised):
#   SPOOL_CI_RUNNER='"ubuntu-latest"' DRY_RUN=0 ./run -a do_gh_set_ci_vars
# Jobs QUEUE rather than fail when the runner is offline, so a dead box looks
# like a hung gate, not a red one.
name: "10 ci: quality gate"

# ONE hermetic quality gate for csi-spl, modelled on csi-rel's
# 10_ci-quality.yml: every job is cheap, needs no GCP identity and no network
# beyond the Go module proxy and one emulator image pull.
#
# NO `paths:` FILTER, deliberately (csi-rel's reasoning holds here): an
# allow-list that is wrong fails SILENTLY -- no run, green checks, and a
# regression nobody is told about. These suites are cheap, so they run on
# every master push.
#
# EXPRESS DOCS LANE (owner, t1 a477c187, msgs 50a349f4 "a bypass lane for
# those purely doc changes" + 31e00aee "integrated in the CICD"; reverses spec
# 075 O6). Still no `paths:` filter: every push starts this gate, and the
# first job (classify) decides by FILES, never by author. A push whose every
# path changed since the last GREEN gate on the ref is a *.md outside csi-spl-wui/** and .github/** (the set wf 32
# publishes) skips the code jobs (hub, wui, wui-generate, wui-e2e, iac, orc,
# orc-features, cnf); distribution-hygiene and no-ysg-box-ref still run (a doc can carry a
# banned name), and a skipped job is not a failure, so the gate is green.
# It FAILS SAFE: an error, an empty diff, a merge, a force-push or new-branch
# base, a pull request, a dispatch without express_base -> the full gate.
#
# ONE GATE FOR PUSH AND PULL REQUEST (spec 072 A35): this file is also the
# reusable gate. 11_ci-public.yml calls it on `pull_request` (fork branches
# included) with `runner: '"ubuntu-latest"'`, so a contributor's pull request
# runs exactly these jobs, never a hand-kept subset. It is THIS file, not a new
# one, on purpose: the self-hosted runner group spool-ci-trusted admits only
# named workflows (this one at refs/heads/master), and a job inside a separate
# reusable file would be judged by that file's path -- trunk's gate would queue
# for ever until the org setting changed. No `pull_request:` trigger here: a
# pull request never reaches the self-hosted runners, 11 is its entry point.
#
# The WUI (csi-spl-wui) has two jobs below: unit tests + typecheck, and
# browser e2e (016 T021) against a generated mock-tenant bundle.
# iac-suite, orc-suite and cnf-suite (016 T003-T005) run the bash suites of
# csi-spl-iac, csi-spl-orc and csi-spl-cnf; none of them holds a GCP identity.

on:
  # Both inputs are for a CONTROL on a throwaway branch (the self-hosted group
  # takes this file at master only, so a branch run needs a hosted runner).
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          runs-on for every job, JSON (e.g. '"ubuntu-latest"'). Empty: the
          RUNNER rule at the top of this file.
        type: string
        default: ""
      express_base:
        description: >-
          classify <this sha>..the dispatched sha for the express docs lane,
          as a push would. Empty: full gate.
        type: string
        default: ""
  push:
    branches: [master]
  # The pull-request entry (11_ci-public.yml). Empty inputs = a push here.
  workflow_call:
    inputs:
      runner:
        description: >-
          runs-on for every job, JSON (a label array or a quoted string, as
          SPOOL_CI_RUNNER). Empty: the RUNNER rule at the top of this file.
        type: string
        default: ""
      e2e_skip:
        description: >-
          more tests/e2e files to leave out of this run (E2E_SKIP of
          run-e2e-tests.mjs), space-separated; for a runner whose fonts differ.
        type: string
        default: ""

permissions:
  contents: read


# One running + one pending gate per ref; a newer push replaces the pending
# one. A gate on the newest sha covers every commit before it. Without this,
# a busy fleet (a push every few minutes, ~9 jobs a gate, 4 runners) queued
# 16+ gates for 35+ minutes on 2026-09-25 and a red gate surfaced hours late.
#
# So "cancelled" on a master run of this gate means SUPERSEDED, not lost: on
# 2026-10-04 (n=100 runs) 85 were replaced pending runs and the tip still got
# a finished verdict every ~25 min (one gate's wall time, ~70 job-min). Do not
# make the group per sha (~15 pushes/h x ~70 job-min against a 4-runner pool
# queues without bound) nor set cancel-in-progress (a push every ~4 min would
# kill every gate before it finishes). Gate: gate10-concurrency.tst.sh.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Express docs lane classifier (see EXPRESS DOCS LANE at the top):
  # csi-spl-orc/src/bash/scripts/ci-doc-only.sh on <last GREEN gate>..sha.
  # NOT github.event.before: the concurrency group cancels pending runs as
  # superseded, so `before` may be a code push whose gate never ran (2fb25f650
  # then 875251619, 2026-10-07); diffing from it would wave that code through
  # behind a doc push. The base is the head sha of the newest successful push
  # run of this workflow on this ref, so everything since the last green
  # verdict must be docs. No such run, or the API fails: full gate.
  # Its output doc_only is 'true' ONLY when the script proved it; the code
  # jobs below skip only on == 'true' and carry !cancelled(), so a failed or
  # skipped classify runs them. Gate: ci-doc-only.tst.sh.
  # ===========================================================================
  classify:
    name: "classify: doc-only push (express docs lane)?"
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # actions: read to find the last green run of this workflow
    permissions:
      contents: read
      actions: read
    outputs:
      doc_only: ${{ steps.cls.outputs.doc_only }}
    steps:
      # the commit graph and trees, no blobs: enough for rev-list and a
      # name-only diff between the base and sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Classify the push (anything unproven = code, full gate)
        id: cls
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.express_base || '' }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          v=doc_only=false
          if [[ "$EVENT" == push ]]; then
            BASE=$(gh api "repos/$REPO/actions/workflows/10_ci-quality.yml/runs?branch=$REF_NAME&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || BASE=""
            [[ -n "$BASE" ]] || echo "ci-doc-only: no last green push run found"
          fi
          if [[ "$EVENT" == push || "$EVENT" == workflow_dispatch ]] && [[ -n "$BASE" ]]; then
            v=$(bash csi-spl-orc/src/bash/scripts/ci-doc-only.sh "$BASE" "$HEAD_SHA") || v=doc_only=false
          else
            echo "ci-doc-only: $EVENT without a base: full gate"
          fi
          [[ "$v" == doc_only=true ]] || v=doc_only=false
          echo "$v" >>"$GITHUB_OUTPUT"
          echo "**$v** (${BASE:0:12}..${HEAD_SHA:0:12}, $EVENT)" >>"$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # The hub suite: csi-spl-api/src/bash/tests/run-all-tests.sh -- gofmt,
  # go vet, go test, the no-ysg-box-ref gate, the spool smoke, the hub
  # Postgres gate and the hub GCS (fake-gcs) gate.
  # ===========================================================================
  hub-suite:
    name: "hub: gofmt, go vet, go test, smoke, Postgres + GCS gates"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    # Above hub-pg.tst.sh's go test -timeout 20m plus the ~7 min of steps and
    # suites before it, so a hung Postgres test fails with its dump, not a kill
    # (runs 37623893526, 37635707328: 19 min with go's default 10m).
    timeout-minutes: 35
    # actions: read for gate-fail-fast.sh (see wui-e2e): a red job elsewhere
    # in the run ends this one, so a red gate frees its slot.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The box's /tmp is a 32 GB tmpfs shared with every agent on it, and
      # when they fill it every t.TempDir/mktemp here fails with "no space
      # left on device" (run 37031322430, bf701c2b: 8 fallback tests and the
      # file tests red, no code at fault). RUNNER_TEMP is on the runner's disk
      # and wiped per job; its longest path (40 chars) keeps the Postgres and
      # submit unix sockets well under the ~107-byte limit.
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: csi-spl-api/src/go/spool-hub-api/go.mod
          cache: false

      # run-all-tests.sh and build.sh are offline by design (GOPROXY=off), so
      # the module cache has to be filled before they run.
      - name: Download Go modules
        working-directory: csi-spl-api/src/go/spool-hub-api
        run: go mod download

      # Supply-chain integrity: every downloaded module's content must match
      # go.sum. A tampered module in the cache/proxy makes `go mod verify` exit
      # non-zero, failing the gate before any build/test runs the code.
      - name: Verify module checksums (go mod verify)
        working-directory: csi-spl-api/src/go/spool-hub-api
        run: go mod verify

      # The GCS gate SKIPS (exit 0) without a cached emulator image, and the
      # Postgres gate SKIPS without server binaries or a cached image. The
      # runner has PostgreSQL server binaries; the emulator image is pulled
      # here, and the skip check below turns a skip into a failure.
      - name: Cache the fake-gcs emulator image
        # The tag is pinned, so a copy already on this persistent self-hosted
        # runner is the right one: use it and touch no network. A docker pull of
        # an image that is already present is still a ~2.5 s Docker Hub round
        # trip (measured 2026-09-29; inspect is ~0.05 s), and Docker Hub resets
        # the connection now and then (run 36148403827). Only pull when it is
        # genuinely absent (a fresh runner), retrying, then falling back to any
        # cached copy with a warning.
        run: |
          img=fsouza/fake-gcs-server:1.52.2
          docker image inspect "$img" >/dev/null 2>&1 && { echo "using the cached $img"; exit 0; }
          for i in 1 2 3; do docker pull -q "$img" && exit 0; sleep $((i * 10)); done
          docker image inspect "$img" >/dev/null 2>&1 \
            && { echo "::warning::docker pull $img failed 3x; using the cached image"; exit 0; }
          exit 1

      - name: run-all-tests.sh
        env:
          GATE_FAIL_FAST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash csi-spl-orc/src/bash/scripts/gate-fail-fast.sh \
            bash csi-spl-api/src/bash/tests/run-all-tests.sh 2>&1 | tee "$RUNNER_TEMP/hub-suite.log"

      - name: The Postgres and GCS gates really ran (a skip is a failure in CI)
        run: |
          set -euo pipefail
          if grep -E '^skip - no (Postgres server binaries|cached )' "$RUNNER_TEMP/hub-suite.log"; then
            echo "::error::a hub gate skipped in CI -- it proved nothing. Fix the runner setup above."
            exit 1
          fi
          echo "ok - no hub gate skipped"

  # ===========================================================================
  # The WUI suite: csi-spl-wui unit tests (node --test) and nuxt typecheck.
  # pnpm comes from package.json packageManager; the lockfile is frozen so a
  # drifted lockfile fails here instead of resolving silently. Browser e2e
  # (no-x-scroll, console-errors, topic-pane) is the wui-e2e job below.
  # ===========================================================================
  wui-suite:
    name: "wui: unit tests + typecheck"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csi-spl-wui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite;
      # run 37053725586: wui unit, cnf and iac red on ENOSPC, /tmp inodes full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: csi-spl-wui/package.json
          # per job, not the shared ~/setup-pnpm: 4 runners share one home and
          # raced on it (ENOTEMPTY, then "pnpm: command not found", run 36138615567)
          dest: ${{ runner.temp }}/setup-pnpm

      # pnpm's default store sat inside the per-job PNPM_HOME, so every job
      # re-downloaded all ~720 packages over the box's slow link (ETIMEDOUT,
      # job 108199695609). Keep it in the runner's tool cache, which persists.
      - name: pnpm store in the runner tool cache (persists across jobs)
        run: echo "npm_config_store_dir=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test:unit

      - name: Typecheck
        run: pnpm run typecheck


  # ===========================================================================
  # The mock-tenant bundle the browser shards drive (perf round 4 C5): built
  # ONCE per push and handed to the 3 wui-e2e shards as an artifact (~4 MB),
  # instead of every shard running the same `nuxt generate` (~56 s each).
  # The bundle budget runs here, once, AFTER the upload: a budget miss fails
  # this job but no longer stops a single browser test (CLE-35000), because
  # the shards wait on the `bundle` output, not on this job's success.
  # ===========================================================================
  wui-generate:
    name: "wui: nuxt generate (mock tenant) once for the e2e shards"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      bundle: ${{ steps.upload.outcome }}
    defaults:
      run:
        working-directory: csi-spl-wui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # nuxt generate writes its build scratch to TMPDIR: on the job's disk,
      # not the box's shared /tmp tmpfs (see hub-suite and wui-e2e).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: csi-spl-wui/package.json
          # per job, not the shared ~/setup-pnpm: 4 runners share one home and
          # raced on it (ENOTEMPTY, then "pnpm: command not found", run 36138615567)
          dest: ${{ runner.temp }}/setup-pnpm

      # pnpm's default store sat inside the per-job PNPM_HOME, so every job
      # re-downloaded all ~720 packages over the box's slow link (ETIMEDOUT,
      # job 108199695609). Keep it in the runner's tool cache, which persists.
      - name: pnpm store in the runner tool cache (persists across jobs)
        run: echo "npm_config_store_dir=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: nuxt generate (mock tenant)
        id: generate
        env:
          NUXT_PUBLIC_USE_MOCK: "1"
          NUXT_PUBLIC_DEFAULT_LOCALE: "en"
          # HUM-10: a repository for tests/e2e/commit-links (example values;
          # the deployed page reads cnf env.wui.repo_* from /config.json)
          NUXT_PUBLIC_REPO_WEB_URL: "https://git.example.org/acme/spool"
          NUXT_PUBLIC_REPO_COMMIT_PATH: "/commit/"
          NUXT_PUBLIC_REPO_CLONE_URL: "https://git.example.org/acme/spool"
          NUXT_PUBLIC_REPO_HELP_PATH: "/blob/master/csi-spl-doc/doc/help/"
        run: pnpm run generate

      - name: Upload the generated bundle for the e2e shards
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wui-mock-bundle
          path: csi-spl-wui/.output/public
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Initial JS gzip stays within the performance budget
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 ../csi-spl-orc/src/bash/scripts/perf-budget.py bundle \
            --pub .output/public \
            --budgets ../csi-spl-doc/specs/027-spool-performance/contracts/perf-budgets.json


  # ===========================================================================
  # The WUI browser suite (016 T021): no-x-scroll, console-errors, and the
  # 1..1 topic-pane gate, against a generated mock-tenant bundle served the
  # way Firebase Hosting does (serve-generated.mjs SPA fallback). Chrome is
  # the runner's google-chrome; missing Chrome is a failure, never a skip.
  # BASE_URL points at that local server so the tests drive THIS commit, not
  # a live hub and not nuxi dev.
  #
  # Left out: the files csi-spl-wui/tests/e2e/ci-skip.txt names, each with
  # its reason (live hub, Hosting CSP headers, visual sweeps), and
  # tests/e2e/*.proof.mjs (live sites or credentials).
  # ===========================================================================
  wui-e2e:
    name: "wui: browser e2e (mock, generated) ${{ matrix.shard }}/3"
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    # the bundle exists even when its budget step failed (see wui-generate)
    needs: [classify, wui-generate]
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' && needs.wui-generate.outputs.bundle == 'success' }}
    # 3 round-robin shards (E2E_SHARD, run-e2e-tests.mjs), CLE-77945
    # 2026-10-02: one serial job ran 104 files in 35 min green and hit the
    # 45 min timeout under load (run 36962189149), so this gate finished once
    # per ~45 min and every push in between was cancelled while pending
    # (36968259163 and ~40 before it). Each shard is ~10-13 min green.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # 10 -> 20 (2026-09-27): the job reached 9m21s green on 94118eef, and
    # run 36313405989 was killed at 10m with every suite passing so far.
    # 20 -> 30 (2026-09-27): 9bce3654 took 19m51s green; run 36338326017 was
    # cancelled at 20m right after names-not-ids 9/9, before the bundle budget.
    # 30 -> 45 (2026-09-28): run 36371370216 (221c9115) ran 03:00:33..03:31:09
    # and was cancelled at 30m inside build-watch, every suite before it green;
    # names-not-ids, search-original and the bundle budget never ran.
    timeout-minutes: 45
    # Fail-fast (spec 072 US1, gate10-fail-fast.tst.sh): the browser step runs
    # under gate-fail-fast.sh, which reads this run's jobs and stops the shard
    # once any job of the run is red, so a red gate frees the one slot per ref
    # in ~30 s instead of at the slowest shard's end (37206701762: 1/3 and 2/3
    # red by 14:12Z, 3/3 hung to its timeout at 14:36Z). `actions: read` is
    # all it needs and all wf 11 grants a called job; cancelling the run would
    # need `actions: write`, which would fail every pull request at startup.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: csi-spl-wui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Each Chrome launch writes a ~80 MB profile and nuxt generate its build
      # scratch to TMPDIR: on the job's disk, not the box's shared /tmp tmpfs
      # (see hub-suite; bf696733: a browser launch hit /tmp full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: csi-spl-wui/package.json
          # per job, not the shared ~/setup-pnpm: 4 runners share one home and
          # raced on it (ENOTEMPTY, then "pnpm: command not found", run 36138615567)
          dest: ${{ runner.temp }}/setup-pnpm

      # pnpm's default store sat inside the per-job PNPM_HOME, so every job
      # re-downloaded all ~720 packages over the box's slow link (ETIMEDOUT,
      # job 108199695609). Keep it in the runner's tool cache, which persists.
      - name: pnpm store in the runner tool cache (persists across jobs)
        run: echo "npm_config_store_dir=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Chrome is on the runner (a skip is a failure)
        run: |
          set -euo pipefail
          if [[ -x /usr/bin/google-chrome ]]; then
            chrome=/usr/bin/google-chrome
          elif [[ -x /usr/bin/google-chrome-stable ]]; then
            chrome=/usr/bin/google-chrome-stable
          else
            echo "::error::no google-chrome on the runner — this job proved nothing"
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      # The bundle wui-generate built for this commit, not a generate per shard.
      - name: The generated bundle (mock tenant) from wui-generate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wui-mock-bundle
          path: csi-spl-wui/.output/public

      - name: Browser e2e (every tests/e2e/*.test.mjs minus ci-skip.txt)
        env:
          CI: "1"
          E2E_SHARD: "${{ matrix.shard }}/3"
          E2E_SKIP: ${{ inputs.e2e_skip }}
          # On a master push only: a pull request (wf 11) keeps the full red
          # report, every red file in one round, and nothing queues behind it.
          GATE_FAIL_FAST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Free ports, a signed-out API stub, the generated bundle served, then
          # the command with BASE_URL set.
          # One discovering runner (CLE-77915): every tests/e2e/*.test.mjs runs
          # unless tests/e2e/ci-skip.txt names it with a reason; every file runs
          # whatever the one before it did, and the step fails at the end naming
          # each red one (CLE-77827).
          bash ../csi-spl-orc/src/bash/scripts/gate-fail-fast.sh \
            bash ../csi-spl-orc/src/bash/scripts/wui-e2e-mock-serve.sh pnpm run test:e2e

  # ===========================================================================
  # The IAC suite (016 T003): csi-spl-iac/src/bash/tests/run-all-tests.sh --
  # tfvars parity against a fresh tpl-gen render, the per-step contracts
  # (025/028/030/031/017/019/120), no key in tf / tree, terraform fmt +
  # validate of every step with its T070 control. SPL_TF_ALLOW_SKIP is NOT
  # set: a missing terraform or tpl-gen is a FAIL there (007 T070), and any
  # SKIP/PARTIAL line is failed here too. terraform is the version the
  # operator runs (1.9.8); tpl-gen is the pinned cnf/tpl-gen.ref, installed by
  # the named action do_setup_tpl_gen. Network: GitHub (tpl-gen), PyPI,
  # registry.terraform.io (providers for `init -backend=false`). No GCP.
  # ===========================================================================
  iac-suite:
    name: "iac: tfvars parity, step contracts, terraform validate"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite;
      # run 37053725586: wui unit, cnf and iac red on ENOSPC, /tmp inodes full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      # The box is on Wi-Fi and busy: terraform (27 MB) and the google
      # providers timed out on every iac job (AggregateError on all 3 attempts,
      # run 36171540592; ~9 KB/s from releases.hashicorp.com, measured
      # 2026-09-25). The runner box keeps terraform 1.9.8 and a read-only
      # provider mirror under /opt/tf; the download below is only a fallback
      # for a runner without it.
      - name: Use the box's terraform 1.9.8 + provider mirror (/opt/tf)
        id: localtf
        run: |
          set -euo pipefail
          tf=/opt/tf/bin/terraform-1.9.8
          # no `| head -1` on terraform: under pipefail its SIGPIPE read as "no
          # /opt/tf" on a runner that has it (run 37036818354), and no
          # checkpoint call, whose out-of-date notice made the output longer
          ver=""; [[ -x "$tf" ]] && ver=$(CHECKPOINT_DISABLE=1 "$tf" version 2>/dev/null) || true
          if [[ -r /opt/tf/terraformrc && "${ver%%$'\n'*}" == 'Terraform v1.9.8' ]]; then
            mkdir -p "$RUNNER_TEMP/tf-bin" && ln -sf "$tf" "$RUNNER_TEMP/tf-bin/terraform"
            echo "$RUNNER_TEMP/tf-bin" >>"$GITHUB_PATH"
            { echo "TF_BIN=$tf"; echo "TF_CLI_CONFIG_FILE=/opt/tf/terraformrc"; } >>"$GITHUB_ENV"
            echo "found=true" >>"$GITHUB_OUTPUT"; echo "ok - using $tf and /opt/tf/mirror"
          else
            echo "found=false" >>"$GITHUB_OUTPUT"; echo "::warning::no /opt/tf on this runner - downloading terraform"
          fi

      - name: Set up terraform 1.9.8 (attempt 1)
        id: tf1
        if: steps.localtf.outputs.found != 'true'
        continue-on-error: true
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Set up terraform 1.9.8 (attempt 2)
        id: tf2
        if: steps.localtf.outputs.found != 'true' && steps.tf1.outcome == 'failure'
        continue-on-error: true
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Set up terraform 1.9.8 (attempt 3)
        id: tf3
        if: steps.localtf.outputs.found != 'true' && steps.tf1.outcome == 'failure' && steps.tf2.outcome == 'failure'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # A runner without /opt/tf builds the same layout once in its own tool
      # cache, kept between jobs: otherwise every run downloads the google
      # providers again and tf-steps-render-and-validate outgrows its 120 s
      # (run 37020039069; 52 s on a runner with the mirror, run 37031322430).
      - name: No /opt/tf - provider mirror in the runner's tool cache (do_setup_tf_mirror)
        if: steps.localtf.outputs.found != 'true'
        working-directory: csi-spl-iac
        run: |
          set -euo pipefail
          export TF_MIRROR_ROOT="$RUNNER_TOOL_CACHE/csi-spl-tf"
          ./run -a do_setup_tf_mirror
          echo "TF_CLI_CONFIG_FILE=$TF_MIRROR_ROOT/terraformrc" >>"$GITHUB_ENV"

      - name: tpl-gen at the pin (do_setup_tpl_gen)
        working-directory: csi-spl-iac
        env:
          TPL_GEN_REPO_URL: https://github.com/csitea/tpl-gen.git
        run: ./run -a do_setup_tpl_gen

      # Proof that the suite reaches no GCP: gcloud / gsutil / bq on PATH are
      # traps that log their argv and fail, there is no key, no ADC and an
      # empty CLOUDSDK_CONFIG. A test that stubs gcloud puts its stub first on
      # PATH and never reaches the trap; any line in the trap log is a test
      # that tried the real CLI, and fails the job below.
      - name: Trap gcloud / gsutil / bq (no GCP from this job)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcp-trap" "$RUNNER_TEMP/gcloud-empty"
          for b in gcloud gsutil bq; do
            printf '#!/bin/sh\necho "%s $*" >>"%s"\nexit 1\n' "$b" "$RUNNER_TEMP/gcp-trap.log" >"$RUNNER_TEMP/gcp-trap/$b"
            chmod +x "$RUNNER_TEMP/gcp-trap/$b"
          done
          : >"$RUNNER_TEMP/gcp-trap.log"
          echo "$RUNNER_TEMP/gcp-trap" >>"$GITHUB_PATH"
          echo "CLOUDSDK_CONFIG=$RUNNER_TEMP/gcloud-empty" >>"$GITHUB_ENV"
          [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" && ! -e "$HOME/.gcp" ]] || { echo "::error::a GCP credential is present on the runner"; exit 1; }

      # The tests' mktemp scratch goes to the job's own disk-backed temp dir,
      # not the box's shared /tmp tmpfs: other work filled that one and cut
      # the hygiene controls' tree copies short (run 37031322430). Not a
      # subdir of it: tpl-gen-step-render-parity needs its scratch no deeper
      # than the checkout's csi-spl-cnf (run 37037762945).
      - name: run-all-tests.sh
        run: |
          set -euo pipefail
          unset SPL_TF_ALLOW_SKIP
          export TMPDIR="$RUNNER_TEMP"
          bash csi-spl-iac/src/bash/tests/run-all-tests.sh 2>&1 | tee "$RUNNER_TEMP/iac-suite.log"

      - name: No test reached GCP (the trap log is empty)
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/gcp-trap.log" ]]; then
            echo "::error::a test called the real gcloud/gsutil/bq -- this suite must be offline"
            sed 's/^/  /' "$RUNNER_TEMP/gcp-trap.log"
            exit 1
          fi
          echo "ok - no gcloud / gsutil / bq call reached the runner's CLI"

      - name: Nothing skipped (a skip is a failure in CI)
        run: |
          set -euo pipefail
          if grep -E '^(SKIP|PARTIAL):' "$RUNNER_TEMP/iac-suite.log"; then
            echo "::error::an iac check skipped in CI -- it proved nothing. Fix the runner setup above."
            exit 1
          fi
          grep -q '^PASS: all tf-steps-render-and-validate.tst.sh assertions' "$RUNNER_TEMP/iac-suite.log" \
            || { echo "::error::tf-steps-render-and-validate did not report PASS: all"; exit 1; }
          echo "ok - no iac check skipped; render parity + validate ran"

  # ===========================================================================
  # The ORC suite (016 T004): csi-spl-orc/src/bash/tests/run-all-tests.sh.
  # Every file is hermetic on ubuntu-latest: gcloud / curl / docker push are
  # stubbed per test, lde-stack.tst.sh needs only `docker compose config` and
  # `sudo -n` (both on the runner), checkout-fake-buy.tst.sh a spool build
  # and a throwaway postgres:16-alpine (pulled here, since the test never
  # pulls). No GCP, no tmux server, no running lde stack. The feature tests
  # (spawn-agents and the rest) are job orc-features below.
  # Two shards (ORC_TEST_SHARD=<k>/2, every 2nd file): one job reached the
  # 20-min cap with 266 of 280 files done (runs 37851965128, 37857115383;
  # green runs before took 16-17 min). Each shard prints its 10 slowest files.
  # ===========================================================================
  orc-suite:
    name: "orc: hermetic action tests (stubbed gcloud/curl/docker) ${{ matrix.shard }}/2"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    # actions: read for gate-fail-fast.sh (see wui-e2e): a red job elsewhere
    # in the run ends this one, so a red gate frees its slot.
    permissions:
      contents: read
      actions: read
    # orc derives ORG/APP from the PARENT dirs, <base>/<ORG>/<ORG>-<APP>
    # (csi-spl-orc/lib/bash/funcs/resolve-oap.func.sh), so the tree is checked
    # out in the operator's layout: on the runner's default
    # .../csi-spl/csi-spl it derives ORG=csi-spl and every tf-runner name is
    # wrong (run 35447040549: tf-import-existing, tf-runner-make-path).
    defaults:
      run:
        working-directory: csi/csi-spl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: csi/csi-spl

      # The tests' go builds (100-380 MB go-build work dirs each) and mktemp
      # fixtures go to the job's disk, not the box's shared /tmp tmpfs (see
      # hub-suite).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: csi/csi-spl/csi-spl-api/src/go/spool-hub-api/go.mod
          cache: false

      # checkout-fake-buy builds spool offline (GOPROXY=off).
      - name: Download Go modules
        working-directory: csi/csi-spl/csi-spl-api/src/go/spool-hub-api
        run: go mod download

      # checkout-fake-buy SKIPs its live part without a CACHED image.
      - name: Cache the Postgres image
        # A copy already on this persistent self-hosted runner works for the
        # test (it needs a postgres:16-alpine, and the test never pulls), so use
        # it and touch no network: a docker pull of a present image is still a
        # ~2.5 s Docker Hub round trip (measured 2026-09-29) and Docker Hub
        # resets the connection now and then (run 36148403827). Only pull when
        # it is genuinely absent (a fresh runner), then fall back to the cache.
        run: |
          img=postgres:16-alpine
          docker image inspect "$img" >/dev/null 2>&1 && { echo "using the cached $img"; exit 0; }
          for i in 1 2 3; do docker pull -q "$img" && exit 0; sleep $((i * 10)); done
          docker image inspect "$img" >/dev/null 2>&1 \
            && { echo "::warning::docker pull $img failed 3x; using the cached image"; exit 0; }
          exit 1

      # Proof that the suite reaches no GCP: gcloud / gsutil / bq on PATH are
      # traps that log their argv and fail, there is no key, no ADC and an
      # empty CLOUDSDK_CONFIG. A test that stubs gcloud puts its stub first on
      # PATH and never reaches the trap; any line in the trap log is a test
      # that tried the real CLI, and fails the job below.
      - name: Trap gcloud / gsutil / bq (no GCP from this job)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcp-trap" "$RUNNER_TEMP/gcloud-empty"
          for b in gcloud gsutil bq; do
            printf '#!/bin/sh\necho "%s $*" >>"%s"\nexit 1\n' "$b" "$RUNNER_TEMP/gcp-trap.log" >"$RUNNER_TEMP/gcp-trap/$b"
            chmod +x "$RUNNER_TEMP/gcp-trap/$b"
          done
          : >"$RUNNER_TEMP/gcp-trap.log"
          echo "$RUNNER_TEMP/gcp-trap" >>"$GITHUB_PATH"
          echo "CLOUDSDK_CONFIG=$RUNNER_TEMP/gcloud-empty" >>"$GITHUB_ENV"
          [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" && ! -e "$HOME/.gcp" ]] || { echo "::error::a GCP credential is present on the runner"; exit 1; }

      - name: run-all-tests.sh
        env:
          GATE_FAIL_FAST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
          ORC_TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          set -euo pipefail
          bash csi-spl-orc/src/bash/scripts/gate-fail-fast.sh \
            bash csi-spl-orc/src/bash/tests/run-all-tests.sh 2>&1 | tee "$RUNNER_TEMP/orc-suite.log"

      - name: No test reached GCP (the trap log is empty)
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/gcp-trap.log" ]]; then
            echo "::error::a test called the real gcloud/gsutil/bq -- this suite must be offline"
            sed 's/^/  /' "$RUNNER_TEMP/gcp-trap.log"
            exit 1
          fi
          echo "ok - no gcloud / gsutil / bq call reached the runner's CLI"

      # ghrunner has no sudo (a CI user with root on the box is not worth it),
      # so the root-only sections of spool-permissions (1-3), lde-stack (5)
      # and box-workspace-isolation (3: throwaway users, EACCES) SKIP on the
      # host. They run here instead, in a throwaway container whose
      # user has passwordless sudo, setfacl and a `nobody`; yq is the runner's.
      # The container has no docker compose, so lde-stack's compose check
      # SKIPs there -- the host run above covers it. Shard 1 only: it runs
      # its three files whole, whichever shard runs them on the host.
      - name: Root-only sections in a container (sudo, setfacl, nobody)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          docker build -q -t spl-orc-sudo:ci - <<'DOCKERFILE'
          FROM debian:13-slim
          RUN apt-get update -qq \
           && apt-get install -y -qq --no-install-recommends sudo acl bash coreutils procps python3 jq git curl ca-certificates gettext-base >/dev/null \
           && rm -rf /var/lib/apt/lists/* \
           && useradd -m -s /bin/bash ci && echo 'ci ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci
          USER ci
          DOCKERFILE
          docker run --rm -v "$(command -v yq)":/usr/local/bin/yq:ro \
            -v "$PWD":/w/csi/csi-spl:ro -w /w/csi/csi-spl spl-orc-sudo:ci bash -c '
              set -uo pipefail; rc=0
              for t in spool-permissions lde-stack box-workspace-isolation; do
                echo "=== $t.tst.sh"; bash csi-spl-orc/src/bash/tests/$t.tst.sh || rc=1
              done; exit $rc' 2>&1 | tee "$RUNNER_TEMP/orc-sudo.log"
          if grep -E '^SKIP:' "$RUNNER_TEMP/orc-sudo.log" | grep -vx 'SKIP: no docker compose'; then
            echo "::error::a root-only orc section skipped in the container too"; exit 1
          fi
          for want in 'PASS: an outsider cannot inject a message' 'PASS: sticky cleared, setgid set' \
                      "PASS: workspace B's user gets EACCES reading A's message"; do
            grep -qxF "$want" "$RUNNER_TEMP/orc-sudo.log" || { echo "::error::container run lacks: $want"; exit 1; }
          done
          echo "ok - the root-only sections ran and passed in the container"

      - name: Nothing skipped (a skip is a failure in CI)
        run: |
          set -euo pipefail
          # The three root-only SKIPs are allowed ONLY because the step above ran
          # those exact sections with sudo and passed; any other SKIP fails.
          if grep -E '^SKIP:' "$RUNNER_TEMP/orc-suite.log" \
             | grep -vxF -e 'SKIP: no passwordless sudo / setfacl' \
                         -e 'SKIP: no passwordless sudo / setfacl / nobody (or nobody is in ghrunner): sections 1-3' \
                         -e 'SKIP: part 3 needs passwordless sudo and useradd'; then
            echo "::error::an orc check skipped in CI -- it proved nothing. Fix the runner setup above."
            exit 1
          fi
          echo "ok - no orc check skipped outside the container-proven sections"

  # ===========================================================================
  # The orc FEATURE tests: every csi-spl-orc/src/bash/features/*/tests/test-*.sh
  # (spawn-agents, graft, mcp-bot, ...), found by
  # csi-spl-orc/src/bash/features/run-ci-tests.sh, one per cpu (at most 6;
  # features/ci-serial.txt names the ones that run alone after). Reverses 016
  # FR-011: two spawn-agents tests stayed red on master unnoticed (fixed
  # 9fb5f0a54, 2645bc5de) because nothing ran them. Each test drives a private
  # tmux server and a throwaway SPOOL_ROOT (SPOOL_TEST=1), so nothing touches
  # the box. Left out, each printed by name: features/ci-skip.txt (a red owned
  # by another lane) and the files an orc-suite wrapper already execs.
  # Its own job, beside orc-suite (16-17 min): measured 2026-10-09, 73 files
  # in 80 s at 6 jobs on the box, 192 s on a 4-cpu hosted runner (452 s for
  # spawn-agents alone, serial).
  # ===========================================================================
  orc-features:
    name: "orc: feature tests (spawn-agents, graft, mcp-bot, ...)"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Same operator layout as orc-suite: ./run derives ORG/APP from the parent dirs.
    defaults:
      run:
        working-directory: csi/csi-spl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: csi/csi-spl

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite).
      # A tmux socket path over 107 bytes fails to bind, and every spawn-agents
      # test keeps its socket under TMPDIR: refuse a long one up front.
      - name: Temp files on the runner's disk, short enough for tmux sockets
        run: |
          (( ${#RUNNER_TEMP} <= 60 )) || { echo "::error::RUNNER_TEMP is ${#RUNNER_TEMP} bytes; tmux sockets under it would not bind"; exit 1; }
          echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      # Several tests build spool (go build, GOPROXY=off in some).
      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: csi/csi-spl/csi-spl-api/src/go/spool-hub-api/go.mod
          cache: false

      - name: Download Go modules
        working-directory: csi/csi-spl/csi-spl-api/src/go/spool-hub-api
        run: go mod download

      # The self-hosted box has tmux; a hosted runner may not.
      - name: tmux on PATH
        run: |
          command -v tmux >/dev/null && { tmux -V; exit 0; }
          sudo -n apt-get install -y -qq tmux >/dev/null && tmux -V

      - name: run-ci-tests.sh
        run: bash csi-spl-orc/src/bash/features/run-ci-tests.sh

  # ===========================================================================
  # The CNF suite (016 T005): the conf-validator exit-code contract
  # (0 valid / 1 invalid / 2 could not check). The test refuses to skip: an
  # interpreter without the validator's dependencies is exit 2. The poetry
  # env is the module's own .venv, which the test picks up by itself.
  # ===========================================================================
  cnf-suite:
    name: "cnf: conf-validator exit codes"
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.doc_only != 'true' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite;
      # run 37053725586: wui unit, cnf and iac red on ENOSPC, /tmp inodes full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      # actions/setup-python has no build for the runner's Debian 13 ("version
      # '3.12' ... was not found for Debian 13"), so the job uses the runner's
      # own python3 (pyproject asks ^3.10) and a throwaway venv for poetry.
      - name: Set up Python (the runner's python3 + a venv for poetry)
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/poetry-venv"
          "$RUNNER_TEMP/poetry-venv/bin/pip" install -q poetry
          echo "$RUNNER_TEMP/poetry-venv/bin" >>"$GITHUB_PATH"

      - name: poetry install (conf-validator, from its lock)
        working-directory: csi-spl-cnf/src/python/conf-validator
        run: |
          set -euo pipefail
          poetry env use "$(command -v python3)"
          poetry install --no-root --no-interaction

      - name: conf-validator-exit-codes.tst.sh
        run: bash csi-spl-cnf/src/bash/tests/conf-validator-exit-codes.tst.sh

      # spec 076 T002: the models' own unit tests (env.cloud.provider)
      - name: conf-validator unit tests
        working-directory: csi-spl-cnf/src/python/conf-validator
        run: poetry run python -m unittest discover -v

  # ===========================================================================
  # Reference-hygiene gate (spec 002 T003): the spool Go source never
  # references ysg-box. Also part of run-all-tests.sh; its own job so a
  # failure is named on the run page.
  # ===========================================================================
  no-ysg-box-ref:
    name: "spool source carries no ysg-box reference"
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite;
      # run 37053725586: wui unit, cnf and iac red on ENOSPC, /tmp inodes full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"
      - run: bash csi-spl-api/src/bash/tests/no-ysg-box-ref.tst.sh

  # ===========================================================================
  # Read-only security scanners for a PULL REQUEST (spec 072 A35, research a3
  # S6): gitleaks over the history, trivy config over the terraform, checkov.
  # The same named actions 15_sec-deps-secrets.yml and 65_iac-checkov.yml run
  # on every master push, so a push skips this job rather than run them twice
  # on the self-hosted runners; any other event (11's pull_request, a
  # dispatch) runs it. No secret, no write: a planted secret or a bad IaC
  # change fails the pull request before merge.
  # ===========================================================================
  pr-sec-scan:
    name: "sec: gitleaks, trivy config, checkov (read-only)"
    if: ${{ github.event_name != 'push' }}
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      # Pinned and checksummed as in 15_sec-deps-secrets.yml.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "$sha  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gitleaks (control, then the history)
        working-directory: csi-spl-iac
        run: SEC_SCAN=secrets ./run -a do_sec_scan

      - name: Install trivy 0.74.0
        run: |
          set -euo pipefail
          v=0.74.0; base="https://github.com/aquasecurity/trivy/releases/download/v$v"
          tgz="trivy_${v}_Linux-64bit.tar.gz"
          get() { curl -fsSL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 -o "$2" "$1"; }
          get "$base/$tgz" "$RUNNER_TEMP/$tgz"
          get "$base/trivy_${v}_checksums.txt" "$RUNNER_TEMP/trivy-checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tgz\$" trivy-checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/trivy" && tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version | head -1
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: trivy config (terraform misconfiguration)
        working-directory: csi-spl-iac
        run: SEC_SCAN=iac ./run -a do_sec_scan

      - name: Install checkov 3.3.21
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/checkov-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --quiet checkov==3.3.21
          "$venv/bin/checkov" --version | grep -xF 3.3.21
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: checkov (control + scan vs baseline)
        working-directory: csi-spl-iac
        run: ./run -a do_sec_checkov

  # ===========================================================================
  # Gate health (CLE-3442): on a RED run only, the failures-per-JOB table for
  # the last 40 runs, written into this run's summary. Counted per run, one
  # banned line in one spec.md read as twelve broken pipelines on 2026-09-21;
  # counted per job it reads as one defect that sat on trunk for 14 minutes,
  # which is the thing a lane can act on.
  #
  # A REPORT, never a gate: continue-on-error, so it cannot redden a run, and
  # correspondingly it proves nothing -- read it, do not trust it as a control.
  # It runs the same named action an operator runs (do_report_ci_gate), and
  # `actions: read` is the only permission it adds, for this job alone.
  # A code job the express docs lane skipped is `skipped`, not a failure, so
  # a doc-only push never starts this job.
  # ===========================================================================
  gate-health:
    name: "gate health: what else has been failing"
    needs: [hub-suite, wui-suite, wui-generate, wui-e2e, iac-suite, orc-suite, orc-features, cnf-suite, no-ysg-box-ref, distribution-hygiene, pr-sec-scan]
    if: failure()
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite;
      # run 37053725586: wui unit, cnf and iac red on ENOSPC, /tmp inodes full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Failures per job over the last 40 runs
        working-directory: csi-spl-iac
        env:
          GH_TOKEN: ${{ github.token }}
          CI_GATE_RUNS: "40"
          CI_GATE_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          {
            echo "## gate health -- failures per job, last ${CI_GATE_RUNS} runs"
            echo
            echo '```'
            ./run -a do_report_ci_gate 2>&1 \
              | sed -E 's/\x1b\[[0-9;]*m//g' \
              | grep -avE '\[(DEBUG|INFO)\]' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Distribution-hygiene sweep: org-neutral, no personal names, no literal OS
  # users / box names / AD identities / personal home dirs, no owner mail
  # address. Values are withheld from the log on purpose -- a CI log is a
  # distribution channel too -- so only file:line is printed.
  #
  # "ysg-box" is the name of the behavioural reference product and is allowed;
  # a bare "ysg" (the OS user) is not. Images are a zip-time exclusion, not a
  # source-tree one, so they are not swept here.
  #
  # Excluded: the AI-tool instruction files (never distributed), this file and
  # the spawn-agents hygiene test (both hold the patterns themselves).
  # ===========================================================================
  distribution-hygiene:
    name: "distribution-hygiene sweep over the tree"
    runs-on: ${{ inputs.runner && fromJSON(inputs.runner) || vars.SPOOL_CI_RUNNER && fromJSON(vars.SPOOL_CI_RUNNER) || github.repository == 'csitea/csi-spl' && fromJSON('["self-hosted","spool-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Temp on the job's disk, not the box's shared /tmp tmpfs (see hub-suite;
      # run 37053725586: wui unit, cnf and iac red on ENOSPC, /tmp inodes full).
      - name: Temp files on the runner's disk, not the shared /tmp tmpfs
        run: echo "TMPDIR=$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Sweep
        run: |
          set -uo pipefail
          excl=(--exclude=CLAUDE.md --exclude=GEMINI.md --exclude=AGENTS.md
                --exclude=10_ci-quality.yml --exclude=test-hygiene.sh
                --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=tpl-gen)
          fail=0
          # Owner-approved exception (owner decision 2026-09-19, "in the yaml,
          # relax the gate"): the owner's gcloud account is config, key
          # env.gcp.gcp_account_owner_email. A hit is allowed ONLY when it is
          # in csi-spl-cnf/csi-spl/<name>.env.{yaml,json} AND the whole line
          # is that key with one bare value -- no comment, no second value.
          # The same address anywhere else, under another key, or trailed by
          # anything on that line still fails. Not a blanket email allow.
          # The R03 alert recipients (owner order 2026-10-05, step 070)
          # are the same kind of config: keys alert_email_<n> in the same
          # env.gcp section, one bare value per line, allowed exactly so.
          # CONTROL: csi-spl-iac/src/bash/tests/hygiene-owner-email-allow.tst.sh
          allow_file='^\./csi-spl-cnf/csi-spl/[a-z]+\.env\.(yaml|json)$'
          allow_line='^[[:space:]]*"?(gcp_account_owner_email|alert_email_[0-9]+)"?[[:space:]]*:[[:space:]]*"?[^"[:space:]#,]+"?,?[[:space:]]*$'
          # Second owner-approved exception (spec 069 v0.2, section 4 row Y8:
          # "users into csi-spl-cnf"): the satellite's two OS users are
          # config, keys box_owner_user / box_agent_user in the same cnf
          # files, one bare user name per line, and ONLY the OS-user sweep
          # allows them (the name and mail sweeps allow only the mail key).
          # CONTROL: csi-spl-iac/src/bash/tests/hygiene-box-users-allow.tst.sh
          allow_user_line='^[[:space:]]*"?box_(owner|agent)_user"?[[:space:]]*:[[:space:]]*"?[a-z_][a-z0-9_-]*"?,?[[:space:]]*$'
          allowed() { # <file:line> <the line regex this sweep allows, or "">
            local f="${1%%:*}" n="${1#*:}" re="$2"
            [[ -n "$re" ]] || return 1
            [[ "$f" =~ $allow_file ]] || return 1
            [[ "$(sed -n "${n}p" "$f")" =~ $re ]]
          }
          sweep() { # <label> <pattern> [<allowed line regex> <what it allows>]
            local label="$1" pattern="$2" re="${3:-}" what="${4:-}" hits rc=0 h kept="" n_allowed=0
            # grep exits 1 on NO match -- the clean case. The step shell is
            # `bash -e` and pipefail carries grep's status out of the
            # pipeline, so an unguarded clean sweep would abort the script
            # silently. Accept 1; anything above it (bad pattern, unreadable
            # tree) is a gate failure, never a pass.
            # The owner-approved allowance is applied below (allowed()), per
            # hit, by file AND whole line -- not by key name alone.
            hits="$(grep -rnIoP "${excl[@]}" "$pattern" . | cut -d: -f1,2 | sort -u)" || rc=$?
            if (( rc > 1 )); then
              echo "::error::hygiene: ${label} -- grep failed (rc=$rc), the sweep proved nothing"
              fail=1; return 0
            fi
            while IFS= read -r h; do
              [[ -n "$h" ]] || continue
              if allowed "$h" "$re"; then n_allowed=$((n_allowed + 1)); else kept+="$h"$'\n'; fi
            done <<<"$hits"
            hits="${kept%$'\n'}"
            (( n_allowed )) && echo "allowed - ${label}: ${n_allowed} line(s) = the owner-approved ${what} in csi-spl-cnf"
            if [[ -n "$hits" ]]; then
              echo "::error::hygiene: ${label} -- $(wc -l <<<"$hits") line(s)"
              sed 's/^/  /' <<<"$hits"
              fail=1
            else
              echo "ok - ${label}"
            fi
          }
          sweep "non-Csitea org or bank reference" '(?i)nordea|\.op\.fi|op-pohjola'
          sweep "personal name"                    '(?i)yordan|georgiev|sandholm|\bpetri\b' \
                "$allow_line" "gcp_account_owner_email key"
          sweep "literal OS user / box / AD id"    '(?i)\bysg\b(?!-box)|\bclaude-user\b|\bai-usr\b|\bz013503\b|wmpf5jz555|\btnk\b' \
                "$allow_user_line" "box_owner_user / box_agent_user keys"
          sweep "personal home directory"          '/home/(?!runner\b)[a-z][a-z0-9_-]*/'
          sweep "owner mail address or domain"     '(?i)@gmail\.com|flok\.fi' \
                "$allow_line" "gcp_account_owner_email key"
          # Spec 110 2.3: no TRACKED .vibe/ dir anywhere in the tree. Every
          # worktree is a trusted Vibe folder whose .vibe/{config.toml,
          # hooks.toml,AGENTS.md} is read first, so one commit could change the
          # model, add an MCP server or run a pre_tool hook on every m- seat.
          # Over the files on disk, not git ls-files: here that is the
          # checkout, and do_check_dist_hygiene runs this same step over a
          # tracked-file export -- one rule, one place.
          # CONTROL: csi-spl-iac/src/bash/tests/check-dist-hygiene.tst.sh
          vibe="$(find . -path ./.git -prune -o ! -type d -print | sed 's|^\./||' | grep -E '(^|/)\.vibe/' | sort)" || true
          if [[ -n "$vibe" ]]; then
            while IFS= read -r f; do
              echo "::error file=$f::a tracked .vibe/ file: Vibe reads it first in every trusted worktree (model, MCP servers, pre_tool hooks) - git rm --cached it (spec 110 2.3)"
            done <<<"$vibe"
            fail=1
          else
            echo "ok - no tracked .vibe/ dir"
          fi
          exit "$fail"
