# ci: the public quality gate -- the pull-request entry to the ONE gate.
#
# Spec 072 A35: a contributor's pull request (fork branches included) runs the
# SAME jobs as a master push, because this workflow holds no job of its own: it
# calls 10_ci-quality.yml, the reusable gate (hub, wui unit + typecheck,
# generate, browser e2e, iac, orc, cnf, no-ysg-box-ref, distribution hygiene,
# and the read-only security scanners). Add a check to 10 and a pull request
# gets it too; there is no second list to keep in step.
#
# GitHub-hosted runners only (`runner` below), no secret, read-only token: a
# pull request can never reach the self-hosted runners (org runner group
# spool-ci-trusted: named workflows at refs/heads/master only). Outside
# contributors' runs still wait for a maintainer's approval (repository
# setting). Runs only while the repository is PUBLIC (hosted minutes of a
# private repo are billed). A master push is gated by 10 alone.

name: "11 ci: public quality gate"

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: "gate"
    if: ${{ !github.event.repository.private }}
    # gate-health in 10 reads the run list (actions: read); nothing writes.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/10_ci-quality.yml
    with:
      runner: '"ubuntu-latest"'
      # card-edge-inset asserts the 390 px channel card header fits ONE line;
      # with the hosted runner's fonts it wraps to two (run 36942045783), on
      # the self-hosted box it is one. Its other 60+ checks are
      # font-independent and run on every push. (CLE-77915)
      e2e_skip: card-edge-inset.test.mjs
