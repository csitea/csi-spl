# Dependency and secret scans. Same runner rule as 10_ci-quality.yml:
# self-hosted (spool-ci), not ubuntu-latest. Tools are installed in the job.
# A missing tool fails the action; nothing here skips.
#
# govulncheck pin is golang.org/x/vuln v1.8.0 (needs go 1.26), which builds on this module's
# go 1.26. The vulnerability database is downloaded at run time.
# gitleaks 8.30.1 reads .gitleaks.toml and the full history (fetch-depth: 0).
# pnpm audit fails on moderate and above.
# trivy 0.74.0 scans the production hub base image. The image is that base
# plus a static binary and SQL; the binary is govulncheck's job.
# --ignore-unfixed: an upstream CVE with no fix does not redden trunk.
name: "15 sec: deps and secrets"

on:
  workflow_dispatch:
    inputs:
      push_scope:
        description: >-
          scope the dependency legs as a push would (diff from the last green
          run on this ref); for a control on a throwaway branch. Off: every leg.
        type: boolean
        default: false
  push:
    branches: [master]
    # No path filter: gitleaks scans the full history, so a secret can land in
    # ANY file. The DEPENDENCY legs (govulncheck, pnpm audit, trivy) are scoped
    # inside the job instead (step "scope" below; owner 2026-10-01, CLE-77829):
    # on a push they run only when go.mod/go.sum, the WUI lockfile, a
    # Dockerfile, terraform or this scan itself changed SINCE THE LAST GREEN
    # RUN. Schedule and dispatch always run every leg (new advisories land
    # without a push).
  schedule:
    # nightly full run on master (belt-and-braces with the per-push run)
    - cron: '17 3 * * *'

permissions:
  contents: read

# Only the newest sha's scan matters; cancel a superseded run so a busy trunk
# does not queue a scan per push.
concurrency:
  group: sec-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sec-scan:
    name: "sec: govulncheck, pnpm audit, gitleaks, trivy"
    # GitHub-hosted: the repo is public (free minutes) and these scanners need no
    # box state, so they run off the 4 self-hosted runners that deploys need.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read to find the last green run of this workflow (scope step)
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Which legs does this event need? gitleaks always; the dependency legs
      # only when their inputs changed since the LAST GREEN run of this
      # workflow on the ref (csi-spl-iac/src/bash/scripts/sec-deps-scope.sh).
      # NOT github.event.before: cancel-in-progress kills a superseded run, so
      # `before` may be a deps push whose scan never ran (c81ef0110 superseded
      # 42 s later by e3d3ec2a5, deps=false, 2026-10-10). No green run, an API
      # or script error: every leg runs. Gate: sec-deps-scope.tst.sh.
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PUSH_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.push_scope || false }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          v=deps=true BASE=""
          if [[ "$EVENT" == push || "$PUSH_SCOPE" == true ]]; then
            BASE=$(gh api "repos/$REPO/actions/workflows/15_sec-deps-secrets.yml/runs?branch=$REF_NAME&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || BASE=""
            [[ -n "$BASE" ]] || echo "sec-deps-scope: no last green run found"
            v=$(bash csi-spl-iac/src/bash/scripts/sec-deps-scope.sh "$BASE" "$HEAD_SHA") || v=deps=true
          fi
          [[ "$v" == deps=false ]] || v=deps=true
          echo "$v" >> "$GITHUB_OUTPUT"
          echo "dependency legs (govulncheck, pnpm audit, trivy): ${v#deps=}; gitleaks: always"
          echo "**$v** (${BASE:0:12}..${HEAD_SHA:0:12}, $EVENT)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go (version from go.mod)
        if: steps.scope.outputs.deps == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: csi-spl-api/src/go/spool-hub-api/go.mod
          cache: true
          cache-dependency-path: csi-spl-api/src/go/spool-hub-api/go.sum

      - name: Download Go modules
        if: steps.scope.outputs.deps == 'true'
        working-directory: csi-spl-api/src/go/spool-hub-api
        run: go mod download

      - name: Install govulncheck v1.8.0
        if: steps.scope.outputs.deps == 'true'
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: govulncheck (reachable vulnerabilities)
        if: steps.scope.outputs.deps == 'true'
        working-directory: csi-spl-iac
        run: SEC_SCAN=go ./run -a do_sec_scan

      - name: Set up pnpm (version from package.json packageManager)
        if: steps.scope.outputs.deps == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: csi-spl-wui/package.json
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node
        if: steps.scope.outputs.deps == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: csi-spl-wui/pnpm-lock.yaml

      - name: pnpm install (frozen lockfile)
        if: steps.scope.outputs.deps == 'true'
        working-directory: csi-spl-wui
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (moderate and above)
        if: steps.scope.outputs.deps == 'true'
        working-directory: csi-spl-iac
        run: SEC_SCAN=wui ./run -a do_sec_scan

      # The tarball is verified against its published sha256 before it is
      # unpacked, so a MITM or a swapped release asset fails closed instead of
      # running an unknown binary (as the trivy step below already does).
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "$sha  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gitleaks (full history)
        working-directory: csi-spl-iac
        run: SEC_SCAN=secrets ./run -a do_sec_scan

      # Cached per runner in the tool cache: a fresh download every run failed
      # on the box's Wi-Fi (curl 92 HTTP/2 PROTOCOL_ERROR, run 36233647193).
      # A miss downloads with retries over HTTP/1.1 and checks the archive
      # against trivy's published checksums before it is cached.
      - name: Install trivy 0.74.0
        if: steps.scope.outputs.deps == 'true'
        run: |
          set -euo pipefail
          v=0.74.0; dir="$RUNNER_TOOL_CACHE/trivy/$v"
          if [[ ! -x "$dir/trivy" ]]; then
            base="https://github.com/aquasecurity/trivy/releases/download/v$v"
            tgz="trivy_0.74.0_Linux-64bit.tar.gz"
            get() { curl -fsSL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 -o "$2" "$1"; }
            get "$base/$tgz" "$RUNNER_TEMP/$tgz"
            get "$base/trivy_0.74.0_checksums.txt" "$RUNNER_TEMP/trivy-checksums.txt"
            (cd "$RUNNER_TEMP" && grep " $tgz\$" trivy-checksums.txt | sha256sum -c -)
            mkdir -p "$dir.tmp.$$" && tar -xzf "$RUNNER_TEMP/$tgz" -C "$dir.tmp.$$" trivy
            mkdir -p "$(dirname "$dir")" && mv -T "$dir.tmp.$$" "$dir" 2>/dev/null || rm -rf "$dir.tmp.$$"
          fi
          "$dir/trivy" --version | head -1
          echo "$dir" >> "$GITHUB_PATH"

      - name: trivy (hub base image)
        if: steps.scope.outputs.deps == 'true'
        working-directory: csi-spl-iac
        run: SEC_SCAN=images ./run -a do_sec_scan
