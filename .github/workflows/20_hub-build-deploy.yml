name: 20_hub-build-deploy
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "csi-spl-api/**"
      - "csi-spl-cnf/**"
      - "csi-spl-iac/**"
      - ".github/workflows/20_hub-build-deploy.yml"

env:
  ENV: dev
  APP: hub
  REGISTRY: europe-north1-docker.pkg.dev
  REPO: csi-spl-dev
  IMAGE: hub
  DEPLOY_SA: csi-spl-dev@csi-spl-dev.iam.gserviceaccount.com
  DEPLOY_ID_TOKEN: ${{ secrets.DEPLOY_ID_TOKEN }}

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard
        id: guard
        run: |
          set -euo pipefail
          ok=1
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Only run on push if csi-spl-api or csi-spl-cnf changed
            if ! git diff --quiet HEAD~1 HEAD -- csi-spl-api csi-spl-cnf; then
              echo "ok=true" >> $GITHUB_OUTPUT
            else
              echo "ok=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi

  ver:
    needs: guard
    if: needs.guard.outputs.ok == true
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ver.outputs.sha }}
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      stale: ${{ steps.ver.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          tag="$(git describe --tags --exact-match 2>/dev/null || echo "")"
          version="$(./csi-spl-iac/run -a do_release_version)"
          stale="false"
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            stale="true"
          fi
          echo "sha=$sha" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "stale=$stale" >> $GITHUB_OUTPUT

  build:
    needs: ver
    if: needs.guard.outputs.ok == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1027449934695/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: csi-spl-dev@csi-spl-dev.iam.gserviceaccount.com

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker build -t ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ needs.ver.outputs.sha }} -f csi-spl-api/src/docker/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ needs.ver.outputs.sha }}

  deploy:
    needs: [guard, ver, build]
    if: needs.guard.outputs.ok == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1027449934695/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: csi-spl-dev@csi-spl-dev.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy ${{ env.APP }} \
            --image ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ needs.ver.outputs.sha }} \
            --region europe-north1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "ENV=${{ env.ENV }}"

      # spec 112 ORC-2: sync approved goals and milestones to the calendar after the hub deploy.
      # Treats 503 roadmap_not_configured as a warning (not a failure) to avoid blocking deploys.
      - name: Sync goals to calendar (do_spl_goals_sync)
        if: needs.guard.outputs.ok == true && needs.ver.outputs.stale != true
        run: |
          set -euo pipefail
          rc=0
          ENV="$ENV" GCP_ACCOUNT="$DEPLOY_SA" ./csi-spl-orc/run -a do_spl_goals_sync || rc=$?
          case "$rc" in
            0) echo "INFO: Goals synced successfully" ;;
            503) echo "WARNING: Roadmap not configured (503 roadmap_not_configured)" ;;
            *) echo "ERROR: Sync failed with exit code $rc" && exit $rc ;;
          esac
