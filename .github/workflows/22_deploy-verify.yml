# ci-cd: spool hub deploy verify (post-deploy smoke)
#
# Modelled on csi-rel's verify-api-health.sh step: after the hub deploy, prove
# the PUBLIC acceptance endpoints answer over HTTPS the way a client reaches
# them (spec 008 FR-P12):
#   site  GET https://<env.dns.fqdn>/                               200, body
#   api   GET https://[<env_subdomain>.]api.<BASE_DOMAIN>/version
#         200 + JSON {version, commit, built_at}
# Every name comes from cnf (csi-spl-orc/src/bash/scripts/verify-hub-endpoints.sh
# resolves them); this file carries no host.
#
# A reusable workflow: 20 calls it as its last job (after deploy, whether the
# deploy ran, was skipped or stood down), and it can be dispatched by hand at
# any time, because the endpoints can break -- or start working -- with no
# deploy at all (DNS, cert, LB). Called from 20, it verifies the envs 20 was
# asked for: a push or "all" -> dev + prd, a dispatch naming one env -> that env.
# (It was first wired as `workflow_run` on 20's completion; that trigger did
# not fire for two completed 20 runs, so the call is now explicit.)
#
# SOFT vs HARD, as csi-rel's UNKNOWN verdict: a probe that cannot reach the hub
# YET -- the name does not resolve, nothing listens there, the managed cert is
# not ACTIVE, or the LB allowlist refuses a GitHub runner (403) -- is a
# ::warning:: and the job stays green, so a not-yet-provisioned ingress never
# reddens trunk. A reachable endpoint that answers wrong (5xx, 404, a bad
# /version body, a timeout) FAILS the job. The job summary says which.

name: "22 ci-cd: spool hub deploy verify"

on:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to verify'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - dev
          - prd

permissions:
  contents: read

jobs:
  verify:
    name: Verify hub endpoints in ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # a superseded verify of the same env has nothing left to say
    concurrency:
      group: deploy-verify-${{ matrix.environment }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson((github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'all') && format('["{0}"]', github.event.inputs.environment) || '["dev","prd"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe the acceptance endpoints (verify-hub-endpoints.sh)
        env:
          ENV_NAME: ${{ matrix.environment }}
        run: |
          set -uo pipefail
          rc=0
          bash csi-spl-orc/src/bash/scripts/verify-hub-endpoints.sh || rc=$?
          case "$rc" in
            0) echo "every acceptance endpoint of $ENV_NAME answers correctly" ;;
            2) echo "::warning::$ENV_NAME: at least one endpoint is not reachable YET (DNS / cert / allowlist / not on the LB) -- the deploy STANDS but is not proven end to end; see the job summary" ;;
            *) echo "::error::$ENV_NAME: an acceptance endpoint answered wrong -- see the job summary"; exit 1 ;;
          esac
