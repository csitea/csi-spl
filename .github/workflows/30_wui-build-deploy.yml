# ci-cd: spool WUI build + deploy (Firebase Hosting)
#
# Modelled on csi-rel's 21_wui-build-deploy.yml (test -> plan -> per-env
# matrix: nuxt generate with that env's values, render firebase.json from
# cnf, firebase deploy --only hosting, probe), without the shop gates.
#
# WHERE THE SITE IS SERVED (spec 007 §3, T072): Firebase Hosting holds the
# files (019 site <org>-<app>-<env>-site); the 031 load balancer is the front
# door for <fqdn> and <tenant>.<fqdn> and sends every path except /v1/*,
# /api/*, /healthz and /version to the site. So the deployed commit is probed
# twice: on <site>.web.app/build.json (the site) and, where cnf turns the LB
# route on (031 wui_origin_host), on https://<fqdn>/build.json (the product
# host). A red probe is a failed deploy.
#
# Build cannot be shared: nuxt generate bakes NUXT_PUBLIC_* into the bundle,
# so dev and prd each build their own .output/public.
#
# GCP auth, owner direction 2026-09-19 (spec 007 T080), csi-rel style:
#   key  -- PRIMARY. The per-project SA key secret GCP_KEY_CSI_SPL_<ENV>
#           (key-csi-spl-<env>.json, published by iac step
#           120-github-general-secrets; never set by hand). The project SA
#           holds roles/owner, so it covers firebase deploy.
#   WIF  -- ALTERNATIVE, used only when the key secret is absent: the 017
#           pool (GCP_WIF_PROVIDER_<ENV>) impersonating the narrow 016
#           Hosting deploy SA (GCP_FIREBASE_DEPLOY_SA_EMAIL_<ENV>).
# No FIREBASE_TOKEN. An env with neither is SKIPPED with a notice, so this
# lands before the key or 017 exist without reddening trunk.

name: "30 ci-cd: spool WUI build + deploy"

on:
  push:
    branches: [master]
    # An ALLOW-LIST of the trees a WUI build reads. Never add paths-ignore.
    paths:
      - 'csi-spl-wui/**'
      - 'csi-spl-cnf/csi-spl/*.env.json'   # site id, fqdn, project, tenant
      - 'csi-spl-orc/src/bash/scripts/render-wui-firebase-json.sh'
      - '.github/workflows/30_wui-build-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment ("all" = dev + prd)'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - prd
          - all

permissions:
  contents: read
  id-token: write   # google-github-actions/auth via WIF

jobs:
  # ---------------------------------------------------------------------------
  # test: the WUI suite. A deploy never ships a red tree.
  # ---------------------------------------------------------------------------
  test:
    name: WUI unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csi-spl-wui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: csi-spl-wui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: csi-spl-wui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run typecheck

  # ---------------------------------------------------------------------------
  # plan: which envs, and which of them can authenticate yet
  # ---------------------------------------------------------------------------
  plan:
    name: Determine deploy targets
    needs: test
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.targets.outputs.envs }}
      any: ${{ steps.targets.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: csi-spl-cnf
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          # booleans only: the secret value never reaches this step
          KEY_DEV: ${{ secrets.GCP_KEY_CSI_SPL_DEV != '' }}
          KEY_PRD: ${{ secrets.GCP_KEY_CSI_SPL_PRD != '' }}
          WIF_DEV: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          SA_DEV: ${{ vars.GCP_FIREBASE_DEPLOY_SA_EMAIL_DEV }}
          WIF_PRD: ${{ vars.GCP_WIF_PROVIDER_PRD }}
          SA_PRD: ${{ vars.GCP_FIREBASE_DEPLOY_SA_EMAIL_PRD }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && -n "$INPUT_ENV" && "$INPUT_ENV" != all ]]; then
            wanted=("$INPUT_ENV")
          else
            wanted=(dev prd)
          fi
          ready=()
          for e in "${wanted[@]}"; do
            # cnf gate: 019 applied for this env (the site exists), owner go
            on=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["env"]["steps"]["019-firebase-static-site"].get("wui_deploy", False)).lower())' "csi-spl-cnf/csi-spl/$e.env.json")
            if [[ "$on" != true ]]; then
              echo "::notice::$e skipped: cnf steps.019-firebase-static-site.wui_deploy is not true (site not provisioned or no go)"; continue
            fi
            key_var="KEY_${e^^}"; wif_var="WIF_${e^^}"; sa_var="SA_${e^^}"
            if [[ "${!key_var:-false}" == true ]]; then
              ready+=("$e"); echo "$e: auth = key (GCP_KEY_CSI_SPL_${e^^})"
            elif [[ -n "${!wif_var:-}" && -n "${!sa_var:-}" ]]; then
              ready+=("$e"); echo "$e: auth = WIF (no GCP_KEY_CSI_SPL_${e^^})"
            else
              echo "::notice::$e skipped: neither secret GCP_KEY_CSI_SPL_${e^^} (iac 120) nor repo variables GCP_WIF_PROVIDER_${e^^} + GCP_FIREBASE_DEPLOY_SA_EMAIL_${e^^} (016/017) are set"
            fi
          done
          if (( ${#ready[@]} )); then
            envs="$(printf '"%s",' "${ready[@]}")"; envs="[${envs%,}]"; any=true
          else
            envs='[]'; any=false
          fi
          echo "deploy targets: $envs"
          { echo "envs=$envs"; echo "any=$any"; } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # deploy: generate, render, deploy, probe -- per env
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy WUI to ${{ matrix.environment }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One firebase deploy per site at a time; never killed mid-flight.
    concurrency:
      group: deploy-wui-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.plan.outputs.envs) }}
    env:
      # a boolean: is this env's project key secret set (a step cannot read
      # its own env: in its `if`, so it lives at job level)
      HAS_KEY: ${{ secrets[format('GCP_KEY_CSI_SPL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read this env's values from cnf
        id: cfg
        env:
          ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          python3 - "csi-spl-cnf/csi-spl/${ENV}.env.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1]))["env"]
          s19 = e["steps"]["019-firebase-static-site"]
          s31 = e["steps"]["031-gcp-hub-ingress"]
          print("project=" + e["gcp"]["gcp_project"])
          print("site=" + s19["site_id"])
          print("fqdn=" + e["dns"]["fqdn"])
          print("tenant=" + s19.get("wui_default_tenant", ""))
          print("lb_route=" + ("true" if s31.get("wui_origin_host") else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: csi-spl-wui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: csi-spl-wui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: csi-spl-wui

      # Reads go to the TENANT host (003 http-v1): {tenant} is filled in by the
      # WUI at run time. Same origin when the page is served on <tenant>.<fqdn>.
      - name: nuxt generate
        working-directory: csi-spl-wui
        env:
          NUXT_PUBLIC_API_BASE: https://{tenant}.${{ steps.cfg.outputs.fqdn }}
          NUXT_PUBLIC_TENANT: ${{ steps.cfg.outputs.tenant }}
          NUXT_PUBLIC_USE_MOCK: "0"
        run: pnpm run generate

      - name: Stamp build.json (the deployed-commit probe)
        working-directory: csi-spl-wui
        run: |
          set -euo pipefail
          printf '{"commit":"%s","built_at":"%s","run":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > .output/public/build.json
          cat .output/public/build.json

      - name: Render firebase.json from cnf
        env:
          ENV: ${{ matrix.environment }}
        run: bash csi-spl-orc/src/bash/scripts/render-wui-firebase-json.sh

      - name: Authenticate to Google Cloud (project key)
        id: auth_key
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('GCP_KEY_CSI_SPL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}

      - name: Authenticate to Google Cloud (WIF alternative)
        if: steps.auth_key.outcome != 'success'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}
          service_account: ${{ vars[format('GCP_FIREBASE_DEPLOY_SA_EMAIL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}

      - name: firebase deploy --only hosting
        working-directory: csi-spl-wui
        run: |
          set -euo pipefail
          # GOOGLE_APPLICATION_CREDENTIALS is exported by google-github-actions/auth.
          pnpm dlx firebase-tools@13 deploy --only hosting \
            --project "${{ steps.cfg.outputs.project }}" --non-interactive

      - name: Probe the deployed commit
        env:
          SITE: ${{ steps.cfg.outputs.site }}
          FQDN: ${{ steps.cfg.outputs.fqdn }}
          LB_ROUTE: ${{ steps.cfg.outputs.lb_route }}
        run: |
          set -uo pipefail
          urls=("https://${SITE}.web.app")
          # cnf can lead the 031 apply: probe the product host only when the LB
          # route really serves the WUI. The hub answers GET / with a plain
          # "spool-hub <env> ok" hello, the WUI with HTML.
          if [[ "$LB_ROUTE" == true ]]; then
            body=$(curl -fsS --max-time 15 "https://${FQDN}/" 2>/dev/null || true)
            if grep -qi '<html' <<<"$body"; then
              urls+=("https://${FQDN}")
            else
              echo "::warning::https://${FQDN}/ is not the WUI yet: 031 wui_origin_host is set in cnf but not applied; probing ${SITE}.web.app only"
              LB_ROUTE=false
            fi
          fi
          rc=0
          for u in "${urls[@]}"; do
            ok=0
            for i in 1 2 3 4 5 6; do
              got=$(curl -fsS "${u}/build.json?run=${GITHUB_RUN_ID}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)
              if [[ "$got" == "$GITHUB_SHA" ]]; then ok=1; break; fi
              sleep 10
            done
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${u}/")
            if (( ok )) && [[ "$code" == 200 ]]; then
              echo "ok - ${u} serves ${GITHUB_SHA:0:8}, / -> 200"
            else
              echo "::error::${u} does not serve ${GITHUB_SHA:0:8} (build.json commit '${got}', / -> ${code})"; rc=1
            fi
          done
          # the hub still answers behind the same host
          [[ "$LB_ROUTE" == true ]] && { code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${FQDN}/version"); \
            [[ "$code" == 200 ]] && echo "ok - https://${FQDN}/version -> 200 (hub)" || { echo "::error::https://${FQDN}/version -> $code"; rc=1; }; }
          exit $rc
