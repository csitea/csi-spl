# ci-cd: spool WUI build + deploy (Firebase Hosting)
#
# Modelled on csi-rel's 21_wui-build-deploy.yml (test -> plan -> per-env
# matrix: nuxt generate with that env's values, render firebase.json from
# cnf, firebase deploy --only hosting, probe), without the shop gates.
#
# WHERE THE SITE IS SERVED (spec 007 §3, T072): Firebase Hosting holds the
# files (019 site <org>-<app>-<env>-site); the 031 load balancer is the front
# door for <fqdn> and <tenant>.<fqdn> and sends every path except /v1/*,
# /api/*, /healthz and /version to the site. So the deployed commit is probed
# twice: on <site>.web.app/build.json (the site) and, where cnf turns the LB
# route on (031 wui_origin_host), on https://<fqdn>/build.json (the product
# host). A red probe is a failed deploy.
#
# Build cannot be shared: nuxt generate bakes NUXT_PUBLIC_* into the bundle,
# so dev and prd each build their own .output/public.
#
# GCP auth, owner direction 2026-09-19 (spec 007 T080), csi-rel style:
#   key  -- PRIMARY. The per-project SA key secret GCP_KEY_CSI_SPL_<ENV>
#           (key-csi-spl-<env>.json, published by iac step
#           120-github-general-secrets; never set by hand). The project SA
#           holds roles/owner, so it covers firebase deploy.
#   WIF  -- ALTERNATIVE, used only when the key secret is absent: the 017
#           pool (GCP_WIF_PROVIDER_<ENV>) impersonating the narrow 016
#           Hosting deploy SA (GCP_FIREBASE_DEPLOY_SA_EMAIL_<ENV>).
# No FIREBASE_TOKEN. An env with neither is SKIPPED with a notice, so this
# lands before the key or 017 exist without reddening trunk.

name: "30 ci-cd: spool WUI build + deploy"

on:
  push:
    branches: [master]
    # An ALLOW-LIST of the trees a WUI build reads. Never add paths-ignore.
    paths:
      - 'csi-spl-wui/**'
      - 'csi-spl-cnf/csi-spl/*.env.json'   # site id, fqdn, project, tenant
      - 'csi-spl-orc/src/bash/scripts/render-wui-firebase-json.sh'
      - 'csi-spl-orc/src/bash/scripts/wait-for-hub-version.sh'
      - '.github/workflows/30_wui-build-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment ("all" = dev + prd)'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - prd
          - all

permissions:
  contents: read
  id-token: write   # google-github-actions/auth via WIF

jobs:
  # ---------------------------------------------------------------------------
  # test: the WUI suite. A deploy never ships a red tree.
  # ---------------------------------------------------------------------------
  test:
    name: WUI unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csi-spl-wui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: csi-spl-wui/package.json
          # per job, not the shared ~/setup-pnpm: 4 runners share one home and
          # raced on it (ENOTEMPTY, then "pnpm: command not found", run 36138615567)
          dest: ${{ runner.temp }}/setup-pnpm

      # pnpm's default store sat inside the per-job PNPM_HOME, so every job
      # re-downloaded all ~720 packages over the box's slow link (ETIMEDOUT,
      # job 108199695609). Keep it in the runner's tool cache, which persists.
      - name: pnpm store in the runner tool cache (persists across jobs)
        run: echo "npm_config_store_dir=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"
      # cache: this job is ubuntu-latest, where RUNNER_TOOL_CACHE is wiped every
      # run (the "persists" above is a self-hosted-only property, and 30 is
      # hosted), so pnpm re-fetched all ~720 packages each run. setup-node's
      # pnpm cache (actions/cache), keyed on the lockfile, persists the store
      # across hosted runs: cold install ~6.5 s -> warm ~1.2 s (measured
      # 2026-09-29). Self-hosted 10_ci-quality is unaffected -- its store dir
      # genuinely persists and it uses no actions/cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: csi-spl-wui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run typecheck

  # ---------------------------------------------------------------------------
  # plan: which envs, and which of them can authenticate yet
  # ---------------------------------------------------------------------------
  # Not behind test: it mutates nothing. The deploy job waits for the suite
  # itself, right before its first irreversible step (see "Wait for the suite").
  plan:
    name: Determine deploy targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      envs: ${{ steps.targets.outputs.envs }}
      any: ${{ steps.targets.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: csi-spl-cnf
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          # booleans only: the secret value never reaches this step
          KEY_DEV: ${{ secrets.GCP_KEY_CSI_SPL_DEV != '' }}
          KEY_PRD: ${{ secrets.GCP_KEY_CSI_SPL_PRD != '' }}
          WIF_DEV: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          SA_DEV: ${{ vars.GCP_FIREBASE_DEPLOY_SA_EMAIL_DEV }}
          WIF_PRD: ${{ vars.GCP_WIF_PROVIDER_PRD }}
          SA_PRD: ${{ vars.GCP_FIREBASE_DEPLOY_SA_EMAIL_PRD }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && -n "$INPUT_ENV" && "$INPUT_ENV" != all ]]; then
            wanted=("$INPUT_ENV")
          else
            wanted=(dev prd)
          fi
          ready=()
          for e in "${wanted[@]}"; do
            # cnf gate: 019 applied for this env (the site exists), owner go
            on=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["env"]["steps"]["019-firebase-static-site"].get("wui_deploy", False)).lower())' "csi-spl-cnf/csi-spl/$e.env.json")
            if [[ "$on" != true ]]; then
              echo "::notice::$e skipped: cnf steps.019-firebase-static-site.wui_deploy is not true (site not provisioned or no go)"; continue
            fi
            key_var="KEY_${e^^}"; wif_var="WIF_${e^^}"; sa_var="SA_${e^^}"
            if [[ "${!key_var:-false}" == true ]]; then
              ready+=("$e"); echo "$e: auth = key (GCP_KEY_CSI_SPL_${e^^})"
            elif [[ -n "${!wif_var:-}" && -n "${!sa_var:-}" ]]; then
              ready+=("$e"); echo "$e: auth = WIF (no GCP_KEY_CSI_SPL_${e^^})"
            else
              echo "::notice::$e skipped: neither secret GCP_KEY_CSI_SPL_${e^^} (iac 120) nor repo variables GCP_WIF_PROVIDER_${e^^} + GCP_FIREBASE_DEPLOY_SA_EMAIL_${e^^} (016/017) are set"
            fi
          done
          if (( ${#ready[@]} )); then
            envs="$(printf '"%s",' "${ready[@]}")"; envs="[${envs%,}]"; any=true
          else
            envs='[]'; any=false
          fi
          echo "deploy targets: $envs"
          { echo "envs=$envs"; echo "any=$any"; } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # deploy: generate, render, deploy, probe -- per env
  # ---------------------------------------------------------------------------
  # Overlaps the build with the suite, gates only the irreversible steps (perf
  # round 4, C6). Measured 2026-10-02 (n=12): test 79 s (median), and only
  # then did each leg start, install and run nuxt generate (37/38 s). Now the
  # leg starts beside the suite and generates with the version
  # do_release_version PREDICTS (a dry run, claims nothing); then "Wait for the
  # suite" polls this run's test job and fails the leg unless it is green, so
  # a red suite still blocks the mint, the hub wait and the firebase deploy.
  # When the mint differs from the prediction (another commit took that
  # version first), the bundle is generated again with the minted one.
  deploy:
    name: Deploy WUI to ${{ matrix.environment }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # 20 min for the build + deploy, plus up to 30 min waiting for the hub
    # (CLE-35057 guard, below)
    timeout-minutes: 50
    # One firebase deploy per site at a time; never killed mid-flight.
    concurrency:
      group: deploy-wui-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # push the v<X.Y.Z> release tag (do_release_version)
      id-token: write   # google-github-actions/auth via WIF
      actions: write    # a stale-target mint re-dispatches this workflow at trunk head
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.plan.outputs.envs) }}
    env:
      # a boolean: is this env's project key secret set (a step cannot read
      # its own env: in its `if`, so it lives at job level)
      HAS_KEY: ${{ secrets[format('GCP_KEY_CSI_SPL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] != '' }}
    steps:
      # fetch-depth 0 so the mint has this commit's history to read; the tag
      # itself is now claimed through the GitHub REST API (see the mint step),
      # not `git push`. The earlier SPL-1194 fix assumed a full clone would let
      # the token push the tag -- it does not: the default GITHUB_TOKEN is a
      # GitHub App token that is refused ANY ref whose target commit's diff
      # touches .github/workflows/*, regardless of what objects the push carries
      # ("refusing to allow a GitHub App to create or update workflow file").
      # Creating the tag via the API writes no workflow content and is allowed.
      # (CLE-77788 / CLE-001 P0.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read this env's values from cnf
        id: cfg
        env:
          ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          python3 - "csi-spl-cnf/csi-spl/${ENV}.env.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1]))["env"]
          s19 = e["steps"]["019-firebase-static-site"]
          # 031 (the M1 LB) is gone (owner 2026-09-19, no LB): lb_route is false
          s31 = e["steps"].get("031-gcp-hub-ingress", {})
          print("project=" + e["gcp"]["gcp_project"])
          print("site=" + s19["site_id"])
          print("fqdn=" + e["dns"]["fqdn"])
          # specs/026: the WUI reads from the ONE api host; the hub takes the
          # tenant from the signed-in session
          print("api_fqdn=" + e["dns"]["api_fqdn"])
          print("tenant=" + s19.get("wui_default_tenant", ""))
          # "" = same-origin auth (today); set per env once the hub serves
          # credentialed CORS on /api/v1/auth/* at that host (csi-rel api_base_url)
          print("auth_base=" + s19.get("wui_auth_base", ""))
          print("lb_route=" + ("true" if s31.get("wui_origin_host") else "false"))
          # spec 021: the unprefixed WUI locale (cnf env.i18n.default_locale)
          print("default_locale=" + e.get("i18n", {}).get("default_locale", "en"))
          # SPL-959: tenant hosts <tenant>.<fqdn> (the apex is wui_default_tenant)
          print("tenant_hosts=" + ("1" if s19.get("wui_tenant_hosts") else "0"))
          PY
          # CLE-35057: the hub bakes the repo .version into GET /version
          echo "want_version=$(tr -d '[:space:]' < .version)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: csi-spl-wui/package.json
          # per job, not the shared ~/setup-pnpm: 4 runners share one home and
          # raced on it (ENOTEMPTY, then "pnpm: command not found", run 36138615567)
          dest: ${{ runner.temp }}/setup-pnpm

      # pnpm's default store sat inside the per-job PNPM_HOME, so every job
      # re-downloaded all ~720 packages over the box's slow link (ETIMEDOUT,
      # job 108199695609). Keep it in the runner's tool cache, which persists.
      - name: pnpm store in the runner tool cache (persists across jobs)
        run: echo "npm_config_store_dir=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"
      # cache: ubuntu-latest wipes RUNNER_TOOL_CACHE each run, so setup-node's
      # pnpm cache (actions/cache, keyed on the lockfile) is what persists the
      # store here: cold install ~6.5 s -> warm ~1.2 s (measured 2026-09-29).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: csi-spl-wui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: csi-spl-wui

      - name: Predict the release version (do_release_version dry run, claims nothing)
        id: pre
        run: |
          set -euo pipefail
          v="$(RELEASE_SHA="$GITHUB_SHA" DRY_RUN=1 ./csi-spl-orc/run -a do_release_version | grep -xE '[0-9]\.[0-9]\.[0-9]' | tail -1)" || v=""
          # no prediction is not fatal: the generate after the mint then runs
          [[ -n "$v" ]] || { echo "::warning::no release version predicted: generating again after the mint"; exit 0; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "predicted release version $v"

      # Reads go to the API host (specs/026: tenant from the session, no
      # per-tenant host); NUXT_PUBLIC_TENANT is only what sign-in binds.
      - name: nuxt generate (beside the suite, predicted version)
        working-directory: csi-spl-wui
        env:
          NUXT_PUBLIC_API_BASE: https://${{ steps.cfg.outputs.api_fqdn }}
          NUXT_PUBLIC_TENANT: ${{ steps.cfg.outputs.tenant }}
          NUXT_PUBLIC_TENANT_HOSTS: ${{ steps.cfg.outputs.tenant_hosts }}
          NUXT_PUBLIC_USE_MOCK: "0"
          NUXT_PUBLIC_AUTH_BASE: ${{ steps.cfg.outputs.auth_base }}
          NUXT_PUBLIC_DEFAULT_LOCALE: ${{ steps.cfg.outputs.default_locale }}
          # absolute base for the hreflang alternates (spec 021)
          NUXT_PUBLIC_SITE_URL: https://${{ steps.cfg.outputs.fqdn }}
          # signed-out bar title: spool-dev / spool-hub
          NUXT_PUBLIC_ENV_NAME: ${{ matrix.environment }}
          # the footer version: the predicted one; regenerated below if the
          # mint differs
          NUXT_PUBLIC_APP_VERSION: ${{ steps.pre.outputs.version }}
        run: pnpm run generate

      # THE gate: everything above is a local build, everything below claims
      # a tag or touches the site. Polls this run's test job (the latest
      # attempt of it); anything but a green finish fails the leg here.
      - name: Wait for the suite (test job green, else no mint and no deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_JOB: WUI unit tests + typecheck
        run: |
          set -uo pipefail
          for _ in $(seq 1 180); do
            st="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              --jq ".jobs[] | select(.name == \"$TEST_JOB\") | \"\(.status) \(.conclusion)\"" 2>/dev/null)" || st=""
            case "$st" in
              "completed success") echo "test job green"; exit 0 ;;
              completed\ *) echo "::error::test job finished '${st#completed }': no mint, no deploy"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::test job not finished after 15 min: no mint, no deploy"; exit 1

      # The version this deploy shows in the footer, minted by CI for this
      # commit (a v<X.Y.Z> tag; the hub deploy of the same commit reuses it).
      # Nobody rolls a version by hand any more.
      - name: Mint the release version (do_release_version)
        id: ver
        env:
          # The tag is claimed through the GitHub REST API (POST /git/refs),
          # not `git push`: the default GitHub App token is refused a ref whose
          # target commit touches .github/workflows/*. (CLE-77788 / CLE-001 P0.)
          #
          # EXCEPT at a commit whose .github/workflows differs from trunk
          # head's (a workflow commit landed after this push): GitHub refuses
          # the token that ref through the API too, and the mint writes
          # stale=true (rc 3). This deploy then stands down and ONE job (the
          # first env) dispatches 30 at trunk head with environment all, which
          # carries this commit -- the same stand-down as workflow 20
          # (CLE-77950, 5d6efd00). An operator dispatch is not re-routed: it
          # fails, naming the cause, so a dispatch never re-dispatches.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ENV: ${{ matrix.environment }}
          FIRST_ENV: ${{ fromJson(needs.plan.outputs.envs)[0] }}
        run: |
          set -euo pipefail
          rc=0
          DRY_RUN=0 RELEASE_SHA="$GITHUB_SHA" ./csi-spl-orc/run -a do_release_version || rc=$?
          if grep -qx 'stale=true' "$GITHUB_OUTPUT"; then
            if [[ "$EVENT" != push ]]; then
              echo "::error::$ENV: ${GITHUB_SHA:0:8} cannot be tagged (its .github/workflows differs from trunk head's); dispatch trunk head instead"
              exit 1
            fi
            echo "::warning::$ENV: ${GITHUB_SHA:0:8} cannot be tagged (its .github/workflows differs from trunk head's) -- standing down for a trunk-head run"
            if [[ "$ENV" == "$FIRST_ENV" ]]; then
              gh workflow run 30_wui-build-deploy.yml --repo "$GITHUB_REPOSITORY" --ref master -f environment=all
              echo "dispatched 30 at master (environment=all)"
            fi
            exit 0
          fi
          ((rc == 0)) || exit "$rc"
          grep -q '^version=[0-9]\.[0-9]\.[0-9]$' "$GITHUB_OUTPUT" || { echo "::error::no release version minted"; exit 1; }

      # Only when another commit took the predicted version first.
      - name: nuxt generate again (the mint differs from the prediction)
        if: steps.ver.outputs.stale != 'true' && steps.ver.outputs.version != steps.pre.outputs.version
        working-directory: csi-spl-wui
        env:
          NUXT_PUBLIC_API_BASE: https://${{ steps.cfg.outputs.api_fqdn }}
          NUXT_PUBLIC_TENANT: ${{ steps.cfg.outputs.tenant }}
          NUXT_PUBLIC_TENANT_HOSTS: ${{ steps.cfg.outputs.tenant_hosts }}
          NUXT_PUBLIC_USE_MOCK: "0"
          NUXT_PUBLIC_AUTH_BASE: ${{ steps.cfg.outputs.auth_base }}
          NUXT_PUBLIC_DEFAULT_LOCALE: ${{ steps.cfg.outputs.default_locale }}
          # absolute base for the hreflang alternates (spec 021)
          NUXT_PUBLIC_SITE_URL: https://${{ steps.cfg.outputs.fqdn }}
          # signed-out bar title: spool-dev / spool-hub
          NUXT_PUBLIC_ENV_NAME: ${{ matrix.environment }}
          # the footer version: the one minted above, not csi-spl-wui/.version
          NUXT_PUBLIC_APP_VERSION: ${{ steps.ver.outputs.version }}
        run: pnpm run generate

      - name: Stamp build.json (the deployed-commit probe)
        if: steps.ver.outputs.stale != 'true'
        working-directory: csi-spl-wui
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          printf '{"commit":"%s","built_at":"%s","run":"%s","version":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$VERSION" > .output/public/build.json
          cat .output/public/build.json

      - name: Render firebase.json from cnf
        if: steps.ver.outputs.stale != 'true'
        env:
          ENV: ${{ matrix.environment }}
        run: bash csi-spl-orc/src/bash/scripts/render-wui-firebase-json.sh

      - name: Authenticate to Google Cloud (project key)
        id: auth_key
        if: steps.ver.outputs.stale != 'true' && env.HAS_KEY == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets[format('GCP_KEY_CSI_SPL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}

      - name: Authenticate to Google Cloud (WIF alternative)
        if: steps.ver.outputs.stale != 'true' && steps.auth_key.outcome != 'success'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}
          service_account: ${{ vars[format('GCP_FIREBASE_DEPLOY_SA_EMAIL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}

      # CLE-35057 (prd 2026-09-27): this job used to put a roll's WUI live
      # 4-6 min before its hub (the hub runs a longer suite and deploys only
      # on an image-tag bump), and for good when the hub job failed. Wait for
      # THIS env's hub to report >= the repo .version; refuse after 30 min.
      - name: Wait for the hub this WUI needs (hub /version >= .version)
        if: steps.ver.outputs.stale != 'true'
        env:
          HUB_URL: https://${{ steps.cfg.outputs.api_fqdn }}
          WANT_VERSION: ${{ steps.cfg.outputs.want_version }}
          TIMEOUT_S: '1800'
        run: bash csi-spl-orc/src/bash/scripts/wait-for-hub-version.sh

      - name: firebase deploy --only hosting
        if: steps.ver.outputs.stale != 'true'
        working-directory: csi-spl-wui
        run: |
          set -euo pipefail
          # GOOGLE_APPLICATION_CREDENTIALS is exported by google-github-actions/auth.
          pnpm dlx firebase-tools@13 deploy --only hosting \
            --project "${{ steps.cfg.outputs.project }}" --non-interactive

      - name: Probe the deployed commit
        if: steps.ver.outputs.stale != 'true'
        env:
          SITE: ${{ steps.cfg.outputs.site }}
          FQDN: ${{ steps.cfg.outputs.fqdn }}
          LB_ROUTE: ${{ steps.cfg.outputs.lb_route }}
        run: |
          set -uo pipefail
          urls=("https://${SITE}.web.app")
          # cnf can lead the 031 apply: probe the product host only when the LB
          # route really serves the WUI. The hub answers GET / with a plain
          # "spool-hub <env> ok" hello, the WUI with HTML.
          if [[ "$LB_ROUTE" == true ]]; then
            body=$(curl -fsS --max-time 15 "https://${FQDN}/" 2>/dev/null || true)
            if grep -qi '<html' <<<"$body"; then
              urls+=("https://${FQDN}")
            else
              echo "::warning::https://${FQDN}/ is not the WUI yet: 031 wui_origin_host is set in cnf but not applied; probing ${SITE}.web.app only"
              LB_ROUTE=false
            fi
          fi
          rc=0
          for u in "${urls[@]}"; do
            ok=0
            for i in 1 2 3 4 5 6; do
              got=$(curl -fsS "${u}/build.json?run=${GITHUB_RUN_ID}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' 2>/dev/null || true)
              if [[ "$got" == "$GITHUB_SHA" ]]; then ok=1; break; fi
              sleep 10
            done
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${u}/")
            if (( ok )) && [[ "$code" == 200 ]]; then
              echo "ok - ${u} serves ${GITHUB_SHA:0:8}, / -> 200"
            else
              echo "::error::${u} does not serve ${GITHUB_SHA:0:8} (build.json commit '${got}', / -> ${code})"; rc=1
            fi
          done
          # the hub still answers behind the same host
          [[ "$LB_ROUTE" == true ]] && { code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${FQDN}/version"); \
            [[ "$code" == 200 ]] && echo "ok - https://${FQDN}/version -> 200 (hub)" || { echo "::error::https://${FQDN}/version -> $code"; rc=1; }; }
          exit $rc
