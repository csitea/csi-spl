# 45 ops: off-instance backup of the hub DB, once a day (specs/029).
#
# Owner order 2026-09-20, verbatim: "the same one should update the specs for
# creating a backup job on the db - for now once daily, triggered from the
# github actions". This is that job. The schedule is 03:17 UTC once a day.
# Point-in-time recovery inside the project stays the minutes-level path.
#
# IS IT REDUNDANT? Measured 2026-09-21 on both envs (csi-spl-orc
# do_spl_db_health, section cloudsql): the instance's OWN automated backups are
# enabled, point-in-time recovery is on, transaction logs are retained 7 days,
# and the last four runs read SUCCESSFUL on each env. So NO, this job is not
# the first line of defence, and it is not a replacement. It is additive, and
# the three things it buys are the ones the built-ins cannot:
#   1. a Cloud SQL backup restores ONLY into Cloud SQL, and it lives inside the
#      instance's project - it dies with the instance, and with the project;
#   2. retainedBackups is 7, so one bad week nobody notices loses every copy.
#      The 045 bucket keeps 30 days;
#   3. a logical dump can be read, diffed, grepped and partially restored. A
#      Cloud SQL backup is opaque.
#
# HOW, and why not pg_dump. `gcloud sql export` runs INSIDE Google: the
# instance streams straight to the 045 bucket. So no row of tenant data ever
# transits this GitHub-hosted runner, the runner never sees a database
# password, and the export runs as the instance's own superuser - which means
# rdb 0014 FORCE row-level security cannot silently empty a table in the dump.
# A proxied pg_dump as the RUNTIME login needs both --enable-row-security and
# the operator scope, and is one forgotten flag away from a dump full of
# zero-row tables that still looks like a backup.
#
# THE RUN PROVES ITSELF. Taking a dump is not evidence that the dump restores,
# so every run then downloads what it just wrote, restores it into a THROWAWAY
# postgres container on the runner, and compares every table against the live
# database read-only (do_spl_db_backup_verify). The comparison is deliberately
# not "the counts are equal" - the dump and the live read are minutes apart and
# dev takes writes in between - but "no live table is missing from the restore,
# and no table restored empty while the live one has rows". Those two are what
# a truncated or RLS-blanked dump actually looks like.
#
# FAILURE IS THE ALERT. A red scheduled workflow is the notification, exactly
# as 00_deploy-lag-watch works. There is no separate alerting to forget to wire.
#
# Auth: ONLY the existing per-env project key secrets GCP_KEY_CSI_SPL_<ENV>
# (published by iac 120). No new credential. An env without its key is SKIPPED
# with a notice, as 20 and 40 skip it.
#
# Schedule: 00:17, 06:17, 12:17 and 18:17 UTC. The 00:17 slot sits before the
# instance's own 01:00 backup window. An export and that backup cannot
# overlap, and the window DRIFTS (measured 2026-09-21: a 01:00 window
# enqueued at 02:17Z on dev and 01:54Z on prd). The action retries a busy
# instance, so a collision costs time, not a missed backup.
#
# Local equivalent:
#   ENV=<env> DRY_RUN=0 ./csi-spl-orc/run -a do_spl_db_backup
#   ENV=<env>            ./csi-spl-orc/run -a do_spl_db_backup_verify
#   ENV=<env> DRY_RUN=0 ./csi-spl-orc/run -a do_spl_backup_offsite
# Restore: do_spl_db_restore / do_spl_files_restore (spec 029 §7).
#
# TOPIC HEADS (spec 099 T007). Each env's run also restores the dump it just
# wrote into a throwaway container and runs do_spl_topic_head_verify's read
# on it: one stored head or part that differs from a rebuild is red
# (mismatches=<k> in the log). And once a night the job topic-head-long runs
# the head suite's long grid, SPOOL_TEST_LONG=1 go test -run TestTopicHead
# (200 random seeds, every case), against a throwaway Postgres on the runner.
#   ENV=<env> BACKUP_SOURCE=env TOPIC_HEAD_VERIFY=1 DRY_RUN=0 ./csi-spl-orc/run -a do_spl_db_restore

name: "45 ops: hub db backup"

on:
  schedule:
    # Once a day, per the owner 2026-10-05 (3f2d8a13): "no need for so tight
    # backups - once per day is enough" (R10 had it at every 6 h). 03:17 UTC
    # keeps clear of 00:00, GitHub's busiest hour. The scheduler is best-effort
    # (this job started 112 min late on 2026-10-04), so the gap between two
    # backups can run past 24 h.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment ("all" = dev then prd)'
        type: choice
        options: [all, dev, prd]
        default: all
      dry_run:
        description: "Resolve and print the target object only; export nothing"
        type: boolean
        default: false
      verify:
        description: "Restore the dump into a throwaway container and compare"
        type: boolean
        default: true
      long_test:
        description: "Also run the nightly topic-head long run (SPOOL_TEST_LONG=1)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # a superseded backup run has nothing to add; the per-env group below is the
  # one that must never be cancelled mid-export
  group: db-backup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: "backup ${{ matrix.environment }}"
    # Estate guard (spec 072 A34): this job reads or changes OUR live estate, so it
    # runs only where SPOOL_ESTATE is 'true' (or on the origin repo); a fork skips it.
    if: vars.SPOOL_ESTATE == 'true' || github.repository == 'csitea/csi-spl'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: [dev, prd]
    concurrency:
      # one export per env at a time, never cancelled while it runs: a
      # cancelled export can leave the instance holding the operation
      group: db-backup-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENV: ${{ matrix.environment }}
      WANT: ${{ github.event.inputs.environment || 'all' }}
      HAS_KEY: ${{ secrets[format('GCP_KEY_CSI_SPL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] != '' }}
    # orc derives ORG/APP from the parent dirs: check out in the operator's
    # layout <base>/csi/csi-spl (as 10 ci's orc-suite and 40 do)
    defaults:
      run:
        working-directory: csi/csi-spl/csi-spl-orc
    steps:
      - name: Selected?
        id: sel
        working-directory: .
        run: |
          if [[ "$WANT" != all && "$WANT" != "$ENV" ]]; then echo "go=0" >>"$GITHUB_OUTPUT"; echo "$ENV not selected"; exit 0; fi
          if [[ "$HAS_KEY" != true ]]; then echo "go=0" >>"$GITHUB_OUTPUT"; echo "::notice::$ENV skipped: no secret GCP_KEY_CSI_SPL_${ENV^^} (iac 120)"; exit 0; fi
          echo "go=1" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.sel.outputs.go == '1'
        with:
          path: csi/csi-spl
          ref: master

      # no auth here: the action activates the env key in its own private
      # CLOUDSDK_CONFIG and pins --account on every call
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: steps.sel.outputs.go == '1'

      - name: psql for the restore check
        if: steps.sel.outputs.go == '1' && github.event.inputs.verify != 'false'
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Env SA key to the path the actions resolve
        if: steps.sel.outputs.go == '1'
        working-directory: .
        env:
          KEY: ${{ secrets[format('GCP_KEY_CSI_SPL_{0}', matrix.environment == 'dev' && 'DEV' || 'PRD')] }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.gcp/.csi"
          printf '%s' "$KEY" >"$HOME/.gcp/.csi/key-csi-spl-$ENV.json"
          jq -e .client_email "$HOME/.gcp/.csi/key-csi-spl-$ENV.json" >/dev/null

      - name: Export the hub DB to the 045 bucket
        id: backup
        if: steps.sel.outputs.go == '1'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: ./run -a do_spl_db_backup

      # the dump is only a backup once something has restored it
      - name: Prove it restores (throwaway container, live read-only)
        if: steps.sel.outputs.go == '1' && github.event.inputs.dry_run != 'true' && github.event.inputs.verify != 'false'
        run: ./run -a do_spl_db_backup_verify

      # spec 099 T007: the same dump restored again, this time with the
      # do_spl_topic_head_verify read on the throwaway copy; one mismatch is
      # red. BACKUP_SOURCE=env: the off-project copy is the next step, so the
      # newest dump there is still yesterday's. A dump older than rdb 0144 has
      # no head table and says so.
      - name: Topic heads on the restored copy (mismatches=0)
        if: steps.sel.outputs.go == '1' && github.event.inputs.dry_run != 'true' && github.event.inputs.verify != 'false'
        env:
          BACKUP_SOURCE: env
          TARGET: local
          TOPIC_HEAD_VERIFY: '1'
          DRY_RUN: '0'
        run: ./run -a do_spl_db_restore

      # OFF the project (spec 044 T077, iac 046): the dump and the files
      # bucket both live in csi-spl-<env>, which "destroy and re-create"
      # destroys. The env SA may only ADD to gs://csi-spl-bkp-<env>; a
      # bucket-to-bucket rsync inside Google, no byte on this runner. Until
      # cnf steps.046.copy_enabled is true the action says so and exits 0.
      - name: Copy the dump and the files off-project
        if: steps.sel.outputs.go == '1' && github.event.inputs.dry_run != 'true'
        env:
          DRY_RUN: '0'
        run: ./run -a do_spl_backup_offsite

      - name: Drop the key
        if: always()
        working-directory: .
        run: rm -rf "$HOME/.gcp"

  # spec 099 T007: the topic-head suite's long grid, nightly. No secret and no
  # estate: a throwaway Postgres on the runner, the schema owner a plain
  # (non-superuser) role so row-level security binds, and the hub runtime role
  # from the same roles SQL the cloud runs (hub-pg.tst.sh's shape).
  topic-head-long:
    name: "topic heads: long run (SPOOL_TEST_LONG=1)"
    if: (vars.SPOOL_ESTATE == 'true' || github.repository == 'csitea/csi-spl') && (github.event_name == 'schedule' || github.event.inputs.long_test == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spool
          POSTGRES_PASSWORD: spool
          POSTGRES_DB: spool_hub
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U spool -d spool_hub -h 127.0.0.1"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: csi-spl-api/src/go/spool-hub-api/go.mod
          cache: false

      - name: psql for the role setup
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Migrate as the schema owner, then the runtime role
        env:
          PGHOST: 127.0.0.1
          PGUSER: spool
          PGPASSWORD: spool
        run: |
          set -euo pipefail
          sql="$PWD/csi-spl-rdb/src/sql/postgres/spool-hub"
          roles="$PWD/csi-spl-rdb/src/sql/postgres/spool-hub-roles"
          psql -X -q -v ON_ERROR_STOP=1 -d spool_hub \
            -c "CREATE ROLE spool_app LOGIN PASSWORD 'spool_app' NOSUPERUSER NOBYPASSRLS CREATEROLE" \
            -c "CREATE DATABASE spool_hub_store OWNER spool_app"
          (cd csi-spl-api/src/go/spool-hub-api && go run ./cmd/spool migrate \
            --db "postgres://spool_app:spool_app@127.0.0.1:5432/spool_hub_store?sslmode=disable" --sql-dir "$sql")
          for f in runtime-role.sql runtime-grants.sql; do
            { echo "SET ROLE spool_app;"; cat "$roles/$f"; } |
              PGOPTIONS="-c client_min_messages=error" psql -X -q -v ON_ERROR_STOP=1 -d spool_hub_store -v runtime_role=spool_rt -v runtime_verifier=spool_rt -f -
          done

      # A skip is a failure: the two long tests must RUN and PASS.
      - name: SPOOL_TEST_LONG=1 go test -run TestTopicHead
        working-directory: csi-spl-api/src/go/spool-hub-api
        env:
          SPOOL_TEST_LONG: '1'
          SPOOL_TEST_PG_DSN: postgres://spool_app:spool_app@127.0.0.1:5432/spool_hub_store?sslmode=disable
          SPOOL_TEST_PG_RUNTIME_DSN: postgres://spool_rt:spool_rt@127.0.0.1:5432/spool_hub_store?sslmode=disable
        run: |
          set -euo pipefail
          SPOOL_TEST_SQL_DIR="$(cd ../../../../csi-spl-rdb/src/sql/postgres/spool-hub && pwd)" \
            go test -count=1 -timeout 80m -run TestTopicHead -v ./internal/store/ 2>&1 | tee "$RUNNER_TEMP/long.log"
          for t in TestTopicHeadRandomSequences TestTopicHeadCases; do
            grep -q -- "^--- PASS: $t " "$RUNNER_TEMP/long.log" || { echo "::error::$t did not run and pass"; exit 1; }
          done
          echo "passed: $(grep -c -- '^--- PASS: TestTopicHead' "$RUNNER_TEMP/long.log") top-level TestTopicHead*"
