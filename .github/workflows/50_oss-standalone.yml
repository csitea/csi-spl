# 50 oss-standalone ::: the root docker-compose.yml runs on a CLEAN machine
# (spec 044 T001 / FR-OS-008, SPL-66): a GitHub-hosted runner with nothing but
# docker builds Postgres 16 + the hub + the WUI from this commit, then a real
# Chrome signs up, confirms the email, signs in, posts in #lobby and reads the
# line back after a reload (csi-spl-wui/tests/e2e/standalone-live.proof.mjs).
#
# GitHub-hosted ONLY (SPL-64): never the self-hosted runners. No secret, no
# cloud credential, read-only token. The screenshots and result.json are the
# run's artifact.
name: 50 oss-standalone

on:
  push:
    branches: [master]
    paths:
      - docker-compose.yml
      - .env.example
      - csi-spl-api/**
      - csi-spl-wui/**
      - csi-spl-rdb/**
      - .github/workflows/50_oss-standalone.yml
  workflow_dispatch: {}

permissions:
  contents: read

# one group per commit: a ref-wide group with cancel-in-progress let every
# later push to the busy trunk cancel the run before it finished (9acb0635)
concurrency:
  group: oss-standalone-${{ github.sha }}
  cancel-in-progress: false

jobs:
  standalone:
    name: "oss: docker compose up + browser proof"
    # runs once the repo is public (CLE-35070): hosted minutes of a private
    # repo are billed
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPOOL_HTTP_PORT: "8080"
      SPOOL_PUBLIC_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up --build (no .env, the documented defaults)
        run: docker compose up --build --detach

      # not `up --wait`: hub-init is a one-shot that EXITS, which some compose
      # versions count as a failed wait
      - name: The hub answers through the front door
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            curl -fsS -o /dev/null http://localhost:8080/healthz && break
            sleep 3
          done
          curl -fsS http://localhost:8080/healthz
          echo
          curl -fsS -o /dev/null -w 'WUI / -> %{http_code}\n' http://localhost:8080/
          docker compose ps --all

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: puppeteer-core + Chrome (a skip is a failure)
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/pp" puppeteer-core@25
          echo "PUPPETEER_CORE=$(cd "$RUNNER_TEMP/pp" && node -p "require.resolve('puppeteer-core')")" >> "$GITHUB_ENV"
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable; do
            if [[ -x "$c" ]]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; "$c" --version; exit 0; fi
          done
          echo "::error::no google-chrome on the runner - this job proved nothing"
          exit 1

      - name: Browser proof - sign up, confirm, sign in, post, reload
        run: BASE="$SPOOL_PUBLIC_URL" OUT="$RUNNER_TEMP/standalone-proof" node csi-spl-wui/tests/e2e/standalone-live.proof.mjs

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload the proof (screenshots + result.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-standalone-proof
          path: ${{ runner.temp }}/standalone-proof
          if-no-files-found: warn

      - name: docker compose down -v
        if: always()
        run: docker compose down --volumes --remove-orphans
