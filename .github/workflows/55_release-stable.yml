# 55 release: the weekly stable release (spec 047 W10, SPL-1170).
#
# Every hub / WUI deploy mints a v<X.Y.Z> tag (do_release_version): ~5 an
# hour on 2026-09-28, so a v-tag is a BUILD, not a release, and a self-hoster
# had nothing to pin but a trunk that moves under them (047 section 4.5).
# Once a week this job cuts a stable-<YYYY-MM-DD> tag on the commit the prd
# hub RUNS (its /version, host from cnf) and publishes a GitHub release with
# generated notes: the commits since the last stable by kind, the DB
# migrations added (forward-only: dump first) and the upgrade steps. The
# newest stable is the release marked "latest"; there is no moving `stable`
# tag, because a tag never moves without --force.
#
# Nothing new since the last stable (prd still runs it) = no release, green.
# A red run here is the alert that no release was cut this week.
#
# GitHub-hosted, no secret: GITHUB_TOKEN with contents: write pushes the tag
# and creates the release. No GCP identity: /version is a public GET.
#
# Job `cli` (spec 072 A4a, lane L3) then attaches the `spool` CLI to the
# release it cut: spool-<linux|darwin>-<amd64|arm64> + spool-SHA256SUMS, built
# from the stable tag, so a box downloads the CLI instead of building it. On a
# dry_run=1 dispatch it builds from this commit and uploads nothing.
#
# Local equivalent (dry run, prints the notes):
#   STABLE_FROM_ENV=prd ./csi-spl-orc/run -a do_release_stable
#   ./csi-spl-orc/run -a do_release_cli_assets

name: "55 release: weekly stable"

on:
  schedule:
    # Mondays 06:41 UTC. GitHub's scheduler is best-effort, so "once a week".
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = print the notes only, 0 = cut the release'
        type: choice
        required: false
        default: '0'
        options: ['0', '1']

concurrency:
  group: release-stable
  cancel-in-progress: false

permissions:
  contents: write   # push the stable-<date> tag + create the release

jobs:
  cut:
    name: Cut the stable release
    # Estate guard (spec 072 A34): this job reads or changes OUR live estate, so it
    # runs only where SPOOL_ESTATE is 'true' (or on the origin repo); a fork skips it.
    if: vars.SPOOL_ESTATE == 'true' || github.repository == 'csitea/csi-spl'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.stable.outputs.tag }}
      version: ${{ steps.stable.outputs.version }}
    steps:
      # fetch-depth 0: the notes walk the history since the last stable tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: do_release_stable
        id: stable
        env:
          STABLE_FROM_ENV: prd
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          GH_TOKEN: ${{ github.token }}
          STABLE_NOTES_FILE: ${{ runner.temp }}/stable-notes.md
        run: |
          set -euo pipefail
          ./csi-spl-orc/run -a do_release_stable
          { echo "## Stable release (DRY_RUN=$DRY_RUN)"; echo
            if [[ -s "$STABLE_NOTES_FILE" ]]; then cat "$STABLE_NOTES_FILE"; else echo "Nothing cut: see the log."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  cli:
    name: Attach the spool CLI
    needs: cut
    # a cut release, or a dry-run dispatch (build only, nothing uploaded)
    if: needs.cut.outputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.cut.outputs.tag || github.sha }}

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: csi-spl-api/src/go/spool-hub-api/go.mod
          cache-dependency-path: csi-spl-api/src/go/spool-hub-api/go.sum

      # build.sh is offline by design (GOPROXY=off): fill the module cache first
      - name: Download Go modules
        working-directory: csi-spl-api/src/go/spool-hub-api
        run: go mod download

      - name: do_release_cli_assets
        env:
          CLI_ASSETS_TAG: ${{ needs.cut.outputs.tag }}
          CLI_ASSETS_VERSION: ${{ needs.cut.outputs.version }}
          CLI_ASSETS_DIR: ${{ runner.temp }}/spool-cli
          DRY_RUN: ${{ needs.cut.outputs.tag != '' && '0' || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./csi-spl-orc/run -a do_release_cli_assets
          { echo "## spool CLI (DRY_RUN=$DRY_RUN${CLI_ASSETS_TAG:+, $CLI_ASSETS_TAG})"; echo; echo '```'
            cat "$CLI_ASSETS_DIR/spool-SHA256SUMS"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
