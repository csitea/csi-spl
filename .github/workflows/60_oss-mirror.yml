# oss: publish the public product repo from this (private) ops repo.
#
# Spec 044 / SPL-61 / CLE-35070. The public repo is, commit by commit, the
# do_oss_export projection of ops master (the export allow-list + scrub),
# pushed only when do_oss_gate reads 0 - see csi-spl-orc/src/bash/run/
# oss-mirror.func.sh. A commit the gate fails is never published: it waits,
# and the next passing commit carries its change.
#
# Runs ONLY in the ops repo (the guard below), on the private self-hosted
# runners: it holds the one write credential of the public repo, the deploy
# key OSS_MIRROR_DEPLOY_KEY (do_oss_ops_repo mints it). The public repo's own
# CI never sees a secret.
#
# The FIRST run is a dispatch naming `base`: the ops commit the public master
# currently is (both repos share that history). Every later run finds its
# place from the Ops-Commit trailer of the public master. Push runs start
# once the repo variable OSS_MIRROR_ENABLED is 1 (set after that first run).

name: "60 oss: publish the public product repo"

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base:
        description: 'FIRST run only: the ops commit the public master currently is'
        required: false
        default: ''
      dry_run:
        description: '1 = project and gate, push nothing'
        type: choice
        options: ['0', '1']
        default: '0'

# One publisher at a time; a queued run publishes up to the newest master, so
# nothing is lost when GitHub replaces a pending run with a newer one.
concurrency:
  group: oss-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Project, gate, publish
    # push runs start once the first dispatch has published (repo variable
    # OSS_MIRROR_ENABLED=1): until the product tree passes the gate a push
    # run could only go red, and a red that is nobody's reads as a broken trunk
    if: github.repository == 'csitea/csi-spl-ops' && (github.event_name == 'workflow_dispatch' || vars.OSS_MIRROR_ENABLED == '1')
    runs-on: [self-hosted, spool-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every ops commit since the last published one

      - name: Set up Go (the gate lists the Go module licences)
        uses: actions/setup-go@v5
        with:
          go-version-file: csi-spl-api/src/go/spool-hub-api/go.mod
          cache: false

      - name: Download Go modules
        working-directory: csi-spl-api/src/go/spool-hub-api
        run: go mod download

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: csi-spl-wui/package.json
          dest: ${{ runner.temp }}/setup-pnpm

      - name: pnpm store in the runner tool cache (persists across jobs)
        run: echo "npm_config_store_dir=$RUNNER_TOOL_CACHE/pnpm-store" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm install (the gate reads the npm licences from node_modules)
        working-directory: csi-spl-wui
        run: pnpm install --frozen-lockfile

      - name: do_oss_mirror
        env:
          MIRROR_KEY: ${{ secrets.OSS_MIRROR_DEPLOY_KEY }}
          OSS_MIRROR_BASE: ${{ github.event.inputs.base }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          set -euo pipefail
          [[ -n "$MIRROR_KEY" ]] || { echo "::error::no OSS_MIRROR_DEPLOY_KEY secret - run do_oss_ops_repo"; exit 1; }
          kd="$(mktemp -d)"; trap 'rm -rf "$kd"' EXIT; chmod 700 "$kd"
          printf '%s\n' "$MIRROR_KEY" >"$kd/k"; chmod 600 "$kd/k"
          export GIT_SSH_COMMAND="ssh -i $kd/k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$kd/known_hosts"
          git fetch -q origin master
          OSS_MIRROR_URL=git@github.com:csitea/csi-spl.git OSS_REF=origin/master \
            OSS_MIRROR_WORK="$RUNNER_TEMP/oss-mirror" ./csi-spl-orc/run -a do_oss_mirror

      - name: The gate report of a commit that waits unpublished
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/oss-mirror/gate-fail.*.tsv; do
            echo "::group::$(basename "$f") (class, path, line, rule - never the value)"
            cat "$f"
            echo "::endgroup::"
          done
