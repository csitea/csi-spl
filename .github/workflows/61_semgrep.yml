# SAST (Semgrep). Same runner rule as 15_sec-deps-secrets.yml: GitHub-hosted
# (ubuntu-latest). Semgrep is installed pinned into a cached venv; a missing tool
# fails the action. The gate uses the p/golang + p/javascript + p/owasp-top-ten
# rulesets against .semgrep-baseline.txt so only NEW findings redden trunk.
#
# Heavy tool: workflow_dispatch + path-scoped push (Go + WUI src).
# No GitHub schedule (owner 2026-10-01, CLE-77829): the box's weekly full scan
# (do_check_weekly_full_scan, Friday 17:00) runs this scanner over its whole
# scope, and the pre-push hook runs it on every push's touched files first.
name: "61 sec: semgrep (SAST)"

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "csi-spl-api/src/go/spool-hub-api/**"
      - "csi-spl-wui/src/**"
      - ".semgrep-baseline.txt"
      - "csi-spl-iac/src/bash/run/sec-semgrep.func.sh"
      - "csi-spl-iac/src/bash/tests/sec-semgrep.tst.sh"
      - ".github/workflows/61_semgrep.yml"

permissions:
  contents: read

concurrency:
  group: sec-semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: "sec: semgrep (p/golang, p/javascript, p/owasp-top-ten)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Version-pinned into a venv (large dep tree; a per-package sha pin is
      # impractical, so the version is the pin). The venv is cached across hosted
      # runs (perf round 4, C3: the install was ~20 s of every run), keyed on
      # the pin + the runner's python + image, so a pin bump or an image python
      # change misses and reinstalls. A restored venv must still answer
      # --version 1.178.0 or it is rebuilt: the assert, not the key, is the gate.
      - name: python version (cache key)
        id: py
        run: echo "ver=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: Restore semgrep venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/csi-spl/semgrep-venv
          key: semgrep-1.178.0-py${{ steps.py.outputs.ver }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}

      - name: Install semgrep 1.178.0
        run: |
          set -euo pipefail
          venv="$HOME/.cache/csi-spl/semgrep-venv"
          if "$venv/bin/semgrep" --version 2>/dev/null | grep -qxF 1.178.0; then
            echo "semgrep 1.178.0 restored from cache"
          else
            rm -rf "$venv"
            python3 -m venv "$venv"
            "$venv/bin/pip" install --disable-pip-version-check --quiet semgrep==1.178.0
          fi
          "$venv/bin/semgrep" --version | grep -xF 1.178.0
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: semgrep (control + scan vs baseline)
        working-directory: csi-spl-iac
        env:
          SEMGREP_SEND_METRICS: "off"
        run: ./run -a do_sec_semgrep
