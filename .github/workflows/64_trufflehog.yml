# Secret scan, second opinion (TruffleHog). Same runner rule as
# 15_sec-deps-secrets.yml: GitHub-hosted (ubuntu-latest). Gitleaks (15) does the
# every-push regex scan over full history; this adds VERIFIED (live) secret
# detection over the working tree. The tool is installed in the job and verified
# against a pinned sha256; a missing tool fails the action.
#
# workflow_dispatch + push on EVERY path, since a secret can land in any file
# (sampled by the ref concurrency
# group). --only-verified reaches provider APIs to confirm a secret is live, so
# it is kept to a bounded working-tree scan, not every-push full history.
# No GitHub schedule (owner 2026-10-01, CLE-77829): the box's weekly full scan
# (do_check_weekly_full_scan, Friday 17:00) runs this scanner over its whole
# scope, and the pre-push hook runs it on every push's touched files first.
name: "64 sec: trufflehog (verified secrets)"

on:
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: sec-trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: "sec: trufflehog verified secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned tarball + sha256. A download that does not match the pin fails
      # closed rather than running an unknown tool.
      - name: Install trufflehog 3.90.8
        run: |
          set -euo pipefail
          v=3.90.8; dir="$RUNNER_TOOL_CACHE/trufflehog/$v"
          sha=aa2258dc4e76d93518730331e69ca01a638c365ab862a828c566e025f6c8150c
          if [[ ! -x "$dir/trufflehog" ]]; then
            mkdir -p "$dir"
            tgz="$RUNNER_TEMP/trufflehog.tar.gz"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o "$tgz" \
              "https://github.com/trufflesecurity/trufflehog/releases/download/v$v/trufflehog_${v}_linux_amd64.tar.gz"
            echo "$sha  $tgz" | sha256sum -c -
            tar -xzf "$tgz" -C "$dir" trufflehog
            chmod +x "$dir/trufflehog"
          fi
          "$dir/trufflehog" --version 2>&1 | head -2
          echo "$dir" >> "$GITHUB_PATH"

      - name: trufflehog (control + verified scan)
        working-directory: csi-spl-iac
        run: ./run -a do_sec_trufflehog
