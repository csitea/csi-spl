# IaC scan (Checkov) of the terraform tree. Same runner rule as
# 15_sec-deps-secrets.yml: GitHub-hosted (ubuntu-latest). Checkov is installed pinned
# into a cached venv; a missing tool fails the action. The gate is against the
# checked-in .checkov.baseline so only NEW misconfig reddens trunk.
#
# Path-scoped push: runs on master only when terraform, the baseline, the action
# or this file changes. workflow_dispatch runs it on demand.
# No GitHub schedule (owner 2026-10-01, CLE-77829): the box's weekly full scan
# (do_check_weekly_full_scan, Friday 17:00) runs this scanner over its whole
# scope, and the pre-push hook runs it on every push's touched files first.
name: "65 sec: checkov (terraform IaC)"

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "csi-spl-iac/src/terraform/**"
      - "csi-spl-iac/src/bash/run/sec-checkov.func.sh"
      - "csi-spl-iac/src/bash/tests/sec-checkov.tst.sh"
      - ".github/workflows/65_iac-checkov.yml"

permissions:
  contents: read

concurrency:
  group: sec-checkov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: "sec: checkov terraform"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Version-pinned into a venv (large dep tree; a per-package sha pin is
      # impractical, so the version is the pin). The venv is cached across hosted
      # runs (perf round 4, C3: the install was ~32 s of every run), keyed on
      # the pin + the runner's python + image, so a pin bump or an image python
      # change misses and reinstalls. A restored venv must still answer
      # --version 3.3.21 or it is rebuilt: the assert, not the key, is the gate.
      - name: python + image version (cache key)
        id: py
        run: |
          echo "ver=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-none}" >> "$GITHUB_OUTPUT"

      - name: Restore checkov venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/csi-spl/checkov-venv
          key: checkov-3.3.21-py${{ steps.py.outputs.ver }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.py.outputs.image }}

      - name: Install checkov 3.3.21
        run: |
          set -euo pipefail
          venv="$HOME/.cache/csi-spl/checkov-venv"
          if "$venv/bin/checkov" --version 2>/dev/null | grep -qxF 3.3.21; then
            echo "checkov 3.3.21 restored from cache"
          else
            rm -rf "$venv"
            python3 -m venv "$venv"
            "$venv/bin/pip" install --disable-pip-version-check --quiet checkov==3.3.21
          fi
          "$venv/bin/checkov" --version | grep -xF 3.3.21
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: checkov (control + scan vs baseline)
        working-directory: csi-spl-iac
        run: ./run -a do_sec_checkov
