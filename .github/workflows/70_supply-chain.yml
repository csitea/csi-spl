# Supply-chain scans (spec 056). GitHub-hosted (ubuntu-latest): the repo is
# public and these need no box state, so they keep the self-hosted runners free
# for deploys. Tools are installed in the job and verified against a sha256
# pinned in this file; a missing tool fails the action -- nothing here skips.
# Gate: csi-spl-iac/src/bash/tests/workflow-70-pinned-checksums.tst.sh.
#   iac   trivy config (misconfiguration) over the terraform, HIGH,CRITICAL,
#         findings triaged in .trivyignore.yaml (each justified + reported).
#   osv   osv-scanner over the Go + WUI lockfiles (dependency-level known vulns,
#         no reachability pruning; a second source beside govulncheck + pnpm
#         audit in 15). Findings triaged in osv-scanner.toml (#15 / T015).
# No GitHub schedule (owner 2026-10-01, CLE-77829): the box's weekly full scan
# (do_check_weekly_full_scan, Friday 17:00) runs this scanner over its whole
# scope, and the pre-push hook runs it on every push's touched files first.
name: "70 sec: supply chain (trivy IaC + OSV)"

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'csi-spl-iac/src/terraform/**'
      - '.trivyignore.yaml'
      - 'osv-scanner.toml'
      - 'csi-spl-api/src/go/spool-hub-api/go.mod'
      - 'csi-spl-api/src/go/spool-hub-api/go.sum'
      - 'csi-spl-wui/pnpm-lock.yaml'
      - '.github/workflows/70_supply-chain.yml'

permissions:
  contents: read

# Only the newest sha's scan matters.
concurrency:
  group: sec-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: "sec: trivy config (terraform IaC)"
    # GitHub-hosted: public repo, no box state needed; keeps the self-hosted
    # runners free for deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cached per runner in the tool cache. A miss downloads with retries over
      # HTTP/1.1 and checks the archive against the sha256 PINNED here before
      # it is cached, never against a checksum file from the same release (a
      # replaced release would bring its own matching file: security round 1
      # row 12). A version bump pins the new sha in the same commit; take it
      # from the release's checksums file AND the asset's GitHub digest
      # (`gh api repos/aquasecurity/trivy/releases/tags/v<v> --jq .assets[].digest`)
      # and pin it only when both agree.
      - name: Install trivy 0.74.0
        run: |
          set -euo pipefail
          v=0.74.0; dir="$RUNNER_TOOL_CACHE/trivy/$v"
          sha=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          if [[ ! -x "$dir/trivy" ]]; then
            base="https://github.com/aquasecurity/trivy/releases/download/v$v"
            tgz="trivy_0.74.0_Linux-64bit.tar.gz"
            get() { curl -fsSL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 -o "$2" "$1"; }
            get "$base/$tgz" "$RUNNER_TEMP/$tgz"
            echo "$sha  $RUNNER_TEMP/$tgz" | sha256sum -c -
            mkdir -p "$dir.tmp.$$" && tar -xzf "$RUNNER_TEMP/$tgz" -C "$dir.tmp.$$" trivy
            mkdir -p "$(dirname "$dir")" && mv -T "$dir.tmp.$$" "$dir" 2>/dev/null || rm -rf "$dir.tmp.$$"
          fi
          "$dir/trivy" --version | head -1
          echo "$dir" >> "$GITHUB_PATH"

      - name: trivy config (terraform misconfiguration)
        working-directory: csi-spl-iac
        run: SEC_SCAN=iac ./run -a do_sec_scan

      # osv-scanner: a direct binary verified against the sha256 PINNED here
      # before it is cached (same fail-closed pattern and bump rule as trivy
      # above; the release's osv-scanner_SHA256SUMS is a source for the pin,
      # never the check).
      - name: Install osv-scanner 2.6.0
        run: |
          set -euo pipefail
          v=2.6.0; dir="$RUNNER_TOOL_CACHE/osv-scanner/$v"
          sha=ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          if [[ ! -x "$dir/osv-scanner" ]]; then
            base="https://github.com/google/osv-scanner/releases/download/v$v"
            get() { curl -fsSL --http1.1 --retry 5 --retry-all-errors --retry-delay 5 -o "$2" "$1"; }
            get "$base/osv-scanner_linux_amd64" "$RUNNER_TEMP/osv-scanner"
            echo "$sha  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/osv-scanner"
            mkdir -p "$dir.tmp.$$" && mv "$RUNNER_TEMP/osv-scanner" "$dir.tmp.$$/osv-scanner"
            mkdir -p "$(dirname "$dir")" && mv -T "$dir.tmp.$$" "$dir" 2>/dev/null || rm -rf "$dir.tmp.$$"
          fi
          "$dir/osv-scanner" --version | head -1
          echo "$dir" >> "$GITHUB_PATH"

      - name: osv-scanner (Go + WUI lockfiles)
        working-directory: csi-spl-iac
        run: SEC_SCAN=osv ./run -a do_sec_scan
