# Workflow lint (actionlint). Same runner rule as 15_sec-deps-secrets.yml:
# self-hosted (spool-ci). The tool is installed in the job and verified against
# a pinned sha256; a missing tool fails the action -- nothing here skips.
# actionlint catches broken/insecure workflow YAML: undefined job needs, bad
# expressions, shellcheck issues in run: scripts, invalid glob/cron, etc.
name: "85 sec: actionlint (workflows)"

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '29 3 * * *'

permissions:
  contents: read

# Only the newest sha's lint matters.
concurrency:
  group: sec-actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: "sec: actionlint every workflow"
    # GitHub-hosted: public repo, no box state; keeps self-hosted runners for deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned binary + sha256. A download that does not match the pin fails
      # closed rather than running an unknown tool.
      - name: Install actionlint 1.7.7
        run: |
          set -euo pipefail
          v=1.7.7; dir="$RUNNER_TOOL_CACHE/actionlint/$v"
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          if [[ ! -x "$dir/actionlint" ]]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o "$RUNNER_TEMP/actionlint.tgz" \
              "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
            echo "$sha  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$dir" actionlint
            chmod +x "$dir/actionlint"
          fi
          "$dir/actionlint" -version
          echo "$dir" >> "$GITHUB_PATH"

      - name: actionlint (control + scan)
        working-directory: csi-spl-iac
        run: ./run -a do_sec_actionlint
