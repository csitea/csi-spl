# Triaged trivy misconfiguration findings for the IaC scan (spec 056 #16).
# Each entry is a KNOWN, reviewed finding scoped to its file, so the gate is
# green today and a NEW misconfiguration (or the same rule in a new file) still
# reddens. These are reported to the infra owner, not silently swallowed.
misconfigurations:
  # GCP-0017: google_sql_database_instance.hub has ipv4_enabled = true (a public
  # IP) with NO authorized network (measured dev + prd 2026-10-19), so only
  # Cloud SQL connectors (IAM + TLS) get in. Kept on purpose: the wf 20/45/49
  # runners and the boxes reach the DB only through the Auth Proxy over it.
  # SPL-2161 (radar step 2) answers the 2026-09-30 accept-vs-private-IP
  # question with "accept, connector_enforcement REQUIRED", plan:
  # csi-spl-doc/specs/007-spool-hub-api-infra/radar-step2-sql-private-ip.md.
  # Scoped to this one file so a new public-IP instance elsewhere still fails.
  - id: GCP-0017
    paths:
      - "040-cloud-sql-postgres/03-cloud-sql.tf"
