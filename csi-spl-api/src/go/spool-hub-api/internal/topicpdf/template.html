<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<style>
  @page { margin: 1.6cm; size: A4; }
  html, body { background: white; color: black; margin: 0; }
  .msg-print { font: 11pt/1.45 "DejaVu Sans", sans-serif; }
  .msg-print__title { font-size: 18pt; margin: 0 0 12pt; }
  .msg-print__card { padding: 8pt 0; border-bottom: 1px solid currentColor; }
  .msg-print__card:last-child { border-bottom: 0; }
  .msg-print__head { display: flex; flex-wrap: wrap; gap: 8pt; margin: 0 0 4pt; font-size: 9.5pt; }
  .msg-print__kind { text-transform: uppercase; letter-spacing: 0.04em; }
  .msg-body { overflow-wrap: anywhere; }
  .msg-body p { margin: 0 0 6pt; }
  .msg-body pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 9pt/1.35 "DejaVu Sans Mono", monospace; background: #f3f3f3; padding: 4pt 6pt; margin: 4pt 0; }
  .msg-body code { font-family: "DejaVu Sans Mono", monospace; font-size: 0.92em; }
  .msg-body blockquote { margin: 4pt 0; padding-left: 8pt; border-left: 2pt solid #999; }
  .msg-body table { border-collapse: collapse; margin: 4pt 0; font-size: 9.5pt; }
  .msg-body th, .msg-body td { border: 1px solid #999; padding: 2pt 4pt; vertical-align: top; text-align: left; }
  .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4, .msg-body h5, .msg-body h6 { font-size: 12pt; margin: 6pt 0 4pt; }
  .msg-print__fig { margin: 6pt 0; break-inside: avoid; }
  .msg-print__fig img { display: block; max-width: 100%; height: auto; }
  .msg-print__fig figcaption { font-size: 9pt; margin-top: 2pt; }
  .msg-print__file { font-size: 9.5pt; margin: 4pt 0; }
</style>
</head>
<body>
<article class="msg-print">
<h1 class="msg-print__title">{{.Title}}</h1>
{{- range .Cards}}
<section class="msg-print__card" data-msg-id="{{.MsgID}}">
<p class="msg-print__head"><strong>{{.Author}}</strong> <time datetime="{{.ISO}}">{{.Time}}</time> <span class="msg-print__kind">{{.Kind}}</span></p>
<div class="msg-body">{{.Body}}</div>
{{- range .Pictures}}
<figure class="msg-print__fig"><img src="{{.Src}}" alt="{{.Name}}"><figcaption>{{.Name}}</figcaption></figure>
{{- end}}
{{- range .Files}}
<p class="msg-print__file">{{.}}{{if $.Link}} <a href="{{$.Link}}">{{$.Link}}</a>{{end}}</p>
{{- end}}
</section>
{{- end}}
</article>
</body>
</html>
