# csi-spl ::: settings shared by EVERY environment. do_tpl_gen deep-merges this
# file UNDER csi-spl/<env>.env.yaml (the env file wins on a clash) and renders
# from the merge.
env:
  dns:
    # THE spool domain (owner decision 2026-09-17). The ONLY place the literal
    # may appear in code or config: change the domain HERE, then re-render
    # both envs. Per-env hostnames are derived from it at render time:
    #   fqdn = <env.dns.env_subdomain>.<BASE_DOMAIN>, or BASE_DOMAIN when the
    #   env_subdomain is empty (prd serves the apex).
    # Guarded by src/bash/tests/domain-single-source.tst.sh in csi-spl-iac.
    BASE_DOMAIN: spool-hub.ai

  # The owner account the human bootstrap gcp-000..004 runs as while no project
  # SA key exists yet, and WHICH org it works in (owner rules 2026-09-19). The
  # ONLY place these literals may appear. Every other wrapper runs as the
  # per-env project SA from its key (do_gcp_account: ACCOUNT > GCP_ACCOUNT >
  # the SA key > refuse; never this owner account) and passes --account on
  # every gcloud call; gcp-000..004 take the org from gcp_org_id unless
  # GCP_ORG_ID is set. An env file may override either.
  # Guarded by csi-spl-iac src/bash/tests/gcloud-account-pinned.tst.sh.
  # Owner order 2026-09-19: the owner account IS committed here. The 10 ci
  # distribution-hygiene sweep allows exactly this one key (by name) and
  # still flags the same name/mail anywhere else in the tree.
  gcp:
    gcp_account_owner_email: yordan.georgiev@flok.fi
    # The R03 alert recipients of step 070 (owner order 2026-10-05, t1
    # 2c74edd5): one email channel per alert_email_<n>, one sms channel per
    # alert_sms_<n> (E.164; the owner enters the code Google texts it, else it
    # never delivers; none set: this repo is public, a phone stays out until
    # the owner picks where it lives). Here, not in the 070 block: env.gcp strings reach
    # terraform as TF_VAR_<KEY> at run time and are never rendered into the
    # tfvars. One bare value per line: the hygiene sweep allows alert_email_<n>
    # exactly as it allows the owner key above.
    alert_email_1: yordan.georgiev@csitea.net
    alert_email_2: yordan.georgiev@gmail.com
    gcp_org_id: "1080340024101"

  # spec 076: the cloud the estate runs on. gcp (the default: dev and prd),
  # none (self-host on the root docker-compose.yml, no cloud) or aws (phase 2).
  # Shell reads it with do_spl_cloud_provider (csi-spl-orc spl-cloud-cnf),
  # where SPOOL_CLOUD_PROVIDER overrides it; the validator refuses any other value.
  # lde stays gcp: it runs the GCS emulator, not the no-cloud path.
  cloud:
    provider: gcp

  # The terraform steps' settings that are THE SAME in every cloud env (spec 072
  # A44, research 04 C4 + C5): one key per fact, written once. An env file
  # holds only what differs (names, sizing, estate-only data) and wins on a
  # clash. lde runs no terraform: an env file without env.steps (lde) gets no
  # env.steps from here (do_spl_merged_cnf). Kept in the env files on purpose,
  # because an action reads them from <env>.env.yaml itself:
  # 019 wui_default_tenant / wui_tenant_hosts (the tenant-host actions).
  # A key set to ~ here is PER ENV: every cloud env file sets it. It is listed
  # only to keep the order the step's tfvars render in (a template walks the
  # merged keys in order), so the render stays byte-identical.
  steps:
    001-enable-gcp-services:
      gcp_services:
        - storage.googleapis.com
        - iam.googleapis.com
        # the project-level reset of iam.disableServiceAccountKeyCreation (doc 6.3)
        - orgpolicy.googleapis.com
        # the hub (spec 007 T004): Cloud Run, Cloud SQL, its DSN secret, and
        # the image registry + product DNS the next steps need
        - run.googleapis.com
        - sqladmin.googleapis.com
        - secretmanager.googleapis.com
        - artifactregistry.googleapis.com
        - dns.googleapis.com
        # compute + certificatemanager: were the 031 hub LB (removed
        # 2026-09-19); left enabled, disabling an API is an owner-gated action
        - compute.googleapis.com
        - certificatemanager.googleapis.com
        # 017 CI deploy identity: WIF token exchange + SA impersonation
        - iamcredentials.googleapis.com
        - sts.googleapis.com
        - firebase.googleapis.com
        - firebasehosting.googleapis.com
        # 005: the env SA claims ownership of <BASE_DOMAIN> (siteVerification
        # REST API), which Cloud Run needs before it creates a 032 mapping
        - siteverification.googleapis.com
        # spec 090 T002: the KMS key (step 055) that seals the marketing
        # channel tokens (envelope encryption, spec 090 FR-002)
        - cloudkms.googleapis.com
        # spec 149 S1: a member's own Google Calendar (the hub calls
        # calendar_base with the member's token, on the sign-in client's project)
        - calendar-json.googleapis.com

    016-firebase-deploy-iam:
      deploy_roles:
        - roles/firebasehosting.admin
        - roles/serviceusage.serviceUsageConsumer
        - roles/run.viewer
      # true once 017 is applied in this env: its trunk principal set may then
      # impersonate this SA from 30_wui-build-deploy.yml (spec 007 T073)
      bind_github_wif: false

    017-github-wif-deploy:
      # GitHub Actions -> GCP keyless auth (Workload Identity Federation).
      # Spec 007 T007: CI deploy identity. Pool + provider trust
      # github_repository OIDC tokens; IAM binding lets those tokens
      # impersonate deploy_sa_email. No SA JSON key (forbidden in this repo).
      # The step CREATES the deploy SA (deploy_sa_account_id, per env) and
      # grants it only what 20_hub-build-deploy.yml does: writer on the 028
      # repository, run.developer on the 030 service, actAs the hub runtime
      # SA. Applies after 028 and 030. Apply needs owner go.
      # THE GitHub repository (<owner>/<repo>), the one key for that fact:
      # 120 gh_repo is derived from it by do_spl_merged_cnf (a literal wins).
      github_repository: csitea/csi-spl
      # the trunk: the ONLY ref whose runs may impersonate the deploy SA
      github_ref: refs/heads/master
      pool_id: github-actions
      provider_id: github

    019-firebase-static-site:
      cert_preference: GROUPED
      wait_dns_verification: false
      additional_fqdns: []
      # owner 2026-09-19 (exactly as csi-rel): env.dns.fqdn IS this site's Firebase
      # custom domain; its DNS records come from do_provision_firebase_dns_env
      bind_custom_domain: true
      # 30_wui-build-deploy.yml deploys this env only when true (the site must exist: 019 applied)
      wui_deploy: true
      # NUXT_PUBLIC_TENANT baked by 30_wui-build-deploy.yml ("" = pick via ?tenant=)
      # NUXT_PUBLIC_AUTH_BASE baked by 30_wui-build-deploy.yml: "" = same-origin;
      # https://<api host> once the hub serves credentialed CORS on /api/v1/auth/*
      # A7 (spec 010 T053): ON in both envs 2026-09-19. The env's fqdn serves the
      # WUI, and its api host (Cloud Run domain mapping) answers it with
      # credentialed CORS. The session cookie has Domain=<base>. The session probe
      # must use the api host: Firebase strips the session cookie on the rewrite.
      # "{api_fqdn}" is expanded by do_spl_merged_cnf.
      wui_auth_base: "https://{api_fqdn}"

    # SPL-1985: static websites, each its own Firebase Hosting site
    # (site_id, per env) + custom domain <name>.<fqdn> + A/TXT records in
    # 025's zone (step 021; csi-spl-doc/doc/md/hosted-sites.md). Keyed by name:
    # a customer name is its private-overlay placeholder. src_dir: the site's
    # Nuxt repo on the box (do_deploy_hosted_site). noindex (an env sets it):
    # robots off.
    021-firebase-hosted-sites:
      sites:
        ws-hidden-12:
          src_dir: /opt/csi/dvn-web

    025-gcp-dns-zone:
      # true = the Firebase custom-domain records (A + TXT hosting-site) of
      # every env.dns.mapped_tenants entry (SPL-959; they were ghs CNAMEs for
      # the retired spec-024 hub mappings).
      mapped_tenant_records: true

    028-gcp-artifact-registry:
      repository_id: ~
      immutable_tags: true
      untagged_max_age_days: 7

    # The hub's service. Name, sizing, runtime SA and env: the hub block
    # below + the env file's hub block. The Cloud SQL instance (040) and the
    # files bucket (050) are read from those steps at render time, not
    # repeated here.
    030-cloud-run-hub:
      # The image is NOT set here: 030 runs hub.image.ref, derived from 028
      # + hub.image (see the hub block below). Terraform owns it: to deploy,
      # bump hub.image.tag, re-render, do_build_push_hub_image, plan + apply.
      health_path: /healthz
      # boxes authenticate with their Ed25519 key on WS hello, not GCP IAM
      # (OQ-06): invoker allUsers; ingress all (hub.cloud_run.ingress), reached
      # through the 032 domain mappings.
      allow_unauthenticated: true

    # csi-rel 031-gcp-cloud-run-domain-mapping, copied unchanged as 032 (csi-spl's
    # 031 was the M1 hub load balancer; deprovisioned in both envs and removed
    # 2026-09-19, owner: "exactly csi-rel: no load balancer").
    # The hub answers on env.dns.api_fqdn only: tenant hosts <tenant>.<fqdn>
    # are the WUI's (019, SPL-959). The service is hub.service_name. Needs
    # 005 (verified owner) and hub.cloud_run.ingress "all". Then
    # ENV=<env> DOMAIN=<host> ./run -a do_spl_wait_for_mapping_cert per host.
    032-gcp-cloud-run-domain-mapping:
      # extra <label>.<BASE_DOMAIN> aliases (csi-rel's cloud_run_additional_domains)
      additional_host_labels: []

    040-cloud-sql-postgres:
      instance_name: ~
      database_version: POSTGRES_16
      # SPL-2890 (dev, 15:17Z 10-22) then SPL-2932 (prd): a DEDICATED core
      # (1 vCPU, 3.75 GB, inside the Cloud SQL SLA), the proof lane's verdict
      # (SPL-2880, doc/md/db-tier-evidence-2026-10-22.md: CPU at the shared
      # core's ceiling plus swapping). Owner go t1 bd710173, msgs 1c8dec68 +
      # 0f305c0a, after the dev load test. Changing it RESTARTS the instance.
      # Undo: db-f1-micro.
      tier: db-custom-1-3840
      availability_type: ZONAL
      disk_size_gb: 10
      database_name: spool
      deletion_protection: ~
      backup_enabled: true
      # Query Insights (spec 029 D1, owner go 2026-09-21): per-query latency
      # and plans, additive and with NO instance restart. Measured 2026-09-21:
      # pg_stat_statements is NOT installed on either env, so before this
      # there were no per-statement timings at all. Caller identity stays off
      # (record_client_address / record_application_tags are false in 040).
      query_insights_enabled: true
      query_insights_string_length: 1024
      query_insights_plans_per_minute: 5
      # SPL-2161 (radar step 2, GCP-0017): REQUIRED = only Cloud SQL
      # connectors may connect (Auth Proxy, Cloud Run's /cloudsql socket).
      # The public IP stays: wf 20/45/49 runners and the boxes reach the DB
      # only through the proxy over it. dev first (applied 2026-10-22 16:32Z,
      # wf 20/45/49 green through the proxy), then prd: its apply waits for
      # the owner's go on the posted plan (t1 8f476aa8). Undo: NOT_REQUIRED.
      connector_enforcement: REQUIRED

    045-gcs-db-backups:
      instance_name: ~
      backups_bucket_name: ~
      # 30 days of off-instance copies against the instance's own 7.
      backup_max_age_days: 30
      soft_delete_retention_seconds: 604800

    050-gcs-files:
      files_bucket_name: ~
      soft_delete_retention_seconds: 604800
      # 0 = no lifecycle rule: the hub's retention (hub.env) deletes files, a
      # bucket rule could delete a file a retained message still names.
      object_max_age_days: 0

    # The Docs section's bucket (owner, prd t1 9f0d751c): every repo .md +
    # tree.json, mirrored at each WUI deploy (csi-spl-orc do_publish_docs),
    # read by the hub (GET /v1/docs/...). publish_enabled (not a tfvar, as
    # 046 copy_enabled) turns on BOTH the deploy upload and the hub's
    # SPOOL_HUB_DOCS_BUCKET: true once 051 is applied (dev + prd 2026-10-04,
    # owner go e65e9389), then 030 is applied. An env with no
    # docs_bucket_name publishes nothing whatever this says.
    051-gcs-docs:
      docs_bucket_name: ~
      soft_delete_retention_seconds: 604800
      publish_enabled: true

    # spec 075 phase 2 (owner, prd t1 9f0d751c msg 2dbabe95: "new terraform
    # step , for each workspace separate bucket"): ONE docs bucket per
    # workspace, <bucket_prefix><slug>, versioned, private, objectAdmin for
    # the hub's runtime SA only. bucket_prefix is also the key the hub's
    # workspace-docs resolver (spec 075 T007) derives each bucket name from.
    # A new workspace gets its bucket by adding its slug to the env's list,
    # re-rendering and applying 052 (no dynamic hook yet).
    052-gcs-workspace-docs:
      bucket_prefix: ~
      workspaces: []
      soft_delete_retention_seconds: 604800
      # spec 114 9.5: each workspace's daily Qto export lands under backup/
      # in its own bucket; a lifecycle rule deletes it after this many days.
      backup_retention_days: 30

    # spec 091 (public dataset export, T002): the PUBLIC bucket (uniform
    # access, allUsers object viewer, this dataset only) and the PRIVATE
    # staging bucket (the day's candidate and its verdicts). Names per env.
    # Lifecycle: daily files 30 days; a file a stable release links is copied
    # under stable/ and kept 365 days (spec 091 section 6, Q2). Rendered and
    # applied by T007 (the apply waits for the owner, Q8).
    053-gcs-public-dataset:
      public_bucket_name: ~
      staging_bucket_name: ~
      daily_retention_days: 30
      stable_retention_days: 365

    # spec 111 Q4 (a) (owner t1 d49b6b76): the blog's PRIVATE picture bucket
    # per env (T006b). Uniform access, public access prevention enforced, no
    # public IAM; wf 30's WIF deploy SA (016) gets objectViewer on it alone to
    # copy the pictures into the build. The writer is the env's project SA.
    # The apply waits for the owner's go.
    054-gcs-blog-media:
      media_bucket_name: ~
      soft_delete_retention_seconds: 604800

    # Owner t1 d80ed72c ("A" to B1 m/bb71c466): a nightly copy of each box's
    # box-only state (do_spl_box_state_backup: transcripts + memory, the spool
    # root, the csi-spl state dirs; never a key, a token or the tenants store)
    # per env, deleted after retention_days. Google-managed encryption, uniform
    # access, public access prevention enforced, versioning off. The boxes
    # upload as writer_sa_account_id (objectCreator only, impersonated by the
    # project SA, no key); a restore reads as the project SA. Apply on owner go.
    056-gcs-box-state:
      state_bucket_name: ~
      writer_sa_account_id: ~
      retention_days: 30
      soft_delete_retention_seconds: 604800

    # Cloud Monitoring (availability plan row R03, owner go "on r03 yes"):
    # until 070 nothing paged; every hub incident was found by a person. An
    # uptime check on https://<env.dns.api_fqdn><health_path> from
    # uptime_regions, and alert policies on uptime failure, 429 rate, 5xx
    # rate, hub error logs and Cloud SQL database/up, each to every channel
    # of env.gcp.alert_email_<n> / alert_sms_<n>: the owner directly, never
    # through the fleet (plan 2.5.4), read by terraform at run time
    # (TF_VAR_ALERT_EMAIL_<n> from do_tf_init), never rendered.
    # The service, the instance and the host come from hub.service_name,
    # steps.040 and env.dns at render time. Counts are "at least N".
    # Measure: ENV=<env> ./run -a do_gcp_list_monitoring.
    070-gcp-monitoring:
      # not 030's /healthz: Cloud Run's frontend answers some paths ending in z
      health_path: /v1/health
      health_content: '"status":"ok"'
      uptime_regions: [EUROPE, USA, ASIA_PACIFIC]
      uptime_period_seconds: 60
      uptime_timeout_seconds: 10
      # more than 1 failing region: two regions must agree before it pages
      uptime_failing_regions: 1
      uptime_fail_seconds: 120
      rate_429_per_min: 20
      rate_5xx_per_5min: 5
      error_logs_per_5min: 10
      sql_down_seconds: 120
      # SPL-2542 (Cloud Run radar step 5): capacity. The ceiling is
      # hub.cloud_run.max_instances (rendered as hub_max_instances), per
      # revision. Measured 7 days to 2026-10-19T10:50Z, one point a minute,
      # read-only as each env's SA: dev never held its max longer than
      # 15 min; prd held it 1346 of 10080 min, in episodes of >= 60 min: 6,
      # >= 180 min: 3, >= 240 min: 0. So 3600 s would have paged prd 6 times
      # that week, dev never.
      instances_at_max_seconds: 3600
      # SPL-3424 (owner Q1 = A, msg e13d9db4): page only when the revision is
      # at max AND busy, container/cpu/utilizations p99 above this for the
      # same duration. The 7 pages since 10-21 came from an idle hub (CPU p99
      # <= 0.06 in the measured episode).
      instances_at_max_cpu_p99: 0.6
      # container/memory/utilizations p99 per minute, max over revisions:
      # dev max 0.28, prd max 0.56 (p99 0.33). 0.8 stays under the hub's
      # GOMEMLIMIT (460 MiB of 512 = 0.9), where the GC starts to fight.
      memory_utilization_threshold: 0.8
      memory_high_seconds: 300
      # SPL-2867 (prd incident 2026-10-22, 09:40-10:10Z): sign-in answered
      # 503 after 10 s and /v1/view/* took 36-193 s while /v1/health stayed
      # 200, so the uptime check could not page. The alerts read Cloud Run's
      # request log of the hub (path and latency are no labels of
      # request_count). Measured read-only as the prd SA, 7 days to
      # 2026-10-22T11Z: sign-in 5xx and >= 3 view 5xx in 5 min came only
      # inside three degraded windows (10-16 17-19Z, 10-20 08-09Z, 10-22
      # 09-10Z); view 5xx elsewhere peaked at 2 in 5 min. /v1/view/* p95 per
      # 5 min: 0.1-0.9 s normally, 9-10 s on 10-22T03:35Z, 19 s on
      # 10-18T07:10Z, 16-172 s in the incident. The p95 stays under the
      # hub's per-view limit (SPL-2866: 5 s + 1 s grace, then 503
      # view_timeout), so it can still fire once that limit is live; the
      # 5xx condition catches the timeouts themselves.
      signin_path: /api/v1/auth/login
      signin_5xx_per_5min: 1
      view_path: /v1/view/
      view_p95_seconds: 4
      view_slow_seconds: 300
      view_5xx_per_5min: 3
      auto_close_seconds: 1800

    # GitHub Actions secret GCP_KEY_<ORG>_<APP>_<ENV> = this env's project SA
    # key (gcp-002, ~/.gcp/.<org>/key-<org>-<app>-<env>.json), published by
    # `gh secret set` from the key file; terraform state holds only its
    # sha256. gh_repo = 017 github_repository, derived by do_spl_merged_cnf.
    120-github-general-secrets: {}

    # spec 077 iac audit: terraform_data runs do_spl_demo_workspace_create
    # (idempotent: an existing workspace prints "created":false). Its
    # demo_enabled / demo_workspace are env.demo.{enabled,workspace}, derived
    # by do_spl_merged_cnf: one key per fact. The root key goes to the
    # ~/.spool-hub mount, never to state or a log.
    036-spl-demo-workspace: {}


  # The spool HUB (spec 007 / 003; ORC OQ decisions 2026-09-18). Shaped like
  # csi-rel's env.api: the hub's Cloud Run sizing under hub.cloud_run, its
  # runtime environment under hub.env.
  #
  # hub.env IS THE PUBLICATION OF THE HUB'S ENV-VAR NAMES: its keys are the
  # exact variables the hub binary (`spool migrate`, `spool serve`) reads, its
  # values the defaults for every env (each env file deep-merges over them).
  # The hub code reads these names; it does not invent its own. Consumers:
  #   - csi-spl-iac 030-cloud-run-hub renders hub.env into the Cloud Run env
  #   - csi-spl-orc do_gen_docker_env renders it (ENV=lde) into the local
  #     stack's env file for do_setup_app_inf
  # Values are strings (they land in an environment); durations are Go
  # time.ParseDuration strings.
  # Derived by do_spl_merged_cnf, never written by hand (unless an env sets
  # them itself, as lde does): SPOOL_HUB_ENV (= env.ENV),
  # SPOOL_HUB_FILES_BUCKET (= steps.050-gcs-files.files_bucket_name),
  # SPOOL_HUB_DOCS_BUCKET (= steps.051-gcs-docs.docs_bucket_name, only while
  # its publish_enabled is true),
  # SPOOL_HUB_WORKSPACE_DOCS_BUCKET (= steps.052-gcs-workspace-docs
  # .bucket_prefix + "{tenant}", spec 075: the hub's per-workspace docs
  # bucket, only while bucket_prefix is set) and
  # SPOOL_HUB_TENANT_HOST_PATTERN (= "{tenant}.<env.dns.fqdn>").
  # NOT here: SPOOL_HUB_DB_DSN in dev/prd is a secret (hub.secret_env names
  # its Secret Manager slot; the version is added out of band), and
  # $SPOOL_HUB_URL is a BOX-side variable (https://<tenant>.<env.dns.fqdn>),
  # never set on the hub.
  hub:
    cloud_run:
      port: 8080
      cpu: "1"
      memory: 512Mi
      # max 2 (owner pick "A", t1 67754bb7, 2026-10-11): a second instance so
      # losing one is no 16-min 429 outage. Cross-instance fan-out is Postgres
      # LISTEN/NOTIFY (spec 059 S1 box rows, S3 new messages, 062 Flow);
      # edits, reactions, deletes, presence and issue frames still reach only
      # the instance's own sockets. 10 needs a bigger DB tier (pool below).
      # min 1. Both cnf-overridable.
      # 030 deletion_protection: true always, except a destroy run (owner 2026-09-19)
      deletion_protection: true
      min_instances: 1
      max_instances: 2
      # SPL-2249 (Cloud Run radar step 3): wf 20 rolls through a canary when
      # enabled (do_canary_hub_deploy): the new revision tagged at 0 %,
      # probed, then <percent> of traffic for <minutes>; promote to latest
      # 100 % unless its 5xx pass max_5xx AND max_5xx_pct % of its requests,
      # or no WS upgrade reached it while its share predicts >= 5. Else the
      # old revision is pinned back. No load balancer: Cloud Run's own split.
      # Two revisions x max_instances = the roll's DB budget (pool below).
      # Off until the owner's go per env (t1 8f476aa8); dev first.
      canary:
        enabled: false
        percent: 10
        minutes: 10
        tag: canary
        probe_interval_s: 30
        metrics_lag_s: 120
        max_5xx: 3
        max_5xx_pct: 1
        # do_check_hub_deploy (SPL-3461): a split whose latest revision is
        # younger than minutes + this is a canary in flight ("rolling", rc 0),
        # older is stuck (rc 4). Counted from the revision's creation, so it
        # covers the deploy, the 0 % probes, metrics_lag_s and the verdict.
        verify_margin_s: 300
      # a WS is one request for its whole life: many per instance, and the
      # Cloud Run 60-min cap; boxes reconnect with backoff + re-hello.
      # 017 FR-SEC-004: csi-rel's API runs max 10 / concurrency 80 / 120 s;
      # that shape does not fit a WebSocket hub (1 instance by OQ-05, and 80
      # slots would be a flood's whole budget). The flood is bounded in the
      # hub instead: hub.env SPOOL_HUB_EDGE_* below, with the global socket
      # cap kept under this concurrency so REST + sign-in keep slots.
      concurrency: 1000
      # Request timeout (SPL-2252, radar step 7): 600 s, was 3600. Since
      # SPL-1981 the hub closes every healthy socket at its max life
      # (SPOOL_HUB_WS_MAX_LIFE, 5 min), and no other request ran past 60 s
      # (prd + dev, 7 days to 2026-10-16). What reached 3600 s were requests
      # the hub never answered: 1751 of them (1271 WS upgrades, 480 REST) on
      # the stuck prd instance of 2026-10-16 (SPL-2238), each holding its
      # instance and a concurrency slot for an hour. 600 = 2 x the max life;
      # hub-request-timeout-030.tst.sh keeps the two apart.
      timeout_seconds: 600
      # "all" (owner 2026-09-19, "exactly csi-rel: no load balancer"): the
      # hub is reached through Cloud Run domain mappings (032: api host +
      # tenant hosts) and the WUI's Firebase rewrite of /api/v1/auth/**, as
      # csi-rel's API. Both need ingress all; the 031 LB + Cloud Armor are gone.
      # Edge limits are in-app (017 T010), not Cloud Armor.
      ingress: all
    env:
      # $PORT (set by Cloud Run) wins over this
      SPOOL_HUB_LISTEN_ADDR: ":8080"
      # The Go runtime sized to the instance above (CLE-35076, SPL-1129):
      # the hub saw 2 CPUs under cloud_run.cpu "1" and had no memory limit
      # under 512Mi. GOMAXPROCS = cloud_run.cpu; GOMEMLIMIT ~90 % of
      # cloud_run.memory so the GC tightens before the hard cap. Change them
      # together with cloud_run (hub-startup-probe-030.tst.sh checks).
      SPOOL_HUB_GOMAXPROCS: "1"
      SPOOL_HUB_GOMEMLIMIT: "460MiB"
      # OQ-11: a send naming a file_id the hub does not hold is refused (400)
      SPOOL_HUB_ALLOW_TEXT_ONLY_WHEN_FILE_MISSING: "false"
      # OQ-13 / limits.md: the offline to_box queue, then delivery=expired
      SPOOL_HUB_QUEUE_TTL: "168h"
      SPOOL_HUB_QUEUE_MAX_PER_BOX: "1000"
      # 027 T010 pgx pool per hub instance. Cloud SQL db-f1-micro (040 tier)
      # has max_connections 25, 3 superuser-reserved: 22 for the hub logins
      # (read live prd via do_spl_db_query, n=2, 2026-10-11). An instance holds
      # this pool + 1 LISTEN connection (store/wake.go), one instance + 1 for
      # the repo-docs worker. max_instances 2 overlapping 2 more in a roll:
      # 4 x (4 + 1) + 1 = 21 of 22. Raise only with the tier or max_instances.
      SPOOL_HUB_DB_MAX_CONNS: "4"
      SPOOL_HUB_DB_MIN_CONNS: "2"
      SPOOL_HUB_DB_MAX_CONN_IDLE_TIME: "5m"
      # SPL-2866 (prd incident 2026-10-22): the hard limit of one /v1/view/*
      # request, its statement_timeout per statement; its context ends 1 s
      # later (pool wait included), then 503 view_timeout. During the incident
      # views held the 4 connections above for 100..164 s and sign-in gave up
      # at its own 10 s. Measured read-only (do_spl_hub_route_latency
      # ROUTE_P99=1, prd 2026-10-21T09:49Z..10-22T09:00Z, healthy): view p99
      # 0.1..2.2 s (issues 2.2, topics 1.8, channels 1.6; n 363..2039).
      # 5 s is > 2 x the worst p99, and 5 + 1 s stays under sign-in's 10 s
      # (hub-view-timeout-030.tst.sh keeps both).
      SPOOL_HUB_VIEW_TIMEOUT: "5s"
      # tiered retention (limits.md): #alerts 7 days, channels/topics 30 days
      SPOOL_HUB_RETENTION_ALERTS: "168h"
      SPOOL_HUB_RETENTION_CHANNELS: "720h"
      # OQ-03(b): hello {box_id,ts,nonce} is accepted within +- this skew
      SPOOL_HUB_HELLO_SKEW: "300s"
      # OQ-10: the WS-issued capability token for POST /v1/files
      SPOOL_HUB_UPLOAD_TOKEN_TTL: "5m"
      # spec 073 4.1: an agent join token's lifetime from minting, a Go
      # duration; the hub refuses to start outside 5m..24h (checkLimits)
      SPOOL_HUB_JOIN_TOKEN_TTL: "1h"
      # 017 FR-SEC-004 in-app edge limits (no LB, no Cloud Armor: owner
      # 2026-09-19; internal/edge). 0 = that limit off. A refused socket is a
      # 429 before the upgrade and never holds a Cloud Run slot.
      #   WS_CONNS_TOTAL: open /v1/ws + /v1/wui/ws sockets, all callers; below
      #     hub.cloud_run.concurrency (1000) so REST and sign-in keep ~100 slots
      #   WS_CONNS_PER_IP / WS_HANDSHAKES_PER_IP (per EDGE_WINDOW) /
      #     AUTH_PER_IP (/api/v1/auth/* per EDGE_WINDOW): keyed on the client
      #     IP, so they are "0" (off) until SPOOL_HUB_TRUSTED_PROXY_HOPS is
      #     measured for the env (017 T012) -- keyed on the front end's own
      #     address they would lock every caller out at once
      SPOOL_HUB_EDGE_WINDOW: "1m"
      SPOOL_HUB_EDGE_WS_CONNS_TOTAL: "900"
      SPOOL_HUB_EDGE_WS_CONNS_PER_IP: "0"
      SPOOL_HUB_EDGE_WS_HANDSHAKES_PER_IP: "0"
      SPOOL_HUB_EDGE_AUTH_PER_IP: "0"
      # handshake + liveness: hello must arrive within HELLO_TIMEOUT; a socket
      # that misses a pong for WS_PING_TIMEOUT is dropped (box client and
      # browsers answer pings while they read)
      SPOOL_HUB_HELLO_TIMEOUT: "10s"
      SPOOL_HUB_WS_PING_INTERVAL: "30s"
      SPOOL_HUB_WS_PING_TIMEOUT: "15s"
      # 017 FR-SEC-006: how many proxies append to X-Forwarded-For in front of
      # the hub; every per-IP limit (edge + 015 native auth) keys on the
      # hops-th entry from the right. Set per env ONLY from a measurement
      # (csi-spl-orc do_spl_probe_client_ip against GET /v1/debug/client-ip,
      # which CLIENT_IP_PROBE mounts; it echoes only the caller's own chain).
      # MEASURED 2026-09-25 ~21:10Z (CLE-34986, do_spl_probe_client_ip, n=3
      # per env, hub 0.6.4): dev hops=1 and prd hops=1 on the api host - the
      # TCP peer is Cloud Run's front end 169.254.169.126 for every caller, so
      # with "0" the 015 native per-IP buckets (login 30/15m, register /
      # verify / forgot / reset 10/15m) were ONE bucket for the whole env. The
      # browser calls native auth on the api host (wui_auth_base). Through the
      # WUI host's Firebase rewrite the chain is [client, firebase] with the
      # spoofed entry stripped (hops would be 2 there); such a request is
      # keyed on Firebase's address, never on an api-host caller's bucket.
      SPOOL_HUB_TRUSTED_PROXY_HOPS: "1"
      SPOOL_HUB_CLIENT_IP_PROBE: "true"
      # spec 155 section 6: the Notes kill switch (/v1/me/realm/notes); "false"
      # answers every notes route 404 notes_off and the stored notes stay.
      SPOOL_HUB_NOTES_ENABLED: "true"
      # 003 contracts/wui-live-ws.md §1: the #general lobby topic, one fixed
      # UUIDv4-shaped task_id for every env and tenant (defined only here; the
      # hub publishes it to browsers in `welcome`). Empty = lobby off.
      SPOOL_HUB_LOBBY_TASK_ID: "00000000-0000-4000-8000-000000000001"
      # 006 T012/T013: tenant quota (0 in the binary default = unlimited; these
      # are the published production values) and unpaid grace window.
      SPOOL_HUB_QUOTA_MESSAGES_PER_MONTH: "100000"
      SPOOL_HUB_QUOTA_PINS: "256"
      SPOOL_HUB_QUOTA_FILE_BYTES: "10737418240"
      SPOOL_HUB_BILLING_GRACE: "168h"
      SPOOL_HUB_LOG_LEVEL: "info"
      SPOOL_HUB_LOG_FORMAT: "json"
      # `spool migrate` reads the csi-spl-rdb SQL (src/sql/postgres/spool-hub)
      # from here; the hub image bundles it at this path
      SPOOL_HUB_MIGRATIONS_DIR: "/opt/spool/sql/postgres/spool-hub"
      # M2 checkout (006 contracts/checkout-v1.md §3; internal/payments):
      # csi-rel's payment code (owner direction 2026-09-19: Stripe exactly as
      # csi-rel; csi-rel's PayPal copied too, OFF, not live-tested).
      # PROVIDER: "" = none (hub up, checkout 503), "fake" (lde/dev), "stripe".
      # Unknown PROVIDER, ENABLE_FAKE_PAY=true outside lde/dev, or PayPal on
      # prd / in live mode make the hub REFUSE TO BOOT (T018); stripe with
      # unusable keys boots and answers checkout 503 (csi-rel F-17).
      # Secret VALUES never live here (payment.secret_env below).
      SPOOL_HUB_PAYMENT_PROVIDER: ""
      SPOOL_HUB_PAYMENT_PLAN_ID: "default"
      SPOOL_HUB_PAYMENT_PLAN_CENTS: "0"
      SPOOL_HUB_PAYMENT_CURRENCY: "eur"
      SPOOL_HUB_PAYMENT_PUBLIC_SCHEME: "https"
      # how long an unpaid checkout holds its tenant slug
      SPOOL_HUB_PAYMENT_HOLD: "1h"
      # 017 T008 / SEC-03: the key is never emailed. The one mail carries a
      # single-use link <CLAIM_URL>#checkout=..&token=.. to the WUI claim page,
      # valid CLAIM_TTL; set per env (required while a rail is on)
      SPOOL_HUB_PAYMENT_CLAIM_URL: ""
      SPOOL_HUB_PAYMENT_CLAIM_TTL: "24h"
      # M4 seats (009 T004, internal/payments): the MONTHLY price of one user
      # (HUM-*) seat and one bot seat on top of PLAN_CENTS; both "0" = seats
      # are not sold (the M2 SKU). A priced kind is bought 1..SEATS_MAX per
      # checkout, and the verified paid webhook writes the caps + the UTC
      # month's seat period (rdb 0016). DEDICATED "true" = the SKU mints a
      # GCP project id {org}-{app}-{env}-{YYYYMMDDHHmm} at the paid minute.
      SPOOL_HUB_PAYMENT_SEAT_USER_CENTS: "0"
      SPOOL_HUB_PAYMENT_SEAT_BOT_CENTS: "0"
      SPOOL_HUB_PAYMENT_SEATS_MAX: "1000"
      SPOOL_HUB_PAYMENT_DEDICATED: "false"
      # stripe (csi-rel STRIPE_*): the publishable key is public (the WUI's
      # Payment Element); API_BASE empty = the live API (set only for a
      # stripe-mock in lde); API_VERSION empty = the driver's pinned version
      SPOOL_HUB_STRIPE_PUBLISHABLE_KEY: ""
      SPOOL_HUB_STRIPE_API_BASE: ""
      SPOOL_HUB_STRIPE_API_VERSION: ""
      # paypal (csi-rel PAYPAL_*): OFF, sandbox only, never prd
      SPOOL_HUB_ENABLE_PAYPAL: "false"
      SPOOL_HUB_PAYPAL_CLIENT_ID: ""
      SPOOL_HUB_PAYPAL_MODE: "sandbox"
      SPOOL_HUB_PAYPAL_API_BASE: ""
      SPOOL_HUB_PAYPAL_WEBHOOK_ID: ""
      SPOOL_HUB_ENABLE_FAKE_PAY: "false"
      # Also read by the hub, deliberately NOT set in any env:
      #   SPOOL_HUB_FILES_DIR  a local-dir blob store instead of GCS (tests);
      #                        exactly one of it / SPOOL_HUB_FILES_BUCKET is set.
      #                        lde uses the bucket + fake-gcs-server instead.
      #   SPOOL_HUB_STRIPE_SECRET_KEY / _WEBHOOK_SECRET, SPOOL_HUB_PAYPAL_CLIENT_SECRET
      #                        secrets (payment.secret_env below).
    # spec 121 section 6 (T103): the embeddable sales channel, a visitor
    # chat in an iframe on a customer's page. OFF on every env until T207
    # turns it on (dev, then prd with the owner's go). do_spl_merged_cnf
    # derives the hub's SPOOL_HUB_EMBED_<KEY> from each key here (one key
    # per fact, never a hub.env literal); the hub refuses a value below 1.
    # visitors_per_ip_*: new visitors per client IP an hour and a UTC day
    #   (429 embed_visitors); posts_*: posts per visitor a minute and a day,
    #   turns_per_day: agent turns per unpaid visitor a day (429 embed_quota);
    #   message_max_bytes: one visitor post, text only (413);
    #   live_visitors_max: live unpaid visitors per embed (503 embed_full).
    # challenge_after_hits / ban_after_hits: a visitor that hits a limit that
    #   many times within hits_window solves the challenge on every post /
    #   has its ip_hash banned for ban_for.
    # token_idle_ttl / token_max_age (section 4.1): the visitor token lives
    #   30 days sliding from its last use, 180 days at most (Go durations).
    # No spend cap here: the per-embed spend ceiling is T305, on hold.
    embed:
      enabled: false
      visitors_per_ip_hour: 5
      visitors_per_ip_day: 20
      posts_per_minute: 6
      posts_per_day: 100
      message_max_bytes: 4096
      turns_per_day: 10
      live_visitors_max: 200
      challenge_after_hits: 3
      ban_after_hits: 5
      hits_window: 24h
      ban_for: 24h
      token_idle_ttl: 720h
      token_max_age: 4320h
    # The hub image (cloud envs). The tag is per env (<env>.env.yaml
    # hub.image.tag). Derived by do_spl_merged_cnf, never written by hand:
    # hub.image.ref = <gcp_region>-docker.pkg.dev/<gcp_project>/
    #   <steps.028-gcp-artifact-registry.repository_id>/<name>:<tag>,
    # the one reference 030 runs and do_build_push_hub_image pushes.
    image:
      name: spool-hub
      # repo-relative: the csi-spl-rdb DDL the image bundles at
      # hub.env.SPOOL_HUB_MIGRATIONS_DIR (the same dir lde.hub.sql_src names)
      sql_src: csi-spl-rdb/src/sql/postgres/spool-hub
    # 017 T029 / FR-SEC-014: two Postgres logins in Cloud SQL (040), so the
    # login the hub runs as cannot switch row level security off.
    # db_owner_user OWNS the schema: `spool migrate` (do_spl_db_bootstrap)
    # runs as it, and its DSN lives ONLY in db_owner_dsn_secret, a slot 040
    # creates and 030 never injects or grants. It is a Cloud SQL API user,
    # created out of band by do_spl_db_bootstrap.
    # db_user is the hub's RUNTIME login, the DSN in secret_env below. The
    # owner creates it in SQL (do_spl_db_owner_split): LOGIN, no CREATEROLE,
    # CREATEDB or BYPASSRLS, no memberships, DML-only grants plus default
    # privileges for what the owner creates later
    # (csi-spl-rdb/src/sql/postgres/spool-hub-roles/runtime-grants.sql).
    db_owner_user: spool_hub
    db_owner_dsn_secret: csi-spl-hub-db-owner-dsn
    db_user: spool_hub_rt
    # how the owner-gated orc actions (do_spl_db_bootstrap, do_spl_tenant_create)
    # reach the Cloud SQL instance from a box: the Cloud SQL Auth Proxy on
    # 127.0.0.1 (a cloud-sql-proxy binary on PATH wins over this image)
    cloud_sql_proxy_image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.0
    # env var -> Secret Manager secret id, cloud envs only. The secret SLOT is
    # terraform (040), its VERSION is added out of band. Never a value in git,
    # tf state or a log.
    secret_env:
      SPOOL_HUB_DB_DSN: csi-spl-hub-db-dsn
    # spec 014 T020: the box-wui Ed25519 PRIVATE key (contracts/wui-dispatch.md
    # section 2.1). 030 always creates the slot (empty, no version resource) and
    # injects it as SPOOL_HUB_WUI_KEY only while inject is "true": Cloud Run
    # refuses a revision whose secret has no version, so an env flips inject
    # after `./run -a do_spl_wui_key_seed` (csi-spl-orc) has added one.
    wui_key:
      inject: "false"
      secret_env:
        SPOOL_HUB_WUI_KEY: csi-spl-hub-wui-key
    # spec 065 L4: the release-notes hygiene filter's name / box / org bans
    # (RE2, one per line). Personal data, so never a value in git, tfvars,
    # state or a log: the list is the 10 ci distribution-hygiene Sweep's own
    # patterns, read out of the workflow and added as a version by
    # `./run -a do_spl_release_note_bans_seed` (csi-spl-orc). 030 always
    # creates the slot (empty) and injects SPOOL_HUB_RELEASE_NOTE_BANS only
    # while inject is "true" (Cloud Run refuses a version-less secret).
    release_note_bans:
      inject: "false"
      secret_env:
        SPOOL_HUB_RELEASE_NOTE_BANS: csi-spl-hub-release-note-bans

  # Browser sign-in (spec 010-spool-social-auth; SPEC-spool-social-auth.md).
  # The hub's internal/auth reads exactly these names; nothing is baked in Go.
  # Shaped like hub: plain values under env, Secret Manager slot ids under
  # secret_env. 030 renders env into the hub's Cloud Run env (merged with
  # hub.env) and injects from secret_env ONLY the session key plus the secret of
  # each LISTED provider (spec 010 T020): Cloud Run refuses a revision whose
  # secret has no version, so an unlisted provider's empty slot is never
  # referenced. 030 also creates every slot below, empty (T021). The owner's
  # console steps: csi-spl-doc/specs/010-spool-social-auth/idp-registration-runbook.md.
  # SPOOL_HUB_AUTH_PROVIDERS is the narrative's
  # env.auth.social.providers: "" = off (no buttons, start/callback 404). The
  # hub FAILS FAST at boot if a listed provider has an unset or PLACEHOLDER-*
  # value, so a provider is listed only after its app is registered and its
  # secret version exists (spec 010 quickstart section 3).
  auth:
    social:
      env:
        SPOOL_HUB_AUTH_PROVIDERS: ""
        # the WUI origin the callback lands on; failures land on /login?auth_error=
        SPOOL_HUB_AUTH_APP_URL: PLACEHOLDER-wui-origin
        SPOOL_HUB_AUTH_SESSION_TTL: "12h"
        SPOOL_HUB_AUTH_STATE_TTL: "15m"
        SPOOL_HUB_AUTH_COOKIE_NAME: spool_session
        # empty = host-only cookie on the callback host
        SPOOL_HUB_AUTH_COOKIE_DOMAIN: ""
        SPOOL_HUB_AUTH_COOKIE_SECURE: "true"
        # spec 010 T056: the OAuth state cookie (carries COOKIE_DOMAIN). Behind
        # Firebase Hosting it must be "__session" (the only request cookie
        # Hosting forwards to Cloud Run); dev/prd set that.
        SPOOL_HUB_AUTH_STATE_COOKIE_NAME: spool_oauth_state
        # client ids are public (they appear in the IdP redirect); placeholders
        # until the apps are registered. Redirect URIs must be byte-identical
        # to the ones registered in the Google / Meta consoles.
        SPOOL_HUB_AUTH_GOOGLE_CLIENT_ID: PLACEHOLDER-google-client-id
        SPOOL_HUB_AUTH_GOOGLE_REDIRECT_URI: PLACEHOLDER-google-redirect-uri
        SPOOL_HUB_AUTH_GOOGLE_SCOPES: "openid email profile"
        SPOOL_HUB_AUTH_FACEBOOK_CLIENT_ID: PLACEHOLDER-facebook-app-id
        SPOOL_HUB_AUTH_FACEBOOK_REDIRECT_URI: PLACEHOLDER-facebook-redirect-uri
        SPOOL_HUB_AUTH_FACEBOOK_SCOPES: "email,public_profile"
        # Microsoft (spec 018): OQ-M1 (a) common = personal + every work/school
        # tenant; a work account's email needs xms_edov=true (OQ-M2 (a)). The
        # Azure "Supported account types" must match TENANT. TRUST_EMAIL=true
        # is refused in prd. Owner runbook:
        # csi-spl-doc/specs/018-spool-auth-microsoft/azure-registration-runbook.md
        SPOOL_HUB_AUTH_MICROSOFT_CLIENT_ID: PLACEHOLDER-microsoft-client-id
        SPOOL_HUB_AUTH_MICROSOFT_REDIRECT_URI: PLACEHOLDER-microsoft-redirect-uri
        SPOOL_HUB_AUTH_MICROSOFT_SCOPES: "openid email profile"
        SPOOL_HUB_AUTH_MICROSOFT_TENANT: common
        SPOOL_HUB_AUTH_MICROSOFT_TRUST_EMAIL: "false"
        SPOOL_HUB_AUTH_LINKEDIN_CLIENT_ID: PLACEHOLDER-linkedin-client-id
        SPOOL_HUB_AUTH_LINKEDIN_REDIRECT_URI: PLACEHOLDER-linkedin-redirect-uri
        SPOOL_HUB_AUTH_LINKEDIN_SCOPES: "openid profile email"
        # xAI endpoints are cnf, never Go (narrative section 1); values from
        # https://auth.x.ai/.well-known/openid-configuration (2026-09-19).
        # OQ-I2: whether xAI registers third-party clients is unknown.
        SPOOL_HUB_AUTH_XAI_CLIENT_ID: PLACEHOLDER-xai-client-id
        SPOOL_HUB_AUTH_XAI_REDIRECT_URI: PLACEHOLDER-xai-redirect-uri
        SPOOL_HUB_AUTH_XAI_SCOPES: "openid profile email"
        SPOOL_HUB_AUTH_XAI_AUTH_URL: https://auth.x.ai/oauth2/authorize
        SPOOL_HUB_AUTH_XAI_TOKEN_URL: https://auth.x.ai/oauth2/token
        SPOOL_HUB_AUTH_XAI_USERINFO_URL: https://auth.x.ai/oauth2/userinfo
      # env var -> Secret Manager secret id (cloud envs). Slots are terraform
      # (030, spec 010 T021); VERSIONS are added out of band by the owner. Never
      # a value in git, tf state or a log.
      secret_env:
        SPOOL_HUB_AUTH_SESSION_KEY: csi-spl-hub-auth-session-key
        SPOOL_HUB_AUTH_GOOGLE_CLIENT_SECRET: csi-spl-hub-auth-google-client-secret
        SPOOL_HUB_AUTH_FACEBOOK_CLIENT_SECRET: csi-spl-hub-auth-facebook-client-secret
        SPOOL_HUB_AUTH_MICROSOFT_CLIENT_SECRET: csi-spl-hub-auth-microsoft-client-secret
        SPOOL_HUB_AUTH_LINKEDIN_CLIENT_SECRET: csi-spl-hub-auth-linkedin-client-secret
        SPOOL_HUB_AUTH_XAI_CLIENT_SECRET: csi-spl-hub-auth-xai-client-secret

    # Native email + password sign-in (spec 015; internal/auth/native_config.go).
    # OFF until ENABLED=true, and ENABLED needs a real SPOOL_HUB_AUTH_SESSION_KEY
    # + SPOOL_HUB_AUTH_APP_URL (auth.social above) or the hub fails fast at
    # boot. 030 renders this env into the hub and injects the session key
    # once ENABLED is "true", even with no IdP listed.
    native:
      env:
        SPOOL_HUB_AUTH_NATIVE_ENABLED: "false"
        SPOOL_HUB_AUTH_NATIVE_VERIFY_REQUIRED: "true"
        # the hub refuses to boot with this true in prd
        SPOOL_HUB_AUTH_NATIVE_DEBUG_TOKENS: "false"
        # OQ-N6: the hops are hub.env SPOOL_HUB_TRUSTED_PROXY_HOPS (017
        # FR-SEC-006, one value for every per-IP limit); the native-only key
        # is retired and the hub refuses it when it disagrees.

  # dispatch c7b6e8db (owner HUM-10 2026-10-07, option 7): a tenant host that
  # turns ready is announced with one line in this t1 channel, posted by the
  # dispatch lease master's desk (do_spl_tenant_host_provision /
  # _reconcile, spl_th_notify_ready). Unset = no post (logged).
  tenant_hosts:
    notify_channel: spool-hub-devel

  # SPL-2584 (owner HUM-10, t1 4b49e47d msgs 6c089b4a, 8b351386): the fleet's
  # automatic notices (an orchestrator failover, a failed or recovered
  # rotation, a hung watchdog) are new topics of this t1 channel, posted by
  # the acting seat's desk through csi-spl-orc do_spl_fleet_notice; never a DM
  # to a person (how-to-post.md rule 18). Unset = the notice is not sent.
  fleet_notices:
    channel: spool-hub-ops

  # spec 077 demo users (owner Q8): the public demo workspace. OFF by default;
  # an env file turns it on (dev first, prd on the owner's go). do_spl_merged_cnf
  # derives the hub's SPOOL_HUB_DEMO_* from here: one key per fact, never
  # written in hub.env. With enabled false a demo_user membership grants
  # nothing and GET /v1/demo answers 404. workspace: the tenant id the demo
  # runs in, made by do_spl_demo_workspace_create. providers: the IdPs whose
  # verified identity is seated with no invite (google, facebook and linkedin
  # only; linkedin by the owner, t1 msg fafec44f).
  # max_live: the live demo memberships at a time (the 10th: demo_full).
  # audit_retention_days: how long the audit of demo posts (rdb 0131, 077
  # FR-011) is kept; do_spl_demo_audit_purge deletes older rows. 90 is the
  # recommended default, the owner's confirmation is pending (t1 4979bb24).
  demo:
    enabled: false
    workspace: demo
    providers: [google, facebook, linkedin]
    max_live: 9
    audit_retention_days: 90

  # spec 075 repo-edit (owner O1-O9): editable Repo Docs, saved to the docs
  # bucket and pushed to master by the hub's GitHub App. OFF on every env until
  # T13 switches dev on. do_spl_merged_cnf derives the hub's
  # SPOOL_HUB_DOCS_EDIT_* from here (one key per fact, never a hub.env literal);
  # lists reach the hub joined with commas.
  # inject: "true" only once secret_env's slot holds a version (Cloud Run
  # refuses a version-less secret); 030 imports the slot (created with the key
  # by do_spl_gh_app_manifest) and grants the runtime SA read either way.
  # github_app_id / installation_id: public ids, not secrets (spec 9).
  # deny: the deny globs of spec 5.2, one per item, grouped by its rows 1-13
  # (row 14 is the hub's own rule); "**" = zero or more path segments.
  # coalesce_*: Go durations (spec 3). rate_*: commits per member and per
  # agent an hour, per workspace and per env a day (spec 5.1).
  # min_member_age: a membership younger than this may not edit.
  # blocked_workspaces: workspace ids ops cut off (the operator brake).
  # repo_export_tenants: the workspaces whose qto docs may be exported to,
  # or imported from, md files of this PUBLIC repository
  # (do_spl_doctree_export_md / _import_md refuse any other; spec 114 9.4.2).
  # private_repos: workspace -> its PRIVATE GitHub repository (<owner>/<repo>);
  # do_spl_doctree_export_md writes that workspace's md docs only into a clone
  # of it (QTO_PRIVATE_REPO_DIR), never into this repository, and the import
  # refuses it: the hub keeps the primary copy (owner HUM-10, csitea 8c223c17
  # msg 2b3de92e; SPL-3543). A workspace is in at most one of the two lists.
  # private_index_required: true makes a missing private doc index (the
  # hand-copy check, do_spl_private_doc_index; CI secret
  # QTO_PRIVATE_INDEX_B64) a FAIL of the qto map check, pre-push and CI;
  # false: a WARN that the check was NOT RUN (SPL-3541).
  docs:
    repo_export_tenants: [system, t1]
    private_index_required: false
    private_repos:
      csitea: csitea/csitea-ws-docs
    repo_edit:
      enabled: false
      inject: "false"
      secret_env:
        SPOOL_GITHUB_APP_KEY: spool-hub-github-app-key
      github_app_id: "5214218"
      installation_id: "168598042"
      github_api: https://api.github.com
      deny:
        - "**/CLAUDE.md"
        - "**/GEMINI.md"
        - "**/AGENTS.md"
        - "**/.*"
        - "**/.*/**"
        - "csi-spl-wui/**"
        - "csi-spl-api/**"
        - "csi-spl-rdb/**"
        - "csi-spl-cnf/**"
        - "csi-spl-iac/src/terraform/**"
        - "csi-spl-orc/src/bash/features/*/assets/**"
        - "**/*.tpl.md"
        - "csi-spl-doc/doc/md/lane-integration-rules.md"
        - "csi-spl-doc/doc/help/**"
        - "csi-spl-doc/specs/**/tasks.md"
        - "**/tests/**"
        - "**/fixtures/**"
        - "**/testdata/**"
        - "**/*.fixture.md"
        - "**/node_modules/**"
        - "tpl-gen/**"
        - "**/bin/**"
        - "**/secrets/**"
      coalesce_after: 15s
      coalesce_max: 10m
      rate_member_per_hour: 30
      rate_agent_per_hour: 60
      rate_workspace_per_day: 100
      rate_env_per_day: 300
      min_member_age: 24h
      blocked_workspaces: []

  # spec 021 (donor i18n, copied): the WUI and the hub mails share one locale
  # set and one default. default_locale is the unprefixed locale of the WUI
  # (prefix_except_default) and the hub's fallback when a person has no
  # stored preference and the request names none. Owner 2026-09-19 (OQ-1):
  # English. Bulgarian stays available under /bg/.
  i18n:
    default_locale: en
    locales: [bg, fi, ru, en, sv, he, tr, mk, el, lt, et, lv, sr, ro, uk, sk, pl, es, nl]

  # Outbound mail for native auth (spec 015; internal/mail/config.go). SMTP
  # values are checked only when TRANSPORT=smtp; no relay exists yet (OQ-N5).
  mail:
    env:
      SPOOL_HUB_MAIL_TRANSPORT: "none"
      SPOOL_HUB_MAIL_SMTP_HOST: PLACEHOLDER-smtp-host
      # an INT in the hub (internal/mail): a placeholder string crashes the
      # boot even while the transport is none/log. 0 = unset; >0 required only for smtp.
      SPOOL_HUB_MAIL_SMTP_PORT: "0"
      SPOOL_HUB_MAIL_SMTP_USER: PLACEHOLDER-smtp-user
      # STARTTLS is REQUIRED for a real relay (the csi-rel outage was a relay
      # reached without it); the hub refuses "none" unless the host is loopback
      SPOOL_HUB_MAIL_SMTP_TLS: "starttls"
      SPOOL_HUB_MAIL_FROM: PLACEHOLDER-mail-from
      SPOOL_HUB_MAIL_FROM_NAME: PLACEHOLDER-mail-from-name
    # slot: created empty by 030 (IDP lane, with the IdP slots); version out of
    # band. Injected only while SPOOL_HUB_MAIL_TRANSPORT is "smtp".
    secret_env:
      SPOOL_HUB_MAIL_SMTP_PASSWORD: csi-spl-hub-mail-smtp-password

  # M2 payment secrets (006 T022; checkout-v1 §3). 030 creates every slot
  # empty (with the auth/mail slots) and injects the stripe pair only while
  # hub.env.SPOOL_HUB_PAYMENT_PROVIDER is "stripe", the PayPal secret only
  # while SPOOL_HUB_ENABLE_PAYPAL is "true": Cloud Run refuses a revision
  # whose secret has no version. Versions are added out of band from the
  # owner's key files (~/.stripe/.csi/.spl/, csi-rel layout); never git,
  # state or a log.
  payment:
    secret_env:
      SPOOL_HUB_STRIPE_SECRET_KEY: csi-spl-hub-stripe-secret-key
      SPOOL_HUB_STRIPE_WEBHOOK_SECRET: csi-spl-hub-stripe-webhook-secret
      SPOOL_HUB_PAYPAL_CLIENT_SECRET: csi-spl-hub-paypal-client-secret
    # 006 T021w: the WUI card step loads the card vendor's SDK and iframes
    # (csi-spl-wui src/utils/card-element.mjs). The WUI Hosting CSP
    # (csi-spl-orc render-wui-firebase-json.sh) admits EXACTLY these absolute
    # https origins, per directive, and nothing when a list is empty: set them
    # only in an env whose hub runs the card rail (PROVIDER stripe).
    wui_csp:
      script: []
      frame: []
      connect: []

  # spec 090 marketing automation (phase 1: the LinkedIn personal feed).
  # workspaces: the workspace (tenant) slugs it is ON for; everywhere else the
  # /v1/marketing routes answer 404 and the WUI hides the section. [] = off.
  # kms_key: step 055's key ring and key. The hub's runtime SA (030) holds
  # cryptoKeyEncrypterDecrypter on that key only; a channel token is stored
  # only as ciphertext sealed with it (FR-002). A key ring cannot be deleted
  # in GCP, so these names are for good.
  # linkedin.*_secret: Secret Manager slot ids of the LinkedIn developer app
  # ("Share on LinkedIn" + "Sign In with LinkedIn using OpenID Connect").
  # 030 creates both slots EMPTY (no version resource: a version puts the
  # value into state); the owner adds the versions out of band. 030 injects
  # them as SPOOL_HUB_MARKETING_LINKEDIN_CLIENT_ID / _CLIENT_SECRET only while
  # linkedin.inject is "true": Cloud Run refuses a revision whose secret has
  # no version, so an env flips inject after both versions exist.
  # kms_key.inject: "true" injects the key's full name as
  # SPOOL_HUB_MARKETING_KMS_KEY; connecting LinkedIn needs it AND the two
  # LinkedIn secrets.
  # post_hour_local: the hour (0-23) of the daily draft, in the workspace's
  # tenants.marketing_tz.
  marketing:
    workspaces: []
    kms_key:
      key_ring: csi-spl-marketing
      crypto_key: channel-tokens
      # 90 days (spec 090 T002)
      rotation_period: 7776000s
      # "true": 030 hands the hub the key as SPOOL_HUB_MARKETING_KMS_KEY
      # (SPL-1634). 055 is applied on dev and prd (re-plan 2026-10-13: no
      # changes; do_spl_kms_check OK on both).
      inject: "true"
    linkedin:
      inject: "true"
      client_id_secret: csi-spl-hub-marketing-linkedin-client-id
      client_secret_secret: csi-spl-hub-marketing-linkedin-client-secret
    post_hour_local: 9

  # spec 149 a member's own Google Calendar (build row B5, SPL-3208).
  # workspaces: the workspace (tenant) ids it is ON for, or the one entry
  # "all"; everywhere else every /v1/me/google-calendar route answers 404 and
  # the WUI section says it is not available. [] = off. S5 is set: "all"
  # (owner HUM-10, t1 838e3484 msg 37f40dc0, "switch it on for every
  # workspace"); it reaches the hub with the step-030 apply (owner go).
  # scopes: what the connect asks Google for, space separated. S2 is done
  # (owner HUM-10, t1 838e3484 msg 54d9116a): calendar.app.created is on the
  # consent screen, so the connect asks for it (spec 149
  # google-review-submission.md section 1.2); it reaches the hub with the
  # step-030 apply (owner go).
  # The OAuth client is each env's sign-in client (P2), the tokens are sealed
  # with marketing.kms_key under the purpose spool-gcal-token/v1 (P6), and
  # the callback is <WUI origin>/v1/me/google-calendar/callback (S3).
  # *_url / calendar_base: Google's endpoints; the hub has no default.
  gcal:
    workspaces: ["all"]
    scopes: "openid email https://www.googleapis.com/auth/calendar.app.created"
    auth_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    revoke_url: https://oauth2.googleapis.com/revoke
    userinfo_url: https://openidconnect.googleapis.com/v1/userinfo
    calendar_base: https://www.googleapis.com/calendar/v3

  # spec 127 workspace vendor keys, lane I1: step 057.
  # kms_key: the key ring and key that wrap each vendor key row's DEK (4.2).
  # The hub's runtime SA (030) is the ONLY member: cryptoKeyEncrypterDecrypter
  # on the key, nothing on the ring or the project. A key ring cannot be
  # deleted in GCP, so these names are for good.
  # pepper_secret: the Secret Manager slot of the fingerprint HMAC pepper, one
  # per env. 057 creates it EMPTY (no version in state); the value is added
  # out of band by csi-spl-iac do_spl_vendor_key_pepper_put.
  # grant_check: "true" (057 applied on dev and prd 2026-10-11); "false" makes
  # the daily do_spl_vendor_key_grant_check (workflow 48) print SKIP, not a red.
  vendor_keys:
    kms_key:
      key_ring: csi-spl-vendor-keys
      crypto_key: dek-wrap
      # 90 days, as 055
      rotation_period: 7776000s
    pepper_secret: csi-spl-hub-vendor-key-pepper
    grant_check: "true"

  # spec 091 public dataset export (the daily seed of ONE workspace).
  # enabled: THE kill switch; false = nothing is published on this env, and it
  # stays false on prd until the owner answers Q1 + Q8. workspace_id: the ONE
  # workspace exported (per env; never a literal anywhere else).
  # allow_list_version: csi-spl-orc/cnf/public-dataset/allow-list.v<N>.yaml.
  # topic_channel: the channel of the dataset topic, never exported (per env).
  # body_drop_cap_pct: more message bodies dropped by the scan than this = the
  # day fails (Q3). size_tolerance_pct: row counts vs the previous published
  # file. candidate_ttl_hours: an unpublished candidate is removed after this.
  # dev_synthetic: read on dev only; dev publishes on the gate alone (no
  # verifier lanes) only while true (Q7).
  # export_login / names_login: the two Postgres logins of fence 1 (T004,
  # spool-hub-roles/public-*-role.sql). Their passwords live ONLY in the two
  # Secret Manager slots below: minted by do_spl_public_export_secret_seed,
  # applied by do_spl_public_export_role (csi-spl-orc); never in the hub.
  public_dataset:
    enabled: false
    workspace_id: ~
    allow_list_version: 1
    topic_channel: ~
    body_drop_cap_pct: 1
    size_tolerance_pct: 50
    candidate_ttl_hours: 24
    dev_synthetic: true
    export_login: spool_public_export
    names_login: spool_public_names
    export_password_secret: csi-spl-public-export-db-password
    names_password_secret: csi-spl-public-names-db-password

  # The BOX side (spec 002): where every agent on a box keeps its mail.
  # Owner decision 2026-09-18: /var/spool-hub (the hub lane changes the code
  # default of $SPOOL_ROOT to it). csi-spl-orc do_provision_spool_root makes
  # it, and do_setup_app_inf calls that. PERMISSIONS MODEL (spec 017
  # FR-SEC-001; one box, many OS users -- one per agent kind -- and local mail
  # is unsigned, so the spool is closed to everyone outside the group):
  #   the group       spool_root_group; EVERY OS user that runs an agent or
  #                   reads the spool (the box owner too) is a member
  #   the dir         mode 27<g><o>, 2770 for other "---": setgid (new entries
  #                   inherit the group), NOT sticky -- `recv --ack` renames a
  #                   message another user wrote, which a sticky dir forbids
  #   ACLs            user/group rwx + other <spool_root_other> + mask, access
  #                   and default, on the root and every subdir (files rw), so
  #                   an inbox a user creates with umask 022 stays writable for
  #                   every other member
  # do_provision_spool_root never creates the group: a box migrates, in a
  # quiet window (running agents need a restart to pick up the group), with
  #   ./run -a do_repair_spool_root                      (dry run: the plan)
  #   DRY_RUN=0 SPOOL_ROOT_MEMBERS="<user> ..." ./run -a do_repair_spool_root
  # Until then provision leaves an existing root as it is (WARN).
  box:
    spool_root: /var/spool-hub
    # the agent login self-heal (csi-spl-orc do_spl_agent_login_check, owner
    # t1 0bb05176): a seat restored, or whose claude started, less than
    # cooldown_min minutes ago is never stopped again by the check
    login_check:
      cooldown_min: 10
    # Map of services to their candidate packages (used by do_box_pkg_flag).
    # Format: "<service>: <candidate pkg> ...", one per line (spec 142
    # section 5.3). Installing a candidate of a service another package owns,
    # or removing the owner, prints a FLAG line.
    pkg_services: |
      dns: systemd-resolved libnss-resolve resolvconf openresolv dnsmasq unbound bind9
      network: network-manager ifupdown netplan.io connman dhcpcd isc-dhcp-client systemd-networkd
      init: systemd-sysv sysvinit-core openrc runit-init
      firewall: ufw firewalld nftables iptables-persistent
      ssh: openssh-server dropbear
    # the deferred lane cleanup (csi-spl-utl do_sweep_workdirs, SPL-2110; owner
    # HUM-10 t1 37349c9b msg ec060ebc): a finished lane's worktree, /tmp
    # scratch and /var/tmp leftovers wait in $SPOOL_ROOT/workdirs.tsv; the box
    # disk sweep removes them after age_h hours, after crit_age_h when the
    # lowest free % of the mounts is at or under crit_free_pct
    # orphans: also sweep the untabled <repo>-wt/<agent id> worktrees (no
    # table row, no local tmux window, not a role or desk id, clean and pushed)
    # under the same age rules (SPL-2856); off until the owner of the box
    # sweep turns it on
    workdir_sweep:
      age_h: 24
      crit_age_h: 6
      crit_free_pct: 8
      orphans: false
    # the external API reachability probe (csi-spl-utl
    # do_net_external_api_check, reliability round row 04, SPL-2232): a
    # payload-free DNS, TCP and TLS handshake to each endpoint, timeout_s per
    # step, appended to <uplink-probe dir>/<box>.external-api.tsv. Report-only.
    external_api_check:
      timeout_s: 5
      endpoints:
        - name: anthropic
          host: api.anthropic.com
          port: 443
        - name: gemini
          host: generativelanguage.googleapis.com
          port: 443
        - name: github
          host: api.github.com
          port: 443
    # the idle filler (csi-spl-orc do_spl_spawn_fill, SPL-1922; owner HUM-10
    # t1 71dbbf15, poll 41155726 answer 3c91b4c1 option A): queues one open
    # issue when the spawn queue is empty and the box has room. The cron line
    # (do_spl_spawn_fill_install_cron) acts only while this is true.
    spawn_fill:
      enabled: true
    # empty = keep the dir's current group; only valid with other "rwx"
    spool_root_group: spool-agents
    spool_root_other: "---"
    # spec 108 3.5: one box = one workspace. csi-spl-orc
    # do_spl_box_workspace_setup enrols a box into ONE workspace: its own OS
    # user (<workspace_user_prefix><tenant>, home <workspace_base>/<tenant>,
    # mode 0700, holding spool/ and state/) and the box-wide claim file
    # <workspace_base>/claim. do_spl_desk_up and do_spl_desk_pin then refuse
    # any other workspace on that box. A box with no claim is an operator box:
    # the multi-workspace desk, not isolated from the operator (owner Q2).
    workspace_base: /var/spool-ws
    workspace_user_prefix: spl-
    # t1 bc1a43e1 fix B: a desk's hub-run sidecar leaves out of its roster
    # an agent the dispatch lease's run report (dispatch/agent-run.tsv) has
    # said does not run for longer than this many minutes, so a dead name
    # stops being offered in the WUI; it comes back on the first report that
    # it runs again. The role ids 001..003 stay while this box's lease seats
    # them or a rotation holds them. do_spl_desk_up passes it as
    # SPOOL_AGENT_DROP_AFTER; 0 = never drop.
    agent_drop_after_minutes: 60
    # SPL-2165: a desk's hub-run sidecar logs its fallback queue (the
    # pending-flush dir a send falls back to while the hub is unreachable)
    # every log_every_minutes - depth, oldest age, rejected, last flush - and
    # at WARN once the oldest entry is warn_after_minutes old; `spool
    # hub-queue` prints the same and exits 3 past it. do_spl_desk_up passes
    # them as SPOOL_QUEUE_LOG_EVERY / SPOOL_QUEUE_WARN_AFTER; 0 = off.
    fallback_queue:
      log_every_minutes: 5
      warn_after_minutes: 15
    # The agent vendor split: claude 60, agy 20, mistral 20, grok and qwen 0
    # (the owner's workspace split, t1 2026-10-08). The split per task kind
    # (spec 115) is agent_split_by_kind below; this flat row is the one for
    # a kind the picker does not know. Out of 100, APPROXIMATE, never a quota:
    # tolerance is the +/- band, judged over the last `window` lane spawns
    # of this box (its registry.tsv, role seats 001..003 left out).
    # csi-spl-orc do_spl_lane_mix prints target vs actual and the vendor
    # the next spawn should go to; /spawn-an-agent reads it. A difficulty
    # left unset is simple_coding (spec 115), not complex. A vendor whose CLI is
    # missing on this box, or whose auth_marker (relative to the agent
    # user's home) is absent, is skipped and its share goes to claude.
    # The hub's workspace setting (rdb 0109, do_spl_agent_split_show)
    # prints the same numbers; LANE_MIX_SPLIT takes that line verbatim.
    # Per kind: rdb 0163, do_spl_agent_split_show --kind <k>.
    # mistral (spec 110, the Mistral Vibe CLI): T013 moved grok's share to
    # it at the owner's workspace split (t1, 2026-10-08), not the spec's 55.
    agent_split:
      claude: 60
      grok: 0
      agy: 20
      qwen: 0
      mistral: 20
      tolerance: 5
      window: 20
      auth_marker:
        grok: .grok/auth.json
        agy: .gemini
        qwen: .qwen/settings.json
        mistral: .vibe/.env
      # UI work (a lane whose brief or paths target csi-spl-wui/) never goes
      # to mistral, as main or backup, while this is false (owner HUM-10, t1
      # b61851fb, 2026-10-16: 5 of 5 mistral WUI/orc lanes failed). Only the
      # outcome of csi-spl-orc do_spl_vendor_ui_retest flips it, never a hand
      # edit; do_spl_lane_mix and the spawn placer read it.
      mistral_ui_allowed: false
      # Coding never goes to mistral, as main or backup, while this is false
      # (owner HUM-10, t1 b61851fb, msg 91bf8278, 2026-10-17: "Docs and
      # reviews only, no coding"; 18 of 60 mistral lanes in 7 days needed a
      # claude takeover). Coding = every kind but specs_and_docs and i18n, a
      # brief with no Kind line included. Only a new owner order flips it;
      # do_spl_lane_mix, do_spl_spawn_enqueue and the spawn placer read it.
      mistral_coding_allowed: false
    # spec 115 (vendor split by task kind, CNF-1): one row of weights per task
    # kind, out of 100, plus the backup vendor. A vendor left out of a row is
    # 0. main = the vendor with the strict maximum (never a tie); backup is a
    # vendor other than main and takes over after 2 failed tries of the main
    # on the same task (spec 115 section 6). agy is 0 and never the backup in
    # tests, simple_coding and complex_coding; in the secret-class kinds,
    # secret and orchestration (dispatching and orchestrating, owner msgs
    # a1e5c678, ff1baf01), only claude, grok or mistral may be non-zero or
    # the backup (the data rule, owner msgs 26117740, 474f32a0). tolerance,
    # window and auth_marker stay under agent_split and apply to every kind;
    # the flat agent_split vendor numbers are the row for a kind the picker
    # does not know, for one release. The conf-validator enforces all of it.
    # Mistral is 0 and never the backup in the coding kinds (tests,
    # simple_coding, complex_coding, secret, orchestration; owner HUM-10, t1
    # b61851fb, msg 91bf8278, 2026-10-17: "Docs and reviews only, no coding");
    # its share went to claude, grok is not raised (owner: Grok off,
    # 2026-10-16). Claude is now the main of every coding kind, and a backup
    # may not be the main, so their backup is grok: with grok off the
    # picker skips it and claude, always the last candidate, takes the lane.
    # specs_and_docs is agy 80 / mistral 15 / claude 5 (owner HUM-10, t1
    # ee1e58d5, msgs 9466b9aa and cb1b623e, 2026-10-13): agy does 80% of the
    # documentation, the spec reviews and the code reviews. Sum 100.
    agent_split_by_kind:
      specs_and_docs: { agy: 80, mistral: 15, claude: 5, backup: claude }
      tests:          { claude: 85, grok: 15, backup: grok }
      simple_coding:  { claude: 59, grok: 41, backup: grok }
      complex_coding: { claude: 90, grok: 10, backup: grok }
      i18n:           { agy: 100, backup: claude }
      secret:         { claude: 100, backup: grok }
      orchestration:  { claude: 65, grok: 35, backup: grok }
    # The Mistral Vibe CLI (spec 110 section 2.2/2.3): do_install_mistral_vibe
    # installs exactly this PyPI version (never latest) and pins active_model
    # in the agent user's ~/.vibe/config.toml. A bump is this edit + a re-run.
    mistral_vibe:
      version: 2.26.0
      model: mistral-vibe-cli-latest
      # The cost cap spawn-mistral.sh passes as --max-price (dollars, spec 110
      # 2.5). Measured on 2.26.0: vibe enforces it in -p mode only, so for an
      # interactive m- seat the Mistral console spend limit is the cap that holds.
      max_price: 5.00
    # The Grok Build CLI context cap (SPL-2215, grok token burn 2/6):
    # spool-harness.sh writes it as [session] auto_compact_threshold_percent
    # into the agent user's ~/.grok/config.toml at every grok launch. Grok
    # then compacts at this % of its 256000-token window (its own default is
    # 80 = 204800). Measured 2026-10-16 on sat (60 lane sessions, 3775 calls):
    # 50 (128000) simulates -34% grok input tokens; the measure:
    # csi-spl-orc ./run -a do_spl_grok_context_growth. Empty = grok's default.
    grok_cli:
      auto_compact_threshold_percent: 50
    # The scheduled box restart (owner HUM-10, t1 1d936561; drill 2
    # 2026-10-08): WEEKLY, every box at its OWN slot so the dispatch and
    # orch leases always have a live box, after the 03:00 box-local
    # uptime-alert drill. csi-spl-orc do_spl_box_restart_install_cron
    # BOX_RESTART_SLOT=<n> puts slot n (0 = the first box, 1 = the second)
    # in that box's crontab; box ids are estate data, never in this file.
    # weekday is cron's (0 = Sunday), the times are in `timezone` whatever
    # the box's own zone (the cron line gates on it, DST included).
    # Nightly is a later owner decision (after a week with no loss).
    restart:
      timezone: Europe/Helsinki
      weekday: 0
      slots: ["04:00", "04:30"]
      # A shutdown BLOCK inhibitor (a desktop box: the logged-in GNOME
      # session holds one) makes logind refuse the reboot even for root
      # (systemd 257: "Access denied", drill 7 2026-10-09). respect = the
      # restart DEFERS and says which lock; ignore = it reboots past it: PID 1
      # starts reboot.target (systemctl start reboot.target
      # --job-mode=replace-irreversibly --no-block, the units stop cleanly),
      # not logind's --check-inhibitors=no, which polkit refuses even for
      # root past a block lock. Forcing past the owner's
      # desktop session is the owner's call: a box that may is set with
      # BOX_RESTART_INHIBITORS=ignore in its own cron env, never here.
      inhibitors: respect
    # The fleet load target (owner HUM-10, t1 c13e8023): keep a box between
    # 50 % and 75 % of its cores (load5 / cpus), fill the boxes in order. The
    # band and the order are the HUB's instance setting (rdb 0118; only the
    # operator workspace's admin changes them, PATCH /v1/operator/fleet-load).
    # This order is only the SEED csi-spl-orc do_spl_box_pick uses while the
    # hub stores none, or does not answer (then 50 / 75 too, with a WARN).
    # Empty = the boxes with a load sample, by name. An instance names its
    # own order in the hub; box ids are estate data, never in this file.
    fleet_load:
      box_order: []
    # Simple load balancing (t1 3cfc236e, the 2026-10-11 lesson: one box's
    # uplink degraded for 3.5 h, beats 60 -> 1..23 per 10 min). A box is
    # DEGRADED when its hub beats in the last window_min are under
    # min_beat_pct % of the expected window_min * 60 / beat_s, or its last
    # beat is over max_gap_s old. csi-spl-orc do_spl_box_pick never places a
    # lane on a degraded box; the fleet lease ranks it last for both roles and
    # gives its configured rank back only after hold_min healthy. Measured on
    # prd: healthy 10-min windows 56..62 beats (max gap 32 s), degraded 1..23.
    # The rule: csi-spl-orc/lib/bash/funcs/spl-box-health.func.sh.
    health:
      window_min: 10
      min_beat_pct: 50
      beat_s: 10
      max_gap_s: 120
      hold_min: 30
    # CI busy (owner HUM-10, t1 f67e3656 msg 565d9bbb: "fewer agents on
    # satellite while CI runs"). While a self-hosted runner job is active on a
    # box (its BOX-0 row's ci=<N>), csi-spl-orc do_spl_box_pick gives it this
    # lower band (each mark at most the box's own) and does not pick it at or
    # over max_agents live agents: new lanes go to another box or hold. Running
    # agents and the rotation are untouched. Measured 2026-10-11 (n = 16 wf 10
    # runs): the CI box's load5 ran 75..335 % of its cores, 10..26 agents.
    # max_age_s: a BOX-0 row older than this says nothing about CI.
    # The rule: csi-spl-orc/lib/bash/funcs/spl-box-ci.func.sh.
    ci_busy:
      max_agents: 12
      low_pct: 25
      high_pct: 50
      max_age_s: 900
    # Weekly quota (SPL-2035, c-001 msg 46b6330a): do_spl_box_pick never
    # places a new lane on a box whose weekly usage of the lane's vendor is at
    # or over weekly_max_pct (claude's / grok's own pane banner, published as
    # wk= in each box's BOX-0 row); every box over -> the lane stays queued
    # ("waiting: claude weekly >= 90% on ..."). No reading = unknown, placed.
    # The rule: csi-spl-orc/lib/bash/funcs/spl-box-quota.func.sh.
    quota:
      weekly_max_pct: 90
    # CI overflow (owner HUM-10, t1 f67e3656 msgs d4ba4b17, 70480eb3,
    # 61cd35bc): wf 10 runs on GitHub-hosted runners; only while those are
    # overwhelmed (a hosted job queued enter_queue_min minutes or longer)
    # does csi-spl-orc do_route_ci_overflow point SPOOL_CI_RUNNER at the
    # local runners, and back once that held hold_min and no hosted job
    # waits exit_queue_min. Out of overflow the local runners are stopped
    # (do_apply_gh_runner_cpu_budget). Together they never take more than
    # cap_pct % of a box's cores AND memory (the runner slice's CPUQuota and
    # MemoryMax), 20..30; a CPU count (cpus, cores) replaces the share when
    # set, never above the box's cores. enabled and cpus are the defaults
    # only: the workspace admin's hub setting (fleet-load ci_overflow,
    # runner_cpus, boxes.<box>.runner_cpus) wins when stored.
    ci_overflow:
      enabled: true
      cap_pct: 25
      cpus: 0
      enter_queue_min: 10
      exit_queue_min: 3
      hold_min: 30

    # spec 073 AC8 (SPL-907): the workspace admin wf 23's join check signs
    # in as (csi-spl-orc do_spl_join_check): it mints a join token, a
    # throwaway box joins with install.sh --join, the seat is verified and
    # removed. Not secret: the password is ONLY the GitHub secret
    # SPL_PROBE_ADMIN_PW_<ENV>. Empty = the check skips with a ::notice::.
    join_check_email: sys+admin@csitea.net
    join_check_tenant: t1

    # Owner t1 151d85fc (msgs 6a6dcd7e, 68b543b1, ec950b4b): the env's box
    # state bucket (step 056) mapped to two folders with gcsfuse
    # (csi-spl-orc do_spl_box_state_mount). The code never names a path: it
    # reads SPL_BOX_STATE_RO / SPL_BOX_STATE_RW from spl_box_state_mounts.
    #   ro_dir     the whole bucket, read-only, as the project SA
    #   rw_dir     ONLY <rw_prefix>/ of the bucket, read-write, as the box
    #              writer SA; the nightly backups (<box>/<date>/) are never
    #              under it and stay immutable to boxes
    #   rw_prefix  the shared prefix; never a box name
    # A dir starting "~/" is under the running user's $HOME; %env% is the env.
    box_state_mount:
      ro_dir: "~/mnt/box-state/%env%/ro"
      rw_dir: "~/mnt/box-state/%env%/rw"
      rw_prefix: shared

    # SPL-2420: the customer repos the fleet lands in, beside csi-spl. A lane
    # ends its issue done with LANE_LANDED_REPO=<name> (do_spl_lane_issue), a
    # **Live** post proves a sha of one with LIVE_REPO=<name>
    # (spl_desk_live_proof), and the done-claim check reads their trunks; all
    # three resolve the name with spl_landed_repo (csi-spl-orc
    # spl-lane-issue.func.sh). The clone may live on one box only; box
    # (optional) names that box in a refusal on any other. A src_dir of a
    # step above (a hosted site) is a known repo too, named by its basename.
    #   name     what a lane passes; src_dir  the clone on its box
    #   trunk    the branch a landing is on (empty = origin/HEAD, master, main)
    landed_repos:
      - name: csi-rel
        src_dir: /opt/csi/csi-rel
        trunk: master


  # The source repository's url pieces the WUI links to (HUM-10). Every
  # instance names its own: an env file may override any of them, and a key
  # left empty hides that link (no fallback repository in code). wf 30 writes
  # them into the served /config.json (repoWebUrl, repoCloneUrl,
  # repoCommitPath, repoHelpPath); the compose stack takes SPOOL_REPO_* envs.
  #   repo_web_url     the repository's web page; base of the two paths below
  #   repo_clone_url   what "Connect an agent" clones the spool source from
  #   repo_commit_path a commit hash in a message links to
  #                    <repo_web_url><repo_commit_path><hash> (GitLab: /-/commit/)
  #   repo_help_path   a /help page's repo-relative link resolves against
  #                    <repo_web_url><repo_help_path> (GitLab: /-/blob/master/...)
  wui:
    repo_web_url: https://github.com/csitea/csi-spl
    repo_clone_url: https://github.com/csitea/csi-spl
    repo_commit_path: /commit/
    repo_help_path: /blob/master/csi-spl-doc/doc/help/
    # SPL-1994 (owner HUM-10, t1 72898ea2): minutes a person's received post
    # shows the spinning hourglass while no agent has answered; after that a
    # calm "waiting" mark. wf 30 writes it into /config.json (awaitReplyMinutes).
    await_reply_minutes: 10
    # spec 116 T7: true = search engines may index the public pages (/login,
    # /help, /blog: index,follow, robots.txt + sitemap.xml on the apex). Off
    # here, on in prd.env.yaml only: dev and every other env stay noindex.
    # wf 30 bakes it (NUXT_PUBLIC_SEO_INDEX); render-wui-firebase-json.sh
    # sets the served X-Robots-Tag from it.
    seo_index: false
    # spec 033 T015 (SPL-12): the probe member wf 30's live proof signs in as
    # after each deploy (csi-spl-orc do_spl_wui_live_proof): the owner's test
    # member (role tester, t1, dev and prd; SPL-1591). Not secret: the
    # password is ONLY the GitHub secret SPL_PROBE_PW_<ENV>. Empty = the step
    # skips with a ::notice:: naming these keys.
    live_proof_email: sys@csitea.net
    live_proof_tenant: t1

  # spec 111 blog (T001). tz: the blog day (D-Q1); `published` is stored in
  # UTC and the day, the cap and the digest hour are computed in this zone.
  # cap_per_day: posts per day in tz, digest included; digest_reserved of
  # them are held for the daily digest. max_words: the body limit of one post.
  # digest_at: the digest hour, HH:MM in tz. locales_from: the locale list
  # comes from the WUI i18n catalogue, never a second list here.
  blog:
    tz: Europe/Helsinki
    cap_per_day: 7
    # cap_exempt_tags: a post carrying one of these tags neither counts toward
    # cap_per_day nor is held by it; the digest slot and every other check
    # stay. Owner (HUM-10, t1 msg d940f865): "but no no those feature posts
    # should be done now" - option a (msg a8a36654): lift the limit for this
    # series only, the limit stays for everything else.
    cap_exempt_tags: [feature]
    digest_reserved: 1
    max_words: 450
    digest_at: "23:00"
    locales_from: i18n
    # The post picture (do_spl_blog_image): AI Studio first, then on its 429
    # Vertex AI in this project + region as that project's per-env SA (key
    # <agent-home>/.gcp/.csi/key-<vertex_project>.json). Owner t1 d49b6b76
    # option b: the csi-rel dev project pays for now; which project pays for
    # good is t1 4f445df3.
    image:
      vertex_project: csi-rel-dev
      vertex_location: us-central1

  # Spec 123 (cost tracking) section 4.2, build lane 2: the GCP billing export
  # to BigQuery and its reader. do_gcp_billing_export_setup (csi-spl-iac, dry
  # run by default, DRY_RUN=0 is the owner's, Q-3) makes the dataset and the
  # reader SA in export_project; do_spl_estate_cost_read reads it daily as that
  # SA (Q-2 = A: roles/bigquery.dataViewer on the dataset only), every project
  # whose id is LIKE project_like, and re-reads the trailing reread_days days
  # (the export lags and revises recent days). The billing account id is the
  # env var GCP_BILLING_ACCOUNT_ID, never here.
  # Security round 1 row 6 (SPL-1967): the max age per secret class, in whole
  # days, read by do_spl_secret_age_report (csi-spl-iac). The owner set both
  # class defaults to 90 days (SPL-1945, t1 8f476aa8: msg e8d4c60d "set a
  # default limit for the other secrets and service account keys first", msg
  # 018e37eb "A - 90 days", "D - 90 days"); null would mean not set, nothing
  # OVER. secret_version: an enabled Secret Manager version; sa_key: a
  # user-managed service account key.
  secrets:
    max_age_days:
      secret_version: 90
      sa_key: 90
      # SPL-2657 (Cloud Run radar step 6 part 2): the rotation schedule, the
      # max age in days of each secret the hub pins (env.hub.secret_versions).
      # It beats secret_version for that secret. A secret past it is OVER in
      # do_spl_secret_age_report; one rotation is do_spl_secret_rotate
      # (csi-spl-doc/doc/md/secret-rotation.md). The owner approved these
      # values (poll c5bf2101, answer A, 2026-10-20). No secret here rotates
      # by itself, every one needs a 030 apply with his go.
      per_secret:
        csi-spl-hub-db-dsn: 90
        csi-spl-hub-auth-session-key: 180
        csi-spl-hub-auth-google-client-secret: 180
        csi-spl-hub-auth-facebook-client-secret: 180
        csi-spl-hub-auth-linkedin-client-secret: 180
        csi-spl-hub-marketing-linkedin-client-id: 180
        csi-spl-hub-marketing-linkedin-client-secret: 180
        csi-spl-hub-mail-smtp-password: 180
        csi-spl-hub-stripe-secret-key: 180
        csi-spl-hub-stripe-webhook-secret: 365
        spool-hub-github-app-key: 180
        csi-spl-hub-wui-key: 365
  cost:
    reread_days: 5
    # Spec 123 sections 4.5 and 4.6, build lane 4: the cost sources the nightly
    # do_spl_cost_rollup_daily (csi-spl-orc) asks the cost-source factory for,
    # in this order (lib spl-cost-source.func.sh: a source is a function
    # spl_cost_source_<name> plus its entry here, no change to the rollup).
    # gcp re-reads the billing export window above; fleet_tokens and
    # agent_hours are the box's own (posted as <name>.<box>). rollup_utc is the
    # UTC time its cron runs (do_spl_cost_rollup_install_cron). The rollup
    # prunes the lease tick's day logs (dispatch/agent-run-<day>.log, ~0.5 MB
    # a day) to the last day_log_keep_days days.
    sources: [gcp, fleet_tokens, agent_hours]
    rollup_utc: "02:00"
    day_log_keep_days: 62
    gcp:
      # export_project: the reader SA's home and the project its query jobs run
      # in. export_dataset: the dataset the setup makes there when no
      # export_source_* is set.
      export_project: csi-spl-all
      export_dataset: spl_billing_export
      # SPL-3376 (owner HUM-10, t1 af4bbf51, poll fe5d4bfb answer A): the owner
      # set the billing export up in this project and dataset; the reader finds
      # its gcp_billing_export_v1_* table there by prefix, as the reader SA
      # (roles/bigquery.dataViewer on this dataset only).
      export_source_project: csi-spl-prd
      export_source_dataset: csi_spl_prd
      # multi-region EU: a new export backfills the current and previous month
      # only into a multi-region dataset (EU or US)
      export_location: EU
      reader_sa: spl-cost-reader
      project_like: "csi-spl-%"
  # SPL-2108 (owner HUM-10, t1 1b6f871f msg 44fef397): the daily exchange
  # rates of the costs' second currency, read by do_spl_fx_rates_fetch
  # (csi-spl-orc, cron row fx-rates-fetch) and posted to the hub's rdb 0200
  # fx_rates as units per USD. A currency in ecb_currencies (the European
  # ones) comes from the ECB euro reference rates (the last 90 days), every
  # other one from the Federal Reserve H.10 daily series (the last 60
  # observations; the Fed publishes weekly). days is how far back each run
  # posts (an UPSERT: a re-post changes nothing).
  fx:
    days: 30
    ecb_url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist-90d.xml
    fed_url: "https://www.federalreserve.gov/datadownload/Output.aspx?rel=H10&series=60f32914ab61dfab590e0e470153e3ae&lastobs=60&from=&to=&filetype=csv&label=include&layout=seriescolumn"
    ecb_currencies: [EUR, GBP, CHF, SEK, NOK, DKK, PLN, CZK, HUF, RON, BGN, ISK]
  # Spec 121 section 7 (T303): the price per million units of every metered
  # (provider, model, kind), the source of rdb 0171 model_prices. Filled by
  # do_spl_model_prices_sync (csi-spl-orc, DRY_RUN=1 by default). A price
  # change is a NEW row: edit the price AND move valid_from on; the rows
  # already in the table stay, so an old balance re-prices the same. Re-using
  # a valid_from the table holds at another price is refused. Units: micros of
  # currency per million (USD 4.00 = 4000000). kind is one of
  # llm_tokens_in, llm_tokens_out, llm_tokens_cache_read,
  # llm_tokens_cache_write (the 5-minute write), agent_seconds, storage_bytes,
  # cloud_share. Source: the provider's first-party pay-per-token API list
  # price (anthropic: cached 2026-09-25; cache write = 1.25 x input;
  # mistral: https://mistral.ai/pricing and
  # https://docs.mistral.ai/studio-api/conversations/advanced/prompt-caching,
  # read 2026-10-17, cache read = 10% of input, no separate write price).
  # model is the name the collector reports: a dated id such as
  # claude-haiku-4-5-20251001 prices as claude-haiku-4-5 (the hub strips the
  # date), mistral-large is vibe's alias of mistral-large-latest.
  model_prices:
    - provider: anthropic
      model: claude-opus-5-5
      currency: USD
      valid_from: "2026-10-01T00:00:00Z"
      per_million:
        llm_tokens_in: 4000000
        llm_tokens_out: 20000000
        llm_tokens_cache_read: 200000
        llm_tokens_cache_write: 5000000
    - provider: anthropic
      model: claude-sonnet-5-5
      currency: USD
      valid_from: "2026-10-01T00:00:00Z"
      per_million:
        llm_tokens_in: 2000000
        llm_tokens_out: 10000000
        llm_tokens_cache_read: 200000
        llm_tokens_cache_write: 2500000
    - provider: anthropic
      model: claude-haiku-4-5
      currency: USD
      valid_from: "2026-10-01T00:00:00Z"
      per_million:
        llm_tokens_in: 1000000
        llm_tokens_out: 5000000
        llm_tokens_cache_read: 100000
        llm_tokens_cache_write: 1250000
    - provider: mistral
      model: mistral-large
      currency: USD
      valid_from: "2026-10-01T00:00:00Z"
      per_million:
        llm_tokens_in: 500000
        llm_tokens_out: 1500000
        llm_tokens_cache_read: 50000
        llm_tokens_cache_write: 500000
