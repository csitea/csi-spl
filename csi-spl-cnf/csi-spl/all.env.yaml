# csi-spl ::: settings shared by EVERY environment. do_tpl_gen deep-merges this
# file UNDER csi-spl/<env>.env.yaml (the env file wins on a clash) and renders
# from the merge.
env:
  dns:
    # THE spool domain (owner decision 2026-09-17). The ONLY place the literal
    # may appear in code or config: change the domain HERE, then re-render
    # both envs. Per-env hostnames are derived from it at render time:
    #   fqdn = <env.dns.env_subdomain>.<BASE_DOMAIN>, or BASE_DOMAIN when the
    #   env_subdomain is empty (prd serves the apex).
    # Guarded by src/bash/tests/domain-single-source.tst.sh in csi-spl-iac.
    BASE_DOMAIN: spool-hub.ai

  # WHO every gcloud call runs as, and WHICH org the bootstrap works in (owner
  # rule 2026-09-19). The ONLY place these literals may appear: the shell
  # wrappers resolve the account through do_gcp_account (ACCOUNT > GCP_ACCOUNT
  # > gcp_account_owner_email) and pass --account on every gcloud call; gcp-000..004
  # take the org from gcp_org_id unless GCP_ORG_ID is set. An env file may
  # override either. CI sets GCP_ACCOUNT to the project SA, which wins.
  # Guarded by csi-spl-iac src/bash/tests/gcloud-account-pinned.tst.sh.
  # Owner order 2026-09-19: the owner account IS committed here. The 10 ci
  # distribution-hygiene sweep allows exactly this one key (by name) and
  # still flags the same name/mail anywhere else in the tree.
  gcp:
    gcp_account_owner_email: yordan.georgiev@flok.fi
    gcp_org_id: "1080340024101"


  # The spool HUB (spec 007 / 003; ORC OQ decisions 2026-09-18). Shaped like
  # csi-rel's env.api: the hub's Cloud Run sizing under hub.cloud_run, its
  # runtime environment under hub.env.
  #
  # hub.env IS THE PUBLICATION OF THE HUB'S ENV-VAR NAMES: its keys are the
  # exact variables the hub binary (`spool migrate`, `spool serve`) reads, its
  # values the defaults for every env (each env file deep-merges over them).
  # The hub code reads these names; it does not invent its own. Consumers:
  #   - csi-spl-iac 030-cloud-run-hub renders hub.env into the Cloud Run env
  #   - csi-spl-orc do_gen_docker_env renders it (ENV=lde) into the local
  #     stack's env file for do_setup_app_inf
  # Values are strings (they land in an environment); durations are Go
  # time.ParseDuration strings.
  # Derived by do_spl_merged_cnf, never written by hand (unless an env sets
  # them itself, as lde does): SPOOL_HUB_ENV (= env.ENV),
  # SPOOL_HUB_FILES_BUCKET (= steps.050-gcs-files.files_bucket_name) and
  # SPOOL_HUB_TENANT_HOST_PATTERN (= "{tenant}.<env.dns.fqdn>").
  # NOT here: SPOOL_HUB_DB_DSN in dev/prd is a secret (hub.secret_env names
  # its Secret Manager slot; the version is added out of band), and
  # $SPOOL_HUB_URL is a BOX-side variable (https://<tenant>.<env.dns.fqdn>),
  # never set on the hub.
  hub:
    cloud_run:
      port: 8080
      cpu: "1"
      memory: 512Mi
      # OQ-05: max 1 in M1 so every box WS lands on one instance (no
      # cross-instance fan-out); milestones: min 1. Both cnf-overridable.
      # 030 deletion_protection: true always, except a destroy run (owner 2026-09-19)
      deletion_protection: true
      min_instances: 1
      max_instances: 1
      # a WS is one request for its whole life: many per instance, and the
      # Cloud Run 60-min cap; boxes reconnect with backoff + re-hello
      concurrency: 1000
      timeout_seconds: 3600
      # M1 (owner 2026-09-18): ingress is IAP and/or an IP allowlist until
      # M2 -- unknown internet cannot hold a WS. Cloud Run cannot filter
      # source IPs itself, so the service takes load-balancer traffic only
      # and the allowlist (Cloud Armor) / IAP lives on the LB in front of
      # it (the 031 domain-mapping / LB step). M2: "all".
      ingress: internal-and-cloud-load-balancing
    env:
      # $PORT (set by Cloud Run) wins over this
      SPOOL_HUB_LISTEN_ADDR: ":8080"
      # OQ-11: a send naming a file_id the hub does not hold is refused (400)
      SPOOL_HUB_ALLOW_TEXT_ONLY_WHEN_FILE_MISSING: "false"
      # OQ-13 / limits.md: the offline to_box queue, then delivery=expired
      SPOOL_HUB_QUEUE_TTL: "168h"
      SPOOL_HUB_QUEUE_MAX_PER_BOX: "1000"
      # tiered retention (limits.md): #alerts 7 days, channels/threads 30 days
      SPOOL_HUB_RETENTION_ALERTS: "168h"
      SPOOL_HUB_RETENTION_CHANNELS: "720h"
      # OQ-03(b): hello {box_id,ts,nonce} is accepted within +- this skew
      SPOOL_HUB_HELLO_SKEW: "300s"
      # OQ-10: the WS-issued capability token for POST /v1/files
      SPOOL_HUB_UPLOAD_TOKEN_TTL: "5m"
      # 003 contracts/wui-live-ws.md §1: the #general lobby thread, one fixed
      # UUIDv4-shaped task_id for every env and tenant (defined only here; the
      # hub publishes it to browsers in `welcome`). Empty = lobby off.
      SPOOL_HUB_LOBBY_TASK_ID: "00000000-0000-4000-8000-000000000001"
      # 006 T012/T013: tenant quota (0 in the binary default = unlimited; these
      # are the published production values) and unpaid grace window.
      SPOOL_HUB_QUOTA_MESSAGES_PER_MONTH: "100000"
      SPOOL_HUB_QUOTA_PINS: "256"
      SPOOL_HUB_QUOTA_FILE_BYTES: "10737418240"
      SPOOL_HUB_BILLING_GRACE: "168h"
      SPOOL_HUB_LOG_LEVEL: "info"
      SPOOL_HUB_LOG_FORMAT: "json"
      # `spool migrate` reads the csi-spl-rdb SQL (src/sql/postgres/spool-hub)
      # from here; the hub image bundles it at this path
      SPOOL_HUB_MIGRATIONS_DIR: "/opt/spool/sql/postgres/spool-hub"
      # M2 checkout (006 contracts/checkout-v1.md §3; internal/payments).
      # PROVIDER names a rail by PROTOCOL: "" = none (hub up, checkout 503),
      # "fake" (lde/dev), "hosted-hmac" (the csi-rel 069 hosted-page rail;
      # which vendor answers at API_BASE is this file's business, never Go's).
      # Anything else, a hosted-hmac rail missing MERCHANT_ID / a URL / the
      # secret (payment.secret_env), or ENABLE_FAKE_PAY=true outside lde/dev
      # makes the hub REFUSE TO BOOT (T018). The secret VALUE never lives here.
      SPOOL_HUB_PAYMENT_PROVIDER: ""
      SPOOL_HUB_PAYMENT_PLAN_ID: "default"
      SPOOL_HUB_PAYMENT_PLAN_CENTS: "0"
      SPOOL_HUB_PAYMENT_CURRENCY: "eur"
      SPOOL_HUB_PAYMENT_PUBLIC_SCHEME: "https"
      # how long an unpaid checkout holds its tenant slug
      SPOOL_HUB_PAYMENT_HOLD: "1h"
      # hosted-hmac only (empty otherwise): the provider API base, our account
      # id, and the browser returns + webhook URL (<wui-origin>/checkout/...,
      # <wui-origin>/api/v1/webhooks/payment)
      SPOOL_HUB_PAYMENT_API_BASE: ""
      SPOOL_HUB_PAYMENT_MERCHANT_ID: ""
      SPOOL_HUB_PAYMENT_SUCCESS_URL: ""
      SPOOL_HUB_PAYMENT_CANCEL_URL: ""
      SPOOL_HUB_PAYMENT_CALLBACK_URL: ""
      SPOOL_HUB_ENABLE_FAKE_PAY: "false"
      # Also read by the hub, deliberately NOT set in any env:
      #   SPOOL_HUB_FILES_DIR  a local-dir blob store instead of GCS (tests);
      #                        exactly one of it / SPOOL_HUB_FILES_BUCKET is set.
      #                        lde uses the bucket + fake-gcs-server instead.
      #   SPOOL_HUB_PAYMENT_SECRET_KEY  secret (payment.secret_env below),
      #                        injected only while PROVIDER is hosted-hmac.
    # The hub image (cloud envs). The tag is per env (<env>.env.yaml
    # hub.image.tag). Derived by do_spl_merged_cnf, never written by hand:
    # hub.image.ref = <gcp_region>-docker.pkg.dev/<gcp_project>/
    #   <steps.028-gcp-artifact-registry.repository_id>/<name>:<tag>,
    # the one reference 030 runs and do_build_push_hub_image pushes.
    image:
      name: spool-hub
      # repo-relative: the csi-spl-rdb DDL the image bundles at
      # hub.env.SPOOL_HUB_MIGRATIONS_DIR (the same dir lde.hub.sql_src names)
      sql_src: csi-spl-rdb/src/sql/postgres/spool-hub
    # the hub's Postgres login in Cloud SQL (040): created out of band by
    # csi-spl-orc do_spl_db_bootstrap, whose DSN becomes the secret below
    db_user: spool_hub
    # how the owner-gated orc actions (do_spl_db_bootstrap, do_spl_tenant_create)
    # reach the Cloud SQL instance from a box: the Cloud SQL Auth Proxy on
    # 127.0.0.1 (a cloud-sql-proxy binary on PATH wins over this image)
    cloud_sql_proxy_image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.0
    # env var -> Secret Manager secret id, cloud envs only. The secret SLOT is
    # terraform (040), its VERSION is added out of band. Never a value in git,
    # tf state or a log.
    secret_env:
      SPOOL_HUB_DB_DSN: csi-spl-hub-db-dsn
    # spec 014 T020: the box-wui Ed25519 PRIVATE key (contracts/wui-dispatch.md
    # section 2.1). 030 always creates the slot (empty, no version resource) and
    # injects it as SPOOL_HUB_WUI_KEY only while inject is "true": Cloud Run
    # refuses a revision whose secret has no version, so an env flips inject
    # after `./run -a do_spl_wui_key_seed` (csi-spl-orc) has added one.
    wui_key:
      inject: "false"
      secret_env:
        SPOOL_HUB_WUI_KEY: csi-spl-hub-wui-key

  # Browser sign-in (spec 010-spool-social-auth; SPEC-spool-social-auth.md).
  # The hub's internal/auth reads exactly these names; nothing is baked in Go.
  # Shaped like hub: plain values under env, Secret Manager slot ids under
  # secret_env. 030 renders env into the hub's Cloud Run env (merged with
  # hub.env) and injects from secret_env ONLY the session key plus the secret of
  # each LISTED provider (spec 010 T020): Cloud Run refuses a revision whose
  # secret has no version, so an unlisted provider's empty slot is never
  # referenced. 030 also creates every slot below, empty (T021). The owner's
  # console steps: csi-spl-doc/specs/010-spool-social-auth/idp-registration-runbook.md.
  # SPOOL_HUB_AUTH_PROVIDERS is the narrative's
  # env.auth.social.providers: "" = off (no buttons, start/callback 404). The
  # hub FAILS FAST at boot if a listed provider has an unset or PLACEHOLDER-*
  # value, so a provider is listed only after its app is registered and its
  # secret version exists (spec 010 quickstart section 3).
  auth:
    social:
      env:
        SPOOL_HUB_AUTH_PROVIDERS: ""
        # the WUI origin the callback lands on; failures land on /login?auth_error=
        SPOOL_HUB_AUTH_APP_URL: PLACEHOLDER-wui-origin
        SPOOL_HUB_AUTH_SESSION_TTL: "12h"
        SPOOL_HUB_AUTH_STATE_TTL: "15m"
        SPOOL_HUB_AUTH_COOKIE_NAME: spool_session
        # empty = host-only cookie on the callback host
        SPOOL_HUB_AUTH_COOKIE_DOMAIN: ""
        SPOOL_HUB_AUTH_COOKIE_SECURE: "true"
        # client ids are public (they appear in the IdP redirect); placeholders
        # until the apps are registered. Redirect URIs must be byte-identical
        # to the ones registered in the Google / Meta consoles.
        SPOOL_HUB_AUTH_GOOGLE_CLIENT_ID: PLACEHOLDER-google-client-id
        SPOOL_HUB_AUTH_GOOGLE_REDIRECT_URI: PLACEHOLDER-google-redirect-uri
        SPOOL_HUB_AUTH_GOOGLE_SCOPES: "openid email profile"
        SPOOL_HUB_AUTH_FACEBOOK_CLIENT_ID: PLACEHOLDER-facebook-app-id
        SPOOL_HUB_AUTH_FACEBOOK_REDIRECT_URI: PLACEHOLDER-facebook-redirect-uri
        SPOOL_HUB_AUTH_FACEBOOK_SCOPES: "email,public_profile"
        # generic OIDC providers (spec 010 FR-012). Microsoft: OQ-I1 (a) =
        # personal accounts only; another tenant needs TRUST_EMAIL (owner).
        SPOOL_HUB_AUTH_MICROSOFT_CLIENT_ID: PLACEHOLDER-microsoft-client-id
        SPOOL_HUB_AUTH_MICROSOFT_REDIRECT_URI: PLACEHOLDER-microsoft-redirect-uri
        SPOOL_HUB_AUTH_MICROSOFT_SCOPES: "openid email profile"
        SPOOL_HUB_AUTH_MICROSOFT_TENANT: consumers
        SPOOL_HUB_AUTH_MICROSOFT_TRUST_EMAIL: "false"
        SPOOL_HUB_AUTH_LINKEDIN_CLIENT_ID: PLACEHOLDER-linkedin-client-id
        SPOOL_HUB_AUTH_LINKEDIN_REDIRECT_URI: PLACEHOLDER-linkedin-redirect-uri
        SPOOL_HUB_AUTH_LINKEDIN_SCOPES: "openid profile email"
        # xAI endpoints are cnf, never Go (narrative section 1); values from
        # https://auth.x.ai/.well-known/openid-configuration (2026-09-19).
        # OQ-I2: whether xAI registers third-party clients is unknown.
        SPOOL_HUB_AUTH_XAI_CLIENT_ID: PLACEHOLDER-xai-client-id
        SPOOL_HUB_AUTH_XAI_REDIRECT_URI: PLACEHOLDER-xai-redirect-uri
        SPOOL_HUB_AUTH_XAI_SCOPES: "openid profile email"
        SPOOL_HUB_AUTH_XAI_AUTH_URL: https://auth.x.ai/oauth2/authorize
        SPOOL_HUB_AUTH_XAI_TOKEN_URL: https://auth.x.ai/oauth2/token
        SPOOL_HUB_AUTH_XAI_USERINFO_URL: https://auth.x.ai/oauth2/userinfo
      # env var -> Secret Manager secret id (cloud envs). Slots are terraform
      # (030, spec 010 T021); VERSIONS are added out of band by the owner. Never
      # a value in git, tf state or a log.
      secret_env:
        SPOOL_HUB_AUTH_SESSION_KEY: csi-spl-hub-auth-session-key
        SPOOL_HUB_AUTH_GOOGLE_CLIENT_SECRET: csi-spl-hub-auth-google-client-secret
        SPOOL_HUB_AUTH_FACEBOOK_CLIENT_SECRET: csi-spl-hub-auth-facebook-client-secret
        SPOOL_HUB_AUTH_MICROSOFT_CLIENT_SECRET: csi-spl-hub-auth-microsoft-client-secret
        SPOOL_HUB_AUTH_LINKEDIN_CLIENT_SECRET: csi-spl-hub-auth-linkedin-client-secret
        SPOOL_HUB_AUTH_XAI_CLIENT_SECRET: csi-spl-hub-auth-xai-client-secret

    # Native email + password sign-in (spec 015; internal/auth/native_config.go).
    # OFF until ENABLED=true, and ENABLED needs a real SPOOL_HUB_AUTH_SESSION_KEY
    # + SPOOL_HUB_AUTH_APP_URL (auth.social above) or the hub fails fast at
    # boot. 030 renders this env into the hub and injects the session key
    # once ENABLED is "true", even with no IdP listed.
    native:
      env:
        SPOOL_HUB_AUTH_NATIVE_ENABLED: "false"
        SPOOL_HUB_AUTH_NATIVE_VERIFY_REQUIRED: "true"
        # the hub refuses to boot with this true in prd
        SPOOL_HUB_AUTH_NATIVE_DEBUG_TOKENS: "false"
        # OQ-N6: set from one X-Forwarded-For measurement on dev
        SPOOL_HUB_AUTH_NATIVE_TRUSTED_PROXY_HOPS: "0"

  # Outbound mail for native auth (spec 015; internal/mail/config.go). SMTP
  # values are checked only when TRANSPORT=smtp; no relay exists yet (OQ-N5).
  mail:
    env:
      SPOOL_HUB_MAIL_TRANSPORT: "none"
      SPOOL_HUB_MAIL_SMTP_HOST: PLACEHOLDER-smtp-host
      # an INT in the hub (internal/mail): a placeholder string crashes the
      # boot even while the transport is none/log. 0 = unset; >0 required only for smtp.
      SPOOL_HUB_MAIL_SMTP_PORT: "0"
      SPOOL_HUB_MAIL_SMTP_USER: PLACEHOLDER-smtp-user
      # STARTTLS is REQUIRED for a real relay (the csi-rel outage was a relay
      # reached without it); the hub refuses "none" unless the host is loopback
      SPOOL_HUB_MAIL_SMTP_TLS: "starttls"
      SPOOL_HUB_MAIL_FROM: PLACEHOLDER-mail-from
      SPOOL_HUB_MAIL_FROM_NAME: PLACEHOLDER-mail-from-name
    # slot: created empty by 030 (IDP lane, with the IdP slots); version out of
    # band. Injected only while SPOOL_HUB_MAIL_TRANSPORT is "smtp".
    secret_env:
      SPOOL_HUB_MAIL_SMTP_PASSWORD: csi-spl-hub-mail-smtp-password

  # M2 payment secret (006 T022; checkout-v1 §3). 030 creates the slot empty
  # (with the auth/mail slots) and injects it only while
  # hub.env.SPOOL_HUB_PAYMENT_PROVIDER is "hosted-hmac": Cloud Run refuses a
  # revision whose secret has no version. The owner adds the version out of
  # band from the provider's merchant secret file; never git, state or a log.
  payment:
    secret_env:
      SPOOL_HUB_PAYMENT_SECRET_KEY: csi-spl-hub-payment-secret-key

  # The BOX side (spec 002): where every agent on a box keeps its mail.
  # Owner decision 2026-09-18: /var/spool-hub (the hub lane changes the code
  # default of $SPOOL_ROOT to it). csi-spl-orc do_provision_spool_root makes
  # it, and do_setup_app_inf calls that. PERMISSIONS MODEL (one box, many OS
  # users -- one per agent kind -- all of them trusted, as local mail is
  # unsigned):
  #   the dir         mode 2777: setgid (new entries inherit the group),
  #                   NOT sticky -- `recv --ack` renames a message another
  #                   user wrote, which a sticky dir forbids
  #   default ACLs    user/group/other rwx + mask rwx, on the root and every
  #                   existing subdir, so an inbox a user creates with umask
  #                   022 stays writable for every other agent user
  # This is the model the box's agent message dir already runs on. A box that
  # wants to close `other` sets spool_root_group to a group every agent user
  # is in and spool_root_other to "---" (running agents need a re-login to
  # pick up a new group, so it is not the default).
  box:
    spool_root: /var/spool-hub
    # empty = keep the dir's current group (root's, when the dir is new)
    spool_root_group: ""
    spool_root_other: rwx

