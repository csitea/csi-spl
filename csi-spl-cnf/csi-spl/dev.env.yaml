# csi-spl ::: dev environment. The single source of truth tpl-gen renders into
# csi-spl-cnf/csi-spl/dev/tf/<step>.{vars,backend-config}.tfvars.
#
# NOT in this file, by design (fail-fast env vars at run time, never baked in):
#   GCP_ORG_ID or GCP_FOLDER_ID   where the project is created
#   GCP_BILLING_ACCOUNT_ID        the billing account linked to it
#   GCP_ACCOUNT                   the identity running gcp-001
env:
  ENV: dev
  ORG: csi
  APP: spl
  ORG_APP: csi-spl

  dns:
    # The domain itself is env.dns.BASE_DOMAIN in all.env.yaml. Convention (as
    # csi-rel and pas-psf): prd serves the apex, dev serves dev.<BASE_DOMAIN>.
    # env.dns.fqdn is DERIVED by do_tpl_gen into dev.env.json.
    env_subdomain: dev
    # Tenant hosts <tenant>.<fqdn> (SPL-959, owner option B 2026-09-26: "only
    # the spool-hub should be without the subdomain"): each entry is a Firebase
    # Hosting custom domain of the WUI site (019 additional_fqdns) plus its
    # 025 records (A 199.36.158.100 + TXT hosting-site). The apex is t1, which
    # is never listed. Edited ONLY by do_spl_tenant_host_provision/deprovision
    # (flow style on one line, the action rewrites exactly this line).
    mapped_tenants: [csitea, e2e, demo]
    # Hosts that only 301-redirect to the apex (owner 2026-09-29, topic
    # e802196b: www.<fqdn> had no DNS). Each becomes a 019 Firebase custom
    # domain with redirect_target = fqdn plus its 025 A + TXT hosting-site.
    redirect_hosts: [www]

  versions:
    terraform_version: 1.9.8
    infra_version: 1.0.0
    google_provider_version: "~> 6.0"

  gcp:
    gcp_project: csi-spl-dev
    gcp_region: europe-north1
    state_bucket: csi-spl-dev-tfstate

  steps:
    000-gcp-remote-bucket:
      bucket_name: csi-spl-dev-tfstate

    # csi-rel 005-gcp-domain-verification, unchanged: Cloud Run domain mapping
    # (032) needs this env's SA to be a VERIFIED OWNER of <BASE_DOMAIN>
    # (measured 2026-09-19: neither SA was). verification_records comes from
    # ENV=<env> ./run -a do_spl_domain_verify (the siteVerification token,
    # "<source> <target>"): add it here, provision 005, then run the action
    # again with VERIFY=1. The CNAME goes into the prd apex zone (025).
    005-gcp-domain-verification:
      prd_zone_name: spool-hub
      parent_zone_project: csi-spl-prd
      # do_spl_domain_verify token for csi-spl-dev@ (2026-09-19)
      verification_records:
        - source: lcbhghjiue5q.spool-hub.ai.
          target: gv-2gbgvnbqb2z6fm.dv.googlehosted.com.

    016-firebase-deploy-iam:
      deploy_sa_account_id: csi-spl-dev-fb-deploy

    017-github-wif-deploy:
      deploy_sa_account_id: csi-spl-deploy-dev

    019-firebase-static-site:
      site_id: csi-spl-dev-site
      wui_default_tenant: "t1"
      # SPL-959 (owner option B 2026-09-26): true = the WUI binds the tenant to
      # its host (<tenant>.<fqdn>; the apex is wui_default_tenant), the switcher
      # changes host, the apex forwards old links (NUXT_PUBLIC_TENANT_HOSTS).
      # Flip together with hub.env SPOOL_HUB_WUI_TENANT_HOSTS, and only once
      # every mapped tenant host serves (do_spl_tenant_host_provision).
      wui_tenant_hosts: true

    020-gcp-relay-bucket:
      # Owner decision 2026-09-17: csi-spl-<env>-rel, and bnc-cpt-all-relay's
      # access model exactly (measured; see 03-relay-bucket.tf).
      relay_bucket_name: csi-spl-dev-rel
      relay_sa_account_id: csi-spl-rel-dev

    # The env's public Cloud DNS zone (csi-rel 007-dns flow, owner 2026-09-19).
    # prd: the apex zone, ADOPTED (import), never created (registrar NS).
    # dev: the subzone dev.<BASE_DOMAIN>, CREATED in csi-spl-dev, delegated by an
    # NS record in the prd apex zone (parent_zone_*), written on the prd key.
    # Apply prd -> dev, destroy dev -> prd.
    025-gcp-dns-zone:
      zone_name: spool-hub-dev
      zone_description: "spool hub dev subzone: created by 025-gcp-dns-zone, delegated from the prd apex zone"
      parent_zone_name: spool-hub
      parent_zone_project: csi-spl-prd
      # dev.api.<BASE_DOMAIN> is in the apex zone (prd's 025, as csi-rel); this
      # subzone only gets the tenant CNAMEs from env.dns.mapped_tenants
      cloud_run_mapping_records: []

    # The hub image registry (Docker, dev project, gcp_region). Tags are
    # immutable: hub.image.tag names exactly one image.
    028-gcp-artifact-registry:
      repository_id: csi-spl-dev-hub

    040-cloud-sql-postgres:
      instance_name: csi-spl-dev-pg
      deletion_protection: false

    045-gcs-db-backups:
      # Off-instance daily dumps of the hub DB (owner order 2026-09-20).
      # Measured 2026-09-21: the instance's OWN automated backups and PITR are
      # already on and green, so this is additive - it survives the instance
      # (NOT the project: 046 copies it out), keeps more than
      # retainedBackups=7, and is readable.
      instance_name: csi-spl-dev-pg
      backups_bucket_name: csi-spl-dev-db-backups

    046-gcs-offsite-backups:
      # The OFF-PROJECT copy of the 045 dumps and the 050 files (spec 044
      # contingency T077, owner "4. yes" 2026-09-29): a bucket in csi-spl-bkp,
      # which a destroy of csi-spl-dev does not touch. Rendered and run per env,
      # but as the csi-spl-bkp SA (do_tf_init reads tf_key_project) with its
      # state in csi-spl-bkp's own state bucket.
      tf_key_project: csi-spl-bkp
      tf_state_bucket: csi-spl-bkp-tfstate
      offsite_bucket_name: csi-spl-bkp-dev
      # the env SA: objectCreator + list names only - add, never read or delete
      writer_service_account: csi-spl-dev@csi-spl-dev.iam.gserviceaccount.com
      retention_days: 30
      max_age_days: 90
      noncurrent_max_age_days: 30
      soft_delete_retention_seconds: 2592000
      # workflow 45 copies each new dump + file here (do_spl_backup_offsite).
      # Live since 2026-09-29 (CLE-35114): the owner bootstrapped csi-spl-bkp
      # (gcp-000 ENV=bkp) and 046 is applied, so gs://csi-spl-bkp-dev exists and
      # the daily copy runs.
      copy_enabled: true

    050-gcs-files:
      # the file_id content bucket (t/<tenant>/files/<sha256>); NOT git-rel's
      # 020 relay bucket. Same hygiene as 020: private, uniform, PAP enforced.
      files_bucket_name: csi-spl-dev-files

    051-gcs-docs:
      # the Docs section's bucket: repo .md + tree.json (do_publish_docs).
      # 051 applied 2026-10-04: the deploy uploads (all.env.yaml
      # publish_enabled), the hub reads it once 030 carries SPOOL_HUB_DOCS_BUCKET.
      docs_bucket_name: csi-spl-dev-docs

    052-gcs-workspace-docs:
      # one docs bucket per workspace: csi-spl-dev-docs-<slug> (spec 075 T006).
      # The workspaces of this env on 2026-10-04: t1 (the apex) + every
      # env.dns.mapped_tenants entry.
      bucket_prefix: csi-spl-dev-docs-
      workspaces: [t1, csitea, e2e]

    053-gcs-public-dataset:
      # spec 091: the public seed bucket and its private staging (T007).
      public_bucket_name: csi-spl-dev-public-dataset
      staging_bucket_name: csi-spl-dev-public-dataset-staging

    054-gcs-blog-media:
      # spec 111 T006b: the blog's private picture bucket (apply on owner go).
      media_bucket_name: csi-spl-dev-blog-media

  # The hub, per env. The shared hub settings and THE ENV-VAR NAMES live in
  # all.env.yaml; this deep-merges over them. Derived by do_spl_merged_cnf,
  # never written here: hub.env.SPOOL_HUB_ENV, SPOOL_HUB_FILES_BUCKET (from
  # 050), SPOOL_HUB_TENANT_HOST_PATTERN (from env.dns.fqdn).
  hub:
    service_name: csi-spl-hub-dev
    runtime_sa_account_id: csi-spl-hub-dev
    # 010 T019 dev half (ORC 2026-09-19, M3-E2E-DEV OBS-2): the door is the
    # SESSION door, as prd: with it off any socket could claim a member's
    # hello.as. Member sessions only; the dev WUI origins below may call it
    # cross-origin with credentials.
    env:
      SPOOL_HUB_VIEW_DOOR: "session"
      SPOOL_HUB_VIEW_CORS_ORIGINS: https://csi-spl-dev-site.web.app,https://csi-spl-dev-site.firebaseapp.com,https://dev.spool-hub.ai
      # SPL-959 (owner option B 2026-09-26): a browser request is served as the
      # tenant its page host names (Origin https://<tenant>.<fqdn>; the apex is
      # t1), member-only, with credentialed CORS for this env's tenant hosts.
      # Paired with steps.019 wui_tenant_hosts (the WUI half).
      SPOOL_HUB_WUI_TENANT_HOSTS: "true"
      SPOOL_HUB_WUI_APEX_TENANT: "t1"
      # spec 014 (WUI dispatch, contracts/wui-dispatch.md section 1). The key
      # is the Secret Manager one (hub.wui_key below), no longer EPHEMERAL: a
      # hub restart keeps it, so tenant pins and long-lived boxes survive
      # (M3-E2E-DEV OBS-4).
      SPOOL_HUB_WUI_DISPATCH: "true"
      # 017 T029 (CLE-3421): 030 injects the DB DSN secret at `latest`, which
      # a running revision never re-reads. Bump this (the hub ignores it) to
      # make 030 start a new revision after a DSN version change, e.g.
      # do_spl_db_owner_split or its ROLLBACK=1. 1 = spool_hub_rt split.
      SPOOL_HUB_DB_DSN_EPOCH: "1"
      # spec 010 / OQ-A5 (owner call): the first sign-in of a tenant with no
      # members becomes its owner. dev on, prd default (false). Inert while
      # SPOOL_HUB_AUTH_PROVIDERS is empty.
      SPOOL_HUB_AUTH_BOOTSTRAP_OWNER: "true"
      # 006 T020 (M2): dev sells on the fake rail only until the owner's
      # provider keys exist; the hub refuses this flag on prd (checkout-v1 §0.5).
      SPOOL_HUB_ENABLE_FAKE_PAY: "true"
      SPOOL_HUB_PAYMENT_PLAN_CENTS: "2000"
      # 006 T022 (owner go 2026-09-19: reuse the csi-rel Stripe account, TEST
      # mode on dev): the card rail. Secrets in the 030 slots
      # (do_spl_provision_stripe_endpoints + do_spl_payment_secret_seed with
      # STRIPE_KEY_APP=rel); the publishable key is public (the WUI Payment
      # Element). With PROVIDER stripe the fake rail is off (Rail() = card).
      SPOOL_HUB_PAYMENT_PROVIDER: "stripe"
      SPOOL_HUB_STRIPE_PUBLISHABLE_KEY: "pk_test_51U7IozBDaSl9juxAVW13RhCFozNqrSB3bSvXa6Wun6RyphJBUg9iuYuttKKi5tZz5IyzPK2ECWSgr3GBLDcMTYrJ008YPcadw9"
      # 017 T008: the emailed single-use claim link (required with a rail)
      SPOOL_HUB_PAYMENT_CLAIM_URL: "https://dev.spool-hub.ai/checkout/claim"
      # CLE-77780 (owner 2026-09-30): the box operator creates and mails invites
      # via /v1/operator/* on the hub, so no box dials SMTP. The allow-list is
      # the env project SA the box authenticates as (its key mints a Google id
      # token); the audience is this hub's own API URL ({api_fqdn}), which the
      # box mints the token for and the hub checks. Empty allow-list = routes off.
      SPOOL_HUB_OPERATOR_EMAILS: "csi-spl-dev@csi-spl-dev.iam.gserviceaccount.com"
      SPOOL_HUB_OPERATOR_AUDIENCE: "https://dev.api.spool-hub.ai"
      # spec 099 T009 (owner HUM-10 go, t1 5901e226 msg 022f63b6): the topic
      # head read in shadow: serve the walk, run the head read on every list
      # (SPOOL_HUB_TOPIC_HEADS_SAMPLE default 1) and log any byte mismatch.
      SPOOL_HUB_TOPIC_HEADS: "shadow"
    # 014 T020/T022: csi-spl-hub-wui-key has its first version (minted
    # 2026-09-19 by do_spl_wui_key_seed), so 030 injects SPOOL_HUB_WUI_KEY
    wui_key:
      inject: "true"
    image:
      # the tag 030 runs in dev. csi-spl-orc do_build_push_hub_image builds
      # and pushes it; the registry refuses to move an existing tag, so a new
      # build means a new tag here.
      tag: "1.1.3"

  # spec 077 T023 (owner HUM-10 2026-10-05, "turn it on in both the
  # development and production environments"): the demo is ON in dev.
  demo:
    enabled: true

  # spec 075 repo-edit 6.2: dev writes master too, so its env cap is lower.
  # T13 (owner HUM-10 2026-10-07, "Switch it on both mobile and desktop."):
  # the App key has a version in dev, so it is injected and editing is ON.
  docs:
    repo_edit:
      enabled: true
      inject: "true"
      rate_env_per_day: 50

  # Browser sign-in (spec 010): the dev values over all.env.yaml auth.social.
  # Google is ON (SPOOL_HUB_AUTH_PROVIDERS below). The WUI (https://<env.dns.fqdn>)
  # calls the hub's API host (env.dns.api_fqdn) CROSS-ORIGIN; the OAuth
  # callback stays on the WUI host, which the Google client authorises and
  # Firebase Hosting rewrites to the hub (as csi-rel; owner 2026-09-19: no
  # console change). spec 010 FR-010, T051.
  auth:
    social:
      env:
        # APP_URL (https://<env.dns.fqdn>, the WUI) and every <P>_REDIRECT_URI
        # (<APP_URL>/api/v1/auth/<p>/callback) are DERIVED by do_spl_merged_cnf
        # (spec 010 T022, T051): never a literal host here.
        # The session cookie must reach the API host AND every tenant host, and
        # both are only under the registrable domain (dev: dev.api.<base> is not
        # under dev.<base>), so Domain=<BASE_DOMAIN> (OQ-A1 (a), OQ-A2).
        # Trade-off (OQ-A4): the dev and prd cookies now reach each other's
        # hosts; the distinct names keep them apart, and neither hub can verify
        # the other's (different session keys). The OAuth state cookie stays
        # host-only on the API host.
        SPOOL_HUB_AUTH_COOKIE_DOMAIN: "{base_domain}"
        # T056: the callback reaches the hub through the Firebase rewrite on the
        # WUI host, which forwards only the "__session" request cookie. Only the
        # STATE cookie takes that name (the session keeps its own, read on the
        # API host). dev and prd share it on Domain=<base>: starting sign-in on
        # both envs within the state TTL costs one invalid_state. Accepted.
        SPOOL_HUB_AUTH_STATE_COOKIE_NAME: __session
        # OQ-A4: the prd apex cookie also reaches dev hosts; a distinct name keeps
        # the two from shadowing each other there
        SPOOL_HUB_AUTH_COOKIE_NAME: spool_session_dev
        # spec 010 T030: the owner's Google OAuth Web client (public id; its secret
        # goes to csi-spl-hub-auth-google-client-secret via do_spl_auth_secrets_seed).
        SPOOL_HUB_AUTH_GOOGLE_CLIENT_ID: 436311356630-srfr43efrcnpt2r62vabjgnlcaovlp1f.apps.googleusercontent.com
        # spec 049: the owner's Meta app "spool-hub" (App ID is public; the App Secret
        # goes to csi-spl-hub-auth-facebook-client-secret via do_spl_auth_idp_secret_seed).
        SPOOL_HUB_AUTH_FACEBOOK_CLIENT_ID: "913022908351919"
        # spec 019: the LinkedIn app "Spool Hub" (one app for dev and prd, OQ-L1 (b);
        # record: specs/090-marketing-automation/linkedin-app-setup.md). The Client ID
        # is public; the secret goes to csi-spl-hub-auth-linkedin-client-secret via
        # do_spl_auth_idp_secret_seed. Listed in SPOOL_HUB_AUTH_PROVIDERS only once
        # that slot has a version (Cloud Run refuses a version-less secret).
        SPOOL_HUB_AUTH_LINKEDIN_CLIENT_ID: "77sza3iug33kc2"
        # LIVE (owner go 2026-09-19): the session-key + google secret versions
        # exist in this project, so 030 injects both. linkedin (spec 019, owner go
        # 2026-10-05): csi-spl-hub-auth-linkedin-client-secret version 1 exists.
        SPOOL_HUB_AUTH_PROVIDERS: google,facebook,linkedin
    # spec 015 native sign-in: ON in dev (030 renders auth.native + mail since
    # eccb5a1, and csi-spl-hub-auth-session-key has a version). DEBUG_TOKENS
    # returns the verify/reset token in the response until a mail relay exists
    # (the hub refuses it outside dev). prd stays OFF (OQ-N1).
    native:
      env:
        SPOOL_HUB_AUTH_NATIVE_ENABLED: "true"
        SPOOL_HUB_AUTH_NATIVE_DEBUG_TOKENS: "true"

  # dev relay = prd's (owner 2026-09-19 "to both the environments", 010
  # FR-016 / CLE-3411): csi-rel's smtp.gmail.com:587, STARTTLS, the Csitea
  # Workspace system mailbox, From its +noreply alias. The dev slot
  # csi-spl-hub-mail-smtp-password was seeded by do_gcp_copy_secret from
  # csi-rel-prd as the dev SA (sha256-verified, 2026-09-19T16:49Z). Native
  # DEBUG_TOKENS above still answer on dev; the mails now also arrive.
  mail:
    env:
      SPOOL_HUB_MAIL_TRANSPORT: "smtp"
      SPOOL_HUB_MAIL_SMTP_HOST: smtp.gmail.com
      SPOOL_HUB_MAIL_SMTP_PORT: "587"
      SPOOL_HUB_MAIL_SMTP_TLS: "starttls"
      SPOOL_HUB_MAIL_SMTP_USER: sys@csitea.net
      SPOOL_HUB_MAIL_FROM: sys+noreply-spool@csitea.net
      SPOOL_HUB_MAIL_FROM_NAME: SPOOL-HUB.AI NO-REPLY
  # 006 T021w: dev's hub runs the card rail (hub.env PROVIDER stripe), so the
  # WUI CSP admits the card vendor's SDK, iframes and API (the vendor's
  # published CSP list); prd stays empty until prd sells on the card rail.
  payment:
    wui_csp:
      script: ["https://js.stripe.com", "https://*.js.stripe.com"]
      frame: ["https://js.stripe.com", "https://*.js.stripe.com", "https://hooks.stripe.com"]
      connect: ["https://api.stripe.com"]
  # spec 066 (perceived-performance metrics): the WUI real-user timing
  # collector. rum_enabled bakes NUXT_PUBLIC_PERF_RUM into the build
  # (wf30); dev collects now. sample_rate (0..1) is the share of sessions that
  # collect: 1.0 = 100 % (spec 066 section 4, owner Q5).
  # spec 090 phase 1: on for t1 (the apex) and the dev spool workspace.
  # linkedin.inject stays "false" on dev (HOLD, owner 5cd2e544: no posting
  # on the company's behalf from dev) until the owner answers in f0c3927e.
  marketing:
    workspaces: [t1, spool]
    linkedin:
      inject: "false"
  # spec 091 (T002): the workspace exported as the public seed, measured from
  # the live tenants row (do_spl_db_query, 2026-10-05), and the channel of the
  # dataset topic, never exported. enabled stays all.env.yaml's false.
  public_dataset:
    workspace_id: t1
    topic_channel: spool-hub-ops
  perf:
    rum_enabled: true
    sample_rate: 1.0
