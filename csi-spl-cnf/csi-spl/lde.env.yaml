# csi-spl ::: lde environment -- the LOCAL developer stack. Like csi-rel's
# lde.env.yaml: no GCP project, no terraform, no tfvars. Consumed only by
# csi-spl-orc (do_gen_docker_env / do_setup_app_inf), which deep-merges
# all.env.yaml under this file exactly as do_tpl_gen does for dev/prd.
#
# The Postgres password below is a throwaway for a container that publishes
# on 127.0.0.1 only -- the csi-rel lde pattern. It is NOT a secret and is
# never valid anywhere else; cloud DSNs live in Secret Manager (hub.secret_env).
env:
  ENV: lde
  ORG: csi
  APP: spl
  ORG_APP: csi-spl

  dns:
    # nothing is served under the domain in lde: tenants are <tenant>.localhost
    env_subdomain: lde

  # The local stack (csi-spl-orc/src/docker). Host ports are published on
  # 127.0.0.1 only and chosen off the defaults (5432/4443/8080), so the stack
  # coexists with other projects' containers on a shared box.
  lde:
    compose_project: csi-spl-lde
    pg:
      image: postgres:16-alpine
      host_port: 55432
      db: spool
      user: spool
      password: spool_lde_pw
    gcs:
      image: fsouza/fake-gcs-server:1.52.2
      host_port: 54443
    wui:
      host_port: 3000
    hub:
      host_port: 58080
      # repo-relative: the csi-spl-rdb DDL the lde image bundles at
      # hub.env.SPOOL_HUB_MIGRATIONS_DIR for `spool migrate`
      sql_src: csi-spl-rdb/src/sql/postgres/spool-hub
    # the tenant do_setup_app_inf smokes against: SPOOL_HUB_URL is
    # http://<smoke_tenant>.localhost:<hub.host_port>
    smoke_tenant: t1
    # Opt-in switches for the local stack, all OFF by default. Each has an
    # env override read by do_lde_cnf (1/0 or true/false), so a developer
    # flips one without editing this file:
    #   auth_native     LDE_AUTH_NATIVE=1     spec 015 email + password; mail
    #                                         transport "log", debug tokens in
    #                                         the response body (no inbox)
    #   auth_providers  LDE_AUTH_PROVIDERS=google,...  spec 010 social; the
    #                                         client id + secret per provider
    #                                         come from the caller's env
    #                                         (SPOOL_HUB_AUTH_<P>_CLIENT_ID /
    #                                         _CLIENT_SECRET), never from cnf;
    #                                         SPOOL_HUB_AUTH_IDP_BASE_URL too
    #                                         for a fake IdP
    #   wui_dispatch    LDE_WUI_DISPATCH=1    spec 014: an ephemeral box-wui
    #                                         key (new on every hub start) and
    #                                         dispatch on; pin it per tenant
    #                                         with ./run -a do_spl_pin_box_wui
    # Any auth switch also gets a per-tree session key, generated into the
    # state dir (never in git). do_gen_docker_env renders them into hub.env.
    switches:
      auth_native: false
      auth_providers: ""
      wui_dispatch: false

  # The hub env names are published in all.env.yaml; lde overrides values
  # and sets the two the cloud gets from elsewhere (DSN, emulator).
  hub:
    env:
      SPOOL_HUB_ENV: lde
      # compose service names (pg, gcs), not host ports: the hub runs in the
      # compose network
      SPOOL_HUB_DB_DSN: postgres://spool:spool_lde_pw@pg:5432/spool?sslmode=disable
      SPOOL_HUB_FILES_BUCKET: csi-spl-lde-files
      # the standard cloud.google.com/go/storage emulator variable
      STORAGE_EMULATOR_HOST: gcs:4443
      SPOOL_HUB_TENANT_HOST_PATTERN: "{tenant}.localhost"
      SPOOL_HUB_LOG_LEVEL: debug
      SPOOL_HUB_LOG_FORMAT: console
      # 003 view-v1 §2 / wui-live-ws.md §2: lde reads and the browser live
      # socket are open (the hub refuses "off" outside lde/dev); the WUI dev
      # server is the one allowed cross-origin caller.
      SPOOL_HUB_VIEW_DOOR: "off"
      SPOOL_HUB_VIEW_CORS_ORIGINS: "http://localhost:3000"
      # 077 fake-pay so tenant activate works without a live rail (lde only;
      # the hub forces this off when SPOOL_HUB_ENV=prd).
      SPOOL_HUB_ENABLE_FAKE_PAY: "true"
      SPOOL_HUB_PAYMENT_PLAN_CENTS: "2000"
      SPOOL_HUB_PAYMENT_PUBLIC_SCHEME: "http"
      # 017 T008: the emailed single-use claim link opens the lde WUI
      SPOOL_HUB_PAYMENT_CLAIM_URL: "http://localhost:3000/checkout/claim"

  # Browser sign-in (spec 010 / 015) in lde. do_gen_docker_env renders
  # env.auth.social.env, env.auth.native.env and env.mail.env into hub.env
  # (a PLACEHOLDER value is dropped, never rendered), then applies the
  # env.lde.switches above. {lde_wui_port} / {lde_hub_port} are replaced by
  # this tree's ports (LDE_WUI_PORT / LDE_HUB_PORT win over cnf). Auth rides
  # the WUI origin: the WUI dev server proxies /api/v1/auth/** to the hub
  # (NUXT_DEV_AUTH_PROXY), so the callback and the cookie live on
  # http://localhost:<wui port>. http and a non-Secure cookie are lde-only.
  auth:
    social:
      env:
        SPOOL_HUB_AUTH_APP_URL: "http://localhost:{lde_wui_port}"
        SPOOL_HUB_AUTH_COOKIE_SECURE: "false"
        SPOOL_HUB_AUTH_GOOGLE_REDIRECT_URI: "http://localhost:{lde_wui_port}/api/v1/auth/google/callback"
        SPOOL_HUB_AUTH_FACEBOOK_REDIRECT_URI: "http://localhost:{lde_wui_port}/api/v1/auth/facebook/callback"
        SPOOL_HUB_AUTH_MICROSOFT_REDIRECT_URI: "http://localhost:{lde_wui_port}/api/v1/auth/microsoft/callback"
        SPOOL_HUB_AUTH_LINKEDIN_REDIRECT_URI: "http://localhost:{lde_wui_port}/api/v1/auth/linkedin/callback"
        SPOOL_HUB_AUTH_XAI_REDIRECT_URI: "http://localhost:{lde_wui_port}/api/v1/auth/xai/callback"
    native:
      env:
        # ENABLED stays "false" here: the auth_native switch turns it on.
        # Debug tokens: register / forgot return the token in the body, so a
        # verify round trip needs no mailbox (the hub refuses this in prd).
        SPOOL_HUB_AUTH_NATIVE_DEBUG_TOKENS: "true"

  # lde mail: the hub logs the message instead of sending it (no relay).
  mail:
    env:
      SPOOL_HUB_MAIL_TRANSPORT: "log"
