# csi-spl ::: prd environment. The single source of truth tpl-gen renders into
# csi-spl-cnf/csi-spl/prd/tf/<step>.{vars,backend-config}.tfvars.
#
# NOT in this file, by design (fail-fast env vars at run time, never baked in):
#   GCP_ORG_ID or GCP_FOLDER_ID   where the project is created
#   GCP_BILLING_ACCOUNT_ID        the billing account linked to it
#   GCP_ACCOUNT                   the identity running gcp-001
env:
  ENV: prd
  ORG: csi
  APP: spl
  ORG_APP: csi-spl

  versions:
    terraform_version: 1.9.8
    google_provider_version: "~> 6.0"

  gcp:
    gcp_project: csi-spl-prd
    gcp_region: europe-north1
    state_bucket: csi-spl-prd-tfstate

  steps:
    000-gcp-remote-bucket:
      bucket_name: csi-spl-prd-tfstate

    001-enable-gcp-services:
      gcp_services:
        - storage.googleapis.com
        - iam.googleapis.com

    020-gcp-relay-bucket:
      # Owner decision 2026-09-17: csi-spl-<env>-rel, and bnc-cpt-all-relay's
      # access model exactly (measured; see 03-relay-bucket.tf).
      relay_bucket_name: csi-spl-prd-rel
      # 0 = no lifecycle rule, as MEASURED on bnc-cpt-all-relay. git-rel's
      # doc promises 1 day. OPEN QUESTION to the owner; not changed silently.
      object_max_age_days: 0
      soft_delete_retention_seconds: 604800
      relay_sa_account_id: csi-spl-rel-prd
