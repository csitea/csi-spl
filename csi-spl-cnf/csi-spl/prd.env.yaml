# csi-spl ::: prd environment. The single source of truth tpl-gen renders into
# csi-spl-cnf/csi-spl/prd/tf/<step>.{vars,backend-config}.tfvars.
#
# NOT in this file, by design (fail-fast env vars at run time, never baked in):
#   GCP_ORG_ID or GCP_FOLDER_ID   where the project is created
#   GCP_BILLING_ACCOUNT_ID        the billing account linked to it
#   GCP_ACCOUNT                   the identity running gcp-001
env:
  ENV: prd
  ORG: csi
  APP: spl
  ORG_APP: csi-spl

  dns:
    # The domain itself is env.dns.BASE_DOMAIN in all.env.yaml. Convention (as
    # csi-rel and pas-psf): prd serves the apex, dev serves dev.<BASE_DOMAIN>.
    # env.dns.fqdn is DERIVED by do_tpl_gen into prd.env.json. Config only: no
    # verification, DNS record or mapping exists or is planned yet.
    env_subdomain: ""

  versions:
    terraform_version: 1.9.8
    infra_version: 1.0.0
    google_provider_version: "~> 6.0"

  gcp:
    gcp_project: csi-spl-prd
    gcp_region: europe-north1
    state_bucket: csi-spl-prd-tfstate

  steps:
    000-gcp-remote-bucket:
      bucket_name: csi-spl-prd-tfstate

    001-enable-gcp-services:
      gcp_services:
        - storage.googleapis.com
        - iam.googleapis.com
        # the project-level reset of iam.disableServiceAccountKeyCreation (doc 6.3)
        - orgpolicy.googleapis.com
        # the hub (spec 007 T004): Cloud Run, Cloud SQL, its DSN secret, and
        # the image registry + product DNS the next steps need
        - run.googleapis.com
        - sqladmin.googleapis.com
        - secretmanager.googleapis.com
        - artifactregistry.googleapis.com
        - dns.googleapis.com
        # 031 hub ingress: the load balancer + Cloud Armor (compute) and the
        # wildcard certificate (certificatemanager)
        - compute.googleapis.com
        - certificatemanager.googleapis.com
        # 017 CI deploy identity: WIF token exchange + SA impersonation
        - iamcredentials.googleapis.com
        - sts.googleapis.com
        - firebase.googleapis.com
        - firebasehosting.googleapis.com

    016-firebase-deploy-iam:
      deploy_sa_account_id: csi-spl-prd-fb-deploy
      deploy_roles:
        - roles/firebasehosting.admin
        - roles/serviceusage.serviceUsageConsumer
        - roles/run.viewer
      # true once 017 is applied in this env: its trunk principal set may then
      # impersonate this SA from 30_wui-build-deploy.yml (spec 007 T073)
      bind_github_wif: false

    017-github-wif-deploy:
      # GitHub Actions -> GCP keyless auth (Workload Identity Federation).
      # Spec 007 T007: CI deploy identity. Pool + provider trust
      # github_repository OIDC tokens; IAM binding lets those tokens
      # impersonate deploy_sa_email. No SA JSON key (forbidden in this repo).
      # The step CREATES the deploy SA (deploy_sa_account_id) and grants it
      # only what 20_hub-build-deploy.yml does: writer on the 028 repository,
      # run.developer on the 030 service, actAs the hub runtime SA. Applies
      # after 028 and 030. Apply needs owner go.
      github_repository: csitea/csi-spl
      # the trunk: the ONLY ref whose runs may impersonate the deploy SA
      github_ref: refs/heads/master
      pool_id: github-actions
      provider_id: github
      deploy_sa_account_id: csi-spl-deploy-prd

    019-firebase-static-site:
      site_id: csi-spl-prd-site
      cert_preference: GROUPED
      wait_dns_verification: false
      additional_fqdns: []
      # false: the product hosts stay on the 031 LB, which sends non-hub paths to
      # <site_id>.web.app (spec 007 §3, T072); no Firebase custom domain
      bind_custom_domain: false
      # 30_wui-build-deploy.yml deploys this env only when true (the site must exist: 019 applied)
      wui_deploy: false
      # NUXT_PUBLIC_TENANT baked by 30_wui-build-deploy.yml ("" = pick via ?tenant=)
      wui_default_tenant: ""

    020-gcp-relay-bucket:
      # Owner decision 2026-09-17: csi-spl-<env>-rel, and bnc-cpt-all-relay's
      # access model exactly (measured; see 03-relay-bucket.tf).
      relay_bucket_name: csi-spl-prd-rel
      # bnc-cpt-all-relay had NO lifecycle rule (measured); 1 day is the one
      # deliberate difference, owner-decided 2026-09-18 (8df4516, spec 001 FR-002).
      object_max_age_days: 1
      soft_delete_retention_seconds: 604800
      relay_sa_account_id: csi-spl-rel-prd

    # The env's public Cloud DNS zone (csi-rel 007-dns flow, owner 2026-09-19).
    # prd: the apex zone, ADOPTED (import), never created (registrar NS).
    # dev: the subzone dev.<BASE_DOMAIN>, CREATED in csi-spl-dev, delegated by an
    # NS record in the prd apex zone (parent_zone_*), written on the prd key.
    # Apply prd -> dev, destroy dev -> prd.
    025-gcp-dns-zone:
      zone_name: spool-hub
      zone_description: "spool hub public zone: adopted by 025-gcp-dns-zone, never recreate (registrar NS)"
      parent_zone_name: ""
      parent_zone_project: ""

    # The hub image registry (Docker, prd project, gcp_region). Tags are
    # immutable: hub.image.tag names exactly one image.
    028-gcp-artifact-registry:
      repository_id: csi-spl-prd-hub
      immutable_tags: true
      untagged_max_age_days: 7

    # The hub's service. Name, sizing, runtime SA and env: the hub block
    # below + all.env.yaml. The Cloud SQL instance (040) and the files bucket
    # (050) are read from those steps at render time, not repeated here.
    030-cloud-run-hub:
      # The image is NOT set here: 030 runs hub.image.ref, derived from 028
      # + hub.image (see the hub block below). Terraform owns it: to deploy,
      # bump hub.image.tag, re-render, do_build_push_hub_image, plan + apply.
      health_path: /healthz
      # boxes authenticate with their Ed25519 key on WS hello, not GCP IAM
      # (OQ-06): invoker allUsers, but ingress (hub.cloud_run.ingress) only
      # lets the allowlisted load balancer reach it in M1.
      allow_unauthenticated: true

    # The hub's front door (M1, owner 2026-09-18): global external HTTPS load
    # balancer -> serverless NEG -> 030, a wildcard certificate for
    # <env.dns.fqdn> + *.<env.dns.fqdn> (Certificate Manager, DNS-authorized)
    # and a Cloud Armor IP ALLOWLIST: only these CIDRs reach the hub, the rest
    # get 403. Empty = nobody. The fqdn and the service are read from env.dns /
    # hub at render time, not repeated here.
    031-gcp-hub-ingress:
      # TEMPORARY, M1 verification only (owner 2026-09-18): open to everyone.
      # Tighten to the real CIDRs before M2 / production traffic.
      allowed_ip_ranges: ["0.0.0.0/0"]
      # extra hub hosts <label>.<BASE_DOMAIN> (each gets its own cert + records)
      # OWNER CALL (spec 007 OQ-H1, OQ-H2): prd stays hub-only and un-narrowed until
      # the owner says so; the ready-to-apply values are csi-spl-prd-site.web.app
      # and true (spec 007 §4, T076)
      wui_origin_host: ""
      l7_narrowing: false
      # the paths the hub serves: hub_paths stay on the hub when wui_origin_host
      # is set (URL-map path_rule syntax; /v1/ws and /v1/wui/ws are under /v1/*),
      # hub_path_regex (RE2 over request.path) is what l7_narrowing lets through
      hub_paths: ["/v1/*", "/api/*", "/healthz", "/version"]
      hub_path_regex: "^/(v1/|api/v1/|healthz$|version$)"
      extra_host_labels: ["api"]
      # the Cloud DNS zone that serves env.dns.fqdn (025's zone of this env),
      # in dns_zone_project ("" = this env's project); an empty zone = none,
      # and the step's dns_records_to_create output lists the records to add
      # by hand. extra_dns_*: where the extra_host_labels records go when they
      # sit outside env.dns.fqdn (dev: dev.api.<BASE_DOMAIN> is in the prd apex
      # zone, written on the prd key); "" = dns_managed_zone
      dns_managed_zone: spool-hub
      dns_zone_project: ""
      extra_dns_managed_zone: ""
      extra_dns_zone_project: ""

    040-cloud-sql-postgres:
      instance_name: csi-spl-prd-pg
      database_version: POSTGRES_16
      tier: db-f1-micro
      availability_type: ZONAL
      disk_size_gb: 10
      database_name: spool
      deletion_protection: true
      backup_enabled: true

    050-gcs-files:
      # the file_id content bucket (t/<tenant>/files/<sha256>); NOT git-rel's
      # 020 relay bucket. Same hygiene as 020: private, uniform, PAP enforced.
      files_bucket_name: csi-spl-prd-files
      soft_delete_retention_seconds: 604800
      # 0 = no lifecycle rule: the hub's retention (hub.env) deletes files, a
      # bucket rule could delete a file a retained message still names.
      object_max_age_days: 0

    120-github-general-secrets:
      # GitHub Actions secret GCP_KEY_CSI_SPL_<ENV> = this env's project SA key
      # (gcp-002, ~/.gcp/.csi/key-csi-spl-<env>.json), published by `gh secret
      # set` from the key file; terraform state holds only its sha256.
      gh_repo: csitea/csi-spl

  # The hub, per env. The shared hub settings and THE ENV-VAR NAMES live in
  # all.env.yaml; this deep-merges over them. Derived by do_spl_merged_cnf,
  # never written here: hub.env.SPOOL_HUB_ENV, SPOOL_HUB_FILES_BUCKET (from
  # 050), SPOOL_HUB_TENANT_HOST_PATTERN (from env.dns.fqdn).
  hub:
    service_name: csi-spl-hub-prd
    runtime_sa_account_id: csi-spl-hub-prd
    # Owner decisions 2026-09-19 (PRD-ROLLOUT, CLE-3373): the prd WUI is served
    # from the apex with the SESSION door (010 T019 prd half; the 003 OQ-16
    # view token is superseded). Only member sessions read; every refusal is
    # 401 view_door. CORS: the apex origin, credentialed. No bootstrap owner in
    # prd (010 OQ-A5): the first owner is seated by `spool hub-invite`.
    env:
      SPOOL_HUB_VIEW_DOOR: "session"
      SPOOL_HUB_VIEW_CORS_ORIGINS: https://spool-hub.ai
      SPOOL_HUB_AUTH_BOOTSTRAP_OWNER: "false"
      # spec 014: ON (owner 2026-09-19: after the dev end to end passed; ORC
      # relayed M3-E2E-DEV PASS 12:32Z). Preconditions met first: the Secret
      # Manager box-wui key (wui_key below) and t1's box-wui pin.
      SPOOL_HUB_WUI_DISPATCH: "true"
    # 014 T020/T022: csi-spl-hub-wui-key has its first version (minted
    # 2026-09-19 by do_spl_wui_key_seed), so 030 injects SPOOL_HUB_WUI_KEY
    wui_key:
      inject: "true"
    image:
      # the tag 030 runs in prd. csi-spl-orc do_build_push_hub_image builds
      # and pushes it; the registry refuses to move an existing tag, so a new
      # build means a new tag here.
      tag: "0.1.6"

  # Browser sign-in (spec 010): the prd values over all.env.yaml auth.social.
  # Google is ON (SPOOL_HUB_AUTH_PROVIDERS below). The WUI (https://<env.dns.fqdn>)
  # calls the hub's API host (env.dns.api_fqdn) CROSS-ORIGIN, so the callback
  # host is the API host (spec 010 FR-010 as superseded 2026-09-19, T051).
  auth:
    social:
      env:
        # APP_URL (https://<env.dns.fqdn>, the WUI) and every <P>_REDIRECT_URI
        # (https://<env.dns.api_fqdn>/api/v1/auth/<p>/callback) are DERIVED by
        # do_spl_merged_cnf (spec 010 T022, T051): never a literal host here.
        # The session cookie must reach the API host AND every tenant host, and
        # both are only under the registrable domain (dev: dev.api.<base> is not
        # under dev.<base>), so Domain=<BASE_DOMAIN> (OQ-A1 (a), OQ-A2).
        # Trade-off (OQ-A4): the dev and prd cookies now reach each other's
        # hosts; the distinct names keep them apart, and neither hub can verify
        # the other's (different session keys). The OAuth state cookie stays
        # host-only on the API host.
        SPOOL_HUB_AUTH_COOKIE_DOMAIN: "{base_domain}"
        # spec 010 T030: the owner's Google OAuth Web client (public id; its secret
        # goes to csi-spl-hub-auth-google-client-secret via do_spl_auth_secrets_seed).
        SPOOL_HUB_AUTH_GOOGLE_CLIENT_ID: 351721145894-tlpratlmuevu86jfmckhji06h0f7dc2b.apps.googleusercontent.com
        # LIVE (owner go 2026-09-19): the session-key + google secret versions
        # exist in this project, so 030 injects both.
        SPOOL_HUB_AUTH_PROVIDERS: google
    # spec 015 native sign-in (T015, owner 2026-09-19: ON in prd via the Gmail
    # Workspace relay, like csi-rel). The SMTP password version exists (the
    # csi-rel app password, copied by owner go 2026-09-19), so ENABLED and mail
    # TRANSPORT "smtp" flip together. DEBUG_TOKENS stays false (the hub refuses
    # it in prd).
    native:
      env:
        SPOOL_HUB_AUTH_NATIVE_ENABLED: "true"

  # The relay (spec 015 OQ-N5): csi-rel's exactly -- smtp.gmail.com:587,
  # STARTTLS required, login = the Csitea Workspace system mailbox with a Gmail
  # app password (Secret Manager csi-spl-hub-mail-smtp-password = a copy of
  # csi-rel's, owner go 2026-09-19), From = its +noreply alias.
  mail:
    env:
      SPOOL_HUB_MAIL_TRANSPORT: "smtp"
      SPOOL_HUB_MAIL_SMTP_HOST: smtp.gmail.com
      SPOOL_HUB_MAIL_SMTP_PORT: "587"
      SPOOL_HUB_MAIL_SMTP_TLS: "starttls"
      SPOOL_HUB_MAIL_SMTP_USER: sys@csitea.net
      SPOOL_HUB_MAIL_FROM: sys+noreply-spool@csitea.net
      SPOOL_HUB_MAIL_FROM_NAME: SPOOL-HUB.AI NO-REPLY
