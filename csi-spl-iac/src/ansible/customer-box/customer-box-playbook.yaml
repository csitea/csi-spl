---
# The customer box role set (spec 181 row B6, spec 122 4 point 4): the setup
# of a private workspace's own VM. One play, numbered roles, idempotent.
# What it never puts on the VM (spec 181 4.2, Q-3 A): an estate key, a
# GitHub token or an AI login of ours. The customer's agents sign in with the
# customer's own keys (spec 127, Agent keys) after this play. We hold root for
# upkeep only; no fleet lane and no other workspace runs here.
# The gate: cd csi-spl-iac && ./run -a do_spl_customer_box_role_check, and its
# test src/bash/tests/customer-box-role-set.tst.sh. Not wired to a terraform
# step yet: the per-workspace VM step is row B5, the provisioning action B8.
# Every per-VM value comes from the inventory (customer-box.inventory.example.ini),
# never from this play: tenant_id, and repo_url / repo_dir rendered from the
# cnf (env.wui.repo_clone_url) by the provisioning action.
- name: The customer box - hardening, the harness repo, the workspace, the desk start checks
  hosts: customer_box
  become: true

  pre_tasks:
    - name: Refuse a VM without its workspace slug, repo URL or repo dir
      ansible.builtin.assert:
        that:
          - tenant_id is defined and tenant_id is match('^[a-z0-9][a-z0-9-]{0,31}$')
          - repo_url is defined and repo_url is match('^https://')
          - repo_dir is defined and repo_dir is match('^/.+')
        fail_msg: "set tenant_id (the workspace slug), repo_url (cnf env.wui.repo_clone_url) and repo_dir for this VM in the inventory"
      tags: [always]

  roles:
    - { role: 01_box_hardening, tags: [01_box_hardening] }
    - { role: 02_spool_harness, tags: [02_spool_harness] }
    - { role: 03_workspace, tags: [03_workspace] }
    - { role: 04_desk_start_checks, tags: [04_desk_start_checks] }
