---
# 02 the OS binaries (eli-vta 01_os_binaries): the Debian packages the box
# PC's agents run, docker, and the Google Cloud CLI from Google's apt repo.
# Port of satellite-box-setup.sh role_03_os_packages; cnf/satellite-replica.tsv
# names each tool do_satellite_verify compares with the box PC.
- name: Debian packages
  ansible.builtin.apt:
    name:
      - tmux
      - git
      - curl
      - wget
      - ca-certificates
      - gnupg
      - jq
      - python3
      - python3-venv
      - perl
      - util-linux
      - rsync
      - acl
      - sudo
      - make
      - unzip
      - zip
      - build-essential
      - docker.io
      - docker-compose
      - nodejs
      - npm
      - gh
      - htop
      # do_require_bin psql (43 csi-spl actions) and pandoc (2), for the box
      # user that runs them (CLE-77911)
      - postgresql-client
      - pandoc
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: The Google Cloud apt key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor --yes -o /usr/share/keyrings/cloud.google.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/cloud.google.gpg

- name: The Google Cloud apt repo
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main
    filename: google-cloud-sdk
    state: present

- name: The Google Cloud CLI
  ansible.builtin.apt:
    name: google-cloud-cli
    state: present

- name: "Go {{ go_version }} in /usr/local/go (go.dev tarball, sha256-pinned; as on the box PC)"
  ansible.builtin.shell: |
    set -uo pipefail
    [ "$(/usr/local/go/bin/go env GOVERSION 2>/dev/null)" = "go$VER" ] && { echo "OK go$VER"; exit 0; }
    t=$(mktemp -d) && trap 'rm -rf "$t"' EXIT
    curl -fsSL --retry 3 -o "$t/go.tgz" "https://go.dev/dl/go$VER.linux-amd64.tar.gz" || { echo "FAIL download go$VER"; exit 1; }
    [ "$(sha256sum "$t/go.tgz" | cut -d' ' -f1)" = "$SUM" ] || { echo "FAIL go$VER sha256 mismatch"; exit 1; }
    rm -rf /usr/local/go && tar -C /usr/local -xzf "$t/go.tgz" && echo "CHANGED go$VER"
  args:
    executable: /bin/bash
  environment:
    VER: "{{ go_version }}"
    SUM: "{{ go_sha256 }}"
  register: go_out
  changed_when: "'CHANGED' in go_out.stdout"

- name: "yq {{ yq_version }} in /usr/local/bin (GitHub release, sha256-pinned; as on the box PC)"
  ansible.builtin.shell: |
    set -uo pipefail
    [ "$(/usr/local/bin/yq --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" = "$VER" ] && { echo "OK yq $VER"; exit 0; }
    t=$(mktemp -d) && trap 'rm -rf "$t"' EXIT
    curl -fsSL --retry 3 -o "$t/yq" "https://github.com/mikefarah/yq/releases/download/v$VER/yq_linux_amd64" || { echo "FAIL download yq $VER"; exit 1; }
    [ "$(sha256sum "$t/yq" | cut -d' ' -f1)" = "$SUM" ] || { echo "FAIL yq $VER sha256 mismatch"; exit 1; }
    install -m 0755 "$t/yq" /usr/local/bin/yq && echo "CHANGED yq $VER"
  args:
    executable: /bin/bash
  environment:
    VER: "{{ yq_version }}"
    SUM: "{{ yq_sha256 }}"
  register: yq_out
  changed_when: "'CHANGED' in yq_out.stdout"

- name: Go on every login PATH (/usr/local/go/bin, ~/go/bin)
  ansible.builtin.copy:
    dest: /etc/profile.d/go.sh
    content: |
      # written by box-playbook.yaml role 02_os_binaries; do not edit
      case ":$PATH:" in *":/usr/local/go/bin:"*) ;; *) export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH" ;; esac
    mode: "0644"

- name: Go on interactive non-login shells too
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} csi-spl satellite go (box-playbook.yaml 02)"
    block: |
      [ -r /etc/profile.d/go.sh ] && . /etc/profile.d/go.sh

- name: Docker runs
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
