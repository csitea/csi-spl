---
# 05 the users, as on the box PC: the OWNER (tmux, the UI, the worktrees) and
# the AGENT (every AI CLI; CLAUDE.md "Claude Code instances start as" it).
# Their names are csi-spl cnf (spec 069 Y8): steps.060-gcp-vm-satellite
# box_owner_user / box_agent_user of csi-spl-cnf/csi-spl/<env>.env.yaml, read
# here from the rendered <env>.env.json on the controller (proj_path is
# csi-spl-iac in the tf-runner, the cnf is its sibling). Nothing is cloned
# from ysg-box. Homes live on the data disk (home_root), so they survive a
# VM rebuild that keeps it.
# Sudo as on the box PC: NOPASSWD:ALL, one /etc/sudoers.d file each, visudo
# checked. The agent is in the owner's group (the shared worktrees), both in
# docker and spool-agents; both linger (tmux and agents outlive ssh).
# The GCE login user (os_user) stays the ssh/ansible entry only.
- name: The owner and agent users from the csi-spl cnf (box_owner_user / box_agent_user)
  ansible.builtin.set_fact:
    owner_user: "{{ sat_step.box_owner_user | default('') }}"
    agent_user: "{{ sat_step.box_agent_user | default('') }}"
  vars:
    sat_step: "{{ (lookup('file', (proj_path | dirname) + '/csi-spl-cnf/csi-spl/' + env + '.env.json') | from_json).env.steps['060-gcp-vm-satellite'] }}"

- name: Refuse a cnf without both users
  ansible.builtin.assert:
    that:
      - owner_user is match('^[a-z_][a-z0-9_-]*$')
      - agent_user is match('^[a-z_][a-z0-9_-]*$')
      - owner_user != agent_user
    fail_msg: "csi-spl-cnf/csi-spl/{{ env }}.env.yaml steps.060-gcp-vm-satellite must set box_owner_user and box_agent_user (two different users)"

- name: The users' home paths
  ansible.builtin.set_fact:
    owner_home: "{{ home_root }}/{{ owner_user }}"
    agent_home: "{{ home_root }}/{{ agent_user }}"

- name: The spool group
  ansible.builtin.group:
    name: "{{ spool_group }}"
    system: true

- name: The users' own groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
  loop:
    - { name: "{{ owner_user }}", gid: "{{ owner_uid }}" }
    - { name: "{{ agent_user }}", gid: "{{ agent_uid }}" }

- name: The owner user
  ansible.builtin.user:
    name: "{{ owner_user }}"
    uid: "{{ owner_uid }}"
    group: "{{ owner_user }}"
    groups: [docker, "{{ spool_group }}", sudo]
    append: true
    home: "{{ owner_home }}"
    create_home: true
    shell: /bin/bash

- name: The agent user
  ansible.builtin.user:
    name: "{{ agent_user }}"
    uid: "{{ agent_uid }}"
    group: "{{ agent_user }}"
    groups: ["{{ owner_user }}", docker, "{{ spool_group }}"]
    append: true
    home: "{{ agent_home }}"
    create_home: true
    shell: /bin/bash

- name: Passwordless sudo, as on the box PC
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ item }}-nopasswd"
    content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: ["{{ owner_user }}", "{{ agent_user }}"]

- name: Linger (tmux and the agents outlive the ssh session)
  ansible.builtin.command: loginctl enable-linger {{ item }}
  args:
    creates: "/var/lib/systemd/linger/{{ item }}"
  loop: ["{{ owner_user }}", "{{ agent_user }}"]

- name: The owner logs in over IAP with the satellite key too (ssh -l <owner> satellite)
  ansible.posix.authorized_key:
    user: "{{ owner_user }}"
    key: "{{ lookup('file', ssh_public_key_file) }}"
    state: present

- name: /opt/csi, the owner's, group-writable (setgid + default ACL, as on the box PC)
  ansible.builtin.file:
    path: /opt/csi
    state: directory
    owner: "{{ owner_user }}"
    group: "{{ owner_user }}"
    mode: "2775"

- name: Default ACL, group rwx, on /opt/csi
  ansible.posix.acl:
    path: /opt/csi
    etype: group
    entity: "{{ owner_user }}"
    permissions: rwx
    default: "{{ item }}"
    state: present
  loop: [false, true]

- name: Everything under /opt/csi belongs to the owner (a clone made by root or the GCE user)
  ansible.builtin.shell: |
    set -uo pipefail
    if [ -n "$(find /opt/csi \( ! -user "$O" -o ! -group "$O" \) -print -quit)" ]; then
      chown -R "$O:$O" /opt/csi && chmod -R g+rwX /opt/csi && echo CHANGED
    else
      echo OK
    fi
  args:
    executable: /bin/bash
  environment:
    O: "{{ owner_user }}"
  register: opt_owner
  changed_when: "'CHANGED' in opt_owner.stdout"

# The run actions write under /var/<org>/<org>-<app> (desk-reconcile,
# unanswered-sweep, weekly-scan, backups, tenants, <proj>/dat/log/bash) as the
# box user, and the agent's ./run logs there too through the owner's group.
# 2026-10-02: do_spl_desk_install_service as the box user -> "cannot create
# /var/csi/csi-spl/desk-reconcile". As on the box PC: the owner's, group rwx.
- name: /var/csi, the owner's (as on the box PC)
  ansible.builtin.file:
    path: /var/csi
    state: directory
    owner: "{{ owner_user }}"
    group: "{{ owner_user }}"
    mode: "0755"

- name: /var/csi/csi-spl, the owner's, group-writable (setgid + default ACL)
  ansible.builtin.file:
    path: /var/csi/csi-spl
    state: directory
    owner: "{{ owner_user }}"
    group: "{{ owner_user }}"
    mode: "2775"

- name: Default ACL, group rwx, on /var/csi/csi-spl
  ansible.posix.acl:
    path: /var/csi/csi-spl
    etype: group
    entity: "{{ owner_user }}"
    permissions: rwx
    default: "{{ item }}"
    state: present
  loop: [false, true]

- name: The spool root, the owner's, group spool-agents (as on the box PC)
  ansible.builtin.file:
    path: "{{ spool_root }}"
    state: directory
    owner: "{{ owner_user }}"
    group: "{{ spool_group }}"
    mode: "2770"

- name: The box's self-description, read by do_satellite_verify
  ansible.builtin.copy:
    dest: /etc/csi-spl-satellite.env
    content: |
      # written by box-playbook.yaml role 05_users; do not edit
      OWNER_USER={{ owner_user }}
      AGENT_USER={{ agent_user }}
      BOX_TAG={{ box_tag }}
      BOX_TIMEZONE={{ box_timezone }}
    mode: "0644"
