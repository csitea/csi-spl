---
# 06 the credentials (eli-vta 07_gcp_secrets; spec 057 round 1 Q12 A): the
# dev + prd project SA keys and the GitHub token, into the owner's AND the
# agent's home, 0600 in 0700 dirs, so `ENV=dev|prd ./run -a ...`, git and gh
# work there as on the box PC. Read on the controller at run time (~/.gcp is
# mounted into the tf-runner, the token is its GITHUB_TOKEN), no_log, never
# in this repo, the inventory, the run script or terraform state. The AI CLI
# logins are NOT copied: each is the owner's interactive step (topic a5e4f4ae).
- name: The credential dirs
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.user }}"
    group: "{{ item.0.user }}"
    mode: "0700"
  loop: "{{ users | product(['.gcp', '.gcp/.csi', '.github']) | list }}"
  vars:
    users:
      - { user: "{{ owner_user }}", home: "{{ owner_home }}" }
      - { user: "{{ agent_user }}", home: "{{ agent_home }}" }

- name: The project SA keys (dev, prd)
  ansible.builtin.copy:
    dest: "{{ item.0.home }}/.gcp/.csi/key-{{ org }}-{{ app }}-{{ item.1 }}.json"
    content: "{{ lookup('file', controller_home + '/.gcp/.csi/key-' + org + '-' + app + '-' + item.1 + '.json') }}"
    owner: "{{ item.0.user }}"
    group: "{{ item.0.user }}"
    mode: "0600"
  loop: "{{ users | product(creds_envs) | list }}"
  vars:
    users:
      - { user: "{{ owner_user }}", home: "{{ owner_home }}" }
      - { user: "{{ agent_user }}", home: "{{ agent_home }}" }
  no_log: true

# One token per box (SPL-1945 row 3, SPL-2902): a box user's own token, put
# there by do_gh_box_token_put, wins. The controller's GITHUB_TOKEN only seeds
# a user whose token file is missing or empty, so a re-run never puts the
# controller box's token back on the satellite.
- name: The box users' GitHub token files
  ansible.builtin.stat:
    path: "{{ item.home }}/.github/token"
    get_checksum: false
  loop:
    - { user: "{{ owner_user }}", home: "{{ owner_home }}" }
    - { user: "{{ agent_user }}", home: "{{ agent_home }}" }
  register: gh_token_files

- name: Refuse without the controller's GitHub token (only when a box user has no token of its own)
  ansible.builtin.assert:
    that: lookup('env', 'GITHUB_TOKEN') | length > 0
    fail_msg: "GITHUB_TOKEN is empty on the controller (the tf-runner's env)"
  when: gh_token_files.results | map(attribute='stat.size', default=0) | min == 0
  no_log: true

- name: The GitHub token (the controller's, only into a missing or empty token file; a box's own token is kept)
  ansible.builtin.copy:
    dest: "{{ item.item.home }}/.github/token"
    content: "{{ lookup('env', 'GITHUB_TOKEN') }}\n"
    owner: "{{ item.item.user }}"
    group: "{{ item.item.user }}"
    mode: "0600"
  loop: "{{ gh_token_files.results }}"
  when: item.stat.size | default(0) == 0
  no_log: true
