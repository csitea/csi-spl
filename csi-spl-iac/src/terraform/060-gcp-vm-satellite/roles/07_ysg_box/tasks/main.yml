---
# 07 the ysg-box settings (owner, topic 6f10f92b: "add the code which
# provisions the ysg-box settings ... in the ansible call"), by ysg-box's own
# setup: the engine checkout (box.env BOX_ENGINE_ROOT), its /var<engine> dat dirs (engine README
# BOOTSTRAP 2), and the box's claude-config (.bashrc .bash_profile .profile
# .bash_logout, ~/.claude CLAUDE.md settings commands skills, the dotfiles),
# rendered for box <box_tag> from the overlay and applied per role with
# claude-apply.sh (as each user, only that user's HOME, backups, held local
# edits, a smoke-tested .bashrc). The render reads an EXPORT of the overlay
# without ysg-box-cnf: that dir is the hub's own box layer and the resolver
# would read it before boxes/<box_tag>/box.env (box.env says why). A pack
# carries no secret (the render lints for them); no .credentials.json ever.
# The engine's ./run -a box-apply is NOT run: ysg-box is FROZEN for harness
# work (FROZEN.md), the agent harness is csi-spl's (role 08).
- name: The ysg-box engine
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/git-sync.yml"
  vars:
    git_url: "{{ ysg_box_engine_url }}"
    git_dir: "{{ ysg_box_engine_dir }}"
    git_user: "{{ owner_user }}"

- name: The overlay again, now as the owner (05 cloned it as root)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/git-sync.yml"
  vars:
    git_url: "{{ ysg_box_overlay_url }}"
    git_dir: "{{ ysg_box_overlay_dir }}"
    git_user: "{{ owner_user }}"

- name: The engine's run-bsh dat dirs (README BOOTSTRAP 2), the owner's, setgid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ owner_user }}"
    group: "{{ owner_user }}"
    mode: "2775"
  loop:
    - "/var{{ ysg_box_engine_dir | dirname }}"
    - "/var{{ ysg_box_engine_dir }}"
    - "/var{{ ysg_box_engine_dir }}/dat"
    - "/var{{ ysg_box_engine_dir }}/dat/log"
    - "/var{{ ysg_box_engine_dir }}/dat/log/bash"
    - "/var{{ ysg_box_engine_dir }}/dat/zip"

- name: The owner and the agent write the dat dirs (README BOOTSTRAP 2 setfacl)
  ansible.posix.acl:
    path: "/var{{ ysg_box_engine_dir | dirname }}"
    etype: user
    entity: "{{ item.0 }}"
    permissions: rwx
    default: "{{ item.1 }}"
    recursive: true
    state: present
  loop: "{{ [owner_user, agent_user] | product([false, true]) | list }}"

- name: Render + pack box {{ box_tag }}'s claude-config (owner + agent roles)
  ansible.builtin.shell: |
    set -uo pipefail
    s="$ENGINE/ysg-box-orc/src/bash/features/claude-config/scripts"
    w=/var/tmp/satellite-claude-config
    rm -rf "$w" && mkdir -p "$w" && chmod 755 "$w"
    rsync -a --exclude .git --exclude ysg-box-cnf "$OVERLAY/" "$w/org/" || { echo "FAIL export"; exit 1; }
    bash "$s/claude-render.sh" --out "$w/render" --box "$TAG" --org-root "$w/org" --role owner --role agent >"$w/render.log" 2>&1 \
      || { echo "FAIL claude-render: $(tail -n 3 "$w/render.log" | tr '\n' ' ')"; exit 1; }
    if cut -f1 "$w"/render/*.manifest.tsv | grep -q 'credentials'; then echo "FAIL a credentials file in the render"; exit 1; fi
    bash "$s/claude-pack.sh" --render "$w/render" --out "$w/sat.pack" >"$w/pack.log" 2>&1 || { echo "FAIL claude-pack"; exit 1; }
    chmod 644 "$w/sat.pack"
    echo "OK owner $(($(wc -l <"$w/render/owner.manifest.tsv") - 1)) files, agent $(($(wc -l <"$w/render/agent.manifest.tsv") - 1)) files"
  args:
    executable: /bin/bash
  environment:
    ENGINE: "{{ ysg_box_engine_dir }}"
    OVERLAY: "{{ ysg_box_overlay_dir }}"
    TAG: "{{ box_tag }}"
  become: true
  become_user: "{{ owner_user }}"
  register: ysg_render
  changed_when: false

- name: Apply the pack, per role, as that role's user
  ansible.builtin.shell: |
    set -uo pipefail
    cd / && bash "$ENGINE/ysg-box-orc/src/bash/features/claude-config/scripts/claude-apply.sh" \
      --pack /var/tmp/satellite-claude-config/sat.pack --role "$ROLE" --box "$TAG" --adopt
  args:
    executable: /bin/bash
  environment:
    ENGINE: "{{ ysg_box_engine_dir }}"
    ROLE: "{{ item.role }}"
    TAG: "{{ box_tag }}"
  become: true
  become_user: "{{ item.user }}"
  loop:
    - { role: owner, user: "{{ owner_user }}" }
    - { role: agent, user: "{{ agent_user }}" }
  register: ysg_apply
  changed_when: ysg_apply.stdout is search('claude-receipt v1 .*(written|adopted|removed|moved)=[1-9]')

- name: claude-config receipts
  ansible.builtin.debug:
    msg: "{{ ysg_render.stdout }} | {{ ysg_apply.results | map(attribute='stdout_lines') | map('last') | list }}"
