---
# 08 the agent harness (was do_satellite_bootstrap's 05_spool_harness): the
# repo at repo_dir (the owner's, the agent writes through the group), git +
# gh for both users from ~/.github/token, the spool env for every shell, and
# the repo's own spool-install/install.sh AS THE AGENT (the agent CLIs, yq,
# Go, the spool binary, hooks, skills; --no-seat: seating a desk is its own
# step with the tenant admin). The AI CLI login stays the owner's: one
# interactive command as the agent (doc SYS.md 1.3).
- name: The repo, fast-forwarded to origin/master on every run
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/git-sync.yml"
  vars:
    git_url: "{{ repo_url }}"
    git_dir: "{{ repo_dir }}"
    git_user: "{{ owner_user }}"
    git_branch: master

- name: The git identity of trunk's tip, read on the controller (no name in this repo)
  ansible.builtin.set_fact:
    git_name: "{{ lookup('pipe', 'git -C ' + proj_path + ' log -1 --format=%an') }}"
    git_email: "{{ lookup('pipe', 'git -C ' + proj_path + ' log -1 --format=%ae') }}"
  delegate_to: localhost
  become: false

- name: Git for both users - identity, the https helper that reads ~/.github/token, the shared clone
  ansible.builtin.shell: |
    set -uo pipefail
    c=0
    h='!f() { echo username=x-access-token; echo "password=$(cat "$HOME/.github/token")"; }; f'
    set_g() { [ "$(git config --global "$1")" = "$2" ] || { git config --global "$1" "$2"; c=1; }; }
    set_g user.name "$GIT_NAME"
    set_g user.email "$GIT_EMAIL"
    set_g credential.https://github.com.helper "$h"
    git config --global --get-all safe.directory | grep -qx "$REPO" || { git config --global --add safe.directory "$REPO"; c=1; }
    [ "$c" = 1 ] && echo CHANGED || echo OK
  args:
    executable: /bin/bash
  environment:
    GIT_NAME: "{{ git_name }}"
    GIT_EMAIL: "{{ git_email }}"
    REPO: "{{ repo_dir }}"
  become: true
  become_user: "{{ item }}"
  loop: ["{{ owner_user }}", "{{ agent_user }}"]
  register: git_cfg
  changed_when: "'CHANGED' in git_cfg.stdout"

- name: gh for both users, from ~/.github/token
  ansible.builtin.shell: |
    gh auth status -h github.com >/dev/null 2>&1 && { echo OK; exit 0; }
    gh auth login -h github.com --with-token <"$HOME/.github/token" && echo CHANGED
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ item }}"
  loop: ["{{ owner_user }}", "{{ agent_user }}"]
  register: gh_auth
  changed_when: "'CHANGED' in gh_auth.stdout"

- name: The spool env for every shell (login shells via profile.d)
  ansible.builtin.copy:
    dest: /etc/profile.d/csi-spl-satellite.sh
    content: |
      # written by box-playbook.yaml role 08_spool_harness; do not edit
      export SPOOL_ROOT={{ spool_root }}
      export SPOOL_BOX_TAG={{ box_tag }}
      case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) export PATH="$HOME/.local/bin:$PATH" ;; esac
    mode: "0644"

- name: The spool env for interactive non-login shells too (tmux windows, bash -i)
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} csi-spl satellite spool env (box-playbook.yaml 08)"
    block: |
      [ -r /etc/profile.d/csi-spl-satellite.sh ] && . /etc/profile.d/csi-spl-satellite.sh

# SPOOL_DIR_LAYOUT=qualified (spec 058 section 6, CLE-001 decision 3): the
# satellite starts with <ID>@sat mailboxes (plus the bare compat link)
- name: The box config every spawn reads ($SPOOL_ROOT/box.env, spawn-agents box-config.sh; spec 058)
  ansible.builtin.shell: |
    set -uo pipefail
    f="$SPOOL_ROOT/box.env"; before=$(cat "$f" 2>/dev/null)
    timeout 60 setsid -w bash "{{ repo_dir }}/csi-spl-orc/src/bash/features/spawn-agents/scripts/box-config.sh" \
      "SPOOL_AGENT_USER={{ agent_user }}" "SPOOL_DESK_BOX={{ box_tag }}" "SPOOL_AGENT_ID_RANGE={{ agent_id_range }}" \
      "SPOOL_FLEET_ENV={{ fleet_env }}" "SPOOL_FLEET_TENANT={{ fleet_tenant }}" \
      "SPOOL_DIR_LAYOUT=qualified" </dev/null >/dev/null \
      || { echo "FAIL box-config.sh"; exit 1; }
    [ "$(cat "$f")" = "$before" ] && echo OK || echo CHANGED
  args:
    executable: /bin/bash
  environment:
    SPOOL_ROOT: "{{ spool_root }}"
  become: true
  become_user: "{{ agent_user }}"
  register: box_config
  changed_when: "'CHANGED' in box_config.stdout"

- name: spool-install/install.sh as the agent (CLIs, yq, Go, spool, hooks, skills)
  ansible.builtin.shell: |
    set -uo pipefail
    export SPOOL_ROOT="{{ spool_root }}" SPOOL_BOX_TAG="{{ box_tag }}" PATH="$HOME/.local/bin:/usr/local/go/bin:$HOME/go/bin:$PATH"
    cd "{{ repo_dir }}" && timeout 1800 setsid -w bash csi-spl-orc/src/bash/features/spool-install/install.sh --cli "{{ agent_clis }}" --no-seat </dev/null 2>&1
    rc=$?
    # loop run 2 printed nothing: prove the result, never trust an empty ok
    for b in claude spool spool-agent; do [ -x "$HOME/.local/bin/$b" ] || { echo "FAIL no ~/.local/bin/$b after install.sh (rc=$rc)"; exit 1; }; done
    exit "$rc"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  become: true
  become_user: "{{ agent_user }}"
  register: spool_install
  changed_when: spool_install.stdout is search('(?i)install(ed|ing)|built|linked|wrote')

- name: install.sh verdict
  ansible.builtin.debug:
    msg: "{{ spool_install.stdout_lines[-5:] }}"

# The BOX user runs the desks (do_spl_desk_up, the desk sidecar, the desk
# cron and the fleet lease loop), as on the box PC: it needs spool and
# spool-agent too, not only the agent. --cli none: no AI CLI for it (the agent
# user runs every AI CLI). --no-hooks --no-skills: role 07 owns its
# ~/.claude. --no-seat: seating is its own step with the tenant admin. The
# desk sidecar's own spool binary is built on demand from this repo with the
# Go of role 02 (/usr/local/go).
- name: spool-install/install.sh as the owner (the box user that runs the desks)
  ansible.builtin.shell: |
    set -uo pipefail
    export SPOOL_ROOT="{{ spool_root }}" SPOOL_BOX_TAG="{{ box_tag }}" PATH="$HOME/.local/bin:/usr/local/go/bin:$HOME/go/bin:$PATH"
    cd "{{ repo_dir }}" && timeout 1800 setsid -w bash csi-spl-orc/src/bash/features/spool-install/install.sh --cli none --no-seat --no-hooks --no-skills </dev/null 2>&1
    rc=$?
    for b in spool spool-agent; do [ -x "$HOME/.local/bin/$b" ] || { echo "FAIL no ~/.local/bin/$b for the owner after install.sh (rc=$rc)"; exit 1; }; done
    exit "$rc"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  become: true
  become_user: "{{ owner_user }}"
  register: spool_install_owner
  changed_when: spool_install_owner.stdout is search('(?i)install(ed|ing)|built|linked|wrote')

- name: install.sh verdict (owner)
  ansible.builtin.debug:
    msg: "{{ spool_install_owner.stdout_lines[-5:] }}"

# Claude Code's FIRST-RUN onboarding (theme picker, "Select login method")
# stopped all three satellite agents on 2026-10-02 although `claude auth
# status` read loggedIn:true, and spool pokes were typed into those menus. The
# login is the owner's (one interactive command); the first-run STATE is not a
# credential, so it is seeded here: the keys the box PC's agent user carries.
# Only these keys are set, only when missing or false; the rest of
# ~/.claude.json (the oauth account included) is never read out or changed.
# The per-folder trust dialog stays the spawner's (trust-workdir.sh).
- name: Claude Code first-run state for the agent (no onboarding menus at an agent's start)
  ansible.builtin.shell: |
    set -uo pipefail
    ver=$("$HOME/.local/bin/claude" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
    VER="$ver" python3 - <<'PY'
    import json, os, tempfile
    p = os.path.expanduser("~/.claude.json")
    try:
        d = json.load(open(p))
    except FileNotFoundError:
        d = {}
    want = {
        "hasCompletedOnboarding": True,
        "hasSeenAutoModeEntryWarning": True,
        "hasSeenAutoModeOutsideReadPrompt": True,
        "hasResetAutoModeOptInForDefaultOffer": True,
        "hasSeenTasksHint": True,
    }
    if os.environ.get("VER"):
        want["lastOnboardingVersion"] = os.environ["VER"]
    changed = [k for k, v in want.items() if not d.get(k)]
    if not changed:
        print("OK")
        raise SystemExit(0)
    for k in changed:
        d[k] = want[k]
    fd, tmp = tempfile.mkstemp(dir=os.path.dirname(p))
    with os.fdopen(fd, "w") as f:
        json.dump(d, f, indent=2)
    os.chmod(tmp, 0o600)
    os.replace(tmp, p)
    print("CHANGED " + " ".join(sorted(changed)))
    PY
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ agent_user }}"
  register: claude_firstrun
  changed_when: "'CHANGED' in claude_firstrun.stdout"

# The owner's tmux session `main` (the agents' windows live in it; SYS.md
# 1.5.10): a systemd USER unit, enabled, so it comes back after a reboot or a
# recreate without anyone typing `tmux new -s main` (linger is on, role 05).
- name: The owner's systemd user dir is the owner's
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ owner_user }}"
    group: "{{ owner_user }}"
    mode: "0755"
  loop:
    - "{{ owner_home }}/.config"
    - "{{ owner_home }}/.config/systemd"
    - "{{ owner_home }}/.config/systemd/user"

- name: The owner's tmux session `main` as a systemd user unit
  ansible.builtin.copy:
    dest: "{{ owner_home }}/.config/systemd/user/tmux-main.service"
    owner: "{{ owner_user }}"
    group: "{{ owner_user }}"
    mode: "0644"
    content: |
      # written by box-playbook.yaml role 08_spool_harness; do not edit
      [Unit]
      Description=tmux session main (the agents' windows)

      [Service]
      # idempotent: an existing main (started by hand, or by an earlier run) is
      # adopted, never a "duplicate session" failure (playbook 8a4b3c89).
      # The socket is pinned to the default path box.env / the spawner use;
      # %U is systemd's uid specifier (a $ here would be systemd's to expand).
      Type=oneshot
      ExecStart=/bin/sh -c '/usr/bin/tmux -S /tmp/tmux-%U/default has-session -t main 2>/dev/null || /usr/bin/tmux -S /tmp/tmux-%U/default new-session -d -s main'
      # no ExecStop, and KillMode=process: the agents run inside this tmux
      # server, so a unit stop or restart must never end the session. process
      # kills only the unit's main process, which a oneshot has already ended
      # (KillMode=none would do the same but is deprecated in systemd)
      KillMode=process
      RemainAfterExit=yes

      [Install]
      WantedBy=default.target

- name: Enable + start tmux-main (an already running `main` is left alone)
  ansible.builtin.shell: |
    set -uo pipefail
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    systemctl --user daemon-reload
    c=0
    systemctl --user is-enabled -q tmux-main.service || { systemctl --user enable -q tmux-main.service && c=1; }
    S="/tmp/tmux-$(id -u)/default"
    # the unit adopts a running main, so this start never fails on one
    systemctl --user is-active -q tmux-main.service || { systemctl --user start tmux-main.service && c=1; }
    systemctl --user is-active -q tmux-main.service || { echo "FAIL tmux-main.service is not active: $(systemctl --user status tmux-main.service --no-pager 2>&1 | tail -n 3 | tr '\n' ' ')"; exit 1; }
    # the tmux error is kept: playbook 916d1d4f printed a bare "no session"
    # here while the unit had adopted main and the verify row (sudo -u owner) saw
    # it. The unit being active is the proof here; the session itself is
    # the do_satellite_verify row. A miss with the unit active is a WARN with the
    # error, never a silent pass and never a failed run.
    if err=$(/usr/bin/tmux -S "$S" has-session -t main 2>&1); then :
    elif [ -S "$S" ]; then echo "WARN unit active, socket $S present, but has-session in this task said: ${err:-nothing} (uid=$(id -u), TMUX=${TMUX:-}, LC_ALL=${LC_ALL:-})"
    else echo "FAIL no tmux server socket at $S ($err)"; exit 1; fi
    [ "$c" = 1 ] && echo CHANGED || echo OK
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ owner_user }}"
  register: tmux_main
  changed_when: "'CHANGED' in tmux_main.stdout"
