---
# 08 the agent harness (was do_satellite_bootstrap's 05_spool_harness): the
# repo at repo_dir (the owner's, the agent writes through the group), git +
# gh for both users from ~/.github/token, the spool env for every shell, and
# the repo's own spool-install/install.sh AS THE AGENT (the agent CLIs, yq,
# Go, the spool binary, hooks, skills; --no-seat: seating a desk is its own
# step with the tenant admin). The AI CLI login stays the owner's: one
# interactive command as the agent (doc SYS.md 1.3).
- name: The repo
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/git-sync.yml"
  vars:
    git_url: "{{ repo_url }}"
    git_dir: "{{ repo_dir }}"
    git_user: "{{ owner_user }}"

- name: The git identity of trunk's tip, read on the controller (no name in this repo)
  ansible.builtin.set_fact:
    git_name: "{{ lookup('pipe', 'git -C ' + proj_path + ' log -1 --format=%an') }}"
    git_email: "{{ lookup('pipe', 'git -C ' + proj_path + ' log -1 --format=%ae') }}"
  delegate_to: localhost
  become: false

- name: Git for both users - identity, the https helper that reads ~/.github/token, the shared clone
  ansible.builtin.shell: |
    set -uo pipefail
    c=0
    h='!f() { echo username=x-access-token; echo "password=$(cat "$HOME/.github/token")"; }; f'
    set_g() { [ "$(git config --global "$1")" = "$2" ] || { git config --global "$1" "$2"; c=1; }; }
    set_g user.name "$GIT_NAME"
    set_g user.email "$GIT_EMAIL"
    set_g credential.https://github.com.helper "$h"
    git config --global --get-all safe.directory | grep -qx "$REPO" || { git config --global --add safe.directory "$REPO"; c=1; }
    [ "$c" = 1 ] && echo CHANGED || echo OK
  args:
    executable: /bin/bash
  environment:
    GIT_NAME: "{{ git_name }}"
    GIT_EMAIL: "{{ git_email }}"
    REPO: "{{ repo_dir }}"
  become: true
  become_user: "{{ item }}"
  loop: ["{{ owner_user }}", "{{ agent_user }}"]
  register: git_cfg
  changed_when: "'CHANGED' in git_cfg.stdout"

- name: gh for both users, from ~/.github/token
  ansible.builtin.shell: |
    gh auth status -h github.com >/dev/null 2>&1 && { echo OK; exit 0; }
    gh auth login -h github.com --with-token <"$HOME/.github/token" && echo CHANGED
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ item }}"
  loop: ["{{ owner_user }}", "{{ agent_user }}"]
  register: gh_auth
  changed_when: "'CHANGED' in gh_auth.stdout"

- name: The spool env for every shell (login shells via profile.d)
  ansible.builtin.copy:
    dest: /etc/profile.d/csi-spl-satellite.sh
    content: |
      # written by box-playbook.yaml role 08_spool_harness; do not edit
      export SPOOL_ROOT={{ spool_root }}
      export SPOOL_BOX_TAG={{ box_tag }}
      case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) export PATH="$HOME/.local/bin:$PATH" ;; esac
    mode: "0644"

- name: The spool env for interactive non-login shells too (tmux windows, bash -i)
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} csi-spl satellite spool env (box-playbook.yaml 08)"
    block: |
      [ -r /etc/profile.d/csi-spl-satellite.sh ] && . /etc/profile.d/csi-spl-satellite.sh

- name: The box config every spawn reads ($SPOOL_ROOT/box.env, spawn-agents box-config.sh; spec 058)
  ansible.builtin.shell: |
    set -uo pipefail
    f="$SPOOL_ROOT/box.env"; before=$(cat "$f" 2>/dev/null)
    timeout 60 setsid -w bash "{{ repo_dir }}/csi-spl-orc/src/bash/features/spawn-agents/scripts/box-config.sh" \
      "SPOOL_AGENT_USER={{ agent_user }}" "SPOOL_DESK_BOX={{ box_tag }}" "SPOOL_AGENT_ID_RANGE={{ agent_id_range }}" </dev/null >/dev/null \
      || { echo "FAIL box-config.sh"; exit 1; }
    [ "$(cat "$f")" = "$before" ] && echo OK || echo CHANGED
  args:
    executable: /bin/bash
  environment:
    SPOOL_ROOT: "{{ spool_root }}"
  become: true
  become_user: "{{ agent_user }}"
  register: box_config
  changed_when: "'CHANGED' in box_config.stdout"

- name: spool-install/install.sh as the agent (CLIs, yq, Go, spool, hooks, skills)
  ansible.builtin.shell: |
    set -uo pipefail
    export SPOOL_ROOT="{{ spool_root }}" SPOOL_BOX_TAG="{{ box_tag }}" PATH="$HOME/.local/bin:$PATH"
    cd "{{ repo_dir }}" && timeout 1800 setsid -w bash csi-spl-orc/src/bash/features/spool-install/install.sh --cli "{{ agent_clis }}" --no-seat </dev/null
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  become: true
  become_user: "{{ agent_user }}"
  register: spool_install
  changed_when: spool_install.stdout is search('(?i)install(ed|ing)|built|linked|wrote')

- name: install.sh verdict
  ansible.builtin.debug:
    msg: "{{ spool_install.stdout_lines[-5:] }}"
