# gc.conf - the GC agent of every box (owner HUM-10, t1 91a36ace, msgs
# 2135b302 .. 9c595541): ONE garbage-collector session per box, started by
# that box's cron (cnf/box-crons/box-crons.manifest row `gc`), one pass over
# the box's agents, then it closes itself. Read by do_spl_gc
# (src/bash/run/spl-gc.func.sh) and by src/bash/scripts/gc-cron.sh.
#
# slot <minute> <vendor>   the GC starts at that minute of every hour with
#                          that vendor (claude | grok | agy | qwen | mistral).
#                          Owner 9c595541: "on round hours the Claude and on
#                          the 30th minute the grok agents".
# fallback <vendor>        the vendor when the slot's CLI is not installed
# GC_<KNOB>=<seconds>      an env var of the same name overrides it
#
slot 00 claude
slot 30 grok
fallback claude
# the owner's cap per agent (msg 5b224da1): "not spent more than 3 minutes on an agent"
GC_AGENT_CAP=180
# a GC session older than this is ended by the next start (a pass that never closed)
GC_MAX_AGE=1500
# a restart needs a poke from an earlier pass, at least this old ("next run still nothing")
GC_POKE_WAIT=1200
# silence (no heartbeat progress) that the scan marks as suspect
GC_SILENT_AGE=900
# one close request per id in this window
GC_CLOSE_ASK_EVERY=86400
