# tmux-agent-status.conf — window access for an agent fleet (specs/048).
#
# install.sh copies this file to <prefix>/share/spool-agent/tmux-agent-status.conf
# and prints the one line to add to ~/.tmux.conf:
#   source-file <prefix>/share/spool-agent/tmux-agent-status.conf
# ~/.tmux.conf itself is never edited. Nothing here calls select-window or
# refresh-client.
set -g status-interval 15
set -g status-left-length 20
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #[bold]#I:#W* '


# Accessibility: grok's TUI binds Ctrl+J (scroll), which is the tmux prefix on
# the fleet's boxes. Once a client lands on a grok pane, C-j never reaches
# tmux and the human cannot switch windows. The spawn skills tell the human
# on every box to reach the fleet these ways, so the bindings are part of the
# engine, not of one box:
#   click a window name on the status bar
#   F12 then w          (prefix2)
#   Ctrl-Alt-Left/Right (prev/next window)
#   Ctrl-Alt-Up         (choose-tree of every window)
set -g mouse on
set -g prefix2 F12
bind-key -n C-M-Left previous-window
bind-key -n C-M-Right next-window
bind-key -n C-M-Up choose-tree -Zw

# Into the notice STRIP and back out, in ONE key. The strip is the right-hand
# pane every agent window now carries from the moment it is spawned, and the
# owner's requirement (2026-09-22) is that reading it "should be natural and
# fast" - so it cannot cost a prefix, a pane key and a way back.
#
# `-t :.+` is the next pane in the window. With the two panes an agent window
# has - the CLI and its strip - that is a TOGGLE, symmetric, and it needs no
# remembered state: the same key goes in and comes back out. `select-pane -l`
# would have been the obvious toggle and is wrong here, because "last pane" is
# unset until something has already selected one, so the FIRST press - the one
# the owner is actually asking about - would do nothing.
#
# WHY THIS KEY. A root binding (`-n`) is consumed by tmux and never reaches the
# CLI, so the key must be one no agent CLI uses. Ctrl-Alt-arrow is already this
# file's established family for exactly that reason, Left/Right/Up are taken by
# the three bindings above, and Down is the one that is left. Checked
# 2026-09-22: `tmux list-keys | grep -c C-M-Down` -> 0, and the terminal
# sequences Ctrl-Alt-Down/Up emit ("\e[1;7B", "\e[1;7A") appear in none of the
# three CLI binaries - `grep -ac '1;7B'` -> 0 for grok 1.0.41, for agy, and for
# claude 2.1.278. That greps for a literal, so a CLI that assembled the
# sequence at runtime would not show up; no such handling is known, and the
# same family has been in production here for three keys without a collision.
bind-key -n C-M-Down select-pane -t :.+
