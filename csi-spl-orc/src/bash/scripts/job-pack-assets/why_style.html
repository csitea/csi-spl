<style>
  :root { --ink:#323e4f; --muted:#6b7280; --line:#dde3ea; --bg:#f4f6f8; --card:#ffffff; --accent:#1f6f5c; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--ink);
         font:16px/1.6 Roboto, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card { max-width:720px; margin:0 auto 20px; background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:32px 36px; }
  .meta { font-size:14px; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:22px; }
  .meta b { color:var(--ink); font-weight:600; }
  h1 { font-size:19px; margin:4px 0 0; }
  h2 { font-size:16px; margin:0 0 16px; color:var(--muted); font-weight:600; letter-spacing:0.02em; text-transform:uppercase; }
  p { margin:0 0 14px; }
  .hook { font-size:18px; font-weight:600; color:var(--accent); }
  ul { padding-left:20px; margin:0 0 16px; }
  li { margin-bottom:8px; }
  table { border-collapse:collapse; width:100%; margin:6px 0 18px; font-size:15px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { width:34%; color:var(--muted); font-weight:500; }
  .sign { margin-top:20px; }
  .bar { max-width:720px; margin:0 auto 12px; text-align:right; }
  button { font:inherit; font-size:14px; padding:8px 14px; border:1px solid var(--line); border-radius:6px;
           background:var(--card); color:var(--ink); cursor:pointer; margin-left:8px; }
  button:hover { border-color:var(--accent); }
  @media (max-width:520px) { .card { padding:22px 18px; } th { width:40%; } }
  @media print { .bar { display:none; } body { background:#fff; padding:0; } .card { border:0; } }
</style>
