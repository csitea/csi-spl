<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  wui-e2e-fonts.conf: the one font the WUI browser e2e renders with, on the
  CI gate and on a box (SPL-3469, ci-failures-100 panel issue I1).
  wui-e2e-mock-serve.sh exports FONTCONFIG_FILE to this file, and wf 10's
  wui-e2e job sets the same path. Before it the hosted runner fell back to
  DejaVu Sans and the box to Noto Sans, and 1 to 3 px of text width flipped
  geometry asserts (fa817cee2, af62f0e53). DejaVu (fonts-dejavu-core) is on
  both, and every generic family resolves to it. Liberation (fonts-liberation,
  a google-chrome dependency) is read too, only for a test that names it
  (card-edge-inset MEASURE_FONT). No other directory is read, so no fallback
  can pick another font; the system /etc/fonts is left out on purpose.
  Leaving it out also drops its render settings, and fontconfig's bare
  default is full hinting, which draws hinted DejaVu digits 11 px at 16 px
  and 10 px at 14 px (ch no longer scales with font-size). The match below
  restates the Debian and Ubuntu defaults the box and the hosted runner both
  render with: grayscale antialias, hintslight.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- The set is the 8 files of fonts-dejavu-core, by name. The hosted
       runner also ships DejaVu Math TeX Gyre (it won sans-serif there) and
       the fonts-dejavu-extra faces (Oblique, Condensed, ExtraLight) a box
       has none of, so a directory alone is not one font on both. -->
  <selectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSansMono*.ttf</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf</glob>
      <glob>/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf</glob>
    </acceptfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
      <glob>/usr/share/fonts/truetype/liberation/LiberationSansNarrow*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
