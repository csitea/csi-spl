# csi-spl lde ::: shared network + the GCS emulator (spec 007 T001; the
# sibling-prj-orc compose split: -infra / -rdb / -api). Every ${LDE_*} comes from
# the compose.env do_gen_docker_env renders from csi-spl-cnf lde.env.yaml; the
# project name (-p) is per git tree, so volumes and containers are too.
#
# The hub talks to the emulator through the standard STORAGE_EMULATOR_HOST
# (cnf lde hub.env), i.e. gcs:4443 on the lde network. Host access, for the
# smoke and for a developer, is 127.0.0.1:${LDE_GCS_PORT} only.
# Every lde service (infra, rdb, api, wui, local-hub files) sits on this one
# bridge network, never on compose's implicit default (security action 3).
networks:
  lde:
    driver: bridge

volumes:
  gcs-data: {}

services:
  # one shot before gcs (security action 2): the image has no /storage, so
  # docker creates the gcs-data volume root-owned; this hands it, and any
  # file an older root gcs wrote, to the emulator's uid. Root on purpose
  # (.compose-root-allow.tsv) with CHOWN and DAC_READ_SEARCH only, no network.
  gcs-volume-owner:
    image: "${LDE_GCS_IMAGE:?unset - run ./run -a do_gen_docker_env in csi-spl-orc}"
    pull_policy: if_not_present
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "find /storage ! -user 65534 -exec chown 65534:65534 {} +"]
    volumes:
      - "gcs-data:/storage"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"

  gcs:
    image: "${LDE_GCS_IMAGE:?unset - run ./run -a do_gen_docker_env in csi-spl-orc}"
    pull_policy: if_not_present
    user: "65534:65534"
    depends_on:
      gcs-volume-owner:
        condition: service_completed_successfully
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-external-url"
      - "http://gcs:4443"
      - "-backend"
      - "filesystem"
      - "-filesystem-root"
      - "/storage"
    volumes:
      - "gcs-data:/storage"
    ports:
      - "127.0.0.1:${LDE_GCS_PORT:?unset}:4443"
    networks: [lde]
    restart: unless-stopped
