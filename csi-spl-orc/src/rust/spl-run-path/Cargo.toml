[package]
name = "spl-run-path"
# The interface version: run.sh's do_set_vars reads it on the first output
# line and takes the binary only when it equals its own RUN_PATH_BIN_VERSION
# (run-path-bin.tst.sh holds the two equal). Bump both for any change of
# what the binary prints.
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "The path step of run.sh's do_set_vars as one native exec (SPL-5985)"
license = "AGPL-3.0-only"
publish = false

# No dependencies, on purpose (as spl-cmd-guard): pure Rust, nothing to
# fetch, so `cargo build --locked --offline` works on a box and in CI.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
