<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Thread Pane</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .topic-pane {
      width: 320px;
      background: white;
      border-left: 1px solid #ddd;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .topic-pane header {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topic-heading__title {
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }
    .topic-heading__text {
      color: #333;
    }
    .feed-body {
      flex-grow: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <div class="topic-pane">
    <header>
      <strong class="topic-heading__title">
        <span class="topic-heading__text">bold</span>
      </strong>
    </header>
    <div class="feed-body">
      <p>This is a mock thread pane. The title above should show "bold" instead of "**bold**".</p>
    </div>
  </div>
</body>
</html>
