# spool, standalone: Postgres 16 + the hub + the WUI on one machine, with
# one command and no cloud account:
#
#   docker compose up -d             then open http://localhost:8080
#
# Images (spec 072 A1b): `up` pulls the published hub and web images,
# ${SPOOL_IMAGE_REPO}/spool-{hub,web}:${SPOOL_IMAGE_TAG} (default: GHCR, the
# newest stable-* release, wf 56), PINNED BY DIGEST (SPL-2153): the default
# tag carries its sha256, so a re-pushed tag cannot change what runs.
# `./run -a do_pin_compose_images` (csi-spl-orc) moves the pin to a new
# release. Setting SPOOL_IMAGE_TAG replaces tag and digest together. To build
# both from this checkout instead, name a local tag (a build cannot carry a
# digest):
#
#   SPOOL_IMAGE_TAG=local docker compose up --build -d
#
# A `--build` image carries that name; unset SPOOL_IMAGE_TAG and
# `docker compose pull` to go back to the published one.
#
# Sign up on the login page: on localhost the first person to sign in becomes
# the owner of the tenant this stack seeds (SPOOL_TENANT); on a public host
# only SPOOL_OWNER_EMAIL can (a one-time invite, `docker compose logs hub-init`). Every value below has a local
# default; copy .env.example to .env to change one (your own domain, ports,
# passwords, mail). Nothing here reaches any hosted service.
#
#   pg        Postgres 16; its first boot creates the schema owner login
#   s3        SeaweedFS 4.48 (`weed mini`): the S3 API on :9000 and the bucket
#             spool-files. The tag is pinned. MinIO's community image is no
#             longer published, and this one creates the bucket on start.
#   hub-init  one shot: migrations, the hub's DML-only runtime login, the
#             session key and the first tenant (safe to re-run)
#   hub       `spool serve` as the runtime login (row level security binds it)
#   web       Caddy: the generated WUI and a same-origin proxy to the hub; with
#             SPOOL_SITE_ADDRESS set to a domain it also does TLS for it
#   web-volume-owner  one shot: hands the web-data volume to web's uid
#
# Local dev mode (spec 148), for a developer building spool on their own
# machine, is the `dev` profile of this same file:
#
#   docker compose --profile dev up -d
#
#   mail      Mailpit (dev profile only): catches every mail the hub sends;
#             the inbox is http://localhost:8025 (REST /api/v1/messages), SMTP
#             on :1025, both bound to 127.0.0.1 and nothing leaves the machine
#
# The profile adds the catcher; the hub's mail and the one-click dev login
# stay the variables below (defaults: mail to the hub log, dev login off).
# .env.example, block "local dev mode", sets them for the dev profile. The
# hub refuses the dev login and the public default secrets outside
# SPOOL_HUB_ENV=lde.
#
# Every service names a non-root user: (security action 2); the few that
# start as root are in .compose-root-allow.tsv, each with its reason.
#
# Every service sits on the one bridge network `spool` (security action 3),
# never on compose's implicit default; web-volume-owner has none at all.
# Service names (pg, s3, hub) resolve on it; only web publishes ports.
#
# Three secrets are Docker secret files, never env vars (security action 1,
# SPL-2158): the Postgres superuser password, the S3 secret key and the SMTP
# password, mounted under /run/secrets and read through *_FILE. They come
# from ${SPOOL_SECRETS_DIR}; unset, that is csi-spl-api/src/docker/local-secrets,
# the public local defaults. Anything beyond localhost sets
# SPOOL_SECRETS_DIR=./secrets (git-ignored): .env.example and DEPLOY.md.
name: spool

x-db: &db
  SPOOL_DB_NAME: ${SPOOL_DB_NAME:-spool_hub}
  SPOOL_OWNER_ROLE: ${SPOOL_DB_OWNER:-spool_hub}
  SPOOL_OWNER_PASSWORD: ${SPOOL_DB_OWNER_PASSWORD:-spool-local-owner}

services:
  pg:
    image: postgres:16-alpine
    # the image's postgres user from the first process on (its data dir is
    # postgres-owned, so a new pg-data volume is too)
    user: postgres
    environment:
      <<: *db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/spool_db_superuser_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./csi-spl-api/src/docker/pg-init.sh:/docker-entrypoint-initdb.d/10-spool-owner.sh:ro
    secrets: [spool_db_superuser_password]
    healthcheck:
      # over TCP, as hub-init dials it: on a fresh volume the image first runs
      # a socket-only temporary server for initdb + pg-init.sh, then restarts;
      # a socket check went healthy on that one and hub-init hit "connection
      # refused" in the restart gap (wf50 run 36856362013, CLE-77859)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d $${SPOOL_DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [spool]
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.48
    # the image's seaweed user (uid 1000): its /data is seaweed-owned, and the
    # entrypoint already chowned a volume an older root start made
    user: seaweed
    # SeaweedFS reads only AWS_SECRET_ACCESS_KEY: secret-env.sh sets it from
    # the secret file, then runs the image's own entrypoint
    entrypoint: ["/bin/sh", "/opt/spool/secret-env.sh", "AWS_SECRET_ACCESS_KEY", "--", "/entrypoint.sh"]
    command: ["mini", "-dir=/data", "-ip=s3", "-s3.port=9000"]
    environment:
      AWS_ACCESS_KEY_ID: ${SPOOL_S3_ACCESS_KEY:-spool-local-s3-access}
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/spool_s3_secret_key
      S3_BUCKET: spool-files
    secrets: [spool_s3_secret_key]
    volumes:
      - s3-data:/data
      - ./csi-spl-api/src/docker/secret-env.sh:/opt/spool/secret-env.sh:ro
    healthcheck:
      # bucket directory, not the listen port: weed mini creates it after the
      # S3 listener is up (4.48 mini.go, ensureMiniBuckets before ready)
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/buckets/spool-files/"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s
    networks: [spool]
    restart: unless-stopped

  hub-init:
    build: &hub-build
      # the repo root, so the build can read the version off .git (W6);
      # src/docker/hub.Dockerfile.dockerignore narrows what is sent
      context: .
      dockerfile: csi-spl-api/src/docker/hub.Dockerfile
      args:
        SPOOL_VERSION: ${SPOOL_VERSION:-}
    image: ${SPOOL_IMAGE_REPO:-ghcr.io/csitea}/spool-hub:${SPOOL_IMAGE_TAG:-stable-2026-10-12@sha256:ccdee0eb22cdfa6d0f5380dfd4f5f9df4c90634bf0c6f01fc2bf200a0d5347e6}
    # the image's own USER spool (hub.Dockerfile), stated
    user: "10001:10001"
    # secret-env.sh: a hub image older than SPL-2158 reads only the plain env
    # var; a newer one reads the _FILE itself (same file, same value)
    entrypoint: ["/bin/sh", "/opt/spool/secret-env.sh", "SPOOL_SUPERUSER_PASSWORD", "--", "/bin/sh", "/usr/local/bin/hub-entrypoint.sh"]
    command: ["init"]
    environment:
      SPOOL_OWNER_DSN: postgres://${SPOOL_DB_OWNER:-spool_hub}:${SPOOL_DB_OWNER_PASSWORD:-spool-local-owner}@pg:5432/${SPOOL_DB_NAME:-spool_hub}?sslmode=disable
      SPOOL_RUNTIME_ROLE: ${SPOOL_DB_RUNTIME:-spool_hub_rt}
      SPOOL_RUNTIME_PASSWORD: ${SPOOL_DB_RUNTIME_PASSWORD:-spool-local-runtime}
      SPOOL_TENANT: ${SPOOL_TENANT:-main}
      # off localhost (specs/047 W9, W18) hub-init refuses the default
      # passwords above and seats the owner by a one-time invite for
      # SPOOL_OWNER_EMAIL; it prints the sign-in link and the agent seat line
      SPOOL_PUBLIC_URL: ${SPOOL_PUBLIC_URL:-http://localhost:${SPOOL_HTTP_PORT:-8080}}
      SPOOL_BIND: ${SPOOL_BIND:-127.0.0.1}
      SPOOL_OWNER_EMAIL: ${SPOOL_OWNER_EMAIL:-}
      SPOOL_OWNER_PASSWORD: ${SPOOL_DB_OWNER_PASSWORD:-spool-local-owner}
      SPOOL_SUPERUSER_PASSWORD_FILE: /run/secrets/spool_db_superuser_password
    secrets: [spool_db_superuser_password]
    volumes:
      - hub-state:/var/lib/spool/state
      - ./csi-spl-api/src/docker/secret-env.sh:/opt/spool/secret-env.sh:ro
    depends_on:
      pg:
        condition: service_healthy
    networks: [spool]
    # the readiness file init writes as its last step, removed at its start
    # (SPL-2156; hub-entrypoint.sh). `hub` still waits for this one shot to
    # EXIT 0 (service_completed_successfully); the check shows the state while
    # it runs. Once it has exited, docker reports any container unhealthy:
    # read `docker compose ps -a` (Exited (0)). An image older than this check
    # never writes the file, which nothing waits on.
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/spool/state/init.ready"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: "no"

  hub:
    build: *hub-build
    image: ${SPOOL_IMAGE_REPO:-ghcr.io/csitea}/spool-hub:${SPOOL_IMAGE_TAG:-stable-2026-10-12@sha256:ccdee0eb22cdfa6d0f5380dfd4f5f9df4c90634bf0c6f01fc2bf200a0d5347e6}
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/opt/spool/secret-env.sh", "SPOOL_S3_SECRET_KEY", "SPOOL_HUB_MAIL_SMTP_PASSWORD", "--", "/bin/sh", "/usr/local/bin/hub-entrypoint.sh"]
    command: ["serve"]
    environment:
      SPOOL_HUB_ENV: ${SPOOL_HUB_ENV:-lde}
      # spec 076: this stack is the no-cloud provider (embedded S3, plain Postgres)
      SPOOL_CLOUD_PROVIDER: none
      SPOOL_S3_ENDPOINT: http://s3:9000
      SPOOL_S3_BUCKET: spool-files
      SPOOL_S3_ACCESS_KEY: ${SPOOL_S3_ACCESS_KEY:-spool-local-s3-access}
      SPOOL_S3_SECRET_KEY_FILE: /run/secrets/spool_s3_secret_key
      SPOOL_S3_USE_PATH_STYLE: "true"
      SPOOL_HUB_DB_DSN: postgres://${SPOOL_DB_RUNTIME:-spool_hub_rt}:${SPOOL_DB_RUNTIME_PASSWORD:-spool-local-runtime}@pg:5432/${SPOOL_DB_NAME:-spool_hub}?sslmode=disable
      SPOOL_HUB_FILES_DIR: /var/lib/spool/files
      # a tenant host is <tenant>.<domain>; the browser uses the one public
      # URL and the hub takes the tenant from the signed-in session
      SPOOL_HUB_TENANT_HOST_PATTERN: "{tenant}.${SPOOL_DOMAIN:-localhost}"
      SPOOL_HUB_VIEW_DOOR: session
      SPOOL_HUB_VIEW_CORS_ORIGINS: ${SPOOL_PUBLIC_URL:-http://localhost:${SPOOL_HTTP_PORT:-8080}}
      SPOOL_HUB_LOBBY_TASK_ID: ${SPOOL_LOBBY_TASK_ID:-00000000-0000-4000-8000-000000000001}
      SPOOL_HUB_DEFAULT_LOCALE: ${SPOOL_DEFAULT_LOCALE:-en}
      SPOOL_HUB_LOG_FORMAT: ${SPOOL_LOG_FORMAT:-console}
      SPOOL_HUB_LOG_LEVEL: ${SPOOL_LOG_LEVEL:-info}
      # Caddy (web) is the one proxy in front of the hub
      SPOOL_HUB_TRUSTED_PROXY_HOPS: "1"
      SPOOL_HUB_AUTH_NATIVE_TRUSTED_PROXY_HOPS: "1"
      # browser sign-in: email + password on this hub, no identity provider
      # A new account confirms its email before it joins a tenant. Local
      # default: the sign-up form shows the confirmation link itself
      # (SPOOL_AUTH_DEBUG_LINKS, refused unless SPOOL_HUB_ENV is lde/dev); on a
      # real domain set it to false and give the hub an SMTP relay below.
      SPOOL_HUB_AUTH_NATIVE_ENABLED: "true"
      SPOOL_HUB_AUTH_NATIVE_DEBUG_TOKENS: ${SPOOL_AUTH_DEBUG_LINKS:-true}
      SPOOL_HUB_AUTH_APP_URL: ${SPOOL_PUBLIC_URL:-http://localhost:${SPOOL_HTTP_PORT:-8080}}
      # auto = Secure session cookie unless SPOOL_PUBLIC_URL is http on
      # localhost / 127.0.0.1; true / false force it (false off localhost
      # logs auth.cookie_not_secure at start)
      SPOOL_HUB_AUTH_COOKIE_SECURE: ${SPOOL_COOKIE_SECURE:-auto}
      # auto: on localhost the first person to sign in to the empty tenant
      # becomes its owner; anywhere else nobody does (hub-init invites
      # SPOOL_OWNER_EMAIL instead). true / false force it.
      SPOOL_HUB_AUTH_BOOTSTRAP_OWNER: ${SPOOL_BOOTSTRAP_OWNER:-auto}
      SPOOL_PUBLIC_URL: ${SPOOL_PUBLIC_URL:-http://localhost:${SPOOL_HTTP_PORT:-8080}}
      SPOOL_BIND: ${SPOOL_BIND:-127.0.0.1}
      SPOOL_HUB_MAIL_TRANSPORT: ${SPOOL_MAIL_TRANSPORT:-log}
      SPOOL_HUB_MAIL_SMTP_HOST: ${SPOOL_MAIL_SMTP_HOST:-}
      SPOOL_HUB_MAIL_SMTP_PORT: ${SPOOL_MAIL_SMTP_PORT:-587}
      SPOOL_HUB_MAIL_SMTP_USER: ${SPOOL_MAIL_SMTP_USER:-}
      SPOOL_HUB_MAIL_SMTP_PASSWORD_FILE: /run/secrets/spool_mail_smtp_password
      # starttls (the hub's own default) for a real relay; none only for the
      # dev profile's Mailpit (host mail), which the hub allows on lde alone
      SPOOL_HUB_MAIL_SMTP_TLS: ${SPOOL_MAIL_SMTP_TLS:-starttls}
      SPOOL_HUB_MAIL_FROM: ${SPOOL_MAIL_FROM:-}
      # at start the hub connects to the relay and logs in (no mail sent);
      # require = a dead relay, a wrong password, or no relay on a prd hub
      # stops `up` here instead of failing every confirmation mail later
      SPOOL_HUB_MAIL_PREFLIGHT: ${SPOOL_MAIL_PREFLIGHT:-require}
      # the one-click "Dev login" as the workspace owner (spec 148 2.3.2):
      # off unless set; the hub refuses to start with it on outside lde
      SPOOL_HUB_AUTH_DEV_LOGIN_ENABLED: ${SPOOL_AUTH_DEV_LOGIN_ENABLED:-false}
    secrets: [spool_s3_secret_key, spool_mail_smtp_password]
    volumes:
      - hub-state:/var/lib/spool/state:ro
      - hub-files:/var/lib/spool/files
      - ./csi-spl-api/src/docker/secret-env.sh:/opt/spool/secret-env.sh:ro
    depends_on:
      s3:
        condition: service_healthy
      hub-init:
        condition: service_completed_successfully
      # with --profile dev the hub's mail preflight dials Mailpit; without the
      # profile there is no mail service and nothing waits
      mail:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [spool]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: csi-spl-wui/src/docker/wui.Dockerfile
      args:
        SPOOL_VERSION: ${SPOOL_VERSION:-}
        # the one build-time value (it decides which routes carry a locale
        # prefix): a pulled image is en, another locale needs `--build`
        SPOOL_DEFAULT_LOCALE: ${SPOOL_DEFAULT_LOCALE:-en}
    image: ${SPOOL_IMAGE_REPO:-ghcr.io/csitea}/spool-web:${SPOOL_IMAGE_TAG:-stable-2026-10-12@sha256:8e4f3016c34f2fd0883bb6b7cbac54fb99ae0b55666753a41d7a5f9442ab9259}
    environment:
      SPOOL_SITE_ADDRESS: ${SPOOL_SITE_ADDRESS:-:80}
      # read at container start (wui-config.sh, 072 A3), so a pulled image
      # serves any domain or tenant: a change is a restart, not a rebuild
      SPOOL_PUBLIC_URL: ${SPOOL_PUBLIC_URL:-http://localhost:${SPOOL_HTTP_PORT:-8080}}
      SPOOL_TENANT: ${SPOOL_TENANT:-main}
      SPOOL_LOBBY_TASK_ID: ${SPOOL_LOBBY_TASK_ID:-00000000-0000-4000-8000-000000000001}
      # the source repository's url pieces (.env.example); "" = links hidden
      SPOOL_REPO_WEB_URL: ${SPOOL_REPO_WEB_URL:-}
      SPOOL_REPO_CLONE_URL: ${SPOOL_REPO_CLONE_URL:-}
      SPOOL_REPO_COMMIT_PATH: ${SPOOL_REPO_COMMIT_PATH:-}
      SPOOL_REPO_HELP_PATH: ${SPOOL_REPO_HELP_PATH:-}
    ports:
      - "${SPOOL_BIND:-127.0.0.1}:${SPOOL_HTTP_PORT:-8080}:80"
      - "${SPOOL_BIND:-127.0.0.1}:${SPOOL_HTTPS_PORT:-8443}:443"
    volumes:
      - web-data:/data
    depends_on:
      hub:
        condition: service_healthy
      web-volume-owner:
        condition: service_completed_successfully
    networks: [spool]
    # Caddy answers on its own port 80 (SPL-2156): the plain-http default site
    # serves /config.json (written by wui-config.sh at start) with 200; a
    # domain site answers http with its https redirect, 308. The base image's busybox
    # wget is the probe; nothing is installed for it.
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:80/config.json 2>&1 | grep -qE '^ *HTTP/[0-9.]+ (200|308) '"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # Local dev mode only (spec 148 2.2): `docker compose --profile dev up`.
  # Mailpit keeps the mail in memory, takes any SMTP sender with no login and
  # no TLS, and publishes on loopback only, never on SPOOL_BIND.
  mail:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    profiles: ["dev"]
    # the image names no user; Mailpit needs none (in-memory store, /tmp)
    user: "1000:1000"
    ports:
      - "127.0.0.1:${SPOOL_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${SPOOL_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [spool]
    restart: unless-stopped

  # one shot before web: an older web ran as root and left web-data (Caddy's
  # certificates) root-owned; wui.Dockerfile's web runs as uid 10002, so this
  # hands the volume to it. Root on purpose (.compose-root-allow.tsv) with
  # CHOWN and DAC_READ_SEARCH only, no network.
  web-volume-owner:
    # the pg image: already pulled for this stack, and it has find + chown
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "find /data ! -user 10002 -exec chown 10002:10002 {} +"]
    volumes:
      - web-data:/data
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"

networks:
  spool:
    driver: bridge

# Docker secret files (SPL-2158). Outside swarm compose bind-mounts each file
# as it is on the host and ignores uid/mode, so the container users (postgres,
# seaweed, 10001) read it by its own mode: keep the files 0644 inside a 0700
# directory (DEPLOY.md, "Secret files").
secrets:
  spool_db_superuser_password:
    file: ${SPOOL_SECRETS_DIR:-./csi-spl-api/src/docker/local-secrets}/db_superuser_password
  spool_s3_secret_key:
    file: ${SPOOL_SECRETS_DIR:-./csi-spl-api/src/docker/local-secrets}/s3_secret_key
  spool_mail_smtp_password:
    file: ${SPOOL_SECRETS_DIR:-./csi-spl-api/src/docker/local-secrets}/mail_smtp_password

volumes:
  pg-data: {}
  s3-data: {}
  hub-state: {}
  hub-files: {}
  web-data: {}
