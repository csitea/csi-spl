# example.env.yaml - every setting the spool reads from its operator, with
# placeholders only (spec 044 FR-OS-003, T020; issue SPL-1012). Strangers
# build their own hub on their OWN domain: no domain, cloud project, region,
# service-account e-mail, org id, OAuth client id or payment key is compiled
# into csi-spl-api, csi-spl-wui or csi-spl-rdb; each comes from here.
#
# Shape: one section per reader, each key is the environment variable that
# reader takes, its value a placeholder or the default the code uses when the
# variable is unset ("" = unset). Set them in the process environment of the
# hub (sections box .. hub_cloud) and of the web UI build or container
# (sections wui_build, wui_container). The comment above a key is the code's
# own doc comment.
#
# Placeholders: example.com is your domain, <ANGLE> names a value you choose,
# <SECRET> is a credential. A credential never goes into a committed file:
# hand it over by your platform's secret store. SPOOL_S3_SECRET_KEY and
# SPOOL_HUB_MAIL_SMTP_PASSWORD also take <NAME>_FILE, a file path that wins
# over the variable (Docker secrets, internal/secretfile).
#
# The quick local stack (docker-compose.yml) needs none of this: it has its
# own short list with working defaults, .env.example.
#
# Per-deployment edits that are not variables:
#   csi-spl-wui/src/public/privacy.html section 5 states where the hosted
#     operator stores data (its cloud and region). It is static HTML with no
#     JavaScript (spec 049 FR-F7), so it cannot read this file: an operator
#     edits that sentence to its own storage location.
#   csi-spl-wui/src/components/PoweredBy.vue links the project's own
#     attribution ("Powered by ...") to its maker's site; it names the
#     software, not the operator, and stays.
#
# A test fails when a reader gains a variable this file does not list:
# csi-spl-api/src/go/spool-hub-api/internal/config/example_env_test.go (hub)
# and csi-spl-wui/tests/unit/example-env.test.mjs (web UI).

box:
  # SpoolRoot is the on-box message tree: a pre-created system dir, separate
  # from any other tool's message tree (owner decision 2026-09-18).
  SPOOL_ROOT: "/var/spool-hub"
  # KeysDir holds the box PRIVATE key, strictly outside SpoolRoot. Empty here
  # means "$HOME/.spool/keys", resolved in Load.
  SPOOL_KEYS_DIR: ""
  # PinsDir holds shared PUBLIC box pins. Empty here means "<SpoolRoot>/pins".
  SPOOL_PINS_DIR: ""
  # BoxID names this box for its keypair and hub routing. No default: local
  # mode never needs it, and keygen/pin fail fast when it is unset.
  SPOOL_BOX_ID: "<BOX_ID>"
  # LogLevel is a zerolog level name (trace|debug|info|warn|error).
  SPOOL_LOG_LEVEL: "info"
  # LogFormat is "console" (CLI) or "json" (deployed).
  SPOOL_LOG_FORMAT: "console"
  # HubURL switches the box into hub mode (spec 003): the api host
  # https://api.<domain> (specs/026); a legacy https://<tenant>.<domain> still
  # works. Unset = the unchanged local 002 path.
  SPOOL_HUB_URL: "https://api.example.com"
  # Tenant is the box's tenant, sent as X-Spool-Tenant (specs/026 §4) and
  # proven by the box's pin. Unset = derived from a legacy tenant HubURL.
  SPOOL_TENANT: "<TENANT>"
  # TenantRootKey is the path to the tenant root PRIVATE key used by spool-pin
  # to POST/DELETE /v1/pins. Empty = local pin file only (002).
  SPOOL_TENANT_ROOT_KEY: ""
  # FleetRoot is the machine's harness spool root (specs/058 N1), set on a
  # desk's hub-run sidecar only: an agent-to-agent DM the hub delivers to
  # this box is ALSO written into <FleetRoot>/<to>/inbox when that inbox
  # exists, so a peer or a report from another machine reaches the inbox
  # the agent reads with `spool recv`. Unset = no copy (hub, CI, tests).
  SPOOL_FLEET_ROOT: ""
  # AgentDropAfter (t1 bc1a43e1 fix B): a role=box hello and announce leave
  # out an agent the fleet tick's run report has said does not run for
  # longer than this - whole minutes, or a Go duration. do_spl_desk_up sets
  # it from cnf env.box.agent_drop_after_minutes. Unset/0 = never.
  SPOOL_AGENT_DROP_AFTER: ""
  # AgentKeep (SPL-2803): agent ids the drop above never leaves out,
  # space- or comma-separated. The desk service ids (the responder c-684,
  # the ops desk c-685) act from cron with no live process, so the run
  # report never says they run; do_spl_desk_up sets it from
  # SPL_DESK_AGENT_IDS. Unset = none kept.
  SPOOL_AGENT_KEEP: ""
  # QueueWarnAfter / QueueLogEvery (SPL-2165): the hub-run sidecar logs its
  # fallback queue (pending-flush dir) every QueueLogEvery, at WARN once the
  # oldest entry is QueueWarnAfter old; `spool hub-queue` flags the same.
  # Whole minutes or a Go duration. do_spl_desk_up sets them from cnf
  # env.box.fallback_queue. Unset/0 = off.
  SPOOL_QUEUE_WARN_AFTER: ""
  SPOOL_QUEUE_LOG_EVERY: ""
  # DirLayout is the mailbox layout of SpoolRoot (specs/058 6): unset = bare
  # "<ID>" dirs; "qualified" = a new mailbox is "<ID>@<DeskBox>" plus the
  # compat symlink "<ID>". Both layouts are always READ.
  SPOOL_DIR_LAYOUT: ""
  # DeskBox is this machine's desk box id (box.env SPOOL_DESK_BOX), the
  # "<box>" of a qualified mailbox.
  SPOOL_DESK_BOX: ""
  # MirrorLocal also hub-sends same-box mail: unset/0/false (default) or 1/true.
  SPOOL_MIRROR_LOCAL: ""
  # Channels is the box's channel subscriptions (comma list of slugs) sent in
  # hub hello/announce (specs/003 channels-v1 §3). Unset = #lobby only.
  SPOOL_CHANNELS: ""
  # NotifyCmd is the terminal leg (specs/028): the command run after a v:1
  # message lands in a LOCAL agent's inbox, so the agent's tmux pane SHOWS
  # it. On a box this is csi-spl-orc's spool-notify.sh, exported by
  # spool-harness for the agent session and for the hub-run sidecar it
  # starts. Unset (a hub, CI, a test) or "off" = no terminal leg. Split on
  # whitespace into argv; no shell is involved.
  SPOOL_NOTIFY_CMD: ""
  # NotifyTimeout bounds that command. It can never fail a delivery: the
  # file is already written when it runs (002).
  SPOOL_NOTIFY_TIMEOUT: "10s"
  # NotifyAsync is the rollback for the queued terminal leg (specs/030
  # FP-1, FR-007). Unset/"1" = hub-run queues each poke on a per-recipient
  # lane off the read loop; "0"/"false"/"off" = every poke runs synchronously
  # on the delivering goroutine, exactly as before 030. It never turns the
  # terminal leg itself off - that is SPOOL_NOTIFY_CMD=off.
  SPOOL_NOTIFY_ASYNC: ""
  # SubmitSocket is the box-local listener the hub-run sidecar opens so a
  # `spool send` hands its signed envelope to the sidecar's ALREADY-WARM hub
  # session instead of dialling a new one (specs/030 FP-2). Measured
  # 2026-09-21: a cold dial to the live dev hub costs 220.6 ms p50 / 266.5 ms
  # p95 (n=20) before the hello even starts, and the sidecar is holding an
  # authenticated socket to that same hub the whole time.
  #
  # Unset = SubmitPath() below (inside HubDir). "off" = no listener and no
  # client attempt: every send dials as it did before 030, which is the
  # rollback (spec FR-007).
  SPOOL_SUBMIT_SOCKET: ""
  # MsgVersion is the schema version this box WRITES (specs/020
  # contracts/migration.md §5): 1 until every reader is deployed. Readers
  # accept 1 and 2 whatever this says. 0 (a Config built in code) = msg.Version.
  SPOOL_MSG_VERSION: "1"
  # IDQuarantineH is how long a retired agent id stays quarantined
  # (specs/061 3.5-3.6, the allocator's SPOOL_ID_QUARANTINE_H): a message
  # to it inside that window bounces to its sender as a reject.
  # 0 (a Config built in code) = 24.
  SPOOL_ID_QUARANTINE_H: "24"

hub:
  SPOOL_HUB_LISTEN_ADDR: ":8080"
  # Cloud Run: wins over ListenAddr
  PORT: ""
  SPOOL_HUB_ENV: "<ENV>"
  SPOOL_HUB_DB_DSN: "postgres://<DB_USER>@<DB_HOST>:5432/<DB_NAME>?sslmode=require"
  # The pgx pool (specs/027 T010). Cloud SQL db-f1-micro allows 25
  # connections, 3 reserved for superusers: two instances overlapping in a
  # roll at 8 each leave room for operator sessions. A DSN pool_* wins.
  SPOOL_HUB_DB_MAX_CONNS: "8"
  SPOOL_HUB_DB_MIN_CONNS: "2"
  SPOOL_HUB_DB_MAX_CONN_IDLE_TIME: "5m"
  # How long the hub retries its first Postgres open, doubling a 1 s backoff
  # (CI panel 2026-10-28 row F5). Below the 120 s startup probe; 0s = one try.
  SPOOL_HUB_DB_OPEN_WITHIN: "60s"
  # The hard limit of one /v1/view/* request (SPL-2866): its context
  # deadline (the pool wait included) and the server-side statement_timeout
  # of each statement it runs. cnf env.hub.env sets it; 0 = no limit.
  SPOOL_HUB_VIEW_TIMEOUT: "0s"
  # Exactly one blob store: a GCS bucket (prod) or a local dir (tests / lde).
  SPOOL_HUB_FILES_BUCKET: "<FILES_BUCKET>"
  SPOOL_HUB_FILES_DIR: ""
  # The Docs section's bucket (the WUI deploy publishes the repo .md
  # there); a local dir in tests / lde. Neither set = the section is off.
  SPOOL_HUB_DOCS_BUCKET: "<DOCS_BUCKET>"
  SPOOL_HUB_DOCS_DIR: ""
  # The workspace docs (specs/075 Phase 2): one store per workspace.
  # WorkspaceDocsBucket is a bucket name with {tenant} in it (terraform
  # step 052 makes one bucket per workspace); WorkspaceDocsDir is a local
  # root holding <root>/<tenant>/ (tests / lde). Neither set = the
  # /v1/workspace/docs routes are off.
  SPOOL_HUB_WORKSPACE_DOCS_BUCKET: "<WORKSPACE_DOCS_BUCKET>"
  SPOOL_HUB_WORKSPACE_DOCS_DIR: ""
  # NotesEnabled is the Notes kill switch (spec 155 section 6, cnf hub
  # env): false, every /v1/me/realm/notes route answers 404 notes_off and
  # the stored notes stay.
  SPOOL_HUB_NOTES_ENABLED: "false"
  # Editable Repo Docs (spec 075 repo-edit; cnf env.docs.repo_edit, which
  # do_spl_merged_cnf derives into SPOOL_HUB_DOCS_EDIT_*). Enabled false is
  # the kill switch: the edit routes 404 and no worker pushes. The App key
  # is SPOOL_GITHUB_APP_KEY, read at start and never kept here.
  SPOOL_HUB_DOCS_EDIT_ENABLED: "false"
  SPOOL_HUB_DOCS_EDIT_DENY: ""
  SPOOL_HUB_DOCS_EDIT_BLOCKED_WORKSPACES: ""
  SPOOL_HUB_DOCS_EDIT_COALESCE_AFTER: "15s"
  SPOOL_HUB_DOCS_EDIT_COALESCE_MAX: "10m"
  SPOOL_HUB_DOCS_EDIT_MIN_MEMBER_AGE: "24h"
  SPOOL_HUB_DOCS_EDIT_RATE_MEMBER_PER_HOUR: "30"
  SPOOL_HUB_DOCS_EDIT_RATE_AGENT_PER_HOUR: "60"
  SPOOL_HUB_DOCS_EDIT_RATE_WORKSPACE_PER_DAY: "100"
  SPOOL_HUB_DOCS_EDIT_RATE_ENV_PER_DAY: "300"
  SPOOL_HUB_DOCS_EDIT_GITHUB_API: ""
  SPOOL_HUB_DOCS_EDIT_GITHUB_APP_ID: ""
  SPOOL_HUB_DOCS_EDIT_INSTALLATION_ID: ""
  # DocsEditGitHubRepo is "<owner>/<repo>", the one repository edits land in.
  SPOOL_HUB_DOCS_EDIT_GITHUB_REPO: "<OWNER>/<REPO>"
  # TenantHostPattern is "{tenant}.<fqdn>"; the tenant comes from the Host.
  SPOOL_HUB_TENANT_HOST_PATTERN: "{tenant}.example.com"
  SPOOL_HUB_ALLOW_TEXT_ONLY_WHEN_FILE_MISSING: "false"
  SPOOL_HUB_QUEUE_TTL: "168h"
  SPOOL_HUB_QUEUE_MAX_PER_BOX: "1000"
  SPOOL_HUB_RETENTION_ALERTS: "168h"
  SPOOL_HUB_RETENTION_CHANNELS: "720h"
  # Spec 059 S4: a committed delivery row is pruned this long after its commit.
  SPOOL_HUB_COMMITTED_RETENTION: "720h"
  # SPL-987: an agent newly added to a channel is back-filled with the
  # channel's topics active in the last BackfillWindow, newest BackfillMax
  # messages at most. 0 max = no back-fill.
  SPOOL_HUB_BACKFILL_WINDOW: "168h"
  SPOOL_HUB_BACKFILL_MAX: "200"
  # SPL-997: a human post no agent could hear goes to ONE online fallback
  # agent of the tenant (hub/fallback.go). false = off.
  SPOOL_HUB_FALLBACK: "true"
  # SPL-1004: every QueueRelay each hub process delivers the queued rows of
  # the box sockets it holds, and sweeps their tenants for unheard posts
  # (hub/relay.go): a post stored by another process or revision reaches
  # its agents within a tick, not at the box's next hello. 0 = off.
  SPOOL_HUB_QUEUE_RELAY: "5s"
  # spec 059 S1: a row another hub process queued for a box this process
  # holds is pushed the moment it commits (Postgres LISTEN/NOTIFY,
  # hub/wake.go), not at the next QueueRelay tick. false = the poll only.
  SPOOL_HUB_WAKE: "true"
  # spec 059 S3: a message another hub process stored reaches the browser
  # sockets this process holds (the same LISTEN connection,
  # hub/wui_wake.go). false = only the storing process's browsers get it live.
  SPOOL_HUB_WAKE_WUI: "true"
  # SPL-2584: the human post guard (hub/human_post_guard.go, how-to-post.md
  # rule 18). false = the off switch; the hub applies neither rule.
  SPOOL_HUB_HUMAN_POST_GUARD: "true"
  # SPL-1225: the relay also escalates a signed human post that no agent
  # replied to in its topic within this grace to the tenant's responder,
  # regardless of what the (stale, dir-derived) box-desk roster says about
  # who is "online". The fast live/queue path still delivers first; this is
  # the backstop against a post reaching no live agent AND no fallback.
  # 0 = off. Requires Fallback.
  SPOOL_HUB_UNANSWERED_GRACE: "120s"
  # SPL-1225 miss fix (prd t1 4b0ba40a): a post escalated but still unanswered
  # (its poke was refused and dropped) is re-escalated - re-poked, rotating to
  # the next responder / any awake agent - REESCALATE_EVERY after its last
  # attempt, up to REESCALATE_MAX attempts total, so one refused poke to a
  # busy responder is not permanent silence. MAX < 2 = off.
  SPOOL_HUB_REESCALATE_EVERY: "120s"
  SPOOL_HUB_REESCALATE_MAX: "5"
  SPOOL_HUB_HELLO_SKEW: "300s"
  SPOOL_HUB_UPLOAD_TOKEN_TTL: "5m"
  # JoinTokenTTL is how long an agent join token lives from minting (spec
  # 073 4.1). Served environments take the cnf value; the default matches
  # it so a test process with the variable unset agrees. Bounds in
  # checkLimits: JoinTokenTTLMin..JoinTokenTTLMax inclusive.
  SPOOL_HUB_JOIN_TOKEN_TTL: "1h"
  # Quota fields: 0 = unlimited (tests / internal). Production values live in cnf.
  SPOOL_HUB_QUOTA_MESSAGES_PER_MONTH: "0"
  SPOOL_HUB_QUOTA_PINS: "0"
  SPOOL_HUB_QUOTA_FILE_BYTES: "0"
  SPOOL_HUB_BILLING_GRACE: "168h"
  SPOOL_HUB_GRACEFUL_SHUTDOWN: "10s"
  SPOOL_HUB_LOG_LEVEL: "info"
  SPOOL_HUB_LOG_FORMAT: "json"
  SPOOL_HUB_MIGRATIONS_DIR: ""
  # 008 CI/CD logs (M1 stub, flagged off). Token/key are secrets, never logged.
  SPOOL_HUB_CICD_LOGS_ENABLED: "false"
  SPOOL_HUB_CICD_GITHUB_API: ""
  SPOOL_HUB_CICD_GITHUB_TOKEN: "<SECRET>"
  SPOOL_HUB_CICD_TENANT_TOKENS: ""
  SPOOL_HUB_CICD_REPO_ALLOWLIST: "<OWNER>/<REPO>"
  SPOOL_HUB_CICD_FROM_BOX: "hub"
  SPOOL_HUB_CICD_FROM_ID: "CI-0"
  SPOOL_HUB_CICD_HUB_BOX_KEY: "<SECRET>"
  # Viewer API (specs/003 contracts/view-v1.md). ViewDoor "off" is lde/dev
  # only; "session" = member sessions only + credentialed CORS (010 FR-009).
  SPOOL_HUB_VIEW_DOOR: "token"
  SPOOL_HUB_VIEW_CORS_ORIGINS: "https://example.com"
  # TopicHeads is the topic-list read (spec 099 5.1): off = the walk over
  # messages; shadow = serve the walk and, for 1 request in
  # TopicHeadsSample, also run the head read in the same snapshot and log
  # a mismatch; on = serve the head read (rdb 0144, once the tenant is
  # backfilled). GET /version reports it as topic_heads.
  SPOOL_HUB_TOPIC_HEADS: "off"
  SPOOL_HUB_TOPIC_HEADS_SAMPLE: "1"
  # SPL-959 tenant hosts: the WUI of tenant <t> is https://<t>.<fqdn>
  # (TenantHostPattern), and the hub serves a browser request as the tenant
  # its Origin names (member-only), with credentialed CORS for those hosts.
  # WUIApexTenant is the tenant of the apex https://<fqdn> ("" = the
  # session's tenant there, as before). Both off by default.
  SPOOL_HUB_WUI_TENANT_HOSTS: "false"
  SPOOL_HUB_WUI_APEX_TENANT: "<TENANT>"
  # BoxLocksExpected is cnf hub.box_locks_expected (spec 025
  # box-owner-lock.md 6.4): "<tenant>:<box>:<lock_pubkey>" entries joined
  # with commas. A listed box is served only with a verified lock row under
  # that key (store.ParseExpectedBoxLocks; "" = none).
  SPOOL_HUB_BOX_LOCKS_EXPECTED: ""
  # OperatorTenant is the BOOTSTRAP operator workspace (spec 074): the one
  # workspace whose ADMINS manage every other workspace of this instance
  # through /v1/operator/workspaces. The database is the authority
  # (tenants.is_operator, rdb 0116, owner D1): the hub flags this workspace
  # at start only while no row is flagged, and reads it from cnf only until
  # then. "" = the apex workspace (WUIApexTenant); both "" and no row
  # flagged = the routes are off (404).
  SPOOL_HUB_OPERATOR_TENANT: "<TENANT>"
  # DemoEnabled turns on demo users (specs/077): a demo_user acts in
  # DemoWorkspace only. OFF by default in dev and prd; on only by the
  # owner's go, dev first (Q8).
  SPOOL_HUB_DEMO_ENABLED: "false"
  SPOOL_HUB_DEMO_WORKSPACE: "demo"
  # DemoProviders are the sign-in providers the open demo admission takes
  # (cnf env.demo.providers, specs/077 FR-004); never password.
  SPOOL_HUB_DEMO_PROVIDERS: "google,facebook,linkedin"
  # MarketingWorkspaces is the outer marketing allow-list (spec 090, cnf
  # marketing.workspaces): the workspaces whose admins may turn marketing
  # on or off, or the one entry "all" (every workspace). Empty = off
  # everywhere: every /v1/marketing route answers 404.
  SPOOL_HUB_MARKETING_WORKSPACES: ""
  # The LinkedIn marketing app (spec 090 T002/T006, SPL-1634): its client
  # id and secret (Secret Manager, injected while cnf
  # marketing.linkedin.inject is "true"; the secret is never logged), the
  # KMS key that seals member tokens (cnf marketing.kms_key, injected while
  # marketing.kms_key.inject is "true": the full CryptoKey resource name)
  # and the LinkedIn-Version header of the REST API (cnf
  # marketing.linkedin.api_version). Connecting and sharing are on only
  # when the id, the secret and the key are all set.
  SPOOL_HUB_MARKETING_LINKEDIN_CLIENT_ID: "<LINKEDIN_CLIENT_ID>"
  SPOOL_HUB_MARKETING_LINKEDIN_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_MARKETING_KMS_KEY: "projects/<PROJECT_ID>/locations/<REGION>/keyRings/<RING>/cryptoKeys/<KEY>"
  SPOOL_HUB_MARKETING_LINKEDIN_VERSION: "202606"
  # The Meta app for Facebook Page + Instagram publishing (spec 090 T033):
  # the sign-in Meta app reused, its id and secret, the Graph API version and
  # the permissions the connect asks for. Connecting is on only when the id,
  # the secret and SPOOL_HUB_MARKETING_KMS_KEY are all set; else every
  # /v1/marketing/facebook route answers 503 not_configured.
  SPOOL_HUB_MARKETING_FACEBOOK_APP_ID: "<META_APP_ID>"
  SPOOL_HUB_MARKETING_FACEBOOK_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_MARKETING_FACEBOOK_API_VERSION: "v26.0"
  SPOOL_HUB_MARKETING_FACEBOOK_SCOPES: "pages_show_list,pages_read_engagement,pages_manage_posts,instagram_basic,instagram_content_publish"
  # The Google Calendar connect (spec 149 B5, SPL-3208, cnf gcal): the
  # allow-list (workspace ids or "all"; empty = off, every
  # /v1/me/google-calendar route answers 404), the scopes the connect asks
  # for, and Google's endpoints, none defaulted in code. The OAuth client is
  # the sign-in one (SPOOL_HUB_AUTH_GOOGLE_*), the KMS key the marketing one.
  SPOOL_HUB_GCAL_WORKSPACES: ""
  SPOOL_HUB_GCAL_SCOPES: "openid email"
  SPOOL_HUB_GCAL_AUTH_URL: "<GOOGLE_AUTH_URL>"
  SPOOL_HUB_GCAL_TOKEN_URL: "<GOOGLE_TOKEN_URL>"
  SPOOL_HUB_GCAL_REVOKE_URL: "<GOOGLE_REVOKE_URL>"
  SPOOL_HUB_GCAL_USERINFO_URL: "<GOOGLE_USERINFO_URL>"
  SPOOL_HUB_GCAL_CALENDAR_BASE: "<GOOGLE_CALENDAR_API_BASE>"
  # The contacts switch (spec 154 2.9, cnf contacts.workspaces): workspace
  # ids, or the one entry "all"; empty = off, every /v1/me/contacts route
  # answers 404 and GET /v1/view/me says contacts: false. CONTACTS_SCOPES is
  # what the Google connect asks for contacts (row B7), empty until S2.
  SPOOL_HUB_CONTACTS_WORKSPACES: ""
  SPOOL_HUB_CONTACTS_SCOPES: ""
  # A workspace's own vendor keys (spec 127 H1, spec 159 T1): the KMS key
  # that wraps each key's data key (cnf vendor_keys.kms_key, the full
  # CryptoKey resource name of step 057) and the fingerprint HMAC pepper
  # (Secret Manager cnf vendor_keys.pepper_secret; never logged). Both
  # unset = every /v1/vendor-keys route answers 503 vendor_keys_off.
  SPOOL_HUB_VENDOR_KEYS_KMS_KEY: "projects/<PROJECT_ID>/locations/<REGION>/keyRings/<RING>/cryptoKeys/<KEY>"
  SPOOL_HUB_VENDOR_KEYS_PEPPER: "<SECRET>"
  # DemoMaxLive caps the live demo_user seats (cnf demo.max_live,
  # specs/077 FR-006); the next visitor is refused demo_full.
  SPOOL_HUB_DEMO_MAX_LIVE: "9"
  # DemoMaxStay is how long a demo seat lasts from admission (cnf
  # demo.max_stay, specs/077 FR-005, T009); then the door answers 401
  # demo_expired and the 5-minute sweep drops the seat. Below 1m refused.
  SPOOL_HUB_DEMO_MAX_STAY: "3h"
  # DemoAgentTurns caps a demo_user's agent turns (fan-outs and @agent
  # sends) per visit (specs/077 3.7); the next is refused 429 demo_quota.
  SPOOL_HUB_DEMO_AGENT_TURNS: "20"
  # DemoPostsPerMinute and DemoPostsPerDay cap a demo_user's posts per
  # human (specs/077 T012, 3.6); the next is refused 429 demo_quota.
  SPOOL_HUB_DEMO_POSTS_PER_MINUTE: "10"
  SPOOL_HUB_DEMO_POSTS_PER_DAY: "200"
  # DemoVisitsPerDay caps the demo stays one IdP account starts per UTC
  # day (specs/077 Q11, T010), refused demo_visits; DemoSignupsPerIP caps
  # the new demo accounts per client IP per UTC day (3.6), refused
  # demo_signups.
  SPOOL_HUB_DEMO_VISITS_PER_DAY: "2"
  SPOOL_HUB_DEMO_SIGNUPS_PER_IP: "3"
  # Embed* are the embeddable sales channel's switch and limits (specs/121
  # section 6, cnf env.hub.embed): OFF by default; on only by T207 with the
  # owner's go. Visitors per client IP an hour and a UTC day (429
  # embed_visitors); posts per visitor a minute and a day, agent turns per
  # unpaid visitor a day (429 embed_quota); the bytes of one visitor post
  # (413); live unpaid visitors per embed (503 embed_full). A visitor that
  # hits a limit EmbedChallengeAfterHits times within EmbedHitsWindow
  # solves the challenge on every post; EmbedBanAfterHits times bans its
  # ip_hash for EmbedBanFor. The visitor token lives EmbedTokenIdleTTL
  # from its last use, EmbedTokenMaxAge at most (section 4.1). Below 1 (or
  # 1m) the hub refuses to start: 0 must never read as unlimited.
  SPOOL_HUB_EMBED_ENABLED: "false"
  SPOOL_HUB_EMBED_VISITORS_PER_IP_HOUR: "5"
  SPOOL_HUB_EMBED_VISITORS_PER_IP_DAY: "20"
  SPOOL_HUB_EMBED_POSTS_PER_MINUTE: "6"
  SPOOL_HUB_EMBED_POSTS_PER_DAY: "100"
  SPOOL_HUB_EMBED_MESSAGE_MAX_BYTES: "4096"
  SPOOL_HUB_EMBED_TURNS_PER_DAY: "10"
  SPOOL_HUB_EMBED_LIVE_VISITORS_MAX: "200"
  SPOOL_HUB_EMBED_CHALLENGE_AFTER_HITS: "3"
  SPOOL_HUB_EMBED_BAN_AFTER_HITS: "5"
  SPOOL_HUB_EMBED_HITS_WINDOW: "24h"
  SPOOL_HUB_EMBED_BAN_FOR: "24h"
  SPOOL_HUB_EMBED_TOKEN_IDLE_TTL: "720h"
  SPOOL_HUB_EMBED_TOKEN_MAX_AGE: "4320h"
  # Box file streams (spec 160 3.7, row B7; cnf env.hub.file_streams):
  # stream keys per box, workspaces that stream, lines and bytes of text
  # kept per workspace, a stream's line rate a minute (a push over twice
  # it is refused) and the days a line is kept. Below 1 (retention below
  # 1h) the hub refuses to start: 0 must never read as unlimited.
  SPOOL_HUB_FILE_STREAMS_PER_BOX: "8"
  SPOOL_HUB_FILE_STREAMS_MAX_WORKSPACES: "4"
  SPOOL_HUB_FILE_STREAMS_MAX_LINES_PER_WORKSPACE: "500000"
  SPOOL_HUB_FILE_STREAMS_MAX_BYTES_PER_WORKSPACE: "268435456"
  SPOOL_HUB_FILE_STREAMS_RATE_PER_MIN: "600"
  SPOOL_HUB_FILE_STREAMS_RETENTION: "168h"
  # web file globs (spec 160 3.8.3, 3.8.9): live globs a box (409
  # too_many_globs past it) and the days a glob audit row is kept
  SPOOL_HUB_FILE_STREAMS_GLOBS_PER_BOX: "8"
  SPOOL_HUB_FILE_STREAMS_GLOB_AUDIT_RETENTION: "8760h"
  # #general lobby task id (specs/003 contracts/wui-live-ws.md §1); "" = off.
  SPOOL_HUB_LOBBY_TASK_ID: ""
  # AuthBootstrapOwner: the first human to sign in to a tenant with zero
  # members becomes its owner (010 FR-014, OQ-A5). A trust change: dev only
  # until the owner decides; prd admits by operator invite.
  SPOOL_HUB_AUTH_BOOTSTRAP_OWNER: "false"
  # 014 WUI dispatch (specs/014 contracts/wui-dispatch.md §1). WUIKey is the
  # base64 box-wui Ed25519 PRIVATE key (Secret Manager): never logged.
  SPOOL_HUB_WUI_DISPATCH: "false"
  SPOOL_HUB_WUI_KEY: "<SECRET>"
  SPOOL_HUB_WUI_KEY_EPHEMERAL: "false"
  # 017 FR-SEC-006: how many proxies in front of the hub append to
  # X-Forwarded-For; the client IP every per-IP limit keys on (edge and
  # native auth) is the hops-th entry from the right. MEASURED per env with
  # csi-spl-orc do_spl_probe_client_ip, never assumed. 0 = the TCP peer.
  SPOOL_HUB_TRUSTED_PROXY_HOPS: "0"
  SPOOL_HUB_CLIENT_IP_PROBE: "false"
  # 017 FR-SEC-004 in-app edge limits (no LB / Cloud Armor, owner
  # 2026-09-19). 0 turns one limit off. The address-free controls (global
  # socket cap, hello + ping timeouts) default ON, csi-rel's rule that a
  # forgotten key must not fail open. The PER-IP limits default OFF: keyed
  # on a wrong address (hops not yet measured, so every caller shares the
  # front end's) they would be an outage, not a limit; cnf sets them
  # together with SPOOL_HUB_TRUSTED_PROXY_HOPS.
  SPOOL_HUB_EDGE_WINDOW: "1m"
  SPOOL_HUB_EDGE_WS_CONNS_PER_IP: "0"
  SPOOL_HUB_EDGE_WS_CONNS_TOTAL: "900"
  SPOOL_HUB_EDGE_WS_HANDSHAKES_PER_IP: "0"
  SPOOL_HUB_EDGE_AUTH_PER_IP: "0"
  SPOOL_HUB_HELLO_TIMEOUT: "10s"
  SPOOL_HUB_WS_PING_INTERVAL: "30s"
  SPOOL_HUB_WS_PING_TIMEOUT: "15s"
  # WSMaxLife (SPL-1981): a socket is closed with 1012 max_life after this
  # long and its peer redials, so a retired Cloud Run instance holds a
  # max_instances slot for at most this long, not the 3600 s request
  # timeout. 0 = no cap.
  SPOOL_HUB_WS_MAX_LIFE: "5m"
  # MsgVersion is the schema version the hub WRITES for the messages it
  # composes itself (WUI posts, dispatch, CI-logs notes), specs/020
  # contracts/migration.md §5: 1 until every reader is deployed.
  SPOOL_HUB_MSG_VERSION: "1"
  # DefaultLocale is the locale a request that names none gets
  # (X-Locale > Accept-Language > this), the mail locale of last resort, and
  # the one locale WUI links carry no /<loc> prefix for. cnf env.i18n, the
  # same value the WUI builds with; one of the 19 i18n.Supported codes.
  SPOOL_HUB_DEFAULT_LOCALE: "en"
  # The Go runtime's view of the instance (CLE-35076). On Cloud Run the
  # hub saw 2 CPUs under a 1-vCPU limit (GOMAXPROCS 2, logged 2026-09-28)
  # and no memory limit under a 512 Mi cap. 0 / "" = the runtime's own
  # default; cnf sets them from hub.cloud_run cpu and memory.
  SPOOL_HUB_GOMAXPROCS: "0"
  SPOOL_HUB_GOMEMLIMIT: ""

hub_auth:
  # Providers is the comma list of enabled slugs. Empty = auth off: the
  # provider list is empty and start/callback answer 404.
  SPOOL_HUB_AUTH_PROVIDERS: "google,native"
  # SessionKey signs the session cookie and the OAuth state (separate derived
  # subkeys). A secret: Secret Manager, never cnf. At least 32 bytes.
  SPOOL_HUB_AUTH_SESSION_KEY: "<SECRET>"
  # AppURL is the WUI origin the browser lands on after the callback. A
  # failure lands on <AppURL>/login?auth_error=<code>.
  SPOOL_HUB_AUTH_APP_URL: "https://example.com"
  SPOOL_HUB_AUTH_SESSION_TTL: "12h"
  SPOOL_HUB_AUTH_STATE_TTL: "15m"
  SPOOL_HUB_AUTH_COOKIE_NAME: "spool_session"
  SPOOL_HUB_AUTH_COOKIE_DOMAIN: "example.com"
  # CookieSecureSetting is SPOOL_HUB_AUTH_COOKIE_SECURE: true, false or
  # auto (the default). auto = Secure unless AppURL is a loopback http
  # origin (SPL-2152); resolveCookieSecure turns it into CookieSecure.
  SPOOL_HUB_AUTH_COOKIE_SECURE: "auto"
  # StateCookieName is the OAuth state cookie (spec 010 T056). It carries
  # CookieDomain too, so /start on the API host and /callback on the WUI
  # host both see it. Behind Firebase Hosting it must be "__session": the
  # only request cookie Hosting forwards to a Cloud Run rewrite (csi-rel 089).
  SPOOL_HUB_AUTH_STATE_COOKIE_NAME: "spool_oauth_state"
  # IdPBaseURL points EVERY provider at one fake IdP (fakeidp: lde, tests,
  # the auth-demo). Refused in prd, where it would hand client secrets to
  # that host.
  SPOOL_HUB_AUTH_IDP_BASE_URL: "https://idp.example.com"
  SPOOL_HUB_AUTH_GOOGLE_CLIENT_ID: "<GOOGLE_CLIENT_ID>"
  SPOOL_HUB_AUTH_GOOGLE_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_AUTH_GOOGLE_REDIRECT_URI: "https://example.com/api/v1/auth/google/callback"
  SPOOL_HUB_AUTH_GOOGLE_SCOPES: "openid email profile"
  SPOOL_HUB_AUTH_FACEBOOK_CLIENT_ID: "<FACEBOOK_CLIENT_ID>"
  SPOOL_HUB_AUTH_FACEBOOK_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_AUTH_FACEBOOK_REDIRECT_URI: "https://example.com/api/v1/auth/facebook/callback"
  SPOOL_HUB_AUTH_FACEBOOK_SCOPES: "email,public_profile"
  SPOOL_HUB_AUTH_MICROSOFT_CLIENT_ID: "<MICROSOFT_CLIENT_ID>"
  SPOOL_HUB_AUTH_MICROSOFT_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_AUTH_MICROSOFT_REDIRECT_URI: "https://example.com/api/v1/auth/microsoft/callback"
  SPOOL_HUB_AUTH_MICROSOFT_SCOPES: "openid email profile"
  # MicrosoftTenant is the Entra authority segment (spec 018 OQ-M1):
  # common (default: personal + every work/school tenant) | consumers |
  # organizations | a tenant GUID. A work account's email is trusted only
  # with xms_edov=true (FR-005), unless MicrosoftTrustEmail (refused in prd).
  SPOOL_HUB_AUTH_MICROSOFT_TENANT: "common"
  SPOOL_HUB_AUTH_MICROSOFT_TRUST_EMAIL: "false"
  SPOOL_HUB_AUTH_LINKEDIN_CLIENT_ID: "<LINKEDIN_CLIENT_ID>"
  SPOOL_HUB_AUTH_LINKEDIN_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_AUTH_LINKEDIN_REDIRECT_URI: "https://example.com/api/v1/auth/linkedin/callback"
  SPOOL_HUB_AUTH_LINKEDIN_SCOPES: "openid profile email"
  # xAI's endpoints are cnf only (narrative §1: never baked in Go); they
  # are required while xai is listed.
  SPOOL_HUB_AUTH_XAI_CLIENT_ID: "<XAI_CLIENT_ID>"
  SPOOL_HUB_AUTH_XAI_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_AUTH_XAI_REDIRECT_URI: "https://example.com/api/v1/auth/xai/callback"
  SPOOL_HUB_AUTH_XAI_SCOPES: "openid profile email"
  SPOOL_HUB_AUTH_XAI_AUTH_URL: ""
  SPOOL_HUB_AUTH_XAI_TOKEN_URL: ""
  SPOOL_HUB_AUTH_XAI_USERINFO_URL: ""

hub_auth_native:
  SPOOL_HUB_AUTH_NATIVE_ENABLED: "false"
  SPOOL_HUB_AUTH_NATIVE_VERIFY_REQUIRED: "true"
  # DebugTokens returns plaintext tokens in the body (FR-011). Off by
  # default; opt-in for lde only (SPL-2157): dev drops it, prd refuses it.
  SPOOL_HUB_AUTH_NATIVE_DEBUG_TOKENS: "false"
  # The one-click dev login (spec 148 §2.3.2). Off by default; local dev
  # mode (SPOOL_HUB_ENV=lde) only: any other env refuses to start with it on.
  SPOOL_HUB_AUTH_DEV_LOGIN_ENABLED: "false"
  SPOOL_HUB_AUTH_NATIVE_PASSWORD_MIN_LEN: "12"
  SPOOL_HUB_AUTH_NATIVE_ARGON2_MEMORY_KIB: "19456"
  SPOOL_HUB_AUTH_NATIVE_ARGON2_ITERATIONS: "2"
  SPOOL_HUB_AUTH_NATIVE_VERIFY_TTL: "24h"
  SPOOL_HUB_AUTH_NATIVE_RESET_TTL: "1h"
  # Per-account mail floor, counted in the database (FR-006a).
  SPOOL_HUB_AUTH_NATIVE_MAIL_MIN_INTERVAL: "60s"
  SPOOL_HUB_AUTH_NATIVE_MAIL_MAX_PER_DAY: "5"
  # In-process limiter (FR-006b): attempts per RateWindow.
  SPOOL_HUB_AUTH_NATIVE_RATE_WINDOW: "15m"
  SPOOL_HUB_AUTH_NATIVE_LOGIN_PER_EMAIL: "10"
  SPOOL_HUB_AUTH_NATIVE_LOGIN_PER_IP: "30"
  SPOOL_HUB_AUTH_NATIVE_FORM_PER_IP: "10"
  # TrustedProxyHops is how many proxies we trust in front of the hub (Cloud
  # Run front end, Hosting rewrite): the client IP is the hops-th
  # X-Forwarded-For entry from the right. 0 = the TCP peer is the client.
  SPOOL_HUB_AUTH_NATIVE_TRUSTED_PROXY_HOPS: "0"

hub_mail:
  SPOOL_HUB_MAIL_TRANSPORT: "none"
  SPOOL_HUB_MAIL_SMTP_HOST: "smtp.example.com"
  SPOOL_HUB_MAIL_SMTP_PORT: "587"
  SPOOL_HUB_MAIL_SMTP_USER: "<SMTP_USER>"
  SPOOL_HUB_MAIL_SMTP_PASSWORD: "<SECRET>"
  SPOOL_HUB_MAIL_SMTP_TLS: "starttls"
  SPOOL_HUB_MAIL_FROM: "no-reply@example.com"
  SPOOL_HUB_MAIL_FROM_NAME: "<SERVICE_NAME>"
  SPOOL_HUB_MAIL_TIMEOUT: "10s"
  # Preflight is the relay check at hub start (spec 047 W7): off, warn
  # (log a CRITICAL line, keep serving) or require (refuse to start).
  SPOOL_HUB_MAIL_PREFLIGHT: "warn"

hub_payments:
  SPOOL_HUB_PAYMENT_PROVIDER: ""
  SPOOL_HUB_ENABLE_FAKE_PAY: "false"
  SPOOL_HUB_PAYMENT_PLAN_ID: "default"
  SPOOL_HUB_PAYMENT_PLAN_CENTS: "0"
  SPOOL_HUB_PAYMENT_CURRENCY: "eur"
  SPOOL_HUB_PAYMENT_PUBLIC_SCHEME: "https"
  SPOOL_HUB_PAYMENT_HOLD: "1h"
  # ClaimURL is the WUI claim page the emailed single-use link opens
  # (017 T008): <ClaimURL>#checkout=<id>&token=<t>. Required with a rail.
  SPOOL_HUB_PAYMENT_CLAIM_URL: "https://example.com/claim"
  SPOOL_HUB_PAYMENT_CLAIM_TTL: "24h"
  # M4 seats (specs/009 T004): the monthly price of one user (HUM-*) seat
  # and one bot seat, on top of PlanCents. Both 0 = seats are not sold (the
  # M2 SKU, 009 FR-001). A priced kind is bought 1..SeatsMax per checkout;
  # an unpriced kind stays 0 (= unlimited, 009 D-2).
  SPOOL_HUB_PAYMENT_SEAT_USER_CENTS: "0"
  SPOOL_HUB_PAYMENT_SEAT_BOT_CENTS: "0"
  SPOOL_HUB_PAYMENT_SEATS_MAX: "1000"
  # Dedicated: this SKU mints a GCP project id at the paid event (009
  # T005): checkout then takes the buyer's org / app codes.
  SPOOL_HUB_PAYMENT_DEDICATED: "false"
  # Stripe (csi-rel STRIPE_*). SecretKey + WebhookSecret are secrets.
  SPOOL_HUB_STRIPE_SECRET_KEY: "<SECRET: sk_test_...>"
  SPOOL_HUB_STRIPE_WEBHOOK_SECRET: "<SECRET: whsec_...>"
  SPOOL_HUB_STRIPE_PUBLISHABLE_KEY: "<pk_test_...>"
  SPOOL_HUB_STRIPE_API_BASE: ""
  SPOOL_HUB_STRIPE_API_VERSION: ""
  # PayPal (csi-rel PAYPAL_* + ENABLE_PAYPAL). ClientSecret is a secret.
  SPOOL_HUB_ENABLE_PAYPAL: "false"
  SPOOL_HUB_PAYPAL_CLIENT_ID: "<PAYPAL_CLIENT_ID>"
  SPOOL_HUB_PAYPAL_CLIENT_SECRET: "<SECRET>"
  SPOOL_HUB_PAYPAL_MODE: "sandbox"
  SPOOL_HUB_PAYPAL_API_BASE: ""
  SPOOL_HUB_PAYPAL_WEBHOOK_ID: "<PAYPAL_WEBHOOK_ID>"

hub_cloud:
  # The cloud the hub runs on (internal/cloud): gcp, aws or none. none reads
  # the S3 keys below (an S3-compatible store, e.g. the compose stack's).
  SPOOL_CLOUD_PROVIDER: ""
  # The bucket holding files, and how it is addressed (internal/cloud, blob).
  SPOOL_S3_BUCKET: "<FILES_BUCKET>"
  SPOOL_S3_ENDPOINT: "https://s3.example.com"
  # A custom endpoint with no region is signed as us-east-1.
  SPOOL_S3_REGION: "<REGION>"
  SPOOL_S3_USE_PATH_STYLE: ""
  SPOOL_S3_ACCESS_KEY: "<S3_ACCESS_KEY>"
  # or SPOOL_S3_SECRET_KEY_FILE: a file that holds it
  SPOOL_S3_SECRET_KEY: "<SECRET>"
  SPOOL_S3_SESSION_TOKEN: ""
  # Operator invites (cmd/spool/hub.go): the service-account e-mails allowed
  # to call the operator invite routes, space or comma separated, e.g.
  # <SA_NAME>@<PROJECT_ID>.<SA_DOMAIN>; empty = the routes are off.
  SPOOL_HUB_OPERATOR_EMAILS: ""
  # The id-token audience the hub expects: its own URL. Required when
  # SPOOL_HUB_OPERATOR_EMAILS is set.
  SPOOL_HUB_OPERATOR_AUDIENCE: "https://api.example.com"
  # Extra release-note hygiene patterns, RE2, one per line (internal/hub).
  SPOOL_HUB_RELEASE_NOTE_BANS: ""
  # The search index kill switch: on (default) or off (internal/hub).
  SPOOL_HUB_SEARCH_INDEX: "on"
  # The GitHub App private key for docs edits (cmd/spool/hub_repo_edit.go).
  SPOOL_GITHUB_APP_KEY: "<SECRET>"

wui_build:
  # Read by `nuxt generate` (csi-spl-wui/nuxt.config.ts). A deployed page
  # takes apiBase, tenant, siteUrl, lobbyTaskId, envName and repo* from the
  # served /config.json instead (see wui_container), so the bundle is built
  # once for any domain.
  # The api host, https://api.<your domain>; "" = the page's own origin.
  NUXT_PUBLIC_API_BASE: "https://api.example.com"
  # The hub's origin for /api/v1/auth/** (sign-in, session probe), cross
  # origin with credentials; "" = same origin.
  NUXT_PUBLIC_AUTH_BASE: "https://api.example.com"
  # The apex tenant (https://example.com); other tenants are
  # https://<tenant>.example.com when NUXT_PUBLIC_TENANT_HOSTS is 1.
  NUXT_PUBLIC_TENANT: "<TENANT>"
  NUXT_PUBLIC_TENANT_HOSTS: "0"
  # The apex https://example.com (canonical, hreflang, sitemap); required
  # when NUXT_PUBLIC_SEO_INDEX is 1.
  NUXT_PUBLIC_SITE_URL: "https://example.com"
  # 1 = the public pages are indexable by search engines.
  NUXT_PUBLIC_SEO_INDEX: "0"
  # The real-user timing collector: 1 = on, and the share of sessions (0..1).
  NUXT_PUBLIC_PERF_RUM: "0"
  NUXT_PUBLIC_PERF_SAMPLE_RATE: "1"
  # The #lobby topic id; the hub's welcome frame wins when it names one.
  NUXT_PUBLIC_LOBBY_TASK_ID: "00000000-0000-4000-8000-000000000001"
  # The source repository's url pieces: a commit hash links to
  # <web url><commit path><hash>, /help repo links to <web url><help path>,
  # "Connect an agent" clones the clone url. "" hides those links.
  NUXT_PUBLIC_REPO_WEB_URL: "https://git.example.com/<OWNER>/<REPO>"
  NUXT_PUBLIC_REPO_CLONE_URL: "https://git.example.com/<OWNER>/<REPO>.git"
  NUXT_PUBLIC_REPO_COMMIT_PATH: "/commit/"
  NUXT_PUBLIC_REPO_HELP_PATH: "/blob/master/csi-spl-doc/doc/help/"
  # Minutes the reply hourglass spins before it turns into a waiting mark.
  NUXT_PUBLIC_AWAIT_REPLY_MINUTES: "10"
  # 1 = the in-browser mock tenant, 0 = a real hub (default: 1 in dev only).
  NUXT_PUBLIC_USE_MOCK: "0"
  # The version stamp; default csi-spl-wui/.version.
  NUXT_PUBLIC_APP_VERSION: ""
  # The commit and CI run this bundle was built from ("" = no update watch).
  NUXT_PUBLIC_BUILD_COMMIT: ""
  NUXT_PUBLIC_BUILD_RUN: ""
  # The env name shown on the page (e.g. dev, prd); "" = none.
  NUXT_PUBLIC_ENV_NAME: "<ENV>"
  # The unprefixed locale.
  NUXT_PUBLIC_DEFAULT_LOCALE: "en"

wui_container:
  # Read by the web container at start (csi-spl-wui/src/docker/wui-config.sh)
  # into /srv/config.json: a domain or tenant change is a restart.
  # The page origin as the browser sees it; "" = the page's own origin.
  SPOOL_PUBLIC_URL: "https://example.com"
  SPOOL_TENANT: "main"
  SPOOL_LOBBY_TASK_ID: ""
  SPOOL_ENV_NAME: ""
  SPOOL_REPO_WEB_URL: "https://git.example.com/<OWNER>/<REPO>"
  SPOOL_REPO_CLONE_URL: "https://git.example.com/<OWNER>/<REPO>.git"
  SPOOL_REPO_COMMIT_PATH: "/commit/"
  SPOOL_REPO_HELP_PATH: "/blob/master/csi-spl-doc/doc/help/"
