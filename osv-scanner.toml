# OSV-Scanner triage baseline (spec 056 #15 / T015), owner topic 875651f8.
# Pattern mirrors .trivyignore.yaml + .gitleaks.toml: the gate is GREEN today and
# reddens on a NEW lockfile vulnerability. Refreshed after CLE-77817 bumped
# golang.org/x/crypto 0.51->0.55, x/net 0.55->0.58, grpc 1.83.1->1.84.0 (trunk
# 3225fde7), which cleared the 7 Critical + 3 High this list used to carry.
# Remaining entries, each with a reason + review date:
#  - golang.org/x/crypto 0.55.0 / grpc 1.84.0: the fix is in a release that
#    requires go 1.26; this module is pinned to go 1.25 (+ golang:1.25-alpine),
#    so 0.55 / 1.84 are the highest compatible. Not reachable (govulncheck green).
#    Revisit when the toolchain moves to go 1.26.
#  - node-forge 1.4.0 (npm, GHSA-86w9-cpqp-85rv): no fixed release exists; it is
#    pulled only by listhen 1.10.1 (latest, still node-forge ^1.4.0) under
#    @nuxt/cli + nitropack, for the dev server's self-signed HTTPS cert. It is
#    not in the generated static bundle. devalue 5.9.2 -> 5.9.4 (7 GHSAs) was
#    fixed by the lockfile instead (CLE-77971). The pnpm audit leg (workflow 15)
#    carries the SAME single exception, csi-spl-wui/package.json
#    pnpm.auditConfig.ignoreGhsas (JSON has no comments, so its reason and its
#    2026-11-01 expiry live here): remove both together once a fixed
#    node-forge or a listhen without it ships.
#  - braces 3.0.3 (npm, GHSA-vfj7-8cjw-p6xm, high, stack-exhaustion DoS on
#    deeply nested patterns): no fixed release exists (last_affected 3.0.3 =
#    latest). Pulled only through micromatch 4.0.8 (latest) via fast-glob /
#    globby under nitropack, unplugin-vue-router and @intlify/unplugin-vue-i18n:
#    build-time file globbing over our own sources, never untrusted input.
#    Not in the generated static bundle (grep of .output/public for braces /
#    micromatch / "exceeds max characters": 0 of 242 js files, 2026-10-03).
#    The pnpm audit leg (workflow 15) carries the SAME single exception in
#    csi-spl-wui/package.json pnpm.auditConfig.ignoreGhsas; remove both
#    together once a fixed braces or a micromatch without it ships.
#    Re-check by 2026-11-02.
#  - otel/sdk, serialize-javascript (npm): low, below the govulncheck/pnpm-audit
#    gates; Dependabot-tracked.
# Review / re-check by 2026-11-01.

