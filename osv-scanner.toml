# OSV-Scanner triage baseline (spec 056 #15 / T015), owner topic 875651f8.
# Pattern mirrors .trivyignore.yaml + .gitleaks.toml: the gate is GREEN today and
# reddens on a NEW lockfile vulnerability. Refreshed after CLE-77817 bumped
# golang.org/x/crypto 0.51->0.55, x/net 0.55->0.58, grpc 1.83.1->1.84.0 (trunk
# 3225fde7), which cleared the 7 Critical + 3 High this list used to carry.
# Remaining entries, each with a reason + review date:
#  - golang.org/x/crypto (GO-2026-5932): the openpgp package is deprecated; the
#    advisory covers every x/crypto release, so no fixed version exists. We do
#    not import x/crypto/openpgp; osv-scanner rates it unimportant (shown only
#    with --all-vulns). GO-2026-6354/6355/6443 (x/crypto, grpc) were dropped
#    once the toolchain reached go 1.26.9: osv-scanner 2.6.0 named them unused.
#  - node-forge 1.4.0 (npm, GHSA-86w9-cpqp-85rv): no fixed release exists; it is
#    pulled only by listhen 1.10.1 (latest, still node-forge ^1.4.0) under
#    @nuxt/cli + nitropack, for the dev server's self-signed HTTPS cert. It is
#    not in the generated static bundle. devalue 5.9.2 -> 5.9.4 (7 GHSAs) was
#    fixed by the lockfile instead (CLE-77971). The pnpm audit leg (workflow 15)
#    carries the SAME single exception, csi-spl-wui/package.json
#    pnpm.auditConfig.ignoreGhsas (JSON has no comments, so its reason and its
#    2026-11-01 expiry live here): remove both together once a fixed
#    node-forge or a listhen without it ships.
#  - braces 3.0.3 (npm, GHSA-vfj7-8cjw-p6xm): dropped 2026-10-25, osv-scanner
#    named the ignore unused (workflow 70 run 40209390726). The pnpm audit leg
#    (workflow 15) still lists it in csi-spl-wui/package.json
#    pnpm.auditConfig.ignoreGhsas: re-check that one by its own run.
#  - nuxt + @nuxt/nitro-server 3.21.11 (npm, GHSA-vjh5-4x84-xrqp,
#    GHSA-xfq5-w38q-pc2x, GHSA-jjm6-p2m9-9w4x; published 2026-10-22 16:51-17:00Z,
#    reddened workflow 70 with no lockfile change): fixed only in nuxt 4.6.x,
#    no fixed 3.x release (3.21.11 = latest 3.x), so the real fix is the nuxt 4
#    migration. None reaches the shipped WUI (checked 2026-10-22):
#    vjh5 needs a running Nitro server with case-insensitive route rules, we
#    ship `nuxt generate` static output to Firebase Hosting; xfq5 needs server
#    islands, 0 *.server.vue / *.island.vue, 0 NuxtIsland / useHeadSafe in
#    src; jjm6 needs `pages` disabled, src/pages has 35 pages and nuxt.config
#    never sets pages: false. pnpm audit (workflow 15) reddened on 5c14f2efd
#    (moderate vjh5 + xfq5; jjm6 is low, below its gate), so package.json
#    pnpm.auditConfig.ignoreGhsas carries vjh5 + xfq5 with the same reasons and
#    the same 2026-11-05 expiry: remove them together. Re-check by 2026-11-05
#    (SPL-2908).
#  - serialize-javascript (npm): low, below the pnpm-audit gate; Dependabot-
#    tracked. GHSA-m5mm-p8h7-m29v (7.1.1, fixed 7.1.3) was fixed by the lockfile
#    instead: 7.1.4 under @rollup/plugin-terser ^7.0.3. GHSA-8wmf-6v46-5gfg (otel/sdk) was dropped once otel/sdk reached
#    v1.45.0: osv-scanner 2.6.0 named it unused.
#  - deepmerge 4.3.1 (npm, GHSA-gcqx-w48m-w2h4, 5.3): published upstream, it
#    reddened workflow 70 on 13526c84d (run 40654815101) with no lockfile
#    change. No fixed version exists. Only @rollup/plugin-node-resolve 16.0.3
#    pulls it, at build time; it is not in the generated WUI bundle. pnpm
#    audit (workflow 15) was still green on master (run 40655043668): if it
#    reddens, add the same id to package.json pnpm.auditConfig.ignoreGhsas.
#    Re-check by 2026-11-27 (SPL-3972).
# Review / re-check by 2026-11-01.

[[IgnoredVulns]]
