# OSV-Scanner triage baseline (spec 056 #15 / T015), owner topic 875651f8.
# Pattern mirrors .trivyignore.yaml + .gitleaks.toml: the gate is GREEN today and
# reddens on a NEW lockfile vulnerability. Refreshed after CLE-77817 bumped
# golang.org/x/crypto 0.51->0.55, x/net 0.55->0.58, grpc 1.83.1->1.84.0 (trunk
# 3225fde7), which cleared the 7 Critical + 3 High this list used to carry.
# Remaining entries, each with a reason + review date:
#  - golang.org/x/crypto (GO-2026-5932, openpgp): dropped 2026-11-10 (SPL-5082),
#    OSV now lists a fix and x/crypto is on it, the pseudo-version
#    v0.58.1-0.20261009181718-2f1f834330b2 (no tag carries the fix yet; v0.58.0
#    precedes it). GO-2026-6354/6355/6443 (x/crypto, grpc) were dropped
#    once the toolchain reached go 1.26.9: osv-scanner 2.6.0 named them unused.
#  - node-forge (npm, GHSA-86w9-cpqp-85rv): dropped 2026-10-31 (SPL-4508), the
#    pnpm.overrides pin node-forge ^1.4.1 (1.4.2 in the lockfile) fixes it and
#    the 11 node-forge GHSAs that reddened workflows 15 + 70 on 2026-10-31;
#    osv-scanner 2.6.0 then named the ignore unused. Removed from
#    package.json pnpm.auditConfig.ignoreGhsas too.
#  - braces 3.0.3 (npm, GHSA-vfj7-8cjw-p6xm): dropped 2026-10-25, osv-scanner
#    named the ignore unused (workflow 70 run 40209390726). The pnpm audit leg
#    (workflow 15) still lists it in csi-spl-wui/package.json
#    pnpm.auditConfig.ignoreGhsas: re-check that one by its own run. Dropped
#    there too 2026-11-24 (SPL-5070): pnpm audit with no ignores no longer
#    lists it.
#  - nuxt + @nuxt/nitro-server 3.21.11 (npm, GHSA-vjh5-4x84-xrqp,
#    GHSA-xfq5-w38q-pc2x, GHSA-jjm6-p2m9-9w4x; published 2026-10-22 16:51-17:00Z,
#    reddened workflow 70 with no lockfile change): fixed only in nuxt 4.6.x,
#    no fixed 3.x release (3.21.11 = latest 3.x), so the real fix is the nuxt 4
#    migration. None reaches the shipped WUI (checked 2026-10-22):
#    vjh5 needs a running Nitro server with case-insensitive route rules, we
#    ship `nuxt generate` static output to Firebase Hosting; xfq5 needs server
#    islands, 0 *.server.vue / *.island.vue, 0 NuxtIsland / useHeadSafe in
#    src; jjm6 needs `pages` disabled, src/pages has 35 pages and nuxt.config
#    never sets pages: false. pnpm audit (workflow 15) reddened on 5c14f2efd
#    (moderate vjh5 + xfq5; jjm6 is low, below its gate), so package.json
#    pnpm.auditConfig.ignoreGhsas carries vjh5 + xfq5 with the same reasons and
#    the same expiry: remove them together. Re-checked 2026-11-08 (SPL-5069), same
#    reasons hold on the current tree. Re-checked 2026-11-24 (owner t1 80e54ed8
#    answer C, renewed 30 days); the real fix is SPL-5070. Re-check by
#    2026-12-27 (SPL-2908).
#  - The nuxt 4 move (SPL-5070, spec 178, nuxt 4.6.4) dropped xfq5, jjm6,
#    648h (@nuxt/vite-builder) and mjrq (@nuxt/schema): osv-scanner 2.6.0 with
#    no ignores lists none of them on the 4.6.4 lockfile. vjh5, f3x9, hf59 and
#    96x6 stay, as false positives: GitHub's records bound their unpatched 3.x
#    range at < 4.0.0, the OSV records lose that bound and match 4.6.4 too.
#    pnpm audit lists none of the 8, so package.json
#    pnpm.auditConfig.ignoreGhsas no longer carries any of them.
#  - picomatch 2.3.2 + 4.0.7 (npm, GHSA-fc5q-39xc-vjpf, SPL-5816): dropped
#    2026-11-24 (SPL-5070), osv-scanner 2.6.0 named the ignore unused on the
#    nuxt 4 lockfile.
#  - serialize-javascript (npm): GHSA-gfhx-hw2g-v5hg dropped 2026-11-08
#    (SPL-5069), it affects 7.1.1 only, the lockfile has 7.1.4 and osv-scanner
#    2.6.0 named the ignore unused. GHSA-m5mm-p8h7-m29v (7.1.1, fixed 7.1.3) was fixed by the lockfile
#    instead: 7.1.4 under @rollup/plugin-terser ^7.0.3. GHSA-8wmf-6v46-5gfg (otel/sdk) was dropped once otel/sdk reached
#    v1.45.0: osv-scanner 2.6.0 named it unused.
#  - deepmerge 4.3.1 (npm, GHSA-gcqx-w48m-w2h4): dropped 2026-11-17
#    (SPL-5816), osv.dev withdrew the advisory 2026-11-16T18:55Z and
#    osv-scanner 2.6.0 named the ignore unused (workflow 70 run 44126816251).
#  - @nuxt/schema 3.21.11 (npm, GHSA-mjrq-cffv-q4qc, moderate; published
#    2026-11-13 18:11Z, reddened workflows 15 + 70 with no lockfile change):
#    fixed only in 4.6.4, nuxt 3 is end of life and gets no fix, so the real
#    fix is the nuxt 4 migration. It affects only the `nuxt dev` server; prd
#    ships `nuxt generate` static output to Firebase Hosting. Dev caveat,
#    measured 2026-11-14 with pkg-types 2.3.3 findWorkspaceDir: in a git
#    worktree (.git is a file) the git test misses and workspaceDir falls to
#    the farthest parent lockfile, and `pnpm dev` binds 0.0.0.0, so a stray
#    lockfile above a worktree is served. Setting workspaceDir in
#    csi-spl-wui/nuxt.config.ts closes it. package.json
#    pnpm.auditConfig.ignoreGhsas carries the same id: remove them together.
#    Re-checked 2026-11-24 (owner t1 80e54ed8 answer C, renewed 30 days); the
#    real fix is SPL-5070. Re-check by 2026-12-30 (SPL-5474).
# Review / re-check by 2026-11-30 (the two tooling ignores, SPL-4508).

# SPL-2908: the three nuxt 3.21.11 advisories that reddened workflow 70 on 2026-10-22.
[[IgnoredVulns]]
id = "GHSA-vjh5-4x84-xrqp" # SPL-2908
ignoreUntil = 2026-12-27
reason = "nuxt + @nuxt/nitro-server 4.6.4 since SPL-5070, outside the advisory: GitHub's own record (gh api /advisories/GHSA-vjh5-4x84-xrqp) bounds the unpatched 3.x range at < 4.0.0 and lists 4.x fixed in 4.6.2, but the OSV record drops that 3.x upper bound (introduced 3.0.0, no fixed), so osv-scanner 2.6.0 matches every later version. A false positive of the OSV data, pnpm audit (workflow 15) does not list it. Remove when osv-scanner names the ignore unused."

# SPL-4508: three moderate npm advisories that reddened workflows 15 and 70 on
# 2026-10-31 (run 41207686407) with no lockfile change. Each is fixed only in a
# new major that its dependents do not accept, so a pnpm override would force a
# major under them; the real fix is the nuxt 4 migration. None reaches the
# shipped WUI, which is `nuxt generate` static output on Firebase Hosting. The
# pnpm audit leg (workflow 15) carries the same three ids in
# csi-spl-wui/package.json pnpm.auditConfig.ignoreGhsas: remove them together.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249" # SPL-4508
ignoreUntil = 2026-11-30
reason = "minimatch 5.1.9/9.0.9/10.2.6: fixed only in 11.0.1, no fixed 5.x/9.x/10.x; every path is build or lint tooling (eslint, typescript-estree, nitropack via @vercel/nft and archiver) matching patterns from our own config, never user input; not in the generated WUI bundle."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4" # SPL-4508
ignoreUntil = 2026-11-30
reason = "glob 10.5.0/13.0.6: fixed only in 14.0.2, no fixed 10.x/13.x; pulled only at build time by nitropack (@vercel/nft, archiver), and the bug needs a caller that bounds an untrusted walk with an AbortSignal; not in the generated WUI bundle."

