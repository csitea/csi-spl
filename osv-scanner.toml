[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-02
reason = "braces 3.0.3: no fixed version upstream; only micromatch 4.0.8 (latest) via fast-glob/globby under nitropack, unplugin-vue-router and @intlify/unplugin-vue-i18n pulls it, for build-time globbing of our own sources; not shipped in the generated WUI bundle. Re-check for a braces or micromatch release by the expiry."
